<!doctype html>
<!--
  Cinema standby, hall 1: "The Monastery Picture House"
  Diablo 2 Act I (Rogue Monastery / Tristram) as a night-time cinema, isometric (2:1), painterly,
  everything drawn procedurally (canvas 2D + DOM), no images except TMDB posters.

  GREEN SCREEN (chroma key) on the 1920x1080 stage: x 1256, y 36, w 640, h 360 (16:9).
  (At 3840x2160: x 2512, y 72, w 1280, h 720.) Pure Cinema.green, highest z-index, nothing drawn over it;
  its frame, chains and shadow are painted on the background canvas strictly outside the rectangle.
  ?green=off shows showtimes + the five films there instead.

  Options: ?demo=1  ?green=ff00ff  ?green=off  ?chat=off  ?f=3  ?title=...  ?sub=...
  Layers (bottom -> top): bg canvas, wall DOM (posters, curtains, doors, banners, cat), crowd (walkers +
  occluding sprites, z-index = feet y), darkness (multiply, 640x360), glow (screen, 640x360), fx canvas
  (flames, motes), plaques, labels (names, bubbles), title, chat, green screen.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Monastery Picture House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Spectral:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
  :root { --gold: #d6b25e; --gold-hi: #f0d68e; --ink: #efe4cc; --stone: #3b3631; --iron: #1b1a1c; }
  #stage { background: #050407; font-family: 'Spectral', Georgia, serif; color: var(--ink); }
  .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
  #bg { z-index: 1; }
  #wall { z-index: 2; }
  #crowd { z-index: 3; }
  #dark { z-index: 4; mix-blend-mode: multiply; }
  #glow { z-index: 5; mix-blend-mode: screen; }
  #fx { z-index: 6; }
  #plaques { z-index: 7; }
  #labels { z-index: 8; }
  #title, #combo { z-index: 9; }
  #chatpanel { z-index: 10; }
  #green { position: absolute; left: 1256px; top: 36px; width: 640px; height: 360px; z-index: 9999; background: #00ff00; }

  /* ---------- wall-plane DOM (posters, curtains, entrance leaves) ---------- */
  .onwall { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .poster { width: 82px; height: 118px; padding: 5px;
    background: linear-gradient(135deg, #6b4626, #2c1a0c 55%, #533219);
    box-shadow: 3px 5px 7px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,214,150,.28), inset 0 0 0 3px rgba(0,0,0,.35); }
  .poster img, .poster .ph { display: block; width: 72px; height: 108px; object-fit: cover; }
  .poster .ph { display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #3a2a1a, #120c08 70%);
    font: 900 30px 'Cinzel', serif; color: #b48a3e; text-shadow: 0 2px 0 #000; }
  .cur { width: 44px; height: 138px; }
  .cur canvas { position: absolute; left: 0; top: 0; width: 44px; height: 138px; transform-origin: 50% 0; }
  .cur .leak { position: absolute; left: 3px; right: 3px; bottom: 0; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(190,215,255,0), #e4efff 30%, #f4f8ff 50%, #e4efff 70%, rgba(190,215,255,0));
    box-shadow: 0 0 6px 2px rgba(170,200,255,.7); animation: proj 1.7s infinite; }
  @keyframes proj { 0% { opacity: .55; } 9% { opacity: .95; } 14% { opacity: .5; } 31% { opacity: .85; } 38% { opacity: .35; }
    52% { opacity: .9; } 61% { opacity: .6; } 77% { opacity: 1; } 88% { opacity: .45; } 100% { opacity: .55; } }
  .leaf canvas { position: absolute; left: 0; top: 0; transition: transform .45s cubic-bezier(.3,.7,.3,1), filter .45s; }
  .leaf.open canvas { transform: scaleX(.16); filter: brightness(.55); }
  .banner { position: absolute; top: -6px; transform-origin: 50% 0; animation: sway 7s ease-in-out infinite; }
  .banner.gust { animation: gust 3.2s ease-in-out 1; }
  @keyframes sway { 0%, 100% { transform: rotate(-0.8deg); } 50% { transform: rotate(0.9deg); } }
  @keyframes gust { 0% { transform: rotate(0deg) skewX(0deg); } 20% { transform: rotate(4.5deg) skewX(-3deg); } 45% { transform: rotate(-3deg) skewX(2deg); }
    70% { transform: rotate(1.6deg) skewX(-1deg); } 100% { transform: rotate(0deg) skewX(0deg); } }
  #cat { position: absolute; transform-origin: 50% 90%; animation: breathe 3.4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, 1.06); } }

  /* ---------- walkers ---------- */
  .w { position: absolute; left: 0; top: 0; will-change: transform; }
  .w .sh { position: absolute; left: -26px; top: -8px; width: 52px; height: 16px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,.62), rgba(0,0,0,.35) 60%, rgba(0,0,0,0)); }
  .w .bod { position: absolute; left: 0; bottom: 0; transform-origin: 50% 100%; will-change: transform; }
  .w .bod .sb-emote { position: absolute; bottom: 0; }
  .w .carry { position: absolute; bottom: 0; width: 22px; height: 27px; }
  .spr { position: absolute; left: 0; top: 0; }
  .tag { position: absolute; left: 0; top: 0; white-space: nowrap; font: 700 14px/1 'Spectral', Georgia, serif; will-change: transform;
    text-shadow: 0 0 3px #000, 0 1px 2px #000, 1px 0 1px #000, -1px 0 1px #000, 0 -1px 1px #000; transition: opacity .3s; }
  .tag i { font-style: normal; color: var(--gold); }
  .tag.npc { color: #d8c8a0; font-style: italic; }
  .bub { position: absolute; left: 0; top: 0; width: max-content; max-width: 290px; padding: 6px 11px 7px; border-radius: 3px;
    background: linear-gradient(#251e18f2, #15110ef2); border: 1px solid #6e5735;
    box-shadow: 0 0 0 1px #000, 0 6px 14px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,220,150,.12);
    color: #f3e8d0; font: 500 17px/1.28 'Spectral', Georgia, serif; text-align: center; overflow-wrap: anywhere; animation: bubin .2s ease-out; }
  .bub .sb-emote { margin: 0 2px; }
  .bub.npc { font-style: italic; color: #f0dca4; }
  @keyframes bubin { from { opacity: 0; } }
  .ftext { position: absolute; left: 0; top: 0; white-space: nowrap; font: 700 16px 'Cinzel', serif; color: var(--gold-hi);
    text-shadow: 0 0 4px #000, 0 2px 2px #000; animation: ftext 2.2s ease-out forwards; }
  .ftext.blue { color: #9fb4ff; }
  @keyframes ftext { 0% { opacity: 0; margin-top: 6px; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; margin-top: -38px; } }
  .ticket { position: absolute; left: 0; top: 0; width: 22px; height: 12px; border-radius: 2px; background: linear-gradient(#efd9a6, #c9a866);
    box-shadow: 0 1px 3px rgba(0,0,0,.7), inset 0 0 0 1px rgba(120,60,20,.5); }
  .ticket::after { content: ''; position: absolute; left: 5px; right: 5px; top: 5px; height: 2px; background: #8a2a1a; opacity: .7; }

  /* ---------- plaques (carved stone, camera-facing) ---------- */
  .plq { position: absolute; width: 146px; padding: 11px 8px 7px; text-align: center; border-radius: 3px;
    background: linear-gradient(#57504a, #3a352f 45%, #2a2621);
    box-shadow: 0 0 0 1px #0f0d0b, 0 6px 10px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,240,215,.22), inset 0 -2px 0 rgba(0,0,0,.4),
      inset 0 0 0 3px rgba(0,0,0,.18); }
  .plq::before, .plq::after { content: ''; position: absolute; top: 5px; width: 5px; height: 5px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #8a8580, #1d1b1a 70%); }
  .plq::before { left: 5px; }
  .plq::after { right: 5px; }
  .plq .num { position: absolute; left: 50%; top: -11px; transform: translateX(-50%); width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center; font: 700 12px 'Cinzel', serif; color: var(--gold-hi);
    background: radial-gradient(circle at 40% 35%, #4a4644, #161516 75%); box-shadow: 0 0 0 1px #000, 0 0 0 3px var(--acc, #6a1420), 0 2px 4px rgba(0,0,0,.7); }
  .plq .pt { font: 700 14px/1.12 'Cinzel', serif; color: var(--gold-hi); text-shadow: 0 1px 0 #000, 0 0 6px rgba(0,0,0,.6);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .plq .pm { margin-top: 4px; display: flex; justify-content: center; column-gap: 8px; white-space: nowrap; overflow: hidden;
    font: 600 13.5px/1.15 'Spectral', serif; color: #d9ccb0; text-shadow: 0 1px 0 #000; }
  .plq .pm.c2 { margin-top: 1px; }
  .plq .rt { color: #ffcf66; }
  .plq .cn { color: #a9c0ff; }
  .plq.tick { animation: tick .6s ease-out; }
  @keyframes tick { 0% { filter: brightness(1.7); } 100% { filter: none; } }
  .sign { position: absolute; padding: 4px 12px 5px; font: 700 15px/1 'Cinzel', serif; letter-spacing: 2px; color: var(--gold-hi); white-space: nowrap;
    background: linear-gradient(#5a3a20, #3a2412 60%, #2a190c); border-radius: 2px; text-shadow: 0 1px 0 #000;
    box-shadow: 0 0 0 1px #120a04, 0 4px 8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,210,150,.2); transform: translate(-50%, -100%); }
  .sign.small { font-size: 12px; letter-spacing: 1px; padding: 3px 8px 4px; }
  .sign.busy { color: #ff9a7a; }
  .sign.free { color: #b6e39a; }

  /* ---------- title (carved stone header in the dark above the walls) ---------- */
  #title { position: absolute; left: 584px; top: 22px; width: 630px; padding: 12px 22px 12px; text-align: center; border-radius: 4px;
    background: linear-gradient(#4a443e, #302b26 50%, #221e1a);
    box-shadow: 0 0 0 1px #0d0b09, 0 0 0 4px #1b1918, 0 0 0 5px #4b4136, 0 10px 24px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,240,215,.2), inset 0 -2px 0 rgba(0,0,0,.45); }
  #title .t { font: 900 28px/1.05 'Cinzel', serif; letter-spacing: 1px; white-space: nowrap; color: var(--gold); text-shadow: 0 2px 0 #000, 0 0 14px rgba(0,0,0,.8);
    background: linear-gradient(#f6e2a0, #c99b45 60%, #a87a30); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 0 #000); }
  #title .s { margin-top: 5px; font: italic 500 19px 'Spectral', serif; color: #d8ccb2; text-shadow: 0 1px 0 #000; }
  #title .i { margin-top: 6px; display: flex; justify-content: center; gap: 12px; font: 600 15px 'Cinzel', serif; color: #b9a98a; letter-spacing: .5px; text-shadow: 0 1px 0 #000; }
  #title .i b { color: var(--gold-hi); font-weight: 700; }
  #title .i .dot { color: #6b5a40; }
  #title .rivet { position: absolute; top: 50%; width: 9px; height: 9px; margin-top: -4px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #9a948c, #1a1817 70%); }

  #combo { position: absolute; left: 1062px; top: 232px; display: flex; align-items: center; gap: 14px; white-space: nowrap; padding: 8px 22px;
    font: 900 32px 'Cinzel', serif; color: var(--gold-hi); text-shadow: 0 3px 0 #000, 0 0 14px rgba(0,0,0,.9); max-width: 340px; overflow: hidden;
    background: linear-gradient(#2a2622f0, #15120ff0); box-shadow: 0 0 0 1px #000, 0 0 0 3px #4b4136, 0 10px 20px rgba(0,0,0,.7);
    transform: translate(-50%, -50%) scale(.6); opacity: 0; transition: opacity .3s, transform .3s cubic-bezier(.2,1.6,.4,1); }
  #combo.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* ---------- chat panel (stone and iron) ---------- */
  #chatpanel { position: absolute; left: 1560px; top: 440px; width: 344px; height: 624px; border-radius: 4px;
    background: linear-gradient(#141110f4, #0b0908f4);
    box-shadow: 0 0 0 2px #0a0908, 0 0 0 9px #3b3530, 0 0 0 10px #0d0b0a, 0 0 0 11px #5a4c3a, 0 14px 30px rgba(0,0,0,.8), inset 0 0 30px rgba(0,0,0,.8); }
  #chatpanel .hd { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: center; justify-content: center; gap: 12px;
    font: 700 19px 'Cinzel', serif; color: var(--gold); letter-spacing: 3px; text-shadow: 0 2px 0 #000;
    background: linear-gradient(#2e2924, #1a1714); border-bottom: 1px solid #4b4136; box-shadow: 0 1px 0 #000; }
  #chatpanel .hd::before, #chatpanel .hd::after { content: ''; width: 7px; height: 7px; background: #8a6a3a; transform: rotate(45deg); }
  #chatpanel .stud { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #a49c92, #1c1a19 70%); box-shadow: 0 1px 2px #000; }
  #chat { left: 10px; right: 10px; top: 50px; bottom: 8px; }
  #chat .sb-chat-line { font: 500 19px/1.38 'Spectral', 'Segoe UI', serif; }

  /* ---------- ?green=off info ---------- */
  #green.off { background: linear-gradient(#1a1613, #0e0c0a); padding: 22px 34px; overflow: hidden; display: flex; flex-direction: column; gap: 7px;
    box-shadow: inset 0 0 0 2px #4b4136, inset 0 0 40px rgba(0,0,0,.8); }
  #green .ih { font: 900 28px 'Cinzel', serif; color: var(--gold); letter-spacing: 2px; }
  #green .ih2 { margin-top: 8px; font: 700 16px 'Cinzel', serif; color: #a8976e; text-transform: uppercase; letter-spacing: 1px; }
  #green .ir { display: flex; justify-content: space-between; gap: 18px; font: 500 21px/1.2 'Spectral', serif; color: var(--ink); white-space: nowrap; }
  #green .ir span:first-child { overflow: hidden; text-overflow: ellipsis; }
  #green .ir.dim { color: #9c917a; font-size: 18px; }
  #green .ir .r { color: #ffcf66; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" class="layer"></canvas>
  <div id="wall" class="layer"></div>
  <div id="crowd" class="layer"></div>
  <canvas id="dark" class="layer" width="640" height="360"></canvas>
  <canvas id="glow" class="layer" width="640" height="360"></canvas>
  <canvas id="fx" class="layer"></canvas>
  <div id="plaques" class="layer"></div>
  <div id="labels" class="layer"></div>
  <div id="title"><div class="t"></div><div class="s"></div>
    <div class="i"><span>Local time <b id="clock"></b></span><span class="dot">✦</span><span id="next"></span></div>
    <div class="rivet" style="left:8px"></div><div class="rivet" style="right:8px"></div></div>
  <div id="combo"></div>
  <div id="chatpanel">
    <div class="hd">DGG Chat</div>
    <div class="stud" style="left:-11px;top:-11px"></div><div class="stud" style="right:-11px;top:-11px"></div>
    <div class="stud" style="left:-11px;bottom:-11px"></div><div class="stud" style="right:-11px;bottom:-11px"></div>
    <div id="chat"></div>
  </div>
  <div id="green"></div>
</div>

<script src="shared/core.js"></script>
<script src="shared/cinema.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const h = (tag, cls, ...kids) => { const el = document.createElement(tag); if (cls) el.className = cls; el.append(...kids); return el; };
  const { rand, pick } = SB;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const TAU = Math.PI * 2;
  const now = () => performance.now();
  // Smooth wobble in about -1..1 (flames, lights, sway): never a hard flash.
  const wob = (t) => (Math.sin(t) + Math.sin(t * 1.73 + 1.3) * 0.6 + Math.sin(t * 2.91 + 0.7) * 0.3) / 1.9;
  function mulberry(seed) {
    return () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Device pixels per stage pixel, kept in sync before mountStage emits its first resize.
  let K = 1;
  SB.on('resize', (s) => { K = Math.min(3, s * (devicePixelRatio || 1)); });
  SB.mountStage($('stage'));
  if (!q.has('f')) SB.cfg.f = '3';
  SB.mountChat($('chat'), { emoteHeight: 22, max: 36 });
  if (SB.cfg.chat === 'off') $('chatpanel').remove();
  const HAS_CHAT = !!$('chatpanel');

  $('title').querySelector('.t').textContent = SB.cfg.title || 'The Monastery Picture House';
  $('title').querySelector('.s').textContent = SB.cfg.sub || 'Standby · the film resumes soon';

  // ---------- isometric geometry ----------
  // Floor units (u, v): one unit = 64x32 px diamond. z in stage px. Back corner of the hall at (OX, OY).
  const OX = 440;
  const OY = 330;
  const WH = 260;     // wall height
  const LV = 14;      // left wall runs v = 0..LV  (screen x 440 -> -8)
  const RU = 46;      // right wall runs u = 0..RU (screen x 440 -> 1912)
  const iso = (u, v, z = 0) => [OX + (u - v) * 32, OY + (u + v) * 16 - z];
  const GREEN = { x: 1256, y: 36, w: 640, h: 360 };
  const TEXT_RIGHT = HAS_CHAT ? 1545 : 1910;
  const depth = (y) => Math.round(y);
  const green = $('green');

  const DOOR_U = [8.6, 14.6, 20.6, 26.6, 32.6];
  const ACCENT = ['#7a1a24', '#1f4a34', '#22346e', '#56246a', '#7a5618'];
  const ROMAN = ['I', 'II', 'III', 'IV', 'V'];
  const rooms = DOOR_U.map((c, i) => ({ i, c, D: c * 32, approach: [c, 1.5], door: [c, 0.45], inside: [c, -0.55], title: '', hasRating: false }));
  const LEFT_WIN = [5.2, 8.8];               // v of the lancet windows on the left wall
  const ENTRANCE_V = 12.3;                   // centre of the double doors (left wall)
  const BOOTH = { u0: 0.6, u1: 4.4, v0: 0.4, v1: 3.0, hgt: 150 };
  const CAULDRON = [9, 9];
  const PRIVY = { u0: 15.2, u1: 16.8, v0: 11.2, v1: 12.8 };
  const CHEST = [5.65, 5.3];
  const BARRELS = [[0.82, 9.55], [0.86, 10.72]];

  // ---------- procedural textures (made once) ----------
  function noiseCanvas(size, seed, cells, gain = 0.55, contrast = 1.8) {
    const rnd = mulberry(seed);
    const acc = new Float32Array(size * size);
    let amp = 1;
    let tot = 0;
    for (const cell of cells) {
      const n = Math.max(1, Math.round(size / cell));
      const grid = new Float32Array(n * n);
      for (let i = 0; i < grid.length; i++) grid[i] = rnd();
      for (let y = 0; y < size; y++) {
        const gy = (y / size) * n;
        const y0 = Math.floor(gy);
        let fy = gy - y0;
        fy = fy * fy * (3 - 2 * fy);
        const ya = (y0 % n) * n;
        const yb = ((y0 + 1) % n) * n;
        for (let x = 0; x < size; x++) {
          const gx = (x / size) * n;
          const x0 = Math.floor(gx);
          let fx = gx - x0;
          fx = fx * fx * (3 - 2 * fx);
          const xa = x0 % n;
          const xb = (x0 + 1) % n;
          const a = grid[ya + xa] + (grid[ya + xb] - grid[ya + xa]) * fx;
          const b = grid[yb + xa] + (grid[yb + xb] - grid[yb + xa]) * fx;
          acc[y * size + x] += (a + (b - a) * fy) * amp;
        }
      }
      tot += amp;
      amp *= gain;
    }
    const cv = document.createElement('canvas');
    cv.width = size;
    cv.height = size;
    const c = cv.getContext('2d');
    const img = c.createImageData(size, size);
    for (let i = 0; i < acc.length; i++) {
      const v = Math.round(clamp((acc[i] / tot - 0.5) * contrast + 0.5, 0, 1) * 255);
      img.data[i * 4] = v;
      img.data[i * 4 + 1] = v;
      img.data[i * 4 + 2] = v;
      img.data[i * 4 + 3] = 255;
    }
    c.putImageData(img, 0, 0);
    return cv;
  }
  const NOISE_FINE = noiseCanvas(256, 11, [32, 16, 8, 4, 2], 0.62, 2.0);
  const NOISE_BLOT = noiseCanvas(256, 23, [128, 64, 32, 16], 0.5, 2.2);

  // Fill the current clip with a tiled noise pattern.
  function fillTex(c, cv, alpha, op, scale, x, y, w, hh) {
    c.save();
    c.globalCompositeOperation = op;
    c.globalAlpha = alpha;
    const p = c.createPattern(cv, 'repeat');
    p.setTransform(new DOMMatrix([scale, 0, 0, scale, 0, 0]));
    c.fillStyle = p;
    c.fillRect(x, y, w, hh);
    c.restore();
  }

  function radialSprite(rgb, size = 128, stops = [[0, 1], [0.35, 0.62], [0.7, 0.18], [1, 0]]) {
    const cv = document.createElement('canvas');
    cv.width = size;
    cv.height = size;
    const c = cv.getContext('2d');
    const g = c.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    for (const [o, a] of stops) g.addColorStop(o, `rgba(${rgb},${a})`);
    c.fillStyle = g;
    c.fillRect(0, 0, size, size);
    return cv;
  }
  const HOLE = radialSprite('255,255,255');
  const WARM = radialSprite('255,138,48');
  const COOL = radialSprite('130,165,255');
  const PROJ = radialSprite('185,212,255');
  const GOLDL = radialSprite('255,205,90');
  const DOT_W = radialSprite('255,236,190', 32, [[0, 1], [0.4, 0.5], [1, 0]]);
  const DOT_C = radialSprite('210,225,255', 32, [[0, 1], [0.4, 0.45], [1, 0]]);
  const DOT_E = radialSprite('255,170,70', 32, [[0, 1], [0.3, 0.6], [1, 0]]);
  const DOT_S = radialSprite('200,195,190', 64, [[0, 0.5], [0.5, 0.22], [1, 0]]);

  // ---------- drawing helpers ----------
  let BASE = new DOMMatrix();
  function poly(c, pts) {
    c.beginPath();
    pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
    c.closePath();
  }
  function fillPoly(c, pts, fill) { poly(c, pts); c.fillStyle = fill; c.fill(); }
  function strokeLine(c, pts, color, w = 1) {
    c.beginPath();
    pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
    c.strokeStyle = color;
    c.lineWidth = w;
    c.stroke();
  }
  const add = ([x, y], dx, dy) => [x + dx, y + dy];
  // Local wall-plane coordinates: x along the plane in screen px, y = -z.
  function onV(c, v, u0) { c.setTransform(BASE); const [x, y] = iso(u0, v); c.transform(1, 0.5, 0, 1, x, y); }   // plane v = const, faces down-left
  function onU(c, u, v1) { c.setTransform(BASE); const [x, y] = iso(u, v1); c.transform(1, -0.5, 0, 1, x, y); } // plane u = const, faces down-right
  function archPath(c, cx, hw, spring, apex, base = 0) {
    c.moveTo(cx - hw, -base);
    c.lineTo(cx - hw, -spring);
    c.quadraticCurveTo(cx - hw, -(spring + (apex - spring) * 0.78), cx, -apex);
    c.quadraticCurveTo(cx + hw, -(spring + (apex - spring) * 0.78), cx + hw, -spring);
    c.lineTo(cx + hw, -base);
    c.closePath();
  }
  const hsl = (hh, s, l, a = 1) => `hsla(${hh} ${s}% ${l}% / ${a})`;

  // ---------- walls ----------
  function stoneBlock(c, x, y, w, hh, rnd, L0) {
    const L = L0 + rnd() * 9 - 4;
    const hue = 24 + rnd() * 18;
    const sat = 5 + rnd() * 7;
    const j = () => (rnd() - 0.5) * 1.6;
    c.beginPath();
    c.moveTo(x + j(), y + j());
    c.lineTo(x + w + j(), y + j());
    c.lineTo(x + w + j(), y + hh + j());
    c.lineTo(x + j(), y + hh + j());
    c.closePath();
    const g = c.createLinearGradient(x, y, x + w * 0.25, y + hh);
    g.addColorStop(0, hsl(hue, sat, L + 5));
    g.addColorStop(1, hsl(hue, sat, L - 5));
    c.fillStyle = g;
    c.fill();
    c.lineWidth = 1;
    c.strokeStyle = 'rgba(255,238,210,.14)';
    c.beginPath();
    c.moveTo(x + 1, y + hh - 1);
    c.lineTo(x + 1, y + 1);
    c.lineTo(x + w - 1, y + 1);
    c.stroke();
    c.strokeStyle = 'rgba(0,0,0,.38)';
    c.beginPath();
    c.moveTo(x + w - 0.5, y + 1);
    c.lineTo(x + w - 0.5, y + hh - 0.5);
    c.lineTo(x + 1, y + hh - 0.5);
    c.stroke();
    for (let i = 0; i < 5; i++) {
      c.fillStyle = rnd() < 0.55 ? 'rgba(0,0,0,.2)' : 'rgba(255,240,220,.07)';
      c.beginPath();
      c.arc(x + 2 + rnd() * (w - 4), y + 2 + rnd() * (hh - 4), 0.5 + rnd() * 1.3, 0, TAU);
      c.fill();
    }
    if (rnd() < 0.2) {
      const cx = rnd() < 0.5 ? x : x + w;
      const cy = rnd() < 0.5 ? y : y + hh;
      const s = 3 + rnd() * 4;
      fillPoly(c, [[cx, cy], [cx + (cx === x ? s : -s), cy], [cx, cy + (cy === y ? s : -s)]], 'rgba(10,8,6,.55)');
    }
  }

  function wallFace(c, len, rnd, L0) {
    c.fillStyle = '#17130f';
    c.fillRect(0, -WH, len, WH);
    let z = 0;
    while (z < WH - 1) {
      const hh = Math.min(WH - z, 21 + rnd() * 8);
      let x = -rnd() * 30;
      while (x < len) {
        const w = 28 + rnd() * 42;
        stoneBlock(c, x + 1.2, -(z + hh) + 1.2, w - 2.4, hh - 2.4, rnd, L0 - (z / WH) * 3);
        x += w;
      }
      z += hh;
    }
    c.save();
    c.beginPath();
    c.rect(0, -WH, len, WH);
    c.clip();
    fillTex(c, NOISE_FINE, 0.32, 'overlay', 0.55, 0, -WH, len, WH);
    fillTex(c, NOISE_BLOT, 0.38, 'multiply', 2.6, 0, -WH, len, WH);
    // Water streaks and soot.
    for (let i = 0; i < len / 55; i++) {
      const x = rnd() * len;
      const w = 5 + rnd() * 16;
      const l = 40 + rnd() * 140;
      const g = c.createLinearGradient(0, -WH, 0, -WH + l);
      g.addColorStop(0, `rgba(8,6,4,${0.12 + rnd() * 0.14})`);
      g.addColorStop(1, 'rgba(8,6,4,0)');
      c.fillStyle = g;
      c.fillRect(x, -WH, w, l);
    }
    let g = c.createLinearGradient(0, 0, 0, -70);
    g.addColorStop(0, 'rgba(6,5,4,.62)');
    g.addColorStop(1, 'rgba(6,5,4,0)');
    c.fillStyle = g;
    c.fillRect(0, -70, len, 70);
    g = c.createLinearGradient(0, -WH, 0, -WH + 90);
    g.addColorStop(0, 'rgba(4,3,3,.5)');
    g.addColorStop(1, 'rgba(4,3,3,0)');
    c.fillStyle = g;
    c.fillRect(0, -WH, len, 90);
    // Moss creeping up from the floor joint.
    for (let i = 0; i < len / 9; i++) {
      const x = rnd() * len;
      const y = -rnd() * rnd() * 22;
      c.fillStyle = hsl(78 + rnd() * 25, 28 + rnd() * 14, 14 + rnd() * 12, 0.55);
      c.beginPath();
      c.ellipse(x, y, 1.5 + rnd() * 3.5, 1 + rnd() * 2, 0, 0, TAU);
      c.fill();
    }
    c.restore();
  }

  function timber(c, x0, x1, zb, zt, rnd) {
    const y0 = -zt;
    const hh = zt - zb;
    let g = c.createLinearGradient(0, -zb, 0, -zb + 14);
    g.addColorStop(0, 'rgba(0,0,0,.5)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g;
    c.fillRect(x0, -zb, x1 - x0, 14);
    g = c.createLinearGradient(0, y0, 0, y0 + hh);
    g.addColorStop(0, '#634228');
    g.addColorStop(0.45, '#3f2816');
    g.addColorStop(1, '#22150b');
    c.fillStyle = g;
    c.fillRect(x0, y0, x1 - x0, hh);
    c.save();
    c.beginPath();
    c.rect(x0, y0, x1 - x0, hh);
    c.clip();
    for (let i = 0; i < hh * 1.6; i++) {
      const y = y0 + rnd() * hh;
      const xs = x0 + rnd() * (x1 - x0);
      const l = 40 + rnd() * 200;
      c.strokeStyle = rnd() < 0.6 ? `rgba(20,10,4,${0.25 + rnd() * 0.3})` : `rgba(160,110,60,${0.08 + rnd() * 0.1})`;
      c.lineWidth = 0.6 + rnd() * 0.7;
      c.beginPath();
      c.moveTo(xs, y);
      for (let x = xs; x < xs + l; x += 12) c.lineTo(x, y + Math.sin(x * 0.05 + i) * 0.7);
      c.stroke();
    }
    for (let i = 0; i < (x1 - x0) / 140; i++) {
      c.fillStyle = 'rgba(15,8,3,.6)';
      c.beginPath();
      c.ellipse(x0 + rnd() * (x1 - x0), y0 + hh * (0.3 + rnd() * 0.4), 3 + rnd() * 3, 1.5 + rnd(), 0, 0, TAU);
      c.fill();
    }
    fillTex(c, NOISE_FINE, 0.25, 'overlay', 0.5, x0, y0, x1 - x0, hh);
    c.restore();
    strokeLine(c, [[x0, y0 + 0.5], [x1, y0 + 0.5]], 'rgba(255,205,150,.18)');
    strokeLine(c, [[x0, y0 + hh - 0.5], [x1, y0 + hh - 0.5]], 'rgba(0,0,0,.6)');
    // Iron nails.
    for (let x = x0 + 30 + rnd() * 30; x < x1; x += 80 + rnd() * 30) {
      for (const yy of [y0 + hh * 0.3, y0 + hh * 0.72]) {
        c.fillStyle = '#121112';
        c.beginPath();
        c.arc(x, yy, 1.8, 0, TAU);
        c.fill();
        c.fillStyle = 'rgba(200,190,180,.35)';
        c.beginPath();
        c.arc(x - 0.5, yy - 0.6, 0.7, 0, TAU);
        c.fill();
      }
    }
  }

  function doorway(c, D, rnd) {
    // Stone surround with voussoirs, dark opening (the curtain is a DOM sprite on top).
    c.save();
    c.beginPath();
    archPath(c, D, 37, 96, 156);
    const g = c.createLinearGradient(D - 37, 0, D + 37, -156);
    g.addColorStop(0, '#605850');
    g.addColorStop(1, '#4a443e');
    c.fillStyle = g;
    c.fill();
    c.clip();
    fillTex(c, NOISE_FINE, 0.35, 'overlay', 0.5, D - 40, -160, 80, 160);
    c.restore();
    // Jamb quoins.
    for (let z = 0, k = 0; z < 96; z += 24, k++) {
      for (const side of [-1, 1]) {
        const x0 = side < 0 ? D - 37 : D + 26;
        const w = 11 + ((k + (side > 0 ? 1 : 0)) % 2) * 5;
        const xa = side < 0 ? x0 + 11 - w : x0;
        c.strokeStyle = 'rgba(0,0,0,.45)';
        c.lineWidth = 1.2;
        c.strokeRect(xa, -(z + 24), w, 24);
        strokeLine(c, [[xa + 1, -z - 1], [xa + 1, -z - 23], [xa + w - 1, -z - 23]], 'rgba(255,236,205,.16)');
      }
    }
    // Voussoir joints across the arch band.
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      const a = Math.PI - t * Math.PI;
      const xi = D + Math.cos(a) * 26;
      const xo = D + Math.cos(a) * 37;
      const zi = 96 + Math.sin(a) * 44;
      const zo = 96 + Math.sin(a) * 60;
      strokeLine(c, [[xi, -zi], [xo, -zo]], 'rgba(0,0,0,.5)', 1.2);
    }
    c.beginPath();
    archPath(c, D, 37, 96, 156);
    c.strokeStyle = 'rgba(0,0,0,.6)';
    c.lineWidth = 1.5;
    c.stroke();
    // Keystone.
    fillPoly(c, [[D - 6, -137], [D + 6, -137], [D + 8, -160], [D - 8, -160]], '#6d655c');
    strokeLine(c, [[D - 8, -160], [D + 8, -160]], 'rgba(255,236,205,.25)');
    // Opening with a reveal ring.
    c.beginPath();
    archPath(c, D, 26, 96, 140);
    c.fillStyle = '#050403';
    c.fill();
    c.save();
    c.clip();
    c.beginPath();
    archPath(c, D, 26, 96, 140);
    c.strokeStyle = '#231d17';
    c.lineWidth = 9;
    c.stroke();
    c.restore();
  }

  function lancet(c, W, moon) {
    // Pointed window with a deep reveal, leaded glass, night sky and (once) the moon.
    c.save();
    c.beginPath();
    archPath(c, W, 27, 182, 232, 88);
    c.fillStyle = '#5b544c';
    c.fill();
    c.clip();
    fillTex(c, NOISE_FINE, 0.35, 'overlay', 0.5, W - 30, -235, 60, 150);
    c.restore();
    c.beginPath();
    archPath(c, W, 27, 182, 232, 88);
    c.strokeStyle = 'rgba(0,0,0,.6)';
    c.lineWidth = 1.4;
    c.stroke();
    c.beginPath();
    archPath(c, W, 19, 182, 222, 98);
    c.fillStyle = '#16120f';
    c.fill();
    c.save();
    c.beginPath();
    archPath(c, W, 14, 182, 214, 102);
    c.clip();
    const g = c.createLinearGradient(0, -214, 0, -102);
    g.addColorStop(0, '#3a5490');
    g.addColorStop(0.5, '#22356a');
    g.addColorStop(1, '#101a36');
    c.fillStyle = g;
    c.fillRect(W - 15, -215, 30, 115);
    if (moon) {
      const mg = c.createRadialGradient(W + 5, -190, 0, W + 5, -190, 26);
      mg.addColorStop(0, 'rgba(220,232,255,.75)');
      mg.addColorStop(1, 'rgba(220,232,255,0)');
      c.fillStyle = mg;
      c.fillRect(W - 15, -215, 30, 60);
      c.fillStyle = '#eef3ff';
      c.beginPath();
      c.arc(W + 5, -190, 6.5, 0, TAU);
      c.fill();
      c.fillStyle = '#22356a';
      c.beginPath();
      c.arc(W + 8, -192, 5.6, 0, TAU);
      c.fill();
    } else {
      for (const [sx, sy] of [[-6, -196], [5, -168], [-3, -140], [7, -124]]) {
        c.fillStyle = 'rgba(230,238,255,.8)';
        c.fillRect(W + sx, sy, 1, 1);
      }
    }
    // Leaded diamond lattice.
    c.strokeStyle = 'rgba(8,10,18,.75)';
    c.lineWidth = 0.9;
    for (let k = -14; k < 12; k++) {
      c.beginPath();
      c.moveTo(W - 15, -100 - k * 9);
      c.lineTo(W + 15, -100 - k * 9 - 30);
      c.moveTo(W + 15, -100 - k * 9);
      c.lineTo(W - 15, -100 - k * 9 - 30);
      c.stroke();
    }
    c.restore();
    // Mullion and sill.
    fillPoly(c, [[W - 1.8, -102], [W + 1.8, -102], [W + 1.8, -206], [W - 1.8, -206]], '#4e4740');
    fillPoly(c, [[W - 24, -88], [W + 24, -88], [W + 26, -94], [W - 26, -94]], '#6e665d');
    strokeLine(c, [[W - 26, -94], [W + 26, -94]], 'rgba(255,236,205,.3)');
  }

  function entranceArch(c) {
    const E = (LV - ENTRANCE_V) * 32;
    c.save();
    c.beginPath();
    archPath(c, E, 46, 118, 180);
    c.fillStyle = '#5e564e';
    c.fill();
    c.clip();
    fillTex(c, NOISE_FINE, 0.35, 'overlay', 0.5, E - 50, -185, 100, 185);
    c.restore();
    for (let i = 0; i <= 12; i++) {
      const a = Math.PI - (i / 12) * Math.PI;
      strokeLine(c, [[E + Math.cos(a) * 35, -(118 + Math.sin(a) * 46)], [E + Math.cos(a) * 46, -(118 + Math.sin(a) * 62)]], 'rgba(0,0,0,.5)', 1.2);
    }
    for (let z = 0; z < 118; z += 24) {
      for (const xa of [E - 46, E + 35]) {
        c.strokeStyle = 'rgba(0,0,0,.45)';
        c.strokeRect(xa, -(z + 24), 11, 24);
      }
    }
    c.beginPath();
    archPath(c, E, 35, 118, 166);
    const g = c.createLinearGradient(0, -166, 0, 0);
    g.addColorStop(0, '#1b2846');
    g.addColorStop(0.6, '#121c34');
    g.addColorStop(1, '#202838');
    c.fillStyle = g;
    c.fill();
    // Moonlit lane outside: a far wall, a lamp and cobbles.
    c.save();
    c.clip();
    fillPoly(c, [[E - 35, -70], [E + 35, -84], [E + 35, 0], [E - 35, 0]], '#0e1424');
    c.fillStyle = 'rgba(255,190,110,.6)';
    c.beginPath();
    c.arc(E + 14, -92, 2.2, 0, TAU);
    c.fill();
    for (let i = 0; i < 40; i++) {
      c.fillStyle = `rgba(120,140,190,${0.08 + Math.random() * 0.1})`;
      c.beginPath();
      c.ellipse(E - 34 + Math.random() * 68, -Math.random() * 30, 3, 1.5, 0, 0, TAU);
      c.fill();
    }
    c.restore();
  }

  function drawRightWall(c, rnd) {
    onV(c, 0, 0);
    const len = RU * 32;
    wallFace(c, len, rnd, 31);
    timber(c, 0, len, 166, 182, rnd);
    timber(c, 0, len, 244, 260, rnd);
    for (const r of rooms) doorway(c, r.D, rnd);
    // Faint plaster ghosts where old posters hung.
    c.setTransform(BASE);
  }
  function drawLeftWall(c, rnd) {
    onU(c, 0, LV);
    const len = LV * 32;
    wallFace(c, len, rnd, 25);
    timber(c, 0, len, 244, 260, rnd);
    for (const [i, v] of LEFT_WIN.entries()) lancet(c, (LV - v) * 32, i === 0);
    timber(c, 0, len, 196, 210, rnd);
    entranceArch(c);
    // The left wall is turned away from most lamps.
    c.fillStyle = 'rgba(10,12,24,.18)';
    c.fillRect(0, -WH, len, WH);
    c.setTransform(BASE);
  }

  function drawCaps(c, rnd) {
    const back = 22;
    const rA = iso(0, 0, WH);
    const rB = iso(RU, 0, WH);
    const lA = iso(0, LV, WH);
    const cap = (pts, col) => {
      poly(c, pts);
      const g = c.createLinearGradient(pts[0][0], pts[0][1], pts[3][0], pts[3][1]);
      g.addColorStop(0, col);
      g.addColorStop(1, '#16130f');
      c.fillStyle = g;
      c.fill();
    };
    cap([rA, rB, add(rB, back, -11), add(rA, back, -11)], '#4a433b');
    cap([lA, rA, add(rA, -back, -11), add(lA, -back, -11)], '#3e3832');
    fillPoly(c, [rA, add(rA, back, -11), add(rA, 0, -22), add(rA, -back, -11)], '#2a2520');
    strokeLine(c, [lA, rA, rB], 'rgba(255,230,190,.22)', 1.2);
    // Joints on the coping.
    for (let u = 1; u < RU; u += 1.4 + rnd()) strokeLine(c, [iso(u, 0, WH), add(iso(u, 0, WH), back, -11)], 'rgba(0,0,0,.4)');
    for (let v = 1; v < LV; v += 1.4 + rnd()) strokeLine(c, [iso(0, v, WH), add(iso(0, v, WH), -back, -11)], 'rgba(0,0,0,.4)');
    // Corner quoin highlight.
    strokeLine(c, [iso(0, 0, 0), iso(0, 0, WH)], 'rgba(255,230,190,.12)', 1.5);
  }

  function drawVoid(c) {
    const g = c.createLinearGradient(0, 0, 0, 700);
    g.addColorStop(0, '#030204');
    g.addColorStop(1, '#0b090b');
    c.fillStyle = g;
    c.fillRect(0, 0, 1920, 1080);
    // A whisper of vaulting in the dark.
    c.save();
    c.globalAlpha = 0.5;
    for (let i = 0; i < 6; i++) {
      const x = 470 + i * 150;
      const rg = c.createRadialGradient(x, 30 + i * 70, 0, x, 30 + i * 70, 180);
      rg.addColorStop(0, 'rgba(40,34,30,.35)');
      rg.addColorStop(1, 'rgba(40,34,30,0)');
      c.fillStyle = rg;
      c.fillRect(x - 180, i * 70 - 150, 360, 360);
    }
    c.restore();
  }

  // ---------- floor ----------
  function drawFloor(c, rnd) {
    c.save();
    poly(c, [[-80, iso(0, LV + 2.5)[1]], iso(0, LV + 2.5), iso(0, 0), iso(RU + 2, 0), [1990, 1100], [-80, 1100]]);
    c.clip();
    c.fillStyle = '#13110e';
    c.fillRect(-80, 300, 2100, 800);
    const NU = 50;
    const NV = 34;
    const taken = new Uint8Array(NU * NV);
    const stones = [];
    for (let v = 0; v < NV; v++) {
      for (let u = 0; u < NU; u++) {
        if (taken[v * NU + u]) continue;
        const r = rnd();
        let su = 1;
        let sv = 1;
        if (r < 0.2) { su = 2; sv = 2; } else if (r < 0.48) su = 2; else if (r < 0.72) sv = 2;
        if (u + su > NU || v + sv > NV) { su = 1; sv = 1; }
        let free = true;
        for (let a = 0; a < su; a++) for (let b = 0; b < sv; b++) if (taken[(v + b) * NU + u + a]) free = false;
        if (!free) { su = 1; sv = 1; }
        for (let a = 0; a < su; a++) for (let b = 0; b < sv; b++) taken[(v + b) * NU + u + a] = 1;
        stones.push([u, v, su, sv]);
      }
    }
    for (const [u, v, su, sv] of stones) {
      const [cx, cy] = iso(u + su / 2, v + sv / 2);
      if (cx < -120 || cx > 2040 || cy > 1150 || cy < 280) { rnd(); continue; }
      const j = () => (rnd() - 0.5) * 0.09;
      const ins = 0.05;
      const N = iso(u + ins + j(), v + ins + j());
      const E = iso(u + su - ins + j(), v + ins + j());
      const S = iso(u + su - ins + j(), v + sv - ins + j());
      const Wp = iso(u + ins + j(), v + sv - ins + j());
      poly(c, [N, E, S, Wp]);
      const damp = clamp(1 - (u + v) / 30, 0, 1);
      const greenish = rnd() < 0.18;
      const L = 27 + rnd() * 10 - damp * 4;
      const hue = greenish ? 55 + rnd() * 25 : 22 + rnd() * 16;
      const sat = greenish ? 6 + rnd() * 5 : 6 + rnd() * 7;
      const g = c.createLinearGradient(N[0], N[1], S[0], S[1]);
      g.addColorStop(0, hsl(hue, sat, L + 4));
      g.addColorStop(1, hsl(hue, sat, L - 5));
      c.fillStyle = g;
      c.fill();
      strokeLine(c, [Wp, N, E], 'rgba(255,236,208,.12)', 1);
      strokeLine(c, [Wp, S, E], 'rgba(0,0,0,.42)', 1.3);
      // Pits and flecks.
      for (let i = 0; i < 5 * su * sv; i++) {
        const [x, y] = iso(u + 0.12 + rnd() * (su - 0.24), v + 0.12 + rnd() * (sv - 0.24));
        c.fillStyle = rnd() < 0.6 ? 'rgba(0,0,0,.2)' : 'rgba(255,240,220,.07)';
        c.beginPath();
        c.ellipse(x, y, 0.7 + rnd() * 1.6, 0.4 + rnd() * 0.8, 0, 0, TAU);
        c.fill();
      }
      if (rnd() < 0.16) {
        let [x, y] = iso(u + rnd() * su, v + rnd() * sv);
        const pts = [[x, y]];
        for (let k = 0; k < 4; k++) { x += (rnd() - 0.5) * 22; y += (rnd() - 0.3) * 9; pts.push([x, y]); }
        strokeLine(c, pts, 'rgba(0,0,0,.5)', 0.9);
        strokeLine(c, pts.map(([a, b]) => [a + 0.8, b + 0.8]), 'rgba(255,240,220,.06)', 0.7);
      }
      // Moss in the joints, thicker near the damp walls.
      if (rnd() < 0.22 + damp * 0.35) {
        const n = 3 + Math.floor(rnd() * 7);
        const along = rnd() < 0.5;
        for (let k = 0; k < n; k++) {
          const t = rnd();
          const [x, y] = along ? iso(u + t * su, v + sv) : iso(u + su, v + t * sv);
          c.fillStyle = hsl(80 + rnd() * 22, 26 + rnd() * 16, 15 + rnd() * 12, 0.75);
          c.beginPath();
          c.ellipse(x + (rnd() - 0.5) * 3, y + (rnd() - 0.5) * 2, 1.2 + rnd() * 2.6, 0.8 + rnd() * 1.3, 0, 0, TAU);
          c.fill();
          if (rnd() < 0.4) {
            c.fillStyle = 'rgba(150,170,80,.35)';
            c.beginPath();
            c.arc(x, y - 0.6, 0.7, 0, TAU);
            c.fill();
          }
        }
      }
    }
    fillTex(c, NOISE_FINE, 0.38, 'overlay', 0.6, -80, 300, 2100, 800);
    fillTex(c, NOISE_BLOT, 0.42, 'multiply', 3.2, -80, 300, 2100, 800);
    // Ambient occlusion along the wall bases.
    const ao = (a, b, nx, ny, d) => {
      const g = c.createLinearGradient(a[0], a[1], a[0] + nx * d, a[1] + ny * d);
      g.addColorStop(0, 'rgba(4,3,2,.75)');
      g.addColorStop(1, 'rgba(4,3,2,0)');
      c.fillStyle = g;
      fillPoly(c, [a, b, [b[0] + nx * d, b[1] + ny * d], [a[0] + nx * d, a[1] + ny * d]], g);
    };
    ao(iso(0, 0), iso(RU + 2, 0), -0.447, 0.894, 56);
    ao(iso(0, LV + 2), iso(0, 0), 0.447, 0.894, 56);
    c.restore();
  }

  function drawRug(c, rnd) {
    const P = (d) => [[2.0 + d, 3.45 + d], [3.0 - d, 3.45 + d], [3.0 - d, 12.85 - d], [0.1 + d, 12.85 - d], [0.1 + d, 11.75 + d], [2.0 + d, 11.75 + d]].map(([u, v]) => iso(u, v));
    c.save();
    c.filter = 'blur(3px)';
    fillPoly(c, P(-0.06).map(([x, y]) => [x + 2, y + 3]), 'rgba(0,0,0,.55)');
    c.restore();
    fillPoly(c, P(0), '#4c1015');
    fillPoly(c, P(0.07), '#7a1c22');
    c.save();
    poly(c, P(0));
    c.clip();
    // Woven pattern: diamonds down the middle, a gold border.
    for (let v = 4.1; v < 12.4; v += 0.75) fillPoly(c, [iso(2.5, v - 0.28), iso(2.78, v), iso(2.5, v + 0.28), iso(2.22, v)], 'rgba(200,150,60,.45)');
    for (let u = 0.7; u < 2.2; u += 0.75) fillPoly(c, [iso(u - 0.28, 12.3), iso(u, 12.58), iso(u + 0.28, 12.3), iso(u, 12.02)], 'rgba(200,150,60,.45)');
    poly(c, P(0.13));
    c.strokeStyle = 'rgba(214,170,80,.55)';
    c.lineWidth = 1.4;
    c.stroke();
    poly(c, P(0.2));
    c.strokeStyle = 'rgba(30,6,8,.6)';
    c.lineWidth = 1;
    c.stroke();
    fillTex(c, NOISE_FINE, 0.5, 'overlay', 0.5, 0, 300, 700, 400);
    // Worn where the queue stands.
    for (let v = 3.9; v < 11; v += 1) {
      const [x, y] = iso(2.5, v);
      const g = c.createRadialGradient(x, y, 0, x, y, 26);
      g.addColorStop(0, 'rgba(210,170,140,.16)');
      g.addColorStop(1, 'rgba(210,170,140,0)');
      c.fillStyle = g;
      c.fillRect(x - 30, y - 20, 60, 40);
    }
    c.restore();
    // Fringe at the booth end.
    for (let u = 2.03; u < 3.0; u += 0.05) strokeLine(c, [iso(u, 3.45), add(iso(u, 3.45), 5, -3)], 'rgba(220,190,130,.55)', 0.8);
  }

  function drawThresholds(c) {
    for (const r of rooms) {
      const pts = [iso(r.c - 1.05, 0), iso(r.c + 1.05, 0), iso(r.c + 1.05, 0.42), iso(r.c - 1.05, 0.42)];
      fillPoly(c, pts, '#4b443d');
      strokeLine(c, [pts[3], pts[2], pts[1]], 'rgba(0,0,0,.5)', 1.2);
      strokeLine(c, [pts[0], pts[3]], 'rgba(255,236,208,.15)');
      const [x, y] = iso(r.c, 0.21);
      const g = c.createRadialGradient(x, y, 0, x, y, 30);
      g.addColorStop(0, 'rgba(220,200,170,.12)');
      g.addColorStop(1, 'rgba(220,200,170,0)');
      c.fillStyle = g;
      c.fillRect(x - 32, y - 18, 64, 36);
    }
    // Entrance step.
    const e = [iso(0, ENTRANCE_V - 1.15), iso(0.45, ENTRANCE_V - 1.15), iso(0.45, ENTRANCE_V + 1.15), iso(0, ENTRANCE_V + 1.15)];
    fillPoly(c, e, '#4b443d');
    strokeLine(c, [e[1], e[2], e[3]], 'rgba(0,0,0,.5)', 1.2);
  }

  // ---------- props ----------
  const torches = [];
  const candles = [];
  function torch(c, side, lx) {
    // Iron sconce on the wall at z 132, torch leaning out, flame drawn live on the fx canvas.
    const z = 132;
    const wallPt = side === 'R' ? iso(lx / 32, 0, z) : iso(0, LV - lx / 32, z);
    const out = side === 'R' ? [-12, 6] : [12, 6];
    const [wx, wy] = wallPt;
    fillPoly(c, side === 'R' ? [[wx - 4, wy - 9], [wx + 4, wy - 5], [wx + 4, wy + 9], [wx - 4, wy + 5]] : [[wx - 4, wy - 5], [wx + 4, wy - 9], [wx + 4, wy + 5], [wx - 4, wy + 9]], '#1d1b1c');
    strokeLine(c, [[wx, wy + 2], [wx + out[0], wy + out[1] + 2]], '#151314', 3);
    strokeLine(c, [[wx, wy + 1], [wx + out[0], wy + out[1] + 1]], 'rgba(200,190,180,.25)', 0.8);
    const [bx, by] = [wx + out[0], wy + out[1]];
    // Cup and torch shaft.
    fillPoly(c, [[bx - 5, by - 3], [bx + 5, by - 3], [bx + 3, by + 4], [bx - 3, by + 4]], '#222022');
    const tx = bx + out[0] * 0.25;
    const ty = by - 24;
    strokeLine(c, [[bx, by], [tx, ty]], '#4a3018', 4);
    strokeLine(c, [[bx - 0.8, by], [tx - 0.8, ty]], 'rgba(255,200,140,.25)', 1);
    fillPoly(c, [[tx - 4, ty + 3], [tx + 4, ty + 3], [tx + 4.5, ty - 4], [tx - 4.5, ty - 4]], '#2a1c12');
    const fl = { x: tx, y: ty - 3, seed: torches.length * 2.3 };
    torches.push(fl);
    return fl;
  }

  function candleCluster(c, x, y, seed, n = 3) {
    const rnd = mulberry(seed);
    const g = c.createRadialGradient(x, y, 0, x, y, 16);
    g.addColorStop(0, 'rgba(236,224,196,.5)');
    g.addColorStop(1, 'rgba(236,224,196,0)');
    c.fillStyle = g;
    c.beginPath();
    c.ellipse(x, y, 16, 7, 0, 0, TAU);
    c.fill();
    const list = [[-6, -1, 15], [1, 2, 11], [7, -2, 8], [-1, -3, 19], [4, 4, 6]].slice(0, n);
    list.sort((a, b) => a[1] - b[1]);
    for (const [dx, dy, hgt] of list) {
      const cx = x + dx;
      const cy = y + dy;
      const w = 2.4 + rnd() * 0.8;
      const gg = c.createLinearGradient(cx - w, 0, cx + w, 0);
      gg.addColorStop(0, '#bfae8e');
      gg.addColorStop(0.4, '#f2e8d2');
      gg.addColorStop(1, '#9a8a6c');
      c.fillStyle = gg;
      c.fillRect(cx - w, cy - hgt, w * 2, hgt);
      c.beginPath();
      c.ellipse(cx, cy, w, w * 0.45, 0, 0, Math.PI);
      c.fill();
      c.fillStyle = '#f7eedc';
      c.beginPath();
      c.ellipse(cx, cy - hgt, w, w * 0.45, 0, 0, TAU);
      c.fill();
      c.fillStyle = 'rgba(245,235,215,.9)';
      c.fillRect(cx + w * 0.3, cy - hgt, 1.1, 3 + rnd() * 4);
      // Static flame (the glow flickers on the light canvases).
      const fy = cy - hgt - 1;
      const fg = c.createRadialGradient(cx, fy - 3, 0, cx, fy - 3, 5);
      fg.addColorStop(0, 'rgba(255,250,225,1)');
      fg.addColorStop(0.45, 'rgba(255,190,80,.9)');
      fg.addColorStop(1, 'rgba(255,120,30,0)');
      c.fillStyle = fg;
      c.beginPath();
      c.moveTo(cx - 2.2, fy);
      c.quadraticCurveTo(cx - 2.4, fy - 4, cx, fy - 8);
      c.quadraticCurveTo(cx + 2.4, fy - 4, cx + 2.2, fy);
      c.quadraticCurveTo(cx, fy + 1.5, cx - 2.2, fy);
      c.fill();
      candles.push({ x: cx, y: fy - 3 });
    }
  }

  function barrel(c, u, v, r = 0.43, hgt = 44, rnd = Math.random) {
    const [x, y] = iso(u, v);
    const rx = r * 45;
    const ry = r * 22.6;
    const sg = c.createRadialGradient(x + 4, y + 1, 0, x + 4, y + 1, rx * 1.5);
    sg.addColorStop(0, 'rgba(0,0,0,.6)');
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = sg;
    c.beginPath();
    c.ellipse(x + 4, y + 1, rx * 1.5, ry * 1.5, 0, 0, TAU);
    c.fill();
    c.beginPath();
    c.moveTo(x - rx, y - hgt);
    c.quadraticCurveTo(x - rx * 1.16, y - hgt / 2, x - rx, y);
    c.ellipse(x, y, rx, ry, 0, Math.PI, 0, true);
    c.quadraticCurveTo(x + rx * 1.16, y - hgt / 2, x + rx, y - hgt);
    c.closePath();
    const g = c.createLinearGradient(x - rx * 1.1, 0, x + rx * 1.1, 0);
    g.addColorStop(0, '#24170c');
    g.addColorStop(0.32, '#7a5030');
    g.addColorStop(0.55, '#5a3820');
    g.addColorStop(1, '#1c1209');
    c.fillStyle = g;
    c.fill();
    c.save();
    c.clip();
    for (let a = -1.3; a <= 1.3; a += 0.32) {
      const sx = x + Math.sin(a) * rx * 1.05;
      strokeLine(c, [[sx, y - hgt], [sx + Math.sin(a) * 2, y - hgt / 2], [sx, y + ry]], 'rgba(10,5,2,.45)', 0.9);
    }
    fillTex(c, NOISE_FINE, 0.35, 'overlay', 0.4, x - rx * 1.2, y - hgt - ry, rx * 2.4, hgt + ry * 2);
    c.restore();
    for (const f of [0.18, 0.8]) {
      const yy = y - hgt * f;
      const k = f > 0.5 ? 1.0 : 1.04;
      c.beginPath();
      c.ellipse(x, yy, rx * k * 1.06, ry * 0.95, 0, 0.05, Math.PI - 0.05);
      c.strokeStyle = '#1d1c1e';
      c.lineWidth = 3;
      c.stroke();
      c.beginPath();
      c.ellipse(x, yy - 1, rx * k * 1.04, ry * 0.95, 0, 0.6, 1.3);
      c.strokeStyle = 'rgba(210,200,190,.3)';
      c.lineWidth = 1;
      c.stroke();
    }
    c.beginPath();
    c.ellipse(x, y - hgt, rx, ry, 0, 0, TAU);
    const tg = c.createLinearGradient(x - rx, y - hgt - ry, x + rx, y - hgt + ry);
    tg.addColorStop(0, '#8a6038');
    tg.addColorStop(1, '#3e2814');
    c.fillStyle = tg;
    c.fill();
    c.strokeStyle = '#1c130a';
    c.lineWidth = 2;
    c.stroke();
    for (let k = -2; k <= 2; k++) strokeLine(c, [[x + k * rx * 0.35 - ry * 0.5, y - hgt - ry * 0.75], [x + k * rx * 0.35 + ry * 0.5, y - hgt + ry * 0.75]], 'rgba(20,10,4,.4)', 0.8);
    return [x, y - hgt];
  }

  function drawBooth(c, rnd) {
    const { u0, u1, v0, v1, hgt } = BOOTH;
    c.setTransform(BASE);
    // Soft contact shadow.
    c.save();
    c.filter = 'blur(7px)';
    fillPoly(c, [iso(u0 - 0.2, v0), iso(u1 + 0.6, v0), iso(u1 + 0.6, v1 + 0.9), iso(u0 - 0.2, v1 + 0.9)], 'rgba(0,0,0,.6)');
    c.restore();

    const planks = (len, zTop, dark, baseZ = 0) => {
      for (let x = 0; x < len; x += 10.4) {
        const g = c.createLinearGradient(x, 0, x + 10.4, 0);
        const L = 20 + rnd() * 8 - dark;
        g.addColorStop(0, hsl(24, 38, L + 3));
        g.addColorStop(1, hsl(22, 38, L - 3));
        c.fillStyle = g;
        c.fillRect(x, -zTop, Math.min(10.4, len - x), zTop - baseZ);
        strokeLine(c, [[x + 0.5, -zTop], [x + 0.5, -baseZ]], 'rgba(0,0,0,.5)', 1);
        for (let k = 0; k < 3; k++) {
          const gx = x + 2 + rnd() * 7;
          strokeLine(c, [[gx, -zTop], [gx + (rnd() - 0.5) * 2, -(zTop + baseZ) / 2], [gx, -baseZ]], 'rgba(20,10,4,.3)', 0.6);
        }
      }
      fillTex(c, NOISE_FINE, 0.3, 'overlay', 0.4, 0, -zTop, len, zTop - baseZ);
    };

    // Side (+u) face.
    onU(c, u1, v1);
    const sideLen = (v1 - v0) * 32;
    planks(sideLen, hgt, 6);
    timber(c, 0, sideLen, 16, 26, rnd);
    timber(c, 0, sideLen, 128, 138, rnd);
    fillPoly(c, [[0, 0], [8, 0], [8, -hgt], [0, -hgt]], '#4a3018');
    // A pinned notice on the side.
    fillPoly(c, [[30, -96], [56, -96], [56, -62], [30, -62]], '#cdb78e');
    for (let k = 0; k < 6; k++) strokeLine(c, [[33, -90 + k * 4.5], [53 - (k % 3) * 4, -90 + k * 4.5]], 'rgba(60,40,20,.55)', 0.8);
    c.fillStyle = '#6a1a10';
    c.beginPath();
    c.arc(43, -95, 1.8, 0, TAU);
    c.fill();
    c.fillStyle = 'rgba(0,0,0,.25)';
    c.fillRect(0, -hgt, sideLen, hgt);

    // Front (+v) face.
    onV(c, v1, u0);
    const fl = (u1 - u0) * 32;
    planks(fl, 72, 0);
    planks(fl, hgt, 0, 136);
    // Carved panels on the lower front.
    for (const px of [14, 64]) {
      c.strokeStyle = 'rgba(0,0,0,.55)';
      c.lineWidth = 1.5;
      c.strokeRect(px, -62, 44, 46);
      c.strokeStyle = 'rgba(255,210,150,.14)';
      c.lineWidth = 1;
      c.strokeRect(px + 3, -59, 38, 40);
      c.fillStyle = 'rgba(214,170,80,.35)';
      c.beginPath();
      c.moveTo(px + 22, -50);
      c.lineTo(px + 30, -39);
      c.lineTo(px + 22, -28);
      c.lineTo(px + 14, -39);
      c.closePath();
      c.fill();
    }
    // Window opening, warm inside.
    const ig = c.createLinearGradient(0, -136, 0, -78);
    ig.addColorStop(0, '#2a180c');
    ig.addColorStop(1, '#5a3418');
    c.fillStyle = ig;
    c.fillRect(14, -136, fl - 28, 58);
    // Clerk, drawn camera-facing and clipped to the window.
    c.save();
    c.beginPath();
    c.rect(14, -136, fl - 28, 58);
    c.clip();
    c.setTransform(BASE);
    drawClerk(c, iso((u0 + u1) / 2, v1 - 0.6, 78));
    c.restore();
    onV(c, v1, u0);
    // Iron grille with a ticket slot.
    for (let x = 18; x < fl - 14; x += 9) {
      const slot = x > 48 && x < 72;
      const top = -136;
      const bot = slot ? -92 : -78;
      strokeLine(c, [[x, top], [x, bot]], '#141314', 2.2);
      strokeLine(c, [[x - 0.6, top], [x - 0.6, bot]], 'rgba(220,200,180,.25)', 0.6);
    }
    strokeLine(c, [[14, -112], [fl - 14, -112]], '#141314', 2.4);
    strokeLine(c, [[14, -92], [fl - 14, -92]], '#141314', 1.8);
    c.strokeStyle = '#2a1a0c';
    c.lineWidth = 3;
    c.strokeRect(14, -136, fl - 28, 58);
    // Corner posts.
    for (const px of [0, fl - 8]) {
      const g = c.createLinearGradient(px, 0, px + 8, 0);
      g.addColorStop(0, '#5a3a20');
      g.addColorStop(1, '#2e1c0e');
      c.fillStyle = g;
      c.fillRect(px, -hgt, 8, hgt);
    }
    // Counter shelf.
    c.setTransform(BASE);
    const ct = [iso(u0 - 0.1, v1, 80), iso(u1 + 0.1, v1, 80), iso(u1 + 0.1, v1 + 0.45, 80), iso(u0 - 0.1, v1 + 0.45, 80)];
    fillPoly(c, ct, '#7a5232');
    strokeLine(c, [ct[3], ct[2], ct[1]], 'rgba(255,214,160,.3)');
    fillPoly(c, [ct[3], ct[2], add(ct[2], 0, 6), add(ct[3], 0, 6)], '#3a2412');
    fillPoly(c, [ct[2], ct[1], add(ct[1], 0, 6), add(ct[2], 0, 6)], '#2a1a0c');
    // Things on the counter: a brass bell and a candle.
    const [bx, by] = iso(u0 + 0.75, v1 + 0.22, 80);
    c.fillStyle = '#b8913f';
    c.beginPath();
    c.ellipse(bx, by - 3, 4, 4.5, 0, Math.PI, 0);
    c.fill();
    c.fillRect(bx - 5, by - 3, 10, 1.6);
    candleCluster(c, ...iso(u1 - 0.45, v1 + 0.22, 80), 31, 2);

    // Canopy roof with carved fascia.
    const zr = 196;
    const ze = 150;
    const ru0 = 0.25;
    const ru1 = 4.85;
    const rv0 = -0.3;
    const rv1 = 3.75;
    const rmid = 1.72;
    fillPoly(c, [iso(ru0, rv0, ze), iso(ru1, rv0, ze), iso(ru1, rmid, zr), iso(ru0, rmid, zr)], '#2a1c12');
    const R1 = iso(ru0, rmid, zr);
    const R2 = iso(ru1, rmid, zr);
    const E1 = iso(ru0, rv1, ze);
    const E2 = iso(ru1, rv1, ze);
    fillPoly(c, [R1, R2, E2, E1], '#4a2e1a');
    // Shingles.
    const rows = 7;
    for (let r = 0; r < rows; r++) {
      const t0 = r / rows;
      const t1 = (r + 1) / rows;
      const cols = 22;
      for (let k = 0; k < cols; k++) {
        const s0 = (k + (r % 2) * 0.5) / cols;
        const s1 = Math.min(1, s0 + 1 / cols);
        if (s0 >= 1) continue;
        const p = (s, t) => [lerp(lerp(R1[0], R2[0], s), lerp(E1[0], E2[0], s), t), lerp(lerp(R1[1], R2[1], s), lerp(E1[1], E2[1], s), t)];
        const L = 18 + rnd() * 10 + r * 1.2;
        poly(c, [p(s0, t0), p(s1, t0), p(s1, t1 + 0.04), p(s0, t1 + 0.04)]);
        c.fillStyle = hsl(22, 30, L);
        c.fill();
        strokeLine(c, [p(s0, t1 + 0.04), p(s1, t1 + 0.04)], 'rgba(0,0,0,.55)', 1.1);
        strokeLine(c, [p(s0, t0), p(s0, t1)], 'rgba(0,0,0,.35)', 0.7);
      }
    }
    // Gable end (+u).
    const G1 = iso(ru1, rv0, ze);
    fillPoly(c, [G1, E2, R2], '#3a2414');
    c.save();
    poly(c, [G1, E2, R2]);
    c.clip();
    for (let k = 1; k < 9; k++) strokeLine(c, [[lerp(E2[0], G1[0], k / 9), 0], [lerp(E2[0], G1[0], k / 9), 600]], 'rgba(0,0,0,.3)');
    c.restore();
    strokeLine(c, [G1, R2, E2], '#1e120a', 4);
    strokeLine(c, [add(G1, 0, -2), add(R2, 0, -2), add(E2, 0, -2)], 'rgba(214,170,80,.4)', 1);
    // Fascia board with scallops.
    const sc = 14;
    c.beginPath();
    c.moveTo(...E1);
    c.lineTo(...E2);
    c.lineTo(E2[0], E2[1] + 9);
    for (let k = sc; k >= 0; k--) {
      const p = [lerp(E1[0], E2[0], k / sc), lerp(E1[1], E2[1], k / sc) + 9];
      const pm = [lerp(E1[0], E2[0], (k + 0.5) / sc), lerp(E1[1], E2[1], (k + 0.5) / sc) + 14];
      if (k < sc) c.quadraticCurveTo(pm[0], pm[1], p[0], p[1]);
    }
    c.closePath();
    c.fillStyle = '#3a2210';
    c.fill();
    strokeLine(c, [add(E1, 0, 3), add(E2, 0, 3)], 'rgba(214,170,80,.55)', 1.2);
    strokeLine(c, [E1, E2], 'rgba(255,220,170,.28)', 1);
    // Finial.
    fillPoly(c, [add(R2, -2, 0), add(R2, 2, 0), add(R2, 0, -14)], '#b8913f');

    // Hanging lantern at the front corner.
    const A = iso(ru1 - 0.15, rv1 - 0.1, ze - 4);
    strokeLine(c, [A, add(A, 0, 18)], '#1a1819', 1.2);
    const [lx, ly] = add(A, 0, 18);
    fillPoly(c, [[lx - 6, ly + 2], [lx + 6, ly + 2], [lx, ly - 4]], '#1d1b1c');
    const lg = c.createLinearGradient(0, ly + 2, 0, ly + 20);
    lg.addColorStop(0, '#ffe2a0');
    lg.addColorStop(1, '#e08a2a');
    c.fillStyle = lg;
    c.fillRect(lx - 5, ly + 2, 10, 17);
    for (const dx of [-5, 0, 5]) strokeLine(c, [[lx + dx, ly + 2], [lx + dx, ly + 19]], '#1d1b1c', 1.4);
    fillPoly(c, [[lx - 6, ly + 19], [lx + 6, ly + 19], [lx, ly + 25]], '#1d1b1c');
    return [lx, ly + 10];
  }

  function drawClerk(c, [x, y]) {
    // Hooded ticket clerk, lit from the lantern (warm rim on the right).
    c.save();
    c.translate(x, y);
    const robe = c.createLinearGradient(-26, 0, 26, 0);
    robe.addColorStop(0, '#141a12');
    robe.addColorStop(0.6, '#2c3a24');
    robe.addColorStop(1, '#5a5a2a');
    c.fillStyle = robe;
    c.beginPath();
    c.moveTo(-28, 12);
    c.quadraticCurveTo(-24, -24, -6, -30);
    c.lineTo(8, -30);
    c.quadraticCurveTo(26, -24, 28, 12);
    c.closePath();
    c.fill();
    // Hood.
    const hood = c.createLinearGradient(-14, -60, 16, -20);
    hood.addColorStop(0, '#1b2416');
    hood.addColorStop(0.7, '#34452a');
    hood.addColorStop(1, '#6a6a34');
    c.fillStyle = hood;
    c.beginPath();
    c.moveTo(0, -64);
    c.quadraticCurveTo(-17, -52, -15, -28);
    c.quadraticCurveTo(0, -22, 15, -28);
    c.quadraticCurveTo(17, -50, 0, -64);
    c.fill();
    c.fillStyle = '#060403';
    c.beginPath();
    c.ellipse(1, -40, 8, 10, 0, 0, TAU);
    c.fill();
    c.fillStyle = 'rgba(255,200,120,.9)';
    c.beginPath();
    c.arc(-2, -42, 1.1, 0, TAU);
    c.arc(4, -42, 1.1, 0, TAU);
    c.fill();
    // Hands and a roll of tickets.
    c.fillStyle = '#c99b74';
    c.beginPath();
    c.ellipse(-10, 6, 4.5, 3.2, 0, 0, TAU);
    c.ellipse(10, 6, 4.5, 3.2, 0, 0, TAU);
    c.fill();
    c.fillStyle = '#9a2a1c';
    c.beginPath();
    c.ellipse(16, 2, 4, 5, 0, 0, TAU);
    c.fill();
    c.fillStyle = '#e8d2a0';
    c.fillRect(10, 4, 8, 4);
    c.restore();
  }

  function drawScreenFrame(c) {
    const { x, y, w, h: hh } = GREEN;
    c.save();
    c.filter = 'blur(16px)';
    c.fillStyle = 'rgba(0,0,0,.85)';
    c.fillRect(x - 24, y - 6, w + 48, hh + 46);
    c.restore();
    // Chains up into the dark.
    for (const cx of [x + 70, x + w - 70]) {
      for (let yy = -4, k = 0; yy < y - 20; yy += 7, k++) {
        c.strokeStyle = '#2a2729';
        c.lineWidth = 2.2;
        c.beginPath();
        if (k % 2) c.ellipse(cx, yy + 3.5, 1.2, 4.5, 0, 0, TAU);
        else c.ellipse(cx, yy + 3.5, 3.4, 4.5, 0, 0, TAU);
        c.stroke();
        c.strokeStyle = 'rgba(200,190,180,.25)';
        c.lineWidth = 0.8;
        c.beginPath();
        c.ellipse(cx - 0.6, yy + 3, k % 2 ? 0.8 : 2.8, 3.8, 0, Math.PI * 0.9, Math.PI * 1.5);
        c.stroke();
      }
    }
    const F = 20;
    const o = { l: x - F, t: y - F, r: x + w + F, b: y + hh + F };
    const side = (pts, c0, c1, gx0, gy0, gx1, gy1) => {
      const g = c.createLinearGradient(gx0, gy0, gx1, gy1);
      g.addColorStop(0, c0);
      g.addColorStop(1, c1);
      fillPoly(c, pts, g);
    };
    side([[o.l, o.t], [o.r, o.t], [x + w, y], [x, y]], '#6e4a2a', '#3a2412', 0, o.t, 0, y);
    side([[o.l, o.b], [x, y + hh], [x + w, y + hh], [o.r, o.b]], '#2a190c', '#120a05', 0, y + hh, 0, o.b);
    side([[o.l, o.t], [x, y], [x, y + hh], [o.l, o.b]], '#5a3a1e', '#2e1c0e', o.l, 0, x, 0);
    side([[o.r, o.t], [o.r, o.b], [x + w, y + hh], [x + w, y]], '#23150a', '#3a2412', x + w, 0, o.r, 0);
    c.save();
    poly(c, [[o.l, o.t], [o.r, o.t], [o.r, o.b], [o.l, o.b]]);
    c.rect(x, y, w, hh);
    c.clip('evenodd');
    fillTex(c, NOISE_FINE, 0.35, 'overlay', 0.5, o.l, o.t, o.r - o.l, o.b - o.t);
    // Carved molding lines.
    c.strokeStyle = 'rgba(0,0,0,.5)';
    c.lineWidth = 1;
    c.strokeRect(o.l + 6.5, o.t + 6.5, o.r - o.l - 13, o.b - o.t - 13);
    c.strokeStyle = 'rgba(255,214,160,.16)';
    c.strokeRect(o.l + 7.5, o.t + 7.5, o.r - o.l - 15, o.b - o.t - 15);
    c.restore();
    c.strokeStyle = 'rgba(0,0,0,.8)';
    c.lineWidth = 1.5;
    c.strokeRect(o.l + 0.75, o.t + 0.75, o.r - o.l - 1.5, o.b - o.t - 1.5);
    // Gilt lip hugging the screen (outside it).
    c.strokeStyle = '#c9a24a';
    c.lineWidth = 2;
    c.strokeRect(x - 3, y - 3, w + 6, hh + 6);
    c.strokeStyle = '#5a3e18';
    c.lineWidth = 1;
    c.strokeRect(x - 1.5, y - 1.5, w + 3, hh + 3);
    // Iron corner brackets with rivets.
    for (const [cx, cy, sx, sy] of [[o.l, o.t, 1, 1], [o.r, o.t, -1, 1], [o.l, o.b, 1, -1], [o.r, o.b, -1, -1]]) {
      fillPoly(c, [[cx - sx * 3, cy - sy * 3], [cx + sx * 44, cy - sy * 3], [cx + sx * 44, cy + sy * 9], [cx + sx * 9, cy + sy * 9], [cx + sx * 9, cy + sy * 44], [cx - sx * 3, cy + sy * 44]], '#1c1a1b');
      strokeLine(c, [[cx - sx * 3, cy + sy * 44], [cx - sx * 3, cy - sy * 3], [cx + sx * 44, cy - sy * 3]], 'rgba(200,190,180,.3)');
      for (const [rx, ry] of [[22, 3], [38, 3], [3, 22], [3, 38], [3, 3]]) {
        c.fillStyle = '#4a4648';
        c.beginPath();
        c.arc(cx + sx * rx, cy + sy * ry, 2, 0, TAU);
        c.fill();
        c.fillStyle = 'rgba(255,255,255,.35)';
        c.beginPath();
        c.arc(cx + sx * rx - 0.6, cy + sy * ry - 0.6, 0.8, 0, TAU);
        c.fill();
      }
    }
  }

  let BOOTH_LAMP = [0, 0];
  let CAT_TOP = [0, 0];
  const POSTER_CANDLES = [];
  function drawScene() {
    const c = BG;
    BASE = c.getTransform();
    torches.length = 0;
    candles.length = 0;
    POSTER_CANDLES.length = 0;
    c.save();
    drawVoid(c);
    drawRightWall(c, mulberry(7));
    drawLeftWall(c, mulberry(17));
    drawCaps(c, mulberry(4));
    drawFloor(c, mulberry(3));
    drawRug(c, mulberry(5));
    drawThresholds(c);
    for (const r of rooms) torch(c, 'R', r.D + 52);
    torch(c, 'L', (LV - 7.0) * 32);
    torch(c, 'L', (LV - 10.55) * 32);
    for (const r of rooms) {
      const n0 = candles.length;
      candleCluster(c, ...iso(r.c - 2.7, 0.42), 100 + r.i, 3);
      POSTER_CANDLES.push(candles.slice(n0));
    }
    const rb = mulberry(12);
    barrel(c, BARRELS[0][0], BARRELS[0][1], 0.42, 40, rb);
    CAT_TOP = barrel(c, BARRELS[1][0], BARRELS[1][1], 0.45, 46, rb);
    BOOTH_LAMP = drawBooth(c, mulberry(9));
    candleCluster(c, ...iso(1.3, 8.2), 77, 4);
    drawScreenFrame(c);
    c.restore();
  }

  const BG = SB.fitCanvas($('bg'));
  drawScene();
  SB.on('resize', drawScene);

  // ---------- wall-plane DOM: posters, curtains, entrance leaves, banners, cat ----------
  const wallLayer = $('wall');
  const crowd = $('crowd');
  const plaques = $('plaques');
  const labels = $('labels');
  // Matrix that puts a flat element (origin = its top-left) on the right wall at (lx, z top).
  const rightWallM = (lx, zTop) => `matrix(1,0.5,0,1,${OX + lx},${OY + lx / 2 - zTop})`;
  const leftWallM = (lx, zTop) => { const [x0, y0] = iso(0, LV); return `matrix(1,-0.5,0,1,${x0 + lx},${y0 - lx / 2 - zTop})`; };

  function hiCanvas(w, hh) {
    const cv = document.createElement('canvas');
    cv.style.width = `${w}px`;
    cv.style.height = `${hh}px`;
    return cv;
  }
  // A canvas sized for the real output resolution; `draw(ctx)` runs in CSS px.
  function sprite(w, hh, draw, parent) {
    const cv = hiCanvas(w, hh);
    cv.className = 'spr';
    const s = { cv, ctx: cv.getContext('2d'), w, hh, draw };
    s.redraw = () => {
      const c = s.ctx;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, cv.width, cv.height);
      c.setTransform(cv.width / w, 0, 0, cv.height / hh, 0, 0);
      s.draw(c);
    };
    s.resize = () => { cv.width = Math.round(w * K); cv.height = Math.round(hh * K); s.redraw(); };
    SB.on('resize', s.resize);
    s.resize();
    if (parent) parent.append(cv);
    return s;
  }

  function drawCurtain(c, col, seed) {
    const rnd = mulberry(seed);
    c.save();
    c.beginPath();
    c.moveTo(0, 138);
    c.lineTo(0, 44);
    c.quadraticCurveTo(0, 12, 22, 2);
    c.quadraticCurveTo(44, 12, 44, 44);
    c.lineTo(44, 138);
    c.closePath();
    c.clip();
    c.fillStyle = col;
    c.fillRect(0, 0, 44, 138);
    const folds = 6;
    for (let i = 0; i < folds; i++) {
      const x0 = (i / folds) * 44;
      const fw = 44 / folds;
      const g = c.createLinearGradient(x0, 0, x0 + fw, 0);
      g.addColorStop(0, 'rgba(0,0,0,.55)');
      g.addColorStop(0.35 + rnd() * 0.15, 'rgba(255,220,200,.16)');
      g.addColorStop(1, 'rgba(0,0,0,.5)');
      c.fillStyle = g;
      c.fillRect(x0, 0, fw + 0.5, 138);
    }
    const vg = c.createLinearGradient(0, 0, 0, 138);
    vg.addColorStop(0, 'rgba(0,0,0,.65)');
    vg.addColorStop(0.35, 'rgba(0,0,0,.1)');
    vg.addColorStop(0.85, 'rgba(0,0,0,.15)');
    vg.addColorStop(1, 'rgba(120,150,220,.28)');
    c.fillStyle = vg;
    c.fillRect(0, 0, 44, 138);
    fillTex(c, NOISE_FINE, 0.22, 'overlay', 0.3, 0, 0, 44, 138);
    // Gold fringe hem.
    c.fillStyle = 'rgba(200,160,70,.85)';
    c.fillRect(0, 128, 44, 3);
    for (let x = 1; x < 44; x += 2.2) {
      c.fillStyle = `rgba(214,170,80,${0.5 + rnd() * 0.4})`;
      c.fillRect(x, 131, 1, 4 + rnd() * 2);
    }
    c.restore();
  }

  for (const r of rooms) {
    // Poster frame on the wall, left of the door.
    const pw = h('div', 'onwall poster');
    pw.style.transform = rightWallM(r.D - 127, 152);
    const ph = h('div', 'ph', ROMAN[r.i]);
    pw.append(ph);
    wallLayer.append(pw);
    r.posterBox = pw;
    r.posterEl = ph;
    // Curtain in the doorway.

    cw.style.transform = rightWallM(r.D - 22, 138);

    cw.append(sp.cv, h('div', 'leak'));

    wallLayer.append(cw);

    r.ttlEl = h('div', 'pt', '—');
    r.yrEl = h('span', 'yr');
    r.rateEl = h('span', 'rt');
    r.cntEl = h('span', 'cn', '0 went in');
    pl.append(h('div', 'num', ROMAN[r.i]), r.ttlEl, h('div', 'pm', r.yrEl, r.rateEl), h('div', 'pm c2', r.cntEl));
    plaques.append(pl);
    r.plq = pl;

  function swayCurtain(r) {
    r.curtain.animate([
      { transform: 'skewX(0deg) scaleX(1)' }, { transform: 'skewX(-9deg) scaleX(.86)', offset: 0.25 },
      { transform: 'skewX(5deg) scaleX(.95)', offset: 0.55 }, { transform: 'skewX(-2deg) scaleX(.99)', offset: 0.8 }, { transform: 'skewX(0deg) scaleX(1)' },
    ], { duration: 1300, easing: 'ease-out' });
  }

  // Entrance: heavy oak double doors, iron studs.
  function drawLeaf(c, right) {
    const w = 35;
    c.save();
    c.beginPath();
    // Half of the pointed arch (apex at the meeting edge).
    if (!right) {
      c.moveTo(0, 166);
      c.lineTo(0, 48);
      c.quadraticCurveTo(0, 11, 35, 0);
      c.lineTo(35, 166);
    } else {
      c.moveTo(35, 166);
      c.lineTo(35, 48);
      c.quadraticCurveTo(35, 11, 0, 0);
      c.lineTo(0, 166);
    }
    c.closePath();
    c.clip();
    const rnd = mulberry(right ? 3 : 4);
    for (let x = 0; x < w; x += 7) {
      const g = c.createLinearGradient(x, 0, x + 7, 0);
      const L = 22 + rnd() * 7;
      g.addColorStop(0, hsl(26, 40, L + 3));
      g.addColorStop(1, hsl(24, 40, L - 4));
      c.fillStyle = g;
      c.fillRect(x, 0, 7, 166);
      strokeLine(c, [[x + 0.5, 0], [x + 0.5, 166]], 'rgba(0,0,0,.55)');
      for (let k = 0; k < 3; k++) strokeLine(c, [[x + 1.5 + rnd() * 4, 0], [x + 1.5 + rnd() * 4, 166]], 'rgba(20,10,4,.3)', 0.5);
    }
    fillTex(c, NOISE_FINE, 0.3, 'overlay', 0.35, 0, 0, 35, 166);
    for (const yy of [52, 112, 150]) {
      c.fillStyle = '#1a191a';
      c.fillRect(0, yy, 35, 6);
      c.fillStyle = 'rgba(210,200,190,.22)';
      c.fillRect(0, yy, 35, 1);
      for (let x = 4; x < 35; x += 7.5) {
        c.fillStyle = '#3a3739';
        c.beginPath();
        c.arc(x, yy + 3, 1.6, 0, TAU);
        c.fill();
        c.fillStyle = 'rgba(255,255,255,.4)';
        c.beginPath();
        c.arc(x - 0.5, yy + 2.5, 0.6, 0, TAU);
        c.fill();
      }
    }
    // Ring pull.
    const rx = right ? 6 : 29;
    c.strokeStyle = '#1a191a';
    c.lineWidth = 2;
    c.beginPath();
    c.arc(rx, 96, 4.5, 0, TAU);
    c.stroke();
    c.strokeStyle = 'rgba(210,200,190,.3)';
    c.lineWidth = 0.8;
    c.beginPath();
    c.arc(rx, 96, 4.5, Math.PI, Math.PI * 1.6);
    c.stroke();
    const sh = c.createLinearGradient(right ? 35 : 0, 0, right ? 0 : 35, 0);
    sh.addColorStop(0, 'rgba(0,0,0,0)');
    sh.addColorStop(1, 'rgba(0,0,0,.35)');
    c.fillStyle = sh;
    c.fillRect(0, 0, 35, 166);
    c.restore();
  }
  const ENT = { leaves: [], openUntil: 0, open: false };
  {
    const E = (LV - ENTRANCE_V) * 32;
    for (const right of [false, true]) {
      const wrap = h('div', 'onwall leaf');
      wrap.style.transform = leftWallM(right ? E : E - 35, 166);
      const sp = sprite(35, 166, (c) => drawLeaf(c, right));
      sp.cv.style.transformOrigin = right ? '100% 50%' : '0 50%';
      wrap.append(sp.cv);
      wallLayer.append(wrap);
      ENT.leaves.push(wrap);
    }
  }
  function openEntrance() {
    ENT.openUntil = now() + 1600;
    if (!ENT.open) { ENT.open = true; for (const l of ENT.leaves) l.classList.add('open'); }
  }

  // Banners hanging from the dark roof (one sways in a draught now and then).
  function drawBanner(c, w, hh, col, sigil) {
    const g = c.createLinearGradient(0, 0, w, 0);
    g.addColorStop(0, 'rgba(0,0,0,.5)');
    g.addColorStop(0.3, 'rgba(255,255,255,.06)');
    g.addColorStop(1, 'rgba(0,0,0,.55)');
    c.beginPath();
    c.moveTo(0, 6);
    c.lineTo(w, 6);
    c.lineTo(w, hh);
    c.lineTo(w / 2, hh - 18);
    c.lineTo(0, hh);
    c.closePath();
    c.fillStyle = col;
    c.fill();
    c.fillStyle = g;
    c.fill();
    c.save();
    c.clip();
    fillTex(c, NOISE_FINE, 0.3, 'overlay', 0.35, 0, 0, w, hh);
    c.strokeStyle = 'rgba(214,170,80,.75)';
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(4, 8);
    c.lineTo(4, hh - 6);
    c.moveTo(w - 4, 8);
    c.lineTo(w - 4, hh - 6);
    c.stroke();
    c.restore();
    // Sigil: a film reel inside a rogue's crescent.
    const cx = w / 2;
    const cy = hh * 0.42;
    c.strokeStyle = 'rgba(224,182,92,.9)';
    c.fillStyle = 'rgba(224,182,92,.9)';
    c.lineWidth = 2;
    c.beginPath();
    c.arc(cx, cy, w * 0.3, 0, TAU);
    c.stroke();
    if (sigil) {
      for (let k = 0; k < 5; k++) {
        const a = (k / 5) * TAU - Math.PI / 2;
        c.beginPath();
        c.arc(cx + Math.cos(a) * w * 0.17, cy + Math.sin(a) * w * 0.17, w * 0.06, 0, TAU);
        c.fill();
      }
    } else {
      c.beginPath();
      c.arc(cx, cy, w * 0.22, 0.6, TAU - 0.6);
      c.stroke();
    }
    c.fillStyle = '#2a2729';
    c.fillRect(-3, 0, w + 6, 7);
    c.fillStyle = 'rgba(210,200,190,.25)';
    c.fillRect(-3, 0, w + 6, 1.5);
  }
  const banners = [];
  for (const [x, w, hh, col, sig] of [[118, 54, 196, '#5e1218', true], [262, 46, 150, '#17284e', false], [1158, 46, 150, '#3b1a4a', false]]) {
    const sp = sprite(w + 6, hh, (c) => { c.translate(3, 0); drawBanner(c, w, hh, col, sig); });
    sp.cv.className = 'banner';
    sp.cv.style.left = `${x}px`;
    sp.cv.style.animationDelay = `${-x / 90}s`;
    wallLayer.append(sp.cv);
    banners.push(sp.cv);
  }
  // The third banner would hang above the green-screen frame edge: keep only the two on the left.
  banners[2].remove();
  banners.length = 2;
  let nextGust = now() + rand(15_000, 30_000);

  // Sleeping cat on the barrel.
  function drawCat(c) {
    c.translate(39, 36);
    c.scale(1.3, 1.3);
    const fur = c.createRadialGradient(-4, -8, 2, 0, -4, 24);
    fur.addColorStop(0, '#e2a052');
    fur.addColorStop(0.6, '#b8682a');
    fur.addColorStop(1, '#6a3412');
    // Tail curled around the front.
    c.strokeStyle = '#a65a22';
    c.lineWidth = 5;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(16, -2);
    c.quadraticCurveTo(20, 6, 4, 6);
    c.quadraticCurveTo(-10, 6, -16, 2);
    c.stroke();
    c.fillStyle = fur;
    c.beginPath();
    c.ellipse(2, -6, 19, 10.5, -0.08, 0, TAU);
    c.fill();
    c.strokeStyle = 'rgba(90,40,10,.55)';
    c.lineWidth = 1.6;
    for (let k = -2; k <= 3; k++) {
      c.beginPath();
      c.arc(2 + k * 5, -2, 9, -2.2, -1.4);
      c.stroke();
    }
    // Head tucked in.
    const hg = c.createRadialGradient(-15, -10, 1, -14, -7, 10);
    hg.addColorStop(0, '#e8aa5c');
    hg.addColorStop(1, '#8a4818');
    c.fillStyle = hg;
    c.beginPath();
    c.ellipse(-14, -7, 8.5, 7, 0, 0, TAU);
    c.fill();
    c.fillStyle = '#9a521c';
    c.beginPath();
    c.moveTo(-21, -10);
    c.lineTo(-19, -18);
    c.lineTo(-15, -12);
    c.moveTo(-12, -12);
    c.lineTo(-8, -18);
    c.lineTo(-7, -10);
    c.fill();
    c.strokeStyle = '#3a1a08';
    c.lineWidth = 1;

  // ---------- routing on the floor (uv), around solid props ----------
  const OBST = [[0.5, 4.6, 0, 3.45], [8.1, 9.9, 8.1, 9.9], [15.2, 16.8, 11.2, 12.8], [5.2, 6.1, 5.0, 5.6], [0.2, 1.4, 9.0, 11.2], [20.05, 20.95, 16.05, 16.95]];
  const M = 0.4;
  function segHitsBox(a, b, bx) {
    const x0 = bx[0] - M + 0.02;
    const x1 = bx[1] + M - 0.02;
    const y0 = bx[2] - M + 0.02;
    const y1 = bx[3] + M - 0.02;
    let t0 = 0;
    let t1 = 1;
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const p = [-dx, dx, -dy, dy];
    const qq = [a[0] - x0, x1 - a[0], a[1] - y0, y1 - a[1]];
    for (let i = 0; i < 4; i++) {
      if (p[i] === 0) { if (qq[i] < 0) return false; } else {
        const r = qq[i] / p[i];
        if (p[i] < 0) { if (r > t1) return false; if (r > t0) t0 = r; } else { if (r < t0) return false; if (r < t1) t1 = r; }
      }
    }
    return t1 - t0 > 1e-4;
  }

  for (const bx of OBST) {
    const e = M + 0.08;
    for (const [x, y] of [[bx[0] - e, bx[2] - e], [bx[1] + e, bx[2] - e], [bx[1] + e, bx[3] + e], [bx[0] - e, bx[3] + e]]) if (x > 0.7 && y > 0.7) NODES.push([x, y]);

    const prev = new Array(n).fill(-1);
    const done = new Array(n).fill(false);
    dist[0] = 0;
    for (;;) {
      let u = -1;
      for (let i = 0; i < n; i++) if (!done[i] && dist[i] < Infinity && (u < 0 || dist[i] < dist[u])) u = i;

      done[u] = true;

    if (prev[n - 1] < 0) return [b];
    const path = [];
    for (let i = n - 1; i > 0; i = prev[i]) path.unshift(nodes[i]);

  }

  // ---------- speech bubbles (labels layer, max 4, newest wins) ----------

    if (RAT.u < 5 || RAT.u > 34) { RAT.on = false; ratSpr.cv.style.display = 'none'; RAT.next = t + rand(25_000, 60_000); return; }
    if (RAT.frame !== RAT.drawn) { RAT.drawn = RAT.frame; ratSpr.redraw(); }
    const [x, y] = iso(RAT.u, RAT.v);
    ratSpr.cv.style.transform = `translate3d(${(x - 22).toFixed(1)}px, ${(y - 17).toFixed(1)}px, 0) scaleX(${-RAT.dir})`;
    ratSpr.cv.style.zIndex = String(depth(y));
  }

  // ---------- main loop ----------
  let last = now();
  let caulAt = 0;
  let lastTick = 0;
  function safeTick(t) {
    lastTick = now();
    try { tick(t); } catch (error) { console.error('[hall] frame', error); }
  }
  function frame(t) {
    safeTick(t);
    requestAnimationFrame(frame);
  }
  // Watchdog: if animation frames stall (hidden/throttled page, headless capture), keep the scene alive on timers.
  setInterval(() => { if (now() - lastTick > 60) safeTick(now()); }, 33);
  let frames = 0;
  function tick(t) {
    frames += 1;
    if (q.has('debug')) document.title = `f${frames} t${Math.round(t)} a${active.size} q${queue.length} ${[...active].slice(0, 3).map((g) => `${g.state}:${g.spawnT.toFixed(2)}`).join(',')}`;
    const dt = Math.min(0.05, Math.max(0, (t - last) / 1000));
    last = t;
    const ts = t / 1000;
    stepQueue(t);
    for (const g of active) stepWalker(g, t, dt);
    stepJan(t, dt);
    stepRat(t, dt);
    layoutBubbles(t);
    if (ENT.open && t > ENT.openUntil) { ENT.open = false; for (const l of ENT.leaves) l.classList.remove('open'); }
    if (CHS.open && t > CHS.until) { CHS.open = false; chestSpr.redraw(); chestLight.base = 0; chestLight.a = 0; chestLight.glow = 0; }
    privyLight.base = PV.lit ? 1 : 0;
    privyLight.a = PV.lit ? 0.6 : 0;
    privyLight.glow = PV.lit ? 0.18 : 0;
    if (t > nextGust) { const b = banners[0]; b.classList.remove('gust'); void b.offsetWidth; b.classList.add('gust'); nextGust = t + rand(25_000, 50_000); }
    if (t - caulAt > 50) { caulAt = t; CAUL.t = ts; caulSpr.redraw(); }
    for (const L of lights) if (L.pulse > 0) L.pulse = Math.max(0, L.pulse - dt * 1.3);
    drawLight(ts);
    drawFx(ts, dt);
  }
  for (const b of banners) b.addEventListener('animationend', () => b.classList.remove('gust'));
  requestAnimationFrame(frame);
  if (document.fonts) document.fonts.ready.then(() => { caulSpr.redraw(); for (const r of rooms) updateCount(r); });

  SB.start();
})();
</script>
