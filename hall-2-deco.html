<!doctype html>
<!--
  Standby hall, draft 2: "THE GRAND PALACE" - a 1930s art-deco movie palace rendered like a pre-rendered
  isometric RPG interior (Baldur's Gate / Fallout 2 casino luxury): black-and-cream marble with reflections,
  crimson runners, walnut panelling with brass sunbursts, a round box office, five padded-leather theatre doors.

  GREEN SCREEN (chroma key) on the 1920x1080 stage: x 1262, y 18, w 640, h 360 (16:9).
  Pure Cinema.green, z-index 9999 (top-most), no filter/blend/opacity on it or its ancestors; the brass
  "coming attractions" frame is drawn only around it. ?green=off shows showtimes + the five films there.

  Options: ?demo=1  ?green=ff00ff  ?green=off  ?chat=off  ?f=3  ?title=...  ?sub=...
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Grand Palace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Marcellus&family=Poiret+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
  :root {
    --brass: #c9a45c; --brass-hi: #f4dd9c; --brass-lo: #6e4f1e; --ink: #f1e6cc; --crimson: #8e1a24;
    --deco: 'Limelight', 'Georgia', serif; --fine: 'Poiret One', 'Century Gothic', 'Futura', sans-serif;
    --body: 'Marcellus', 'Georgia', serif;
  }
  #stage { background: #050407; color: var(--ink); font-family: var(--body); }
  .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
  #bg { z-index: 1; }
  #wall { z-index: 2; }
  #crowd { z-index: 3; }
  #dark { z-index: 4; mix-blend-mode: multiply; }
  #glow { z-index: 5; mix-blend-mode: screen; }
  #over { z-index: 6; }
  #marquee, #gframe { z-index: 7; }
  #chatpanel, #combo { z-index: 8; }
  /* The chroma-key screen: pure colour, no filter, above everything. */
  #green { position: absolute; left: 1262px; top: 18px; width: 640px; height: 360px; z-index: 9999; background: #00ff00; }

  .plane { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
  .spr { position: absolute; }
  #crowd canvas.spr { will-change: transform; }

  /* ---------- lightboxes (live in the wall plane, CSS matrix) ---------- */
  .lb { position: absolute; width: 118px; height: 240px; }
  .lb .bulbs { position: absolute; left: 0; top: 0; }
  .lb .in { position: absolute; left: 12px; right: 12px; top: 12px; bottom: 12px; display: flex; flex-direction: column; align-items: center;
    background: radial-gradient(ellipse at 50% 40%, #fff6dc, #f3d9a2 60%, #d9b06a); box-shadow: inset 0 0 0 1px rgba(120,70,20,.6), inset 0 0 12px rgba(160,90,20,.45); padding: 3px 3px 2px; }
  .lb .ns { font: 10px/12px var(--deco); letter-spacing: 1.6px; color: #7a1018; white-space: nowrap; }
  .lb .pf { position: relative; width: 84px; height: 126px; margin-top: 2px; flex-shrink: 0; background: #1a0e10; box-shadow: 0 0 0 2px #2a1408, 0 0 0 3px #c9a45c; overflow: hidden; }
  .lb .pf img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .lb .ph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 6px;
    background: repeating-linear-gradient(90deg, rgba(201,164,92,.16) 0 2px, transparent 2px 9px), radial-gradient(circle at 50% 38%, #5a1820, #1a080c 70%);
    font: 13px/1.1 var(--deco); color: #f0d48e; }
  .lb .tt { width: 100%; margin-top: 5px; font: 14px/15px var(--deco); color: #2a0b08; text-align: center; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex-shrink: 0; }
  .lb .mt { font: 600 11.5px/14px var(--body); color: #5a2a0c; white-space: nowrap; }
  .lb .cn { font: 600 11.5px/14px var(--body); color: #8e1a24; white-space: nowrap; }

  /* ---------- doors ---------- */
  .leaf { position: absolute; top: 0; }
  .loosign { position: absolute; width: 56px; height: 14px; font: 700 9.5px/14px var(--body); letter-spacing: 1px; text-align: center; border-radius: 2px;
    background: #140c08; box-shadow: 0 0 0 1px #c9a45c; color: #8fd58a; text-shadow: 0 0 4px rgba(120,255,120,.7); }
  .loosign.busy { color: #ff8070; text-shadow: 0 0 6px rgba(255,80,60,.9); }

  /* ---------- walkers ---------- */
  .w { position: absolute; left: 0; top: 0; will-change: transform; }
  .w .sh { position: absolute; left: -26px; top: -7px; width: 52px; height: 14px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,.6), rgba(0,0,0,.25) 60%, transparent); }
  .w .bod, .w .rf { position: absolute; left: 0; bottom: 0; transform-origin: 50% 100%; }
  .w .bod .sb-emote, .w .rf .sb-emote { position: absolute; bottom: 0; }
  .w .rf { opacity: .2; -webkit-mask-image: linear-gradient(to bottom, transparent 15%, #000); mask-image: linear-gradient(to bottom, transparent 15%, #000); }
  .w .rf.off { opacity: 0; }
  .w .carry { position: absolute; bottom: 4px; }
  .pop { width: 20px; height: 24px; }
  .pop::before { content: ''; position: absolute; left: 1px; right: 1px; bottom: 0; height: 16px; clip-path: polygon(0 0, 100% 0, 86% 100%, 14% 100%);
    background: repeating-linear-gradient(90deg, #d8202e 0 4px, #f6efe0 4px 8px); }
  .pop::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 11px; border-radius: 50% 50% 40% 40%;
    background: radial-gradient(circle at 30% 50%, #fffbe8 0 3px, transparent 3.5px), radial-gradient(circle at 65% 40%, #fff3c0 0 3.5px, transparent 4px),
      radial-gradient(circle at 50% 70%, #ffe9a0 0 4px, transparent 4.5px), #f7e2a8; }
  .stub { width: 14px; height: 9px; background: linear-gradient(90deg, #f3e2bc 0 70%, #c22030 70%); box-shadow: 0 1px 2px rgba(0,0,0,.6); border-radius: 1px; transform: rotate(-12deg); }
  .wo { position: absolute; left: 0; top: 0; will-change: transform; }
  .wo .tag { position: absolute; left: 0; top: 6px; transform: translateX(-50%); white-space: nowrap; font: 15px/1 var(--body); letter-spacing: .3px;
    text-shadow: 0 0 3px #000, 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
  .wo .tag i { font-style: normal; color: var(--brass-hi); margin-right: 3px; font-size: 11px; }
  .wo.hid { opacity: 0; }
  .bub { position: absolute; left: 0; bottom: 84px; width: max-content; max-width: 300px; padding: 5px 11px 6px; text-align: center; overflow-wrap: anywhere;
    font: 17px/1.25 var(--body); color: #fbf1da; background: linear-gradient(#1c1418f2, #0c0a0cf2); border: 1px solid #b08a48; border-radius: 3px;
    box-shadow: 0 0 0 1px #000, 0 6px 14px rgba(0,0,0,.6); }
  .bub::after { content: ''; position: absolute; left: var(--tail, 50%); bottom: -6px; width: 10px; height: 10px; margin-left: -5px; background: #0d0a0c;
    border-right: 1px solid #b08a48; border-bottom: 1px solid #b08a48; transform: rotate(45deg); }
  .bub .sb-emote { margin: 0 2px; }
  .ft { position: absolute; left: 0; top: 0; white-space: nowrap; font: 16px var(--deco); color: var(--brass-hi); pointer-events: none;
    text-shadow: 0 0 4px #000, 1px 1px 0 #000, -1px -1px 0 #000; animation: ft 2s ease-out forwards; }
  .ft.soft { font: 15px var(--body); color: #f6e7c4; }
  .ft.red { color: #ff9c8c; }
  @keyframes ft { 0% { opacity: 0; transform: translate(-50%, 6px); } 14% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -46px); } }
  .glyph { position: absolute; left: 0; top: 0; pointer-events: none; font: 22px/1 'Georgia', serif; color: #f4dd9c;
    text-shadow: 0 0 6px rgba(255,200,110,.8), 0 0 2px #000; animation: glyph var(--dur, 3s) ease-out forwards; }
  .glyph.z { font: italic 17px/1 var(--fine); font-weight: 700; color: #d9e2ff; text-shadow: 0 0 5px rgba(140,160,255,.7), 0 0 2px #000; }
  .glyph.ring { font: 15px/1 var(--deco); color: #ffe0a0; letter-spacing: 1px; }
  @keyframes glyph { 0% { opacity: 0; transform: translate(-50%, 0) scale(.7); } 15% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 20px)), var(--dy, -70px)) scale(1.1); } }
  .ticket { position: absolute; left: 0; top: 0; width: 16px; height: 10px; margin: -5px 0 0 -8px; background: linear-gradient(90deg, #f6e6c0 0 70%, #c22030 70%);
    box-shadow: 0 0 6px rgba(255,220,150,.9); border-radius: 1px; }
  .ring-shake { animation: shake .09s linear infinite; }
  @keyframes shake { 0% { transform: translate(0, 0); } 25% { transform: translate(1.5px, -.5px); } 50% { transform: translate(-1px, .5px); } 75% { transform: translate(1px, .5px); } }

  /* ---------- title marquee ---------- */
  #marquee { position: absolute; left: 728px; top: 12px; width: 488px; height: 140px; }
  #marquee .chain { position: absolute; top: -12px; width: 2px; height: 14px; background: repeating-linear-gradient(#e8cf8a 0 3px, #6e4f1e 3px 5px); }
  #marquee .box { position: absolute; inset: 0; background: linear-gradient(#17121a, #07060a); border-radius: 3px;
    box-shadow: 0 0 0 2px #2a1d0c, 0 0 0 4px #c9a45c, 0 0 0 6px #3a2810, 0 14px 30px rgba(0,0,0,.8), inset 0 0 30px rgba(0,0,0,.9); }
  #marquee canvas { position: absolute; left: 0; top: 0; }
  #marquee .t { position: absolute; left: 0; right: 0; top: 18px; text-align: center; font: 40px/1 var(--deco); letter-spacing: 3px;
    background: linear-gradient(#fff4c8, #e8c272 45%, #a8782e 55%, #f2d68e); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 #000) drop-shadow(0 0 10px rgba(255,190,90,.35)); white-space: nowrap; }
  #marquee .s { position: absolute; left: 0; right: 0; top: 68px; text-align: center; font: 700 19px/1 var(--fine); color: #eadcbc; letter-spacing: 1.5px; white-space: nowrap; }
  #marquee .i { position: absolute; left: 24px; right: 24px; top: 98px; display: flex; justify-content: center; gap: 16px; font: 17px/1 var(--body); color: #d9c7a0; white-space: nowrap; }
  #marquee .i b { font-weight: 400; color: #f4dd9c; }
  #marquee .i .dot { color: #8a6a30; }

  /* ---------- frame around the green screen ---------- */
  #gframe { position: absolute; }

  /* ---------- chat panel: black lacquer in a brass deco frame ---------- */
  #chatpanel { position: absolute; left: 1572px; top: 424px; width: 332px; height: 640px; background: linear-gradient(#141016, #08070a);
    box-shadow: 0 0 0 2px #2a1d0c, 0 0 0 4px #c9a45c, 0 0 0 6px #3a2810, 0 0 0 7px #c9a45c55, 0 18px 40px rgba(0,0,0,.8); border-radius: 2px; }
  #chatpanel::before { content: ''; position: absolute; inset: 6px; border: 1px solid rgba(201,164,92,.35); pointer-events: none; }
  #chatpanel .hd { position: absolute; left: 0; right: 0; top: 0; height: 46px; display: flex; align-items: center; justify-content: center; gap: 12px;
    font: 22px var(--deco); letter-spacing: 4px; color: var(--brass-hi); background: linear-gradient(#251a12, #0f0b08); border-bottom: 2px solid #c9a45c;
    text-shadow: 0 2px 0 #000; }
  #chatpanel .hd i { width: 34px; height: 14px; background: linear-gradient(90deg, transparent, #c9a45c) center/100% 2px no-repeat,
    radial-gradient(circle at 100% 50%, #f4dd9c 0 3px, transparent 3.5px); }
  #chatpanel .hd i:last-child { transform: scaleX(-1); }
  #chat { left: 12px; right: 10px; top: 52px; bottom: 10px; }
  #chat .sb-chat-line { font: 19px/1.38 var(--body); }

  #combo { position: absolute; left: 820px; top: 990px; display: flex; align-items: center; gap: 14px; padding: 8px 26px 10px; white-space: nowrap;
    font: 44px var(--deco); color: var(--brass-hi); letter-spacing: 2px; text-shadow: 0 3px 0 #000;
    background: linear-gradient(#1a1216ee, #070608ee); box-shadow: 0 0 0 2px #2a1d0c, 0 0 0 4px #c9a45c, 0 0 30px rgba(255,190,90,.35);
    transform: translate(-50%, -50%) scale(.6); opacity: 0; transition: opacity .3s, transform .35s cubic-bezier(.2,1.6,.4,1); }
  #combo.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* Info shown in the green-screen rectangle with ?green=off. */
  #green.off { background: linear-gradient(#120d12, #07060a); padding: 22px 34px; display: flex; flex-direction: column; gap: 6px; }
  #green .ih { font: 28px var(--deco); color: var(--brass-hi); letter-spacing: 2px; }
  #green .ih2 { margin-top: 8px; font: 700 17px var(--fine); color: #c9a45c; letter-spacing: 2px; text-transform: uppercase; }
  #green .ir { display: flex; justify-content: space-between; gap: 18px; font: 20px/1.25 var(--body); color: var(--ink); white-space: nowrap; }
  #green .ir span:first-child { overflow: hidden; text-overflow: ellipsis; }
  #green .ir span:last-child { color: #e8c272; }
  #green .ir.dim { color: #9c8f78; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" class="layer"></canvas>
  <div id="wall" class="layer"></div>
  <div id="crowd" class="layer"></div>
  <canvas id="dark" class="layer" width="480" height="270"></canvas>
  <canvas id="glow" class="layer" width="480" height="270"></canvas>
  <div id="over" class="layer"></div>
  <div id="marquee">
    <div class="chain" style="left:60px"></div><div class="chain" style="right:60px"></div>
    <div class="box"></div><canvas id="mqb"></canvas>
    <div class="t"></div><div class="s"></div>
    <div class="i"><span id="clock"></span><span class="dot">◆</span><span id="nextshow"></span></div>
  </div>
  <canvas id="gframe"></canvas>
  <div id="chatpanel"><div class="hd"><i></i>CHAT<i></i></div><div id="chat"></div></div>
  <div id="combo"></div>
  <div id="green"></div>
</div>

<script src="shared/core.js"></script>
<script src="shared/cinema.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const h = (tag, cls, ...kids) => { const el = document.createElement(tag); if (cls) el.className = cls; el.append(...kids); return el; };
  const { rand, pick } = SB;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const TAU = Math.PI * 2;
  const now = () => performance.now();
  const wob = (t) => (Math.sin(t) + Math.sin(t * 1.73 + 1.3) * 0.6 + Math.sin(t * 2.91 + 0.7) * 0.3) / 1.9;
  function mulberry(seed) {
    return () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  if (q.has('debug')) addEventListener('error', (e) => { document.body.dataset.err = `${document.body.dataset.err || ''}${e.message} @${e.lineno}; `; });
  SB.mountStage($('stage'));
  if (!q.has('f')) SB.cfg.f = '3'; // the side panel is narrow
  SB.mountChat($('chat'), { emoteHeight: 24, max: 30 });
  const CHAT_ON = SB.cfg.chat !== 'off';
  const green = $('green');
  if (!CHAT_ON) $('chatpanel').remove();
  $('marquee').querySelector('.t').textContent = (SB.cfg.title || 'The Grand Palace').toUpperCase();
  $('marquee').querySelector('.s').textContent = SB.cfg.sub || 'Intermission  ·  the feature resumes shortly';

  // ======================================================================
  // Isometric geometry. Floor units (u, v); 1 unit = 64 x 32 px (2:1).
  // Right wall = plane v=0 (the corridor with the five theatres), left wall = plane u=0.
  // ======================================================================
  const S = 32;
  const OX = 300;
  const OY = 280;
  const WH = 330;          // wall height in px
  const VF = 19;           // front (cut-away) wall
  const LV = 10.5;         // drawn length of the left wall
  const iso = (u, v, z = 0) => [OX + (u - v) * S, OY + (u + v) * S / 2 - z];
  const planeV = (v0) => [1, 0.5, 0, 1, OX - v0 * S, OY + v0 * S / 2];              // local (u*S, -z)
  const planeU = (u0, V) => [1, -0.5, 0, 1, OX + (u0 - V) * S, OY + (u0 + V) * S / 2]; // local ((V - v)*S, -z)
  const FLOOR = [S, S / 2, -S, S / 2, OX, OY];
  const RW = planeV(0);
  const LW = planeU(0, LV);
  const depth = (u, v) => Math.round((u + v) * 10) + 100;
  const mcss = (m) => `matrix(${m.join(',')})`;

  // Theatre slots along the right wall: pilaster, lightbox, door.
  const SLOT0 = 0.9;
  const SLOTW = 7.6;
  const ROOMS = [0, 1, 2, 3, 4].map((i) => {
    const a = SLOT0 + i * SLOTW;
    return { i, a, lb0: a + 0.6, lb1: a + 0.6 + 118 / S, dc: a + 6.0, title: '', key: '', count: 0, open: 0, openUntil: 0, flash: 0 };
  });
  const PILASTERS = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => SLOT0 + i * SLOTW).concat([SLOT0 + 5 * SLOTW + 3.8, SLOT0 + 6 * SLOTW + 3.8]);
  const LOOS = [
    { name: 'LADIES', v: 3.7, occ: null },
    { name: 'GENTS', v: 7.1, occ: null },
  ].map((L) => ({ ...L, sc: (LV - L.v) * S, open: 0, openUntil: 0 }));

  // Props (floor units).
  const KU = 17;            // box office kiosk
  const KV = 9;
  const POP = { u0: 23.6, u1: 25.4, v0: 6.9, v1: 8.1 };
  const PIANO = { u: 36.6, v: 8.6 };
  const BOOTH = { u0: 0.1, u1: 1.5, v0: 0.35, v1: 1.75 };
  const DRUM = { u: 14, v: 19.25, r: 1.25, ang: 0, target: 0 };
  const DOORMAN = [19.4, 17.7];
  const HAT = [9, 12.5];
  const QU = 17;            // queue lane
  const QCAP = 6;
  const slotPos = (i) => [QU, 11.6 + i * 1.15];
  const LANE_IN = [QU, 18.35];
  const POSTS = [11.3, 12.55, 13.8, 15.05, 16.3, 17.55];

  const OBST = [
    { u0: 14.9, u1: 19.1, v0: 6.9, v1: 11.0 },   // kiosk
    { u0: 15.9, u1: 18.1, v0: 11.0, v1: 18.0 },  // queue lane
    { u0: 23.2, u1: 25.8, v0: 6.5, v1: 8.5 },    // popcorn cart
    { u0: 36.2, u1: 39.3, v0: 5.2, v1: 10.4 },   // piano + bench
    { u0: 0, u1: 1.8, v0: 0, v1: 2.0 },          // phone booth
    { u0: 8.6, u1: 9.4, v0: 12.1, v1: 12.9 },    // top hat
    { u0: 18.7, u1: 20.1, v0: 16.9, v1: 18.6 },  // doorman
  ];
  const BOUNDS = { u0: 0.6, u1: 50, v0: 0.6, v1: 18.45 };

  // ======================================================================
  // Noise + textures (computed once)
  // ======================================================================
  function lattice(seed) { const r = mulberry(seed); const a = new Float32Array(65536); for (let i = 0; i < 65536; i++) a[i] = r(); return a; }
  function vn(L, x, y) {
    const xi = Math.floor(x); const yi = Math.floor(y);
    const fx = x - xi; const fy = y - yi;
    const sx = fx * fx * (3 - 2 * fx); const sy = fy * fy * (3 - 2 * fy);
    const x0 = xi & 255; const y0 = yi & 255; const x1 = (x0 + 1) & 255; const y1 = (y0 + 1) & 255;
    const a = L[y0 * 256 + x0]; const b = L[y0 * 256 + x1]; const c = L[y1 * 256 + x0]; const d = L[y1 * 256 + x1];
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
  }
  function fbm(L, x, y, oct) {
    let s = 0; let amp = 0.5; let f = 1; let n = 0;
    for (let i = 0; i < oct; i++) { s += amp * vn(L, x * f + i * 17.3, y * f + i * 9.1); n += amp; amp *= 0.5; f *= 2.03; }
    return s / n;
  }
  function genTex(w, hh, fn) {
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = hh;
    const c = cv.getContext('2d');
    const img = c.createImageData(w, hh);
    const d = img.data;
    const o = [0, 0, 0, 255];
    for (let y = 0; y < hh; y++) {
      for (let x = 0; x < w; x++) {
        o[3] = 255;
        fn(x, y, o);
        const i = (y * w + x) * 4;
        d[i] = o[0]; d[i + 1] = o[1]; d[i + 2] = o[2]; d[i + 3] = o[3];
      }
    }
    c.putImageData(img, 0, 0);
    return cv;
  }
  const N1 = lattice(11);
  const N2 = lattice(23);
  const N3 = lattice(37);
  const T = {};
  T.mb = genTex(320, 320, (x, y, o) => {
    const n = fbm(N1, x / 70, y / 70, 5);
    const t = (x * 0.8 + y * 0.5) / 55 + n * 4.2;
    const vein = (1 - Math.abs(Math.sin(t * Math.PI))) ** 22;
    const n2 = fbm(N2, x / 22, y / 22, 4);
    const fine = (1 - Math.abs(Math.sin((x * 0.35 - y * 0.9) / 26 + n2 * 7))) ** 46;
    const b = 12 + n2 * 18;
    o[0] = b + vein * 125 + fine * 60; o[1] = b + vein * 108 + fine * 52; o[2] = b * 1.18 + vein * 84 + fine * 46;
  });
  T.mc = genTex(320, 320, (x, y, o) => {
    const n = fbm(N3, x / 80, y / 80, 5);
    const t = (x * 0.6 - y * 0.7) / 60 + n * 3.6;
    const vein = (1 - Math.abs(Math.sin(t * Math.PI))) ** 14;

    c.fillStyle = '#120d0c'; c.fillRect(sc - 29, -153, 58, 12);
    c.font = '700 10.5px "Poiret One", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#f4dd9c'; c.fillText(L.name, sc, -147);
  }

  function drawCornerColumn(W) {
    const c = W.c;
    flat(W);
    const u = 0.32; const v = 0.32; const r = 0.42;
    cylSide(c, u, v, r + 0.08, 0, 24, [[0, '#050406'], [0.35, '#3a3438'], [1, '#08070a']]);
    cylSide(c, u, v, r, 24, WH - 30, [[0, '#060508'], [0.3, '#2a2228'], [0.55, '#0e0c10'], [1, '#050406']]);
    const [x, y] = iso(u, v);
    const rx = r * S * Math.SQRT2;
    for (let i = 1; i < 9; i++) {
      const phi = (i / 9) * Math.PI;
      const xx = x + rx * Math.cos(phi); const yy = y + (rx / 2) * Math.sin(phi);
      c.strokeStyle = `rgba(220,178,100,${0.35 + 0.4 * Math.sin(phi)})`; c.lineWidth = 1;
      c.beginPath(); c.moveTo(xx, yy - 40); c.lineTo(xx, yy - (WH - 60)); c.stroke();
    }
    cylSide(c, u, v, r + 0.12, WH - 30, WH - 16, BRASS);
    cylSide(c, u, v, r + 0.08, 24, 28, BRASS);
  }

  function drawTopCaps(W) {
    const c = W.c;
    flat(W);
    const t = 0.45;
    fillP(c, [iso(0, 0, WH), iso(56, 0, WH), iso(56, -t, WH), iso(-t, -t, WH), iso(-t, LV + 2, WH), iso(0, LV + 2, WH)], '#120d0b');
    c.strokeStyle = 'rgba(240,210,140,.8)'; c.lineWidth = 1.2;
    openPath(c, [iso(56, 0, WH), iso(0, 0, WH), iso(0, LV + 2, WH)]); c.stroke();
    c.beginPath(); const a = iso(56, -t, WH); const b = iso(-t, -t, WH); const d = iso(-t, LV + 2, WH);
    c.moveTo(...a); c.lineTo(...b); c.lineTo(...d); c.strokeStyle = 'rgba(120,90,50,.5)'; c.stroke();
  }

  function lightWalls(W) {
    const c = W.c;
    const walls = [[RW, 56 * S], [LW, LV * S]];
    for (const [m, len] of walls) {
      plane(W, m);
      c.save();
      c.beginPath(); c.rect(0, -WH - 2, len, WH + 2); c.clip();
      c.globalCompositeOperation = 'multiply';
      c.fillStyle = lin(c, 0, -WH, 0, 0, [[0, 'rgb(46,38,46)'], [0.25, 'rgb(92,80,86)'], [0.62, 'rgb(150,132,126)'], [1, 'rgb(108,92,90)']]);
      c.fillRect(0, -WH - 2, len, WH + 2);
      c.restore();
    }
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (const sc of SCONCES) {
      plane(W, sc.wall === 'R' ? RW : LW);
      const x = sc.s;
      c.fillStyle = rad(c, x, -212, 2, 130, [[0, 'rgba(255,190,110,.55)'], [0.35, 'rgba(220,140,70,.22)'], [1, 'rgba(0,0,0,0)']]);
      c.fillRect(x - 130, -WH, 260, WH);
      // up-light fan on the wall above
      c.fillStyle = lin(c, 0, -220, 0, -330, [[0, 'rgba(255,200,130,.32)'], [1, 'rgba(255,200,130,0)']]);
      path(c, [[x - 10, -214], [x + 10, -214], [x + 46, -330], [x - 46, -330]]); c.fill();
      c.fillStyle = rad(c, x, 0, 0, 90, [[0, 'rgba(255,170,90,.16)'], [1, 'rgba(0,0,0,0)']]);
      c.fillRect(x - 90, -90, 180, 90);
    }
    plane(W, RW);
    for (const r of ROOMS) {
      const x = ((r.lb0 + r.lb1) / 2) * S;
      c.fillStyle = rad(c, x, -156, 30, 190, [[0, 'rgba(255,205,130,.42)'], [0.5, 'rgba(230,150,70,.14)'], [1, 'rgba(0,0,0,0)']]);
      c.fillRect(x - 190, -WH, 380, WH);
    }
    plane(W, LW);
    for (const L of LOOS) {
      c.fillStyle = rad(c, L.sc, -170, 4, 70, [[0, 'rgba(255,190,120,.3)'], [1, 'rgba(0,0,0,0)']]);
      c.fillRect(L.sc - 70, -240, 140, 140);
    }
    c.restore();
    // ambient occlusion: wall foot and the inner corner
    plane(W, RW);
    c.fillStyle = lin(c, 0, -40, 0, 0, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,.45)']]); c.fillRect(0, -40, 56 * S, 40);
    c.fillStyle = lin(c, 0, 0, 60, 0, [[0, 'rgba(0,0,0,.55)'], [1, 'rgba(0,0,0,0)']]); c.fillRect(0, -WH, 60, WH);
    plane(W, LW);
    c.fillStyle = lin(c, 0, -40, 0, 0, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,.45)']]); c.fillRect(0, -40, LV * S, 40);
    c.fillStyle = lin(c, LV * S, 0, LV * S - 60, 0, [[0, 'rgba(0,0,0,.6)'], [1, 'rgba(0,0,0,0)']]); c.fillRect(LV * S - 60, -WH, 60, WH);
  }

  function drawLightboxPlates(W) {
    const c = W.c;
    plane(W, RW);
    for (const r of ROOMS) {
      const x = r.lb0 * S;
      // stepped crest
      c.fillStyle = lin(c, 0, -300, 0, -282, BRASS_V);
      c.fillRect(x + 22, -292, 74, 10); c.fillRect(x + 40, -300, 38, 8);
      sunburst(c, x + 59, -300, 4, 16, 7);
      // outer frame
      c.fillStyle = '#1a120a'; c.fillRect(x - 8, -284, 134, 256);
      c.fillStyle = lin(c, x - 7, -283, x + 125, -29, BRASS); c.fillRect(x - 6, -282, 130, 252);
      c.fillStyle = '#2a1a0c'; c.fillRect(x - 2, -278, 122, 244);
      c.fillStyle = '#f3dcaa'; c.fillRect(x, -276, 118, 240);
    }
  }

  // ---------- floor ----------
  function floorPoly() { return [iso(0, 0), iso(60, 0), iso(60, VF), iso(0, VF)]; }

  function drawFloor(s, rnd) {
    const c = s.c;
    plane(s, FLOOR);
    c.fillStyle = '#0c0b0e'; c.fillRect(0, 0, 60, VF);
    const visible = (u, v, du, dv) => {
      const [x, y] = iso(u + du / 2, v + dv / 2);
      return x > -120 && x < 2050 && y > 150 && y < 1160;
    };
    const tile = (u, v, du, dv, tex) => {
      if (!visible(u, v, du, dv)) return;
      c.save();
      c.beginPath(); c.rect(u, v, du, dv); c.clip();
      const m = Math.max(du, dv);
      const sw = 150 * m / 2;
      c.drawImage(tex, rnd() * (tex.width - sw), rnd() * (tex.height - sw), sw, sw, u, v, m, m);
      c.fillStyle = `rgba(${rnd() < 0.5 ? '255,230,200' : '0,0,0'},${rnd() * 0.06})`;
      c.fillRect(u, v, du, dv);
      c.restore();
    };
    // black border band along both back walls
    tile(0, 0, 1, 1, T.mb);
    for (let u = 1; u < 60; u += 2) tile(u, 0, 2, 1, T.mb);
    for (let v = 1; v < VF; v += 2) tile(0, v, 1, 2, T.mb);
    for (let u = 1; u < 60; u += 2) {
      for (let v = 1; v < VF; v += 2) tile(u, v, 2, 2, ((u - 1) / 2 + (v - 1) / 2) % 2 ? T.mc : T.mb);
    }
    // grout + brass inlay
    c.strokeStyle = 'rgba(16,10,8,.85)'; c.lineWidth = 0.035;
    c.beginPath();
    for (let u = 1; u <= 59; u += 2) { c.moveTo(u, 1); c.lineTo(u, VF); }
    for (let v = 1; v <= VF; v += 2) { c.moveTo(1, v); c.lineTo(60, v); }
    c.stroke();
    c.strokeStyle = 'rgba(214,170,96,.85)'; c.lineWidth = 0.06;
    c.beginPath(); c.moveTo(60, 0.94); c.lineTo(0.94, 0.94); c.lineTo(0.94, VF); c.stroke();
    c.strokeStyle = 'rgba(214,170,96,.5)'; c.lineWidth = 0.03;
    c.beginPath(); c.moveTo(60, 0.8); c.lineTo(0.8, 0.8); c.lineTo(0.8, VF); c.stroke();
    // brass keys where four tiles meet
    for (let u = 3; u < 59; u += 2) {
      for (let v = 3; v < VF; v += 2) {
        if (!visible(u - 0.2, v - 0.2, 0.4, 0.4)) continue;
        c.save(); c.translate(u, v); c.rotate(Math.PI / 4);
        c.fillStyle = '#7a5520'; c.fillRect(-0.15, -0.15, 0.3, 0.3);
        c.fillStyle = '#e2bf72'; c.fillRect(-0.11, -0.11, 0.22, 0.22);
        c.fillStyle = '#0d0b0e'; c.fillRect(-0.045, -0.045, 0.09, 0.09);
        c.restore();
      }
    }
  }

  // Inlaid brass-and-marble sunburst medallion in the middle of the lobby floor.
  function drawMedallion(s, u, v) {
    const c = s.c;
    plane(s, FLOOR);
    c.save();
    c.translate(u, v);
    const ring = (r, col) => { c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fillStyle = col; c.fill(); };
    ring(3.3, '#b8893e');
    ring(3.2, '#0c0b0e');
    c.save(); c.beginPath(); c.arc(0, 0, 3.15, 0, TAU); c.clip();
    c.drawImage(T.mb, 0, 0, 320, 320, -3.2, -3.2, 6.4, 6.4);
    c.restore();
    ring(2.55, '#d8b066');
    ring(2.48, '#e9dcc0');
    c.save(); c.beginPath(); c.arc(0, 0, 2.44, 0, TAU); c.clip();
    c.drawImage(T.mc, 0, 0, 320, 320, -2.5, -2.5, 5, 5);
    c.restore();
    for (let i = 0; i < 32; i++) {
      const a = (i / 32) * TAU;
      const long = i % 2 === 0;
      c.beginPath();
      c.moveTo(Math.cos(a - 0.05) * 0.55, Math.sin(a - 0.05) * 0.55);
      c.lineTo(Math.cos(a) * (long ? 3.1 : 2.35), Math.sin(a) * (long ? 3.1 : 2.35));
      c.lineTo(Math.cos(a + 0.05) * 0.55, Math.sin(a + 0.05) * 0.55);
      c.closePath();
      c.fillStyle = long ? 'rgba(226,186,104,.95)' : 'rgba(20,16,20,.85)';
      c.fill();
    }
    ring(0.62, '#c69a4c');
    ring(0.5, '#0c0b0e');
    c.scale(0.02, 0.02);
    c.font = '30px Limelight, Georgia, serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#e8c87a'; c.fillText('GP', 0, 2);
    c.restore();
  }

  function drawReflections(s, W, objs) {
    const c = s.c;
    const k = kOf(s);
    const small = document.createElement('canvas');
    small.width = 640; small.height = 360;
    const sc = small.getContext('2d');
    sc.filter = 'blur(1.6px)';
    sc.drawImage(W.cv, 0, 0, 640, 360);
    c.save();
    flat(s);
    path(c, floorPoly()); c.clip();
    // right wall: mirror about its foot line y = A + x/2
    const A = OY - OX / 2;
    c.save();
    c.beginPath(); c.rect(OX, 0, 1920 - OX, 1080); c.clip();
    c.setTransform(k, k, 0, -k, 0, k * 2 * A);
    c.globalAlpha = 0.3;
    c.drawImage(small, 0, 0, 1920, 1080);
    c.restore();
    // left wall: mirror about y = B - x/2
    const B = OY + OX / 2;
    c.save();
    flat(s);
    c.beginPath(); c.rect(0, 0, OX, 1080); c.clip();
    c.setTransform(k, -k, 0, -k, 0, k * 2 * B);
    c.globalAlpha = 0.3;
    c.drawImage(small, 0, 0, 1920, 1080);
    c.restore();
    // free-standing objects: mirrored about their base line
    for (const [spr, baseY] of objs) {
      if (!spr) continue;
      c.save();
      c.setTransform(k, 0, 0, -k, 0, k * 2 * baseY);
      c.globalAlpha = 0.26;
      c.filter = `blur(${(1.2 * k).toFixed(1)}px)`;
      c.drawImage(spr.cv, spr.x0, spr.y0, spr.w, spr.h);
      c.restore();
    }
    c.restore();
  }

  function carpet(s, u0, v0, u1, v1, rnd, motif) {
    const c = s.c;
    plane(s, FLOOR);
    c.save();
    c.beginPath(); c.rect(u0, v0, u1 - u0, v1 - v0); c.clip();
    for (let u = u0; u < u1; u += 4) {
      for (let v = v0; v < v1; v += 4) {
        c.drawImage(T.carpet, rnd() * 128, rnd() * 128, 128, 128, u, v, 4.02, 4.02);
      }
    }
    const along = motif === 'u';
    // deco motif: chevrons down the middle of the runner
    c.strokeStyle = 'rgba(40,0,6,.55)'; c.lineWidth = 0.09;
    if (along) {
      const mv = (v0 + v1) / 2;
      for (let u = u0 + 0.6; u < u1; u += 1.2) {
        c.beginPath(); c.moveTo(u - 0.3, mv - 0.45); c.lineTo(u, mv); c.lineTo(u - 0.3, mv + 0.45); c.stroke();
      }
      c.fillStyle = 'rgba(214,170,96,.55)';
      for (let u = u0 + 1.2; u < u1; u += 2.4) { c.save(); c.translate(u, mv); c.rotate(Math.PI / 4); c.fillRect(-0.1, -0.1, 0.2, 0.2); c.restore(); }
    } else {
      const mu = (u0 + u1) / 2;
      for (let v = v0 + 0.6; v < v1; v += 1.2) {
        c.beginPath(); c.moveTo(mu - 0.4, v - 0.3); c.lineTo(mu, v); c.lineTo(mu + 0.4, v - 0.3); c.stroke();
      }
    }
    // gold borders
    const bw = (inset, w, col) => {
      c.strokeStyle = col; c.lineWidth = w;
      c.strokeRect(u0 + inset, v0 + inset, u1 - u0 - 2 * inset, v1 - v0 - 2 * inset);
    };
    bw(0.14, 0.09, 'rgba(226,186,104,.9)');
    bw(0.3, 0.035, 'rgba(226,186,104,.7)');
    bw(0.02, 0.05, 'rgba(0,0,0,.6)');
    c.restore();
    // a soft lip shadow on the far edges
    flat(s);
  }

  function drawStreet(s, rnd) {
    const c = s.c;
    flat(s);
    const poly = [iso(-14, 19.5), iso(40, 19.5), iso(40, 40), iso(-14, 40)];
    c.save();
    path(c, poly); c.clip();
    plane(s, FLOOR);
    for (let u = -14; u < 40; u += 6) for (let v = 19.5; v < 34; v += 6) c.drawImage(T.street, rnd() * 100, rnd() * 100, 150, 150, u, v, 6.05, 6.05);
    // kerb line
    c.fillStyle = 'rgba(120,120,130,.25)'; c.fillRect(-14, 25.6, 60, 0.12);
    // red carpet out of the door
    c.drawImage(T.carpet, 0, 0, 120, 256, DRUM.u - 0.9, 19.5, 1.8, 8);
    c.strokeStyle = 'rgba(226,186,104,.8)'; c.lineWidth = 0.07;
    c.strokeRect(DRUM.u - 0.78, 19.5, 1.56, 8);
    // wet sheen + canopy light
    flat(s);
    c.globalCompositeOperation = 'lighter';
    const [lx, ly] = iso(DRUM.u, 20.6);
    c.fillStyle = rad(c, lx, ly, 0, 180, [[0, 'rgba(255,170,90,.24)'], [1, 'rgba(0,0,0,0)']]);
    c.fillRect(lx - 200, ly - 200, 400, 400);
    for (let i = 0; i < 6; i++) {
      const [px, py] = iso(DRUM.u - 1.3 + i * 0.52, 20.6, -40 - (i % 2) * 10);
      c.fillStyle = rad(c, px, py, 0, 22, [[0, 'rgba(255,210,140,.3)'], [1, 'rgba(0,0,0,0)']]);
      c.save(); c.translate(px, py); c.scale(0.3, 1.6); c.translate(-px, -py); c.fillRect(px - 22, py - 22, 44, 44); c.restore();
    }
    c.globalCompositeOperation = 'source-over';
    c.fillStyle = lin(c, 0, 640, 0, 1080, [[0, 'rgba(4,3,8,.25)'], [1, 'rgba(4,3,8,.75)']]);
    c.fillRect(0, 600, 1000, 480);
    c.restore();
  }

  function floorLighting(s) {
    const c = s.c;
    flat(s);
    c.save();
    path(c, floorPoly()); c.clip();
    c.globalCompositeOperation = 'multiply';
    c.fillStyle = rad(c, 760, 620, 60, 1150, [[0, 'rgb(196,184,176)'], [0.45, 'rgb(128,114,116)'], [1, 'rgb(40,32,42)']]);
    c.fillRect(0, 0, 1920, 1080);
    c.globalCompositeOperation = 'source-over';
    plane(s, FLOOR);
    c.fillStyle = lin(c, 0, 0, 0, 1.8, [[0, 'rgba(0,0,0,.65)'], [1, 'rgba(0,0,0,0)']]); c.fillRect(0, 0, 60, 1.8);
    c.fillStyle = lin(c, 0, 0, 1.8, 0, [[0, 'rgba(0,0,0,.65)'], [1, 'rgba(0,0,0,0)']]); c.fillRect(0, 0, 1.8, VF);
    // soft contact shadows of the props
    const sh = (u, v, r, a) => {
      c.fillStyle = rad(c, u, v, 0, r, [[0, `rgba(0,0,0,${a})`], [0.6, `rgba(0,0,0,${a * 0.5})`], [1, 'rgba(0,0,0,0)']]);
      c.fillRect(u - r, v - r, 2 * r, 2 * r);
    };
    sh(KU + 0.3, KV + 0.4, 2.8, 0.7);
    sh(24.6, 7.7, 1.9, 0.65);
    sh(37.6, 7.3, 2.8, 0.6);
    sh(0.9, 1.2, 1.5, 0.6);
    // warm pools
    c.globalCompositeOperation = 'lighter';
    const pool = (u, v, r, col) => {
      c.fillStyle = rad(c, u, v, 0, r, [[0, col], [1, 'rgba(0,0,0,0)']]);
      c.fillRect(u - r, v - r, 2 * r, 2 * r);
    };
    for (const sc of SCONCES) {
      if (sc.wall === 'R') pool(sc.u, 1.3, 3.4, 'rgba(255,170,90,.2)');
      else pool(1.3, sc.v, 3.0, 'rgba(255,170,90,.2)');
    }
    for (const r of ROOMS) pool((r.lb0 + r.lb1) / 2, 1.0, 3.2, 'rgba(255,205,130,.2)');
    pool(KU, KV + 1.5, 5.5, 'rgba(255,190,110,.2)');
    pool(24.5, 8.6, 2.6, 'rgba(255,214,120,.26)');
    pool(37.2, 8.4, 2.8, 'rgba(255,170,90,.18)');
    pool(DRUM.u, 17.6, 3.0, 'rgba(255,170,90,.18)');
    pool(22, 12, 7, 'rgba(255,190,120,.08)');
    pool(33, 13, 6, 'rgba(255,190,120,.07)');
    c.restore();
    // lamp reflections: soft vertical streaks below each light, mirrored into the polish
    flat(s);
    c.save();
    path(c, floorPoly()); c.clip();
    c.globalCompositeOperation = 'lighter';
    const streak = (x, y, rx, ry, col) => {
      c.save(); c.translate(x, y); c.scale(rx / ry, 1);
      c.fillStyle = rad(c, 0, 0, 0, ry, [[0, col], [1, 'rgba(0,0,0,0)']]);
      c.fillRect(-ry, -ry, 2 * ry, 2 * ry);
      c.restore();
    };
    for (const sc of SCONCES) {
      const [x, y] = sc.wall === 'R' ? iso(sc.u, 0.4) : iso(0.4, sc.v);
      streak(x, y + 212, 9, 34, 'rgba(255,200,130,.4)');
    }
    for (const r of ROOMS) { const [x, y] = iso((r.lb0 + r.lb1) / 2, 0.1); streak(x, y + 156, 40, 70, 'rgba(255,214,150,.16)'); }
    { const [x, y] = iso(KU, KV); streak(x, y + 208, 10, 30, 'rgba(255,220,150,.45)'); }
    c.restore();
  }

  // ---------- props (each is its own occluding sprite) ----------
  function drawKiosk(s) {
    const c = s.c;
    clear(s); flat(s);
    const U = KU; const V = KV;
    const [cx, cy] = iso(U, V);
    const RX = (r) => r * S * Math.SQRT2; const RY = (r) => RX(r) / 2;
    // plinth
    cylSide(c, U, V, 1.95, 0, 10, [[0, '#060508'], [0.3, '#4a4248'], [0.5, '#1a161c'], [0.9, '#0a090c'], [1, '#2a2428']]);
    cylTop(c, U, V, 1.95, 10, rad(c, cx - 30, cy - 18, 4, 110, [[0, '#4a4248'], [0.5, '#141116'], [1, '#08070a']]));
    cylRing(c, U, V, 1.95, 10, 'rgba(230,190,110,.8)', 1.2);
    // walnut body with brass fluting
    cylSide(c, U, V, 1.7, 10, 62, [[0, '#1a0e08'], [0.25, '#7a4a28'], [0.45, '#4e2c16'], [0.85, '#24140a'], [0.96, '#5a3a1e'], [1, '#160c06']]);
    for (let i = 1; i < 16; i++) {
      const phi = (i / 16) * Math.PI;
      const x = cx + RX(1.7) * Math.cos(phi); const yy = cy + RY(1.7) * Math.sin(phi);
      c.strokeStyle = `rgba(230,188,104,${(0.25 + 0.55 * Math.sin(phi)).toFixed(2)})`; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(x, yy - 14); c.lineTo(x, yy - 58); c.stroke();
    }
    cylSide(c, U, V, 1.72, 30, 44, [[0, '#060407'], [0.3, '#2a2228'], [0.6, '#0c0a0e'], [1, '#060407']]);
    curvedText(c, 'BOX OFFICE', U, V, 1.72, 37, Math.PI * 0.62, 0.105, '700 11px "Poiret One", sans-serif', '#f0d48e');
    // brass counter ledge
    cylSide(c, U, V, 1.9, 62, 69, BRASS);
    cylTop(c, U, V, 1.9, 69, rad(c, cx - 40, cy - 80, 4, 90, [[0, '#f6e2a2'], [0.6, '#b8893e'], [1, '#6e4f1e']]));
    // interior through the glass
    cylSide(c, U, V, 1.62, 69, 130, null);
    c.fillStyle = rad(c, cx - 20, cy - 108, 6, 95, [[0, '#ffe2a8'], [0.45, '#c87a38'], [1, '#3a1808']]);
    c.fill();
    // the clerk, behind the window
    const phiW = Math.PI * 0.75;
    const wx = cx + RX(1.62) * Math.cos(phiW);
    const wy = cy + RY(1.62) * Math.sin(phiW);
    drawClerk(c, wx + 9, wy - 70);
    // glass, highlights, mullions
    cylSide(c, U, V, 1.62, 69, 130, [[0, 'rgba(255,255,255,.02)'], [0.18, 'rgba(255,244,220,.2)'], [0.24, 'rgba(255,255,255,.03)'],
      [0.68, 'rgba(255,255,255,.05)'], [0.74, 'rgba(255,250,235,.16)'], [0.8, 'rgba(255,255,255,.02)']]);
    for (let i = 1; i < 9; i++) {
      const phi = (i / 9) * Math.PI;
      if (Math.abs(phi - phiW) < 0.2) continue;
      const x = cx + RX(1.62) * Math.cos(phi); const yy = cy + RY(1.62) * Math.sin(phi);
      c.strokeStyle = `rgba(214,170,96,${(0.4 + 0.5 * Math.sin(phi)).toFixed(2)})`; c.lineWidth = 2;
      c.beginPath(); c.moveTo(x, yy - 70); c.lineTo(x, yy - 129); c.stroke();
    }
    // window arch + speaking grille + ticket slot
    c.strokeStyle = '#e8c87a'; c.lineWidth = 2.2;
    c.beginPath(); c.moveTo(wx - 13, wy - 70); c.lineTo(wx - 13, wy - 108); c.quadraticCurveTo(wx, wy - 124, wx + 13, wy - 110); c.lineTo(wx + 13, wy - 70); c.stroke();
    c.beginPath(); c.arc(wx, wy - 84, 4.5, 0, TAU); c.fillStyle = '#b8893e'; c.fill();
    c.fillStyle = '#2a1a0c'; for (let i = -1; i <= 1; i++) c.fillRect(wx - 3, wy - 85 + i * 2, 6, 0.8);
    c.fillStyle = '#100806'; c.fillRect(wx - 9, wy - 72, 18, 3);
    // brass bell on the ledge
    const bx = wx + 22; const by = wy - 66;
    c.fillStyle = lin(c, bx - 6, 0, bx + 6, 0, BRASS); c.beginPath(); c.ellipse(bx, by, 6, 5.5, 0, Math.PI, TAU); c.fill();
    c.fillRect(bx - 7, by, 14, 1.6); c.fillRect(bx - 1, by - 8, 2, 3);
    // frieze band with lettering
    cylSide(c, U, V, 1.76, 130, 149, [[0, '#060407'], [0.3, '#2a2028'], [0.55, '#0e0b10'], [1, '#050406']]);
    cylRing(c, U, V, 1.76, 131.5, 'rgba(232,196,120,.95)', 1.6);
    cylRing(c, U, V, 1.76, 147.5, 'rgba(232,196,120,.95)', 1.6);
    curvedText(c, 'TICKETS', U, V, 1.76, 139.5, Math.PI * 0.55, 0.19, '13px Limelight, Georgia, serif', '#f4dd9c');
    // crown
    cylSide(c, U, V, 1.52, 149, 156, BRASS);
    cylTop(c, U, V, 1.52, 156, '#2a1c0c');
    cylSide(c, U, V, 1.2, 156, 165, [[0, '#060407'], [0.3, '#3a2e34'], [1, '#060407']]);
    const [dx, dy] = iso(U, V, 165);
    c.beginPath(); c.ellipse(dx, dy, RX(1.0), 30, 0, Math.PI, TAU); c.ellipse(dx, dy, RX(1.0), RY(1.0), 0, 0, Math.PI); c.closePath();
    c.fillStyle = rad(c, dx - 14, dy - 22, 2, 52, [[0, '#4a3e44'], [0.5, '#141016'], [1, '#050406']]); c.fill();
    for (let i = 1; i < 8; i++) {
      const phi = Math.PI + (i / 8) * Math.PI;
      c.strokeStyle = 'rgba(226,186,104,.8)'; c.lineWidth = 1.1;
      c.beginPath(); c.moveTo(dx + RX(1.0) * Math.cos(phi), dy - Math.sin(phi) * -RY(1.0) * 0);
      c.quadraticCurveTo(dx + RX(1.0) * Math.cos(phi) * 0.7, dy - 24, dx, dy - 30); c.stroke();
    }
    c.fillStyle = lin(c, dx - 2, 0, dx + 2, 0, BRASS); c.fillRect(dx - 1.5, dy - 46, 3, 17);
    // glowing globe
    c.fillStyle = rad(c, dx - 2, dy - 54, 1, 10, [[0, '#ffffff'], [0.4, '#fff1c8'], [1, '#e8b060']]);
    c.beginPath(); c.arc(dx, dy - 52, 8.5, 0, TAU); c.fill();
  }

  function drawClerk(c, x, y) {

  function drawPopcorn(s) {
    const c = s.c;
    clear(s); flat(s);
    const { u0, u1, v0, v1 } = POP;
    const fv = (z0, z1, col) => fillP(c, [iso(u0, v1, z0), iso(u1, v1, z0), iso(u1, v1, z1), iso(u0, v1, z1)], col);
    const fu = (z0, z1, col) => fillP(c, [iso(u1, v1, z0), iso(u1, v0, z0), iso(u1, v0, z1), iso(u1, v1, z1)], col);
    const ft = (z, col, e = 0) => fillP(c, [iso(u0 - e, v0 - e, z), iso(u1 + e, v0 - e, z), iso(u1 + e, v1 + e, z), iso(u0 - e, v1 + e, z)], col);
    // handle
    c.strokeStyle = '#d8b066'; c.lineWidth = 2.4;
    c.beginPath(); c.moveTo(...iso(u0, 7.2, 50)); c.lineTo(...iso(u0 - 0.7, 7.2, 60)); c.lineTo(...iso(u0 - 0.7, 7.8, 60)); c.lineTo(...iso(u0, 7.8, 50)); c.stroke();
    // red body
    const [ax] = iso(u0, v1); const [bx] = iso(u1, v1); const [ex] = iso(u1, v0);
    fv(14, 54, lin(c, ax, 0, bx, 0, [[0, '#5a0a10'], [0.4, '#b8202c'], [1, '#7a1018']]));
    fu(14, 54, lin(c, bx, 0, ex, 0, [[0, '#5a0a10'], [1, '#2e0508']]));
    plane(s, planeV(v1));
    c.strokeStyle = 'rgba(240,206,130,.9)'; c.lineWidth = 1.2;
    c.strokeRect(u0 * S + 4, -50, (u1 - u0) * S - 8, 30);
    c.font = '700 11px "Poiret One", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#f6e2a2';
    c.fillText('FRESH · HOT', ((u0 + u1) / 2) * S, -35);
    flat(s);
    // glass case: inner back walls, popcorn heap, kettle
    fillP(c, [iso(u0, v0, 54), iso(u1, v0, 54), iso(u1, v0, 104), iso(u0, v0, 104)], lin(c, 0, iso(0, v0, 104)[1], 0, iso(0, v0, 54)[1], [[0, '#c87a28'], [1, '#ffd77a']]));
    fillP(c, [iso(u0, v0, 54), iso(u0, v1, 54), iso(u0, v1, 104), iso(u0, v0, 104)], '#b06420');
    ft(54, '#e8b850');
    const rnd = mulberry(5);
    for (let i = 0; i < 140; i++) {
      const u = u0 + 0.12 + rnd() * (u1 - u0 - 0.24); const v = v0 + 0.1 + rnd() * (v1 - v0 - 0.2);
      const zz = 54 + 16 * (1 - Math.abs(u - (u0 + u1) / 2) / ((u1 - u0) / 2)) * rnd() + rnd() * 6;
      const [x, y] = iso(u, v, zz);
      c.fillStyle = rnd() < 0.25 ? '#fff6d8' : rnd() < 0.5 ? '#ffe6a0' : '#f4cf72';
      c.beginPath(); c.arc(x, y, 2 + rnd() * 1.6, 0, TAU); c.fill();
    }
    const [kx, ky] = iso((u0 + u1) / 2, (v0 + v1) / 2, 92);
    c.fillStyle = lin(c, kx - 12, 0, kx + 12, 0, [[0, '#6a6a70'], [0.4, '#e0e0e8'], [1, '#55555c']]);
    c.beginPath(); c.ellipse(kx, ky, 12, 7, 0, 0, TAU); c.fill();
    c.fillStyle = '#2a2a30'; c.fillRect(kx - 1, ky - 12, 2, 6);
    // front glass + frame
    fv(54, 104, 'rgba(255,240,210,.1)');
    fu(54, 104, 'rgba(255,240,210,.06)');
    c.strokeStyle = '#e2bf72'; c.lineWidth = 2;
    for (const p of [[u0, v1], [u1, v1], [u1, v0]]) { c.beginPath(); c.moveTo(...iso(p[0], p[1], 54)); c.lineTo(...iso(p[0], p[1], 104)); c.stroke(); }
    c.beginPath(); c.moveTo(...iso(u0, v1, 54)); c.lineTo(...iso(u1, v1, 54)); c.lineTo(...iso(u1, v0, 54)); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.12)';
    path(c, [iso(u0 + 0.3, v1, 60), iso(u0 + 0.5, v1, 60), iso(u0 + 0.2, v1, 100), iso(u0 + 0.05, v1, 100)]); c.fill();
    // roof + sign
    ft(104, '#4a0a10', 0.08);
    fv(104, 110, '#9a1824'); fu(104, 110, '#5a0a10');
    ft(110, lin(c, ...iso(u0, v0, 110), ...iso(u1, v1, 110), [[0, '#7a1018'], [1, '#c8303a']]), 0.08);
    c.strokeStyle = '#e2bf72'; c.lineWidth = 1.2;
    openPath(c, [iso(u0 - 0.08, v1 + 0.08, 110), iso(u1 + 0.08, v1 + 0.08, 110), iso(u1 + 0.08, v0 - 0.08, 110)]); c.stroke();
    plane(s, planeV(7.5));
    const sx0 = (u0 + 0.15) * S; const sw = (u1 - u0 - 0.3) * S;
    c.fillStyle = lin(c, 0, -134, 0, -112, BRASS_V); c.fillRect(sx0 - 2, -136, sw + 4, 26);
    c.fillStyle = '#7a0e18'; c.fillRect(sx0, -134, sw, 22);
    c.font = '13px Limelight, Georgia, serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#fff1c8'; c.fillText('POPCORN', sx0 + sw / 2, -122.5);
    c.fillStyle = '#ffe6a0';
    for (let x = sx0 + 3; x < sx0 + sw; x += 6) { c.fillRect(x - 0.8, -135.5, 1.6, 1.6); c.fillRect(x - 0.8, -112, 1.6, 1.6); }
    // wheels
    plane(s, planeV(v1 + 0.03));
    for (const wu of [u0 + 0.42, u1 - 0.42]) {
      const x = wu * S; const y = -16;
      c.beginPath(); c.arc(x, y, 16, 0, TAU); c.strokeStyle = '#120a08'; c.lineWidth = 3.4; c.stroke();
      c.beginPath(); c.arc(x, y, 16, 0, TAU); c.strokeStyle = '#d8b066'; c.lineWidth = 1.2; c.stroke();
      c.strokeStyle = '#c8a050'; c.lineWidth = 0.9;
      for (let i = 0; i < 8; i++) { const a = (i / 8) * TAU; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * 15, y + Math.sin(a) * 15); c.stroke(); }
      c.beginPath(); c.arc(x, y, 3, 0, TAU); c.fillStyle = '#f2d78e'; c.fill();
    }
  }

  function drawPiano(s) {
    const c = s.c;
    clear(s); flat(s);
    // bench
    const bench = { u0: 37.0, u1: 38.4, v0: 9.5, v1: 10.1 };
    const box = (b, z0, z1, cv, cu, ct) => {
      fillP(c, [iso(b.u0, b.v1, z0), iso(b.u1, b.v1, z0), iso(b.u1, b.v1, z1), iso(b.u0, b.v1, z1)], cv);
      fillP(c, [iso(b.u1, b.v1, z0), iso(b.u1, b.v0, z0), iso(b.u1, b.v0, z1), iso(b.u1, b.v1, z1)], cu);
      fillP(c, [iso(b.u0, b.v0, z1), iso(b.u1, b.v0, z1), iso(b.u1, b.v1, z1), iso(b.u0, b.v1, z1)], ct);
    };
    // body footprint (keyboard faces +v)
    const F = [[36.6, 8.6], [38.9, 8.6], [38.9, 7.6], [38.6, 6.7], [38.0, 6.0], [37.3, 5.6], [36.6, 5.5]];
    const legs = [[36.8, 8.35], [38.6, 8.35], [37.2, 5.9]];
    for (const [u, v] of legs) {
      const [x, y] = iso(u, v);
      c.fillStyle = lin(c, x - 3, 0, x + 3, 0, [[0, '#050406'], [0.5, '#3a3438'], [1, '#050406']]);
      c.fillRect(x - 2.5, y - 42, 5, 42);
      c.fillStyle = '#c69a4c'; c.fillRect(x - 3, y - 3, 6, 3);
    }
    // rim sides, back to front
    const edges = [];
    for (let i = 0; i < F.length; i++) {
      const a = F[i]; const b = F[(i + 1) % F.length];
      const nx = b[1] - a[1]; const ny = -(b[0] - a[0]); // outward normal-ish (clockwise in uv)
      if (nx + ny <= 0.001) continue; // faces away from the camera
      edges.push([a, b, (a[0] + a[1] + b[0] + b[1]) / 2]);
    }
    edges.sort((p, q) => p[2] - q[2]);
    for (const [a, b] of edges) {
      const p0 = iso(a[0], a[1], 40); const p1 = iso(b[0], b[1], 40);
      fillP(c, [p0, p1, iso(b[0], b[1], 60), iso(a[0], a[1], 60)], lin(c, p0[0], 0, p1[0], 0, [[0, '#0a090c'], [0.5, '#2a2630'], [1, '#08070a']]));
    }
    // open top: gold plate + strings
    path(c, F.map(([u, v]) => iso(u, v, 60)));
    c.fillStyle = '#0a090c'; c.fill();
    path(c, F.map(([u, v]) => iso(lerp(37.75, u, 0.85), lerp(7.1, v, 0.85), 60)));
    c.fillStyle = lin(c, ...iso(36.6, 5.6, 60), ...iso(38.9, 8.6, 60), [[0, '#8a6526'], [0.5, '#e2bf72'], [1, '#7a5520']]); c.fill();
    c.strokeStyle = 'rgba(40,24,8,.6)'; c.lineWidth = 0.6;
    for (let u = 36.9; u < 38.7; u += 0.12) { c.beginPath(); c.moveTo(...iso(u, 8.4, 60)); c.lineTo(...iso(u, 6.2 + (u - 36.9) * 0.4, 60)); c.stroke(); }
    // keyboard
    const kb = { u0: 36.65, u1: 38.85, v0: 8.6, v1: 9.15 };
    box(kb, 40, 47, '#0b0a0d', '#08070a', '#16131a');
    path(c, [iso(36.78, 8.75, 47.5), iso(38.72, 8.75, 47.5), iso(38.72, 9.08, 47.5), iso(36.78, 9.08, 47.5)]);
    c.fillStyle = '#efe8d6'; c.fill();
    c.strokeStyle = 'rgba(60,50,40,.7)'; c.lineWidth = 0.5;
    for (let u = 36.78; u < 38.72; u += 0.1) { c.beginPath(); c.moveTo(...iso(u, 8.75, 47.5)); c.lineTo(...iso(u, 9.08, 47.5)); c.stroke(); }
    c.fillStyle = '#101014';
    for (let i = 0, u = 36.83; u < 38.66; u += 0.1, i++) if ([0, 1, 3, 4, 5].includes(i % 7)) path(c, [iso(u + 0.03, 8.75, 48), iso(u + 0.09, 8.75, 48), iso(u + 0.09, 8.93, 48), iso(u + 0.03, 8.93, 48)]), c.fill();
    // music stand
    fillP(c, [iso(37.1, 8.45, 60), iso(38.3, 8.45, 60), iso(38.3, 8.3, 82), iso(37.1, 8.3, 82)], '#141118');
    fillP(c, [iso(37.35, 8.43, 64), iso(38.05, 8.43, 64), iso(38.05, 8.32, 80), iso(37.35, 8.32, 80)], '#e8dcc0');
    // lid, propped open on the treble side
    const lid = F.map(([u, v]) => { const d = u - 36.6; return iso(36.6 + d * 0.42, v, 61 + d * 40); });
    c.strokeStyle = '#c69a4c'; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(...iso(38.4, 7.2, 60)); c.lineTo(...iso(36.6 + 1.8 * 0.42, 7.2, 61 + 1.8 * 40)); c.stroke();
    path(c, lid);
    c.fillStyle = lin(c, lid[0][0], lid[0][1], lid[3][0], lid[3][1], [[0, '#050406'], [0.55, '#2c2832'], [0.62, '#5a5462'], [0.7, '#1a171e'], [1, '#08070a']]);
    c.fill();
    c.strokeStyle = 'rgba(255,240,220,.25)'; c.lineWidth = 1; c.stroke();
    // bench
    box(bench, 0, 22, '#0b0a0d', '#08070a', '#16131a');
    path(c, [iso(bench.u0 + 0.05, bench.v0 + 0.05, 24), iso(bench.u1 - 0.05, bench.v0 + 0.05, 24), iso(bench.u1 - 0.05, bench.v1 - 0.05, 24), iso(bench.u0 + 0.05, bench.v1 - 0.05, 24)]);
    c.fillStyle = '#8e1a24'; c.fill();
    // little deco lamp on the piano
    const [lx, ly] = iso(37.1, 6.3, 60);
    c.fillStyle = '#c69a4c'; c.fillRect(lx - 1, ly - 30, 2, 30); c.fillRect(lx - 5, ly - 2, 10, 3);
    c.beginPath(); c.ellipse(lx, ly - 32, 11, 9, 0, Math.PI, TAU); c.closePath();
    c.fillStyle = rad(c, lx, ly - 33, 1, 11, [[0, '#fffbea'], [0.5, '#ffe2a0'], [1, '#c8823a']]); c.fill();
  }

  function drawBooth(s, lit) {
    const c = s.c;
    clear(s); flat(s);
    const { u0, u1, v0, v1 } = BOOTH;
    const H = 150;
    const [ax] = iso(u0, v1); const [bx] = iso(u1, v1); const [ex] = iso(u1, v0);
    // back inner walls (seen through glass)
    fillP(c, [iso(u0, v0, 0), iso(u1, v0, 0), iso(u1, v0, H), iso(u0, v0, H)], '#2a1608');
    fillP(c, [iso(u0, v0, 0), iso(u0, v1, 0), iso(u0, v1, H), iso(u0, v0, H)], '#3a200c');
    // telephone on the back wall
    const [px, py] = iso(u0 + 0.05, (v0 + v1) / 2, 92);
    c.fillStyle = '#0a0806'; c.fillRect(px - 5, py - 10, 10, 18); c.beginPath(); c.ellipse(px, py - 12, 5, 3, 0, 0, TAU); c.fill();
    c.fillStyle = '#c69a4c'; c.beginPath(); c.arc(px, py + 1, 2.5, 0, TAU); c.fill();
    c.fillStyle = lit ? 'rgba(255,214,140,.55)' : 'rgba(255,200,120,.3)';
    const [ix, iy] = iso((u0 + u1) / 2, (v0 + v1) / 2, 120);
    c.beginPath(); c.arc(ix, iy, 18, 0, TAU); c.fill();
    // floor + glass
    fillP(c, [iso(u0, v0, 2), iso(u1, v0, 2), iso(u1, v1, 2), iso(u0, v1, 2)], '#1a0e08');
    const fv = (z0, z1, col) => fillP(c, [iso(u0, v1, z0), iso(u1, v1, z0), iso(u1, v1, z1), iso(u0, v1, z1)], col);
    const fu = (z0, z1, col) => fillP(c, [iso(u1, v1, z0), iso(u1, v0, z0), iso(u1, v0, z1), iso(u1, v1, z1)], col);
    fv(0, 34, lin(c, ax, 0, bx, 0, [[0, '#2a160a'], [0.5, '#6a3e1e'], [1, '#3a200e']]));
    fu(0, 34, lin(c, bx, 0, ex, 0, [[0, '#2a160a'], [1, '#160a04']]));
    fv(34, H, 'rgba(255,230,190,.08)');
    fu(34, H, 'rgba(255,230,190,.05)');
    // frame
    c.strokeStyle = '#4a2a12'; c.lineWidth = 4;
    for (const p of [[u0, v1], [u1, v1], [u1, v0]]) { c.beginPath(); c.moveTo(...iso(p[0], p[1], 0)); c.lineTo(...iso(p[0], p[1], H)); c.stroke(); }
    c.strokeStyle = '#d8b066'; c.lineWidth = 1;
    for (const p of [[u0, v1], [u1, v1], [u1, v0]]) { c.beginPath(); c.moveTo(...iso(p[0], p[1], 2)); c.lineTo(...iso(p[0], p[1], H - 2)); c.stroke(); }
    c.strokeStyle = '#4a2a12'; c.lineWidth = 3;
    for (const z of [34, 96]) { c.beginPath(); c.moveTo(...iso(u0, v1, z)); c.lineTo(...iso(u1, v1, z)); c.lineTo(...iso(u1, v0, z)); c.stroke(); }
    c.fillStyle = 'rgba(255,255,255,.1)';

  function drawDrum(s) {
    const c = s.c;
    clear(s); flat(s);
    const { u, v, r } = DRUM;
    const H = 150;
    const [cx, cy] = iso(u, v);
    const rx = r * S * Math.SQRT2; const ry = rx / 2;
    // flanking pillars
    for (const du of [-1.6, 1.4]) {
      const b = { u0: u + du, u1: u + du + 0.32, v0: v - 0.3, v1: v + 0.3 };
      fillP(c, [iso(b.u0, b.v1, 0), iso(b.u1, b.v1, 0), iso(b.u1, b.v1, 172), iso(b.u0, b.v1, 172)], lin(c, ...iso(b.u0, b.v1), ...iso(b.u1, b.v1), [[0, '#1a161c'], [1, '#0a080c']]));
      fillP(c, [iso(b.u1, b.v1, 0), iso(b.u1, b.v0, 0), iso(b.u1, b.v0, 172), iso(b.u1, b.v1, 172)], '#060508');
      c.strokeStyle = 'rgba(220,178,100,.8)'; c.lineWidth = 1;
      for (const f of [0.3, 0.7]) { const uu = lerp(b.u0, b.u1, f); c.beginPath(); c.moveTo(...iso(uu, b.v1, 20)); c.lineTo(...iso(uu, b.v1, 160)); c.stroke(); }
    }
    // wings (glass with brass edges)
    const wings = [0, 1, 2, 3].map((i) => DRUM.ang + (i * Math.PI) / 2).map((a) => ({ a, d: Math.cos(a) + Math.sin(a) }));
    wings.sort((p, q) => p.d - q.d);
    for (const w of wings) {
      const eu = u + Math.cos(w.a) * r * 0.96; const ev = v + Math.sin(w.a) * r * 0.96;
      const quad = [iso(u, v, 6), iso(eu, ev, 6), iso(eu, ev, H - 8), iso(u, v, H - 8)];
      fillP(c, quad, 'rgba(190,210,230,.10)');
      c.strokeStyle = '#d8b066'; c.lineWidth = 1.6;
      c.beginPath(); c.moveTo(...quad[1]); c.lineTo(...quad[2]); c.moveTo(...quad[0]); c.lineTo(...quad[1]); c.moveTo(...quad[3]); c.lineTo(...quad[2]); c.stroke();
      c.strokeStyle = 'rgba(216,176,102,.5)'; c.lineWidth = 0.8;
      c.beginPath(); c.moveTo(...iso(lerp(u, eu, 0.2), lerp(v, ev, 0.2), 70)); c.lineTo(...iso(lerp(u, eu, 0.95), lerp(v, ev, 0.95), 70)); c.stroke();
    }
    c.fillStyle = lin(c, cx - 3, 0, cx + 3, 0, BRASS); c.fillRect(cx - 2.5, cy - H, 5, H);
    // front glass half + rims
    c.beginPath();
    c.moveTo(cx + rx, cy - H); c.lineTo(cx + rx, cy); c.ellipse(cx, cy, rx, ry, 0, 0, Math.PI); c.lineTo(cx - rx, cy - H);
    c.ellipse(cx, cy - H, rx, ry, 0, Math.PI, 0, true); c.closePath();
    c.fillStyle = lin(c, cx - rx, 0, cx + rx, 0, [[0, 'rgba(255,255,255,.03)'], [0.22, 'rgba(255,240,215,.16)'], [0.3, 'rgba(255,255,255,.02)'], [0.8, 'rgba(255,255,255,.05)'], [1, 'rgba(255,255,255,.01)']]);
    c.fill();
    for (const z of [0, 6, H - 8, H]) cylRing(c, u, v, r, z, z === 0 || z === H ? '#e8c87a' : 'rgba(216,176,102,.7)', z === 0 || z === H ? 2.4 : 1);
    c.strokeStyle = '#d8b066'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(cx - rx, cy); c.lineTo(cx - rx, cy - H); c.moveTo(cx + rx, cy); c.lineTo(cx + rx, cy - H); c.stroke();
    // canopy
    const can = { u0: u - 1.8, u1: u + 1.9, v0: v - 0.6, v1: v + 1.3 };
    const z0 = H + 8; const z1 = H + 26;
    fillP(c, [iso(can.u0, can.v1, z0), iso(can.u1, can.v1, z0), iso(can.u1, can.v1, z1), iso(can.u0, can.v1, z1)], lin(c, 0, iso(0, can.v1, z1)[1], 0, iso(0, can.v1, z0)[1], [[0, '#1c161e'], [1, '#08070a']]));
    fillP(c, [iso(can.u1, can.v1, z0), iso(can.u1, can.v0, z0), iso(can.u1, can.v0, z1), iso(can.u1, can.v1, z1)], '#060508');
    fillP(c, [iso(can.u0, can.v0, z1), iso(can.u1, can.v0, z1), iso(can.u1, can.v1, z1), iso(can.u0, can.v1, z1)], '#2a2228');
    c.strokeStyle = '#e8c87a'; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(...iso(can.u0, can.v1, z1)); c.lineTo(...iso(can.u1, can.v1, z1)); c.lineTo(...iso(can.u1, can.v0, z1)); c.stroke();
    c.beginPath(); c.moveTo(...iso(can.u0, can.v1, z0)); c.lineTo(...iso(can.u1, can.v1, z0)); c.stroke();
    plane(s, planeV(can.v1 + 0.01));
    c.font = '700 11px "Poiret One", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#f4dd9c'; c.fillText('E N T R A N C E', u * S, -(z0 + z1) / 2);
    flat(s);
    for (let i = 0; i <= 10; i++) {
      const [bx, by] = iso(lerp(can.u0 + 0.1, can.u1 - 0.1, i / 10), can.v1, z0 - 2);

  // ---------- door leaves (DOM canvases in the wall plane) ----------
  function drawLeaf(cv, w, hh, mirror, porthole) {
    const c = SB.fitCanvas(cv, w, hh);
    const k = cv.width / w;
    c.setTransform(mirror ? -k : k, 0, 0, k, mirror ? cv.width : 0, 0);
    c.fillStyle = lin(c, 0, 0, w, 0, [[0, '#2a060a'], [0.5, '#5e101a'], [1, '#3a080e']]);
    c.fillRect(0, 0, w, hh);
    // diamond tufting
    c.save(); c.beginPath(); c.rect(2, 2, w - 4, hh - 14); c.clip();
    c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = 0.9;
    for (let d = -hh; d < hh + w; d += 10) {
      c.beginPath(); c.moveTo(d, 0); c.lineTo(d + hh, hh); c.stroke();
      c.beginPath(); c.moveTo(d, hh); c.lineTo(d + hh, 0); c.stroke();
    }
    c.fillStyle = 'rgba(232,196,120,.85)';
    for (let y = 5; y < hh - 12; y += 10) for (let x = (y / 10) % 2 ? 5 : 0; x < w; x += 10) { c.beginPath(); c.arc(x, y, 0.9, 0, TAU); c.fill(); }
    c.restore();
    // stud border
    c.fillStyle = '#e8c87a';
    for (let y = 2; y < hh - 10; y += 4.5) { c.fillRect(1, y, 1.3, 1.3); c.fillRect(w - 2.3, y, 1.3, 1.3); }
    for (let x = 2; x < w - 1; x += 4.5) c.fillRect(x, 1, 1.3, 1.3);
    // porthole
    if (porthole) {
      c.beginPath(); c.arc(w / 2, 32, 8, 0, TAU); c.fillStyle = lin(c, w / 2 - 8, 24, w / 2 + 8, 40, BRASS); c.fill();
      c.beginPath(); c.arc(w / 2, 32, 6, 0, TAU); c.fillStyle = rad(c, w / 2 - 2, 30, 0, 7, [[0, '#3a4a70'], [1, '#0a0c18']]); c.fill();
      c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.arc(w / 2 - 2.5, 29.5, 1.6, 0, TAU); c.fill();
    }
    // push plate + kick plate
    c.fillStyle = lin(c, 0, hh * 0.47, 0, hh * 0.47 + 20, BRASS_V); c.fillRect(w - 9, hh * 0.47, 5, 20);
    c.fillStyle = lin(c, 0, hh - 12, 0, hh, BRASS_V); c.fillRect(0, hh - 12, w, 12);
    c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(0, 0, 1, hh); c.fillRect(w - 1, 0, 1, hh);
  }

  // ---------- frame occluders (wall pixels around a doorway, opening cut out) ----------
  function frameOccluder(name, W, m, sc, hw, top, ow, oh, z) {
    const corners = [[sc - hw, -top], [sc + hw, -top], [sc + hw, 0], [sc - hw, 0]].map(([a, b]) => [m[0] * a + m[2] * b + m[4], m[1] * a + m[3] * b + m[5]]);
    const rect = bboxOf(corners, 2);
    const s = sprite(name, rect, z);
    const c = s.c;
    clear(s);
    const k = kOf(s);
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.drawImage(W.cv, Math.round(rect[0] * k), Math.round(rect[1] * k), s.cv.width, s.cv.height, 0, 0, s.cv.width, s.cv.height);
    plane(s, m);
    c.globalCompositeOperation = 'destination-in';
    c.fillRect(sc - hw, -top, 2 * hw, top);
    c.globalCompositeOperation = 'destination-out';
    c.fillRect(sc - ow, -oh, 2 * ow, oh + 1);
    c.globalCompositeOperation = 'source-over';
    return s;
  }

  // ======================================================================

  const inBox = (p, b) => p[0] > b.u0 && p[0] < b.u1 && p[1] > b.v0 && p[1] < b.v1;
  function segHits(p, q2, b) {
    let t0 = 0; let t1 = 1;
    const dx = q2[0] - p[0]; const dy = q2[1] - p[1];
    for (const [pp, qq] of [[-dx, p[0] - b.u0], [dx, b.u1 - p[0]], [-dy, p[1] - b.v0], [dy, b.v1 - p[1]]]) {
      if (pp === 0) { if (qq < 0) return false; }

        const r = qq / pp;
        if (pp < 0) { if (r > t1) return false; if (r > t0) t0 = r; }
        else { if (r < t0) return false; if (r < t1) t1 = r; }

  const HARD_OBST = OBST.map((b) => shrink(b, 0.04));
  function clearPath(a, b) { return !HARD_OBST.some((o) => !inBox(a, o) && !inBox(b, o) && segHits(a, b, o)); }
  const NODES = [];
  for (const b of OBST) {
    for (const [u, v] of [[b.u0 - 0.3, b.v0 - 0.3], [b.u1 + 0.3, b.v0 - 0.3], [b.u1 + 0.3, b.v1 + 0.3], [b.u0 - 0.3, b.v1 + 0.3]]) {
      if (u < BOUNDS.u0 || u > BOUNDS.u1 || v < BOUNDS.v0 || v > BOUNDS.v1) continue;
      if (OBST.some((o) => inBox([u, v], o))) continue;

  }
  function route(a, b) {
    if (clearPath(a, b)) return [b];
    const nodes = [a, ...NODES, b];
    const n = nodes.length;
    const dist = new Array(n).fill(Infinity);
    const prev = new Array(n).fill(-1);
    const done = new Array(n).fill(false);
    dist[0] = 0;
    for (;;) {
      let x = -1;
      for (let i = 0; i < n; i++) if (!done[i] && dist[i] < Infinity && (x < 0 || dist[i] < dist[x])) x = i;
      if (x < 0 || x === n - 1) break;
      done[x] = true;
      for (let y = 1; y < n; y++) {
        if (done[y]) continue;
        const d = dist[x] + Math.hypot(nodes[y][0] - nodes[x][0], nodes[y][1] - nodes[x][1]);
        if (d < dist[y] && clearPath(nodes[x], nodes[y])) { dist[y] = d; prev[y] = x; }

    for (let i = n - 1; i > 0; i = prev[i]) out.unshift(nodes[i]);

  // ---------- per-frame walker update ----------
  const easeOutBack = (x) => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2;
  function stepWalker(g, t, dt) {
    let moving = false;
    let zOverride = null;
    if (g.state === 'spawn') {
      const k = (t - g.t0) / 450;
      g.op = Math.min(1, k);
      zOverride = 2985;
      if (k >= 1) { g.state = 'free'; begin(g); }
    } else if (g.th) {
      const th = g.th;
      th.t = Math.min(1, th.t + dt / th.dur);
      g.u = lerp(th.a[0], th.b[0], th.t);
      g.v = lerp(th.a[1], th.b[1], th.t);
      g.op = th.mode === 'out' ? 1 - clamp((th.t - 0.25) / 0.75, 0, 1) : clamp(th.t / 0.6, 0, 1);
      zOverride = th.z;
      moving = true;
      if (th.t >= 1) { g.th = null; th.done(); if (!active.has(g)) return; }
    } else if (g.waitFn && g.path.length === 0) {
      if (t >= g.waitUntil) { const fn = g.waitFn; g.waitFn = null; fn(); }
    }
    if (!g.th && g.path.length && g.state !== 'spawn') {
      const [tu, tv] = g.path[0];
      const du = tu - g.u; const dv = tv - g.v;
      const d = Math.hypot(du, dv);
      const st = g.speed * (g.hurry ? 2.1 : 1) * (g.inLane ? 0.8 : 1) * dt;

      } else {
        g.u += (du / d) * st; g.v += (dv / d) * st;

      moving = true;
    }
    if (g.state === 'inLoo') { g.op = 0; }

    // hop
    let s; let lift = 0; let bouncing = false;

    const [x, y] = iso(g.u, g.v);
    g.sx = x; g.sy = y;
    const sc = g.state === 'spawn' ? easeOutBack(Math.min(1, (t - g.t0) / 450)) : 1;
    g.el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)${sc !== 1 ? ` scale(${sc.toFixed(3)})` : ''}`;
    g.bod.style.transform = `translateY(${(-lift).toFixed(1)}px) scale(${(f * (2 - sq)).toFixed(3)}, ${sq})`;
    g.rf.style.transform = `translateY(${lift.toFixed(1)}px) scale(${(f * (2 - sq)).toFixed(3)}, ${-sq})`;
    g.ov.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
    const op = g.op.toFixed(2);
    if (op !== g.opS) { g.opS = op; g.el.style.opacity = op; g.ov.style.opacity = op; }
    const oc = onCarpet(g.u, g.v);
    if (oc !== g.onCarpet) { g.onCarpet = oc; g.rf.classList.toggle('off', oc); }
    const z = zOverride ?? depth(g.u, g.v);
    if (z !== g.z) { g.z = z; g.el.style.zIndex = String(z); g.ov.style.zIndex = String(z); }
    if (g.bub && t > g.bubUntil) dropBubble(g);

  }

  // ======================================================================

  function spinDrum() { DRUM.target += Math.PI / 2; }
  function stepDoors(dt, t) {

      if (d.film) { d.film.a = e * 0.8; d.film.ga = e * 0.35; }
    }

      DRUM.ang = Math.min(DRUM.target, DRUM.ang + dt * 3.2);

  // The usher: patrols the runner with a flashlight and checks tickets at the doors.

  function stepUsher(t, dt) {

    }
    if (AMB.ringUntil) {
      if (t > AMB.nextRing) { AMB.nextRing = t + 900; glyph(iso(0.9, 1.1, 190), pick(['☎ brrring!', 'ring ring!']), 'ring', 1.6, rand(-10, 30), -40); boothLight.pulse = 1; }
      if (t > AMB.ringUntil) {
        AMB.ringUntil = 0;
        AMB.ringAt = t + rand(60_000, 140_000);
        fig.booth.cv.classList.remove('ring-shake');
        drawBooth(fig.booth, false);
      }
    }
    // piano
    if (t > AMB.pianoSwitch) { AMB.pianoOn = !AMB.pianoOn; AMB.pianoSwitch = t + (AMB.pianoOn ? rand(22_000, 40_000) : rand(6_000, 14_000)); }
    if (AMB.pianoOn && t > AMB.nextNote) {
      AMB.nextNote = t + rand(450, 1200);
      glyph(iso(37.6 + rand(-0.4, 0.6), 7.2, 110), pick(['♪', '♫', '♩', '♬']), '', rand(2.6, 3.6), rand(-30, 40), rand(-80, -110));
    }
    pianoLight.flick = AMB.pianoOn ? 0.05 : 0.02;
    // popcorn kettle pops
    const busy = t < popBusyUntil;
    popLight.ga = busy ? 0.4 : 0.24;
    if (t > AMB.nextPop) {
      AMB.nextPop = t + (busy ? rand(120, 260) : rand(2500, 6000));
      const [x, y] = iso(24.5 + rand(-0.5, 0.5), 7.5, 80);
      sparks.push({ x, y, vx: rand(-30, 30), vy: rand(-90, -50), life: 0.8, max: 0.8, kind: 'pop' });
    }
  }

  // ======================================================================
  // Lighting: low-res darkness (multiply) + glow (screen), redrawn per frame
  // ======================================================================
  const DK = 4;
  const dk = $('dark').getContext('2d');
  const gl = $('glow').getContext('2d');
  const darkBase = document.createElement('canvas');
  darkBase.width = 480; darkBase.height = 270;
  {
    const c = darkBase.getContext('2d');
    c.fillStyle = 'rgba(14,8,22,.5)'; c.fillRect(0, 0, 480, 270);
    c.fillStyle = rad(c, 200, 150, 60, 320, [[0, 'rgba(8,4,14,0)'], [0.7, 'rgba(8,4,14,.25)'], [1, 'rgba(8,4,14,.6)']]);
    c.fillRect(0, 0, 480, 270);
  }
  const sparks = [];
  const motes = Array.from({ length: 46 }, () => ({ x: rand(0, 1560), y: rand(150, 1000), vx: rand(-4, 4), vy: rand(-6, -1), ph: rand(0, TAU) }));
  function spr(ctx, img, x, y, r) { const rr = r / DK; ctx.drawImage(img, x / DK - rr, y / DK - rr, rr * 2, rr * 2); }
  function drawLight(ts, dt) {
    dk.globalCompositeOperation = 'copy';
    dk.globalAlpha = 1;
    dk.drawImage(darkBase, 0, 0);
    dk.globalCompositeOperation = 'destination-out';
    for (const L of lights) {
      if (!L.a) continue;
      const f = 1 + L.flick * wob(ts * L.speed + L.seed) + L.pulse * 0.25;
      dk.globalAlpha = clamp(L.a * (1 + L.pulse * 0.4), 0, 1);
      spr(dk, HOLE, L.x, L.y, L.r * f);
    }
    const B = USH.beam;
    if (B) { dk.globalAlpha = 0.85; spr(dk, HOLE, B[2], B[3], 90); }
    dk.globalCompositeOperation = 'source-over';
    dk.globalAlpha = 1;

    gl.globalCompositeOperation = 'source-over';
    gl.clearRect(0, 0, 480, 270);
    gl.globalCompositeOperation = 'lighter';
    for (const L of lights) {
      if (!L.ga) continue;
      gl.globalAlpha = clamp(L.ga * (1 + L.flick * 3 * wob(ts * L.speed * 1.3 + L.seed) + L.pulse * 1.2), 0, 1);
      spr(gl, L.tint, L.x, L.y, L.gr * (1 + L.pulse * 0.3));
    }
    // film flicker through the portholes
    for (const r of ROOMS) {
      const fl = 0.5 + 0.5 * Math.sin(ts * 9 + r.i * 2) * Math.sin(ts * 3.1 + r.i);
      gl.globalAlpha = 0.18 + 0.2 * fl;
      for (const du of [-0.5, 0.5]) { const [x, y] = iso(r.dc + du, 0.05, 108); spr(gl, FILM, x, y, 22); }
    }
    // flashlight beam
    if (B) {
      const [hx, hy, bx, by] = B;
      const ang = Math.atan2(by - hy, bx - hx);
      const len = Math.hypot(bx - hx, by - hy);
      gl.save();
      gl.translate(hx / DK, hy / DK);
      gl.rotate(ang);
      const g = gl.createLinearGradient(0, 0, len / DK, 0);
      g.addColorStop(0, 'rgba(255,246,210,.55)'); g.addColorStop(1, 'rgba(255,240,200,.12)');
      gl.fillStyle = g; gl.globalAlpha = 1;
      gl.beginPath(); gl.moveTo(0, -0.6); gl.lineTo(len / DK, -9); gl.lineTo(len / DK, 9); gl.lineTo(0, 0.6); gl.closePath(); gl.fill();
      gl.restore();
      gl.globalAlpha = 0.55;
      spr(gl, GOLD, bx, by, 60);
    }
    // dust motes drifting in the warm air
    for (const m of motes) {
      m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.y < 120 || m.x < -10 || m.x > 1570) { m.x = rand(0, 1560); m.y = rand(500, 1040); }
      gl.globalAlpha = 0.18 + 0.14 * Math.sin(ts * 0.9 + m.ph);
      gl.fillStyle = '#ffe2b0';
      gl.fillRect(m.x / DK, m.y / DK, 0.6, 0.6);
    }
    // popping kernels
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.life -= dt;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      p.vy += 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      gl.globalAlpha = Math.min(1, p.life / p.max * 1.4);
      spr(gl, GOLD, p.x, p.y, 7);
    }
    // a glint on the forgotten top hat
    const gph = (ts % 7) / 7;
    if (gph < 0.06) { gl.globalAlpha = Math.sin((gph / 0.06) * Math.PI); const [x, y] = iso(HAT[0], HAT[1]); spr(gl, GOLD, x + 10, y - 9, 16); }
    gl.globalAlpha = 1;
  }

  // ======================================================================
  // Main loop
  // ======================================================================
  let ready = false;
  let last = now();
  let bulbT = 0;
  let frameNo = 0;
  function frame() {
    const t = now(); // one clock for everything (rAF timestamps can lag performance.now)
    const dt =Math.min(0.05, Math.max(0, (t - last) / 1000));
    last = t;
    const ts = t / 1000;
    stepQueue(t);
    for (const g of [...active]) stepWalker(g, t, dt);
    stepUsher(t, dt);
    if (ready) { stepDoors(dt, t); stepDoorman(t); stepAmbient(t); }
    for (const L of lights) if (L.pulse > 0) L.pulse = Math.max(0, L.pulse - dt * 1.3);
    drawLight(ts, dt);
    bulbT += dt;
    if (ready && bulbT > 0.13) { bulbT = 0; drawBulbs(); }
    if (++frameNo % 3 === 0) bubbleOverlaps();
    requestAnimationFrame(frame);
  }

  if (q.has('debug')) {
    setInterval(() => {
      document.body.dataset.dbg = [...active].slice(0, 8).map((g) => `${g.nick}:${g.state}:${g.u.toFixed(1)},${g.v.toFixed(1)}:p${g.path.length}:w${g.waitFn ? 1 : 0}`).join(' | ') + ` || q${queue.length} f${frameNo}`;
    }, 500);
  }
  let redrawPending = false;
  function redraw() {
    drawAll();
    drawUsherCanvases();
    drawDoormanCanvas(now() < DM.awakeUntil);
    ready = true;
  }
  const fontsReady = Promise.race([
    Promise.all(['24px Limelight', '700 24px "Poiret One"', '24px Marcellus'].map((f) => document.fonts.load(f).catch(() => null))),
    new Promise((r) => setTimeout(r, 2500)),
  ]);
  fontsReady.then(() => {
    redraw();
    SB.on('resize', () => {
      if (redrawPending) return;
      redrawPending = true;
      requestAnimationFrame(() => { redrawPending = false; redraw(); });
    });
  });
  requestAnimationFrame(frame);
  SB.start();
})();
</script>
</body>
</html>
