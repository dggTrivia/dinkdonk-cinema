<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Standby 01 — Test Card</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
  #stage { background: #000; font-family: 'VT323', monospace; color: #fff; }

  /* ---- patterns ---- */
  .pattern { position: absolute; inset: 0; display: none; }
  .pattern.on { display: block; }
  .row { position: absolute; left: 0; right: 0; display: flex; }
  .row > i { flex: 1; }
  #smpte .r1 { top: 0; height: 67%; }
  #smpte .r2 { top: 67%; height: 8%; }
  #smpte .r3 { top: 75%; height: 25%; }
  #ebu .r1 { top: 0; height: 100%; }
  #grey .r1 { top: 0; height: 50%; }
  #grey .r2 { top: 50%; height: 50%; }
  #grey::after {
    content: ''; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(90deg, transparent 0 118px, rgba(255,255,255,.55) 118px 120px),
      repeating-linear-gradient(0deg, transparent 0 118px, rgba(255,255,255,.55) 118px 120px);
  }

  /* ---- centre circle ---- */
  #circle {
    position: absolute; left: 960px; top: 470px; width: 680px; height: 680px;
    margin: -340px 0 0 -340px; border-radius: 50%;
    border: 6px solid #fff; box-shadow: 0 0 0 6px #000, inset 0 0 0 6px #000;
    background:
      linear-gradient(#fff, #fff) center / 4px 100% no-repeat,
      linear-gradient(#fff, #fff) center / 100% 4px no-repeat;
    mix-blend-mode: normal;
  }
  #band {
    position: absolute; left: 960px; top: 470px; transform: translate(-50%, -50%);
    width: 760px; padding: 18px 0 10px; background: #000; text-align: center;
    border-top: 6px solid #fff; border-bottom: 6px solid #fff;
  }
  #title {
    font-size: 104px; line-height: .9; letter-spacing: 4px;
    text-shadow: 3px 0 rgba(255,0,60,.8), -3px 0 rgba(0,200,255,.8);
  }
  #subline { font-size: 34px; color: #ffe94a; margin-top: 6px; }
  #timer { position: absolute; left: 960px; top: 650px; transform: translateX(-50%);
    background: #000; padding: 2px 22px; font-size: 52px; border: 4px solid #fff; white-space: nowrap; }
  #timer small { font-size: 32px; color: #9fa; margin-right: 12px; }

  /* ---- OSD ---- */
  .osd { position: absolute; font-size: 54px; color: #3f6; text-shadow: 3px 3px 0 #000; letter-spacing: 2px; }
  #osd-ch { left: 60px; top: 40px; }
  #osd-sig { left: 60px; top: 100px; font-size: 40px; }
  #osd-clock { right: 560px; top: 40px; }
  #osd-flash { left: 50%; top: 210px; transform: translateX(-50%); font-size: 86px; color: #fff;
    opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #osd-flash.show { opacity: 1; }

  /* ---- ticker ---- */
  #ticker {
    position: absolute; left: 0; right: 480px; bottom: 0; height: 64px;
    background: #000; color: #ffe94a; font-size: 40px; line-height: 64px;
    overflow: hidden; white-space: nowrap; border-top: 4px solid #fff;
  }
  #ticker-inner { position: absolute; left: 0; display: flex; align-items: center; gap: 40px; padding-left: 100%; }
  #ticker-inner .sb-emote { margin: 0 4px; }
  #cmds { position: absolute; left: 60px; bottom: 84px; font-size: 32px; color: #fff;
    background: rgba(0,0,0,.75); padding: 2px 14px; }
  #cmds b { color: #3f6; }

  /* ---- chat ---- */
  #chatwrap {
    position: absolute; right: 0; top: 0; width: 480px; height: 1080px;
    background: rgba(0, 0, 0, .82); border-left: 4px solid #fff;
  }
  #chathead { height: 64px; line-height: 64px; padding: 0 20px; font-size: 42px; color: #000; background: #ffe94a; }
  #chathead span { float: right; }
  #chat { left: 0; right: 0; top: 64px; bottom: 0; }

  /* ---- floating emotes ---- */
  .ghost { position: absolute; filter: drop-shadow(4px 0 0 rgba(255,0,60,.7)) drop-shadow(-4px 0 0 rgba(0,200,255,.7));
    animation: ghost 2.6s steps(12) forwards; pointer-events: none; }
  @keyframes ghost { 0% { opacity: 0; } 10% { opacity: 1; } 80% { opacity: .9; } 100% { opacity: 0; transform: translateY(-40px); } }
  .dvd { position: absolute; left: 0; top: 0; will-change: transform; }
  .dvd .who { position: absolute; left: 0; right: 0; top: 100%; text-align: center; font-size: 28px; color: #fff;
    text-shadow: 2px 2px 0 #000; white-space: nowrap; }

  /* ---- CRT ---- */
  #noise { position: absolute; inset: 0; width: 1920px; height: 1080px; image-rendering: pixelated; pointer-events: none; }
  #crt { position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 4px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%);
    animation: flicker 4s infinite; }
  @keyframes flicker { 0%, 100% { opacity: 1; } 47% { opacity: .92; } 50% { opacity: 1; } 52% { opacity: .88; } }
  #screen.glitch { animation: glitch .45s steps(6) 1; }
  @keyframes glitch {
    0% { transform: translate(0); filter: none; }
    20% { transform: translate(-18px, 4px) skewX(6deg); filter: hue-rotate(90deg); }
    40% { transform: translate(14px, -6px); filter: invert(1); }
    60% { transform: translate(-6px, 2px) skewX(-4deg); filter: hue-rotate(-60deg) saturate(3); }
    100% { transform: translate(0); filter: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="screen" style="position:absolute;inset:0">
    <div id="smpte" class="pattern on">
      <div class="row r1"><i style="background:#c0c0c0"></i><i style="background:#c0c000"></i><i style="background:#00c0c0"></i><i style="background:#00c000"></i><i style="background:#c000c0"></i><i style="background:#c00000"></i><i style="background:#0000c0"></i></div>
      <div class="row r2"><i style="background:#0000c0"></i><i style="background:#131313"></i><i style="background:#c000c0"></i><i style="background:#131313"></i><i style="background:#00c0c0"></i><i style="background:#131313"></i><i style="background:#c0c0c0"></i></div>
      <div class="row r3"><i style="background:#00214c;flex:1.25"></i><i style="background:#fff;flex:1.25"></i><i style="background:#32006a;flex:1.25"></i><i style="background:#131313;flex:1.5"></i><i style="background:#090909;flex:.33"></i><i style="background:#131313;flex:.33"></i><i style="background:#1d1d1d;flex:.34"></i><i style="background:#131313"></i></div>
    </div>
    <div id="ebu" class="pattern">
      <div class="row r1"><i style="background:#fff"></i><i style="background:#bfbf00"></i><i style="background:#00bfbf"></i><i style="background:#00bf00"></i><i style="background:#bf00bf"></i><i style="background:#bf0000"></i><i style="background:#0000bf"></i><i style="background:#000"></i></div>
    </div>
    <div id="grey" class="pattern">
      <div class="row r1"><i style="background:#000"></i><i style="background:#222"></i><i style="background:#444"></i><i style="background:#666"></i><i style="background:#888"></i><i style="background:#aaa"></i><i style="background:#ccc"></i><i style="background:#eee"></i></div>
      <div class="row r2"><i style="background:#f22"></i><i style="background:#f92"></i><i style="background:#ff2"></i><i style="background:#2f6"></i><i style="background:#2cf"></i><i style="background:#26f"></i><i style="background:#b2f"></i><i style="background:#f2b"></i></div>
    </div>

    <div id="circle"></div>
    <div id="band"><div id="title"></div><div id="subline"></div></div>
    <div id="timer"><small></small><span></span></div>

    <div id="field"></div>

    <div class="osd" id="osd-ch">CH 04</div>
    <div class="osd" id="osd-sig">SIGNAL ▮▯▯▯▯</div>
    <div class="osd" id="osd-clock"></div>
    <div class="osd" id="osd-flash"></div>

    <div id="cmds">chat: <b>!dvd</b> EMOTE · <b>!channel</b> · <b>!static</b></div>
    <div id="ticker"><div id="ticker-inner"></div></div>
  </div>

  <canvas id="noise"></canvas>
  <div id="crt"></div>

  <div id="chatwrap">
    <div id="chathead">CH 2 · CHAT <span id="viewers"></span></div>
    <div id="chat"></div>
  </div>
</div>

<script src="shared/core.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  SB.mountStage($('stage'));
  SB.mountChat($('chat'), { emoteHeight: 30 });

  $('title').textContent = (SB.cfg.title || 'PLEASE STAND BY').toUpperCase();
  $('subline').textContent = SB.cfg.sub || 'WE ARE EXPERIENCING A BRIEF INTERMISSION';

  // ---------- noise ----------
  const noise = $('noise');
  noise.width = 384; noise.height = 216;
  const nctx = noise.getContext('2d');
  const img = nctx.createImageData(384, 216);
  let staticLevel = 0.05;
  let staticTarget = 0.05;
  function drawNoise() {
    staticLevel += (staticTarget - staticLevel) * 0.15;
    const a = Math.round(staticLevel * 255);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = Math.random() * 255;
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = a;
    }
    nctx.putImageData(img, 0, 0);
  }
  function burst(ms = 600, level = 0.9) {
    staticTarget = level;
    $('screen').classList.remove('glitch');
    void $('screen').offsetWidth;
    $('screen').classList.add('glitch');
    setTimeout(() => { staticTarget = 0.05; }, ms);
  }

  // ---------- OSD ----------
  let flashTimer;
  function flash(text, ms = 2200) {
    $('osd-flash').textContent = text;
    $('osd-flash').classList.add('show');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => $('osd-flash').classList.remove('show'), ms);
  }

  const patterns = ['smpte', 'ebu', 'grey'];
  let channel = 0;
  function nextChannel(nick) {
    burst(700);
    setTimeout(() => {
      $(patterns[channel]).classList.remove('on');
      channel = (channel + 1) % patterns.length;
      $(patterns[channel]).classList.add('on');
      $('osd-ch').textContent = `CH ${String(4 + channel * 3).padStart(2, '0')}`;
      if (nick) flash(`▶ ${nick}`);
    }, 350);
  }

  setInterval(() => {
    const t = SB.timerText();
    $('timer').querySelector('small').textContent = t.label.toUpperCase();
    $('timer').querySelector('span').textContent = t.value;
    $('osd-clock').textContent = SB.clockText();
    const level = Math.min(5, Math.ceil(SB.mpm() / 8));
    $('osd-sig').textContent = `SIGNAL ${'▮'.repeat(level)}${'▯'.repeat(5 - level)}  ${SB.mpm()} MSG/MIN`;
  }, 500);

  SB.on('names', ({ connections }) => { $('viewers').textContent = connections ? `${connections.toLocaleString()} 👁` : ''; });

  // ---------- ticker ----------
  const inner = $('ticker-inner');
  let tickerX = 0;
  function refillTicker() {
    const parts = [];
    const top = SB.topEmotes(5);
    if (top.length) {
      const span = document.createElement('span');
      span.append('TOP EMOTES ');
      for (const { k, c } of top) { span.append(SB.emoteEl(k, 40), ` ×${c}  `); }
      parts.push(span);
    }
    const chatters = SB.topChatters(3);
    if (chatters.length) parts.push(`MOST TALKATIVE: ${chatters.map((c) => c.nick).join(' · ')}`);
    parts.push(`${SB.activeChatters().length} CHATTERS ACTIVE`);
    parts.push(SB.cfg.until ? `PROGRAMME RESUMES AT ${SB.cfg.until}` : 'PROGRAMME RESUMES SHORTLY');
    parts.push('TYPE !dvd EMOTE TO RELEASE A BOUNCING LOGO');
    inner.replaceChildren(...parts.map((p) => { const s = document.createElement('span'); s.append(p); return s; }));
    tickerX = 0;
  }

  // ---------- ghosts (emote interference) ----------
  const field = $('field');
  SB.on('msg', (m) => {
    if (!m.emotes.length || m.text.startsWith('!') || field.childElementCount > 10) return;
    const g = SB.emoteEl(m.emotes[0], SB.rand(60, 110));
    g.classList.add('ghost');
    g.style.left = `${SB.rand(60, 1300)}px`;
    g.style.top = `${SB.rand(160, 900)}px`;
    field.append(g);
    setTimeout(() => g.remove(), 2700);
  });

  SB.on('combo', ({ emote, count }) => {
    if (count >= 3) flash(`${count}× C-C-COMBO`, 1500);
    if (count === 5 || count === 10 || count === 20) burst(350, 0.5);
  });
  SB.on('comboEnd', ({ emote, count }) => {
    if (count >= 5) spawnDvd(emote, `${count}× combo`);
  });

  // ---------- DVD logos ----------
  const dvds = [];
  const AREA = { w: 1440, h: 1016 };
  let corners = 0;
  try { corners = Number(localStorage.getItem('sb-corners') || 0); } catch { /* no storage */ }

  function spawnDvd(emote, who) {
    if (dvds.length >= 5) { dvds.shift().el.remove(); }
    const el = document.createElement('div');
    el.className = 'dvd';
    const e = SB.emoteEl(emote, 96);
    const label = document.createElement('div');
    label.className = 'who';
    label.textContent = who;
    el.append(e, label);
    field.append(el);
    const w = Number(e.dataset.w) || 96;
    const speed = SB.rand(170, 240);
    const ang = SB.rand(0.5, 1.1);
    dvds.push({
      el, w, h: 96, x: SB.rand(0, AREA.w - w), y: SB.rand(0, AREA.h - 130),
      vx: Math.cos(ang) * speed * (Math.random() < 0.5 ? -1 : 1),
      vy: Math.sin(ang) * speed * (Math.random() < 0.5 ? -1 : 1),
      hue: 0, born: performance.now(), who,
    });
  }

  function step(dt) {
    const now = performance.now();
    for (let i = dvds.length - 1; i >= 0; i--) {
      const d = dvds[i];
      if (now - d.born > 180_000) { d.el.remove(); dvds.splice(i, 1); continue; }
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      let hitX = false;
      let hitY = false;
      if (d.x < 0) { d.x = 0; d.vx = Math.abs(d.vx); hitX = true; }
      if (d.x > AREA.w - d.w) { d.x = AREA.w - d.w; d.vx = -Math.abs(d.vx); hitX = true; }
      if (d.y < 0) { d.y = 0; d.vy = Math.abs(d.vy); hitY = true; }
      if (d.y > AREA.h - d.h - 34) { d.y = AREA.h - d.h - 34; d.vy = -Math.abs(d.vy); hitY = true; }
      // Near-corner counts: within 14px of the other wall when one wall is hit.
      const nearX = d.x < 14 || d.x > AREA.w - d.w - 14;
      const nearY = d.y < 14 || d.y > AREA.h - d.h - 48;
      if ((hitX && nearY) || (hitY && nearX)) {
        corners += 1;
        try { localStorage.setItem('sb-corners', String(corners)); } catch { /* no storage */ }
        flash(`★ CORNER! ★  #${corners}  ${d.who}`, 3500);
        burst(500, 0.6);
      }
      if (hitX || hitY) { d.hue = (d.hue + 67) % 360; d.el.firstChild.style.filter = `hue-rotate(${d.hue}deg) saturate(1.6)`; }
      d.el.style.transform = `translate(${d.x}px, ${d.y}px)`;
    }
  }

  SB.on('purge', (nick) => {
    for (let i = dvds.length - 1; i >= 0; i--) {
      if (dvds[i].who.toLowerCase() === nick.toLowerCase()) { dvds[i].el.remove(); dvds.splice(i, 1); }
    }
  });

  // ---------- commands ----------
  SB.command('dvd', 4_000, ({ nick, args, msg }) => {
    const want = args.find((a) => SB.emotes.names.has(a.split(':')[0]));
    const last = SB.topEmotes(8);
    const emote = want ? want.split(':')[0] : (msg.emotes[0] || (last.length ? SB.pick(last).k : SB.pick([...SB.emotes.names])));
    spawnDvd(emote, nick);
  });
  SB.command(['channel', 'ch'], 6_000, ({ nick }) => nextChannel(nick));
  SB.command('static', 5_000, ({ nick }) => { burst(900); flash(`~~ ${nick} ~~`, 1200); });

  // ---------- main loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    drawNoise();
    step(dt);
    tickerX -= 110 * dt;
    if (-tickerX > inner.scrollWidth) refillTicker();
    inner.style.transform = `translateX(${tickerX}px)`;
    requestAnimationFrame(frame);
  }
  SB.on('emotes', refillTicker);
  requestAnimationFrame(frame);
  SB.start();
})();
</script>
</body>
</html>
