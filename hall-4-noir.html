<!doctype html>
<!--
  Cinema standby, hall 4: "THE ROXY - RAINY NIGHT" (1990s edition).
  A 90s neighbourhood multiplex on a wet street corner, drawn like a pre-rendered isometric game.
  Outside (lower left): sidewalk, glass box-office booth with an LED ticker under a marquee with
  backlit changeable letters (the 5 film titles) and pink/cyan/purple neon, a video rental window
  ("Be kind, rewind"), payphone, newspaper box, graffiti, street lamp, steaming manhole, rain,
  puddles with mirrored reflections, boxy 90s cars with pop-up headlights (now and then a cab).
  Inside (upper right, through the glass storefront): a confetti-carpet lobby with 5 auditorium doors
  (backlit poster case, title plaque, year, rating, "n went in"), a concession counter with a backlit
  menu and popcorn machine, a CRT TV playing trailers, an arcade cabinet, a cardboard standee, restroom.
  Easter eggs: cat under the marquee, payphone rings, skateboarder, someone with a boombox,
  newspaper blowing by, lightning, puddle splashes, flickering neon letter.

  GREEN SCREEN (chroma key) on the 1920x1080 stage: x 48, y 36, w 576, h 324 (16:9).
  It is the marquee's display board: pure Cinema.green, highest z-index, nothing drawn over it.
  At 3840x2160 multiply by 2. ?green=off shows a letter-board with showtimes and the 5 films instead.

  Options: ?demo=1  ?green=ff00ff  ?green=off  ?chat=off  ?f=3  ?title=...  ?sub=...  ?clerk=EMOTE
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Roxy - Rainy Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Yellowtail&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
  :root {
    --cream: #f3e6c8; --neon: #ff3d6e; --neon-hi: #ffd3df; --cyan: #7af4ff; --gold: #e2b65c;

    --cond: 'Oswald', 'Arial Narrow', 'Roboto Condensed', sans-serif;
    --bebas: 'Bebas Neue', 'Oswald', 'Arial Narrow', sans-serif;
    --deco: 'Archivo Black', 'Arial Black', sans-serif;
    --script: 'Yellowtail', 'Brush Script MT', cursive;
  }
  #stage { background: #05070d; font-family: var(--cond); color: var(--cream); }
  .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
  #bg { z-index: 1; }
  #emit { position: absolute; z-index: 2; pointer-events: none; }
  #crowd { z-index: 3; }
  #glow { z-index: 4; mix-blend-mode: screen; }
  #fx { z-index: 5; }
  #vig { z-index: 6; background:
    radial-gradient(ellipse 75% 70% at 46% 52%, transparent 58%, rgba(2,3,10,.62) 100%); }
  #labels { z-index: 7; }
  #title { z-index: 8; }
  #combo { z-index: 9; }
  #chatpanel { z-index: 10; }
  /* The chroma-key board: pure colour, no filter/opacity/blend, above everything. */
  #green { position: absolute; left: 48px; top: 36px; width: 576px; height: 324px; z-index: 9999; background: #00ff00; }

  /* ---------- sprites in the depth-sorted crowd layer ---------- */
  .sp { position: absolute; left: 0; top: 0; pointer-events: none; }
  .w { position: absolute; left: 0; top: 0; will-change: transform; }
  .w .sh { position: absolute; left: -24px; top: -7px; width: 48px; height: 13px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,.62), rgba(0,0,0,0)); }
  .w .bod, .w .rf { position: absolute; left: 0; bottom: 0; transform-origin: 50% 100%; will-change: transform; }
  .w .bod .sb-emote, .w .rf .sb-emote { position: absolute; bottom: 0; }
  .w .rf { opacity: .26; display: none; }
  .w.out .rf { display: block; }
  .w .umb { position: absolute; width: 76px; height: 50px; left: -38px; background-size: 100% 100%; opacity: 0; transition: opacity .35s; }
  .w .umb.on { opacity: 1; }
  .w .carry { position: absolute; bottom: 4px; background-size: 100% 100%; }
  .w .carry.tk { width: 20px; height: 12px; }
  .w .carry.pc { width: 24px; height: 28px; }

  .door { position: absolute; left: 0; top: 0; overflow: hidden; pointer-events: none; }
  .leaf { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .leaf.red { width: 32px; height: 125px;
    background: linear-gradient(90deg, rgba(255,255,255,.06), transparent 30%), linear-gradient(180deg, #3b3f58 0%, #2a2d42 60%, #1c1e2e 100%);
    box-shadow: inset 0 0 0 2px #9aa1ab, inset 0 0 0 3px #15161f, inset -3px 0 6px rgba(0,0,0,.45); }
  .leaf.red::before { content: ''; position: absolute; left: 10px; top: 16px; width: 12px; height: 34px;
    background: linear-gradient(160deg, #6a7fb0, #1a2240 60%, #0b0f1c); box-shadow: 0 0 0 1.5px #c9ced6; }
  .leaf.red::after { content: ''; position: absolute; left: 3px; right: 3px; top: 64px; height: 5px; background: linear-gradient(#f4f6f8, #6b717a); border-radius: 2px;
    box-shadow: 0 54px 0 -1px #8d949e; }
  .leaf.rr { width: 45px; height: 115px; background: linear-gradient(180deg, #7a5532, #4d321b);
    box-shadow: inset 0 0 0 2px #2a1a0c, inset 4px 4px 0 6px rgba(255,220,170,.08), inset -4px -4px 0 6px rgba(0,0,0,.25); }
  .leaf.rr::after { content: ''; position: absolute; right: 6px; top: 58px; width: 4px; height: 4px; border-radius: 50%; background: #e8c87a; }
  .leaf.glass { width: 37px; height: 104px; border: 3px solid #c9ced6; border-top-width: 4px; border-bottom-width: 7px;
    background: linear-gradient(115deg, rgba(190,215,255,.06) 0%, rgba(255,255,255,.22) 38%, rgba(190,215,255,.05) 52%, rgba(255,240,210,.10) 100%);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
  .leaf.glass::after { content: ''; position: absolute; left: 4px; right: 4px; top: 46px; height: 4px; background: linear-gradient(#f4f6f8, #7c838d); }

  .poster { position: absolute; left: 0; top: 0; width: 70px; height: 105px; transform-origin: 0 0; padding: 4px;
    background: linear-gradient(135deg, #3a3d44, #121318 45%, #2a2d33 60%, #0b0c10);
    box-shadow: inset 0 0 0 1px #8d949e, 0 0 16px 3px rgba(200,225,255,.35); }
  .poster .in { position: relative; width: 100%; height: 100%; overflow: hidden; background: #120c10; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(.9) brightness(1.06); }
  .poster .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: radial-gradient(circle at 50% 35%, #3a1a6a, #0d0a1c 75%); font: 400 11px/1 var(--deco); color: #7af4ff; text-align: center; }
  .poster .ph b { font: 400 22px/1 var(--deco); color: #ff6fae; }
  .poster .gl { position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,.22), rgba(255,255,255,0) 35%, rgba(255,255,255,0) 70%, rgba(255,255,255,.08)); }

  .plaque { position: absolute; left: 0; top: 0; width: 132px; padding: 13px 7px 6px; text-align: center;
    background: linear-gradient(180deg, #17142a, #0a0912); border-radius: 4px;
    box-shadow: 0 0 0 2px #0b0b12, 0 0 0 3.5px #8d949e, 0 0 12px 2px rgba(180,90,255,.35), 0 8px 14px rgba(0,0,0,.6); }
  .plaque::before, .plaque::after { content: ''; position: absolute; top: -34px; width: 2px; height: 30px; background: linear-gradient(#5d636b, #c8cdd4); }
  .plaque::before { left: 18px; }
  .plaque::after { right: 18px; }
  .plaque .num { position: absolute; left: 50%; top: -15px; width: 28px; height: 28px; margin-left: -14px; border-radius: 50%;
    display: grid; place-items: center; background: radial-gradient(circle, #071a24, #02080c); border-radius: 6px;
    box-shadow: 0 0 0 2px #7af4ff, 0 0 10px 2px rgba(80,232,255,.55);
    font: 400 16px/1 var(--deco); color: #e6fdff; text-shadow: 0 0 4px #3ae8ff, 0 0 9px #3ae8ff; }
  .plaque .pt { font: 600 16px/1.12 var(--cond); color: #fff4dc; letter-spacing: .3px; text-transform: uppercase;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
    text-shadow: 0 0 6px rgba(255,120,220,.35); }
  .plaque .pm { margin-top: 3px; display: flex; justify-content: center; gap: 7px; white-space: nowrap; font: 500 13px/1.1 var(--cond); color: #c8b994; }
  .plaque .pm .rt { color: #ffcf5a; }
  .plaque .pc { margin-top: 2px; font: 400 15px/1 var(--bebas); letter-spacing: 1px; color: #ff8ad0; text-shadow: 0 0 6px rgba(255,80,190,.55); white-space: nowrap; }
  .plaque.bump .pc { animation: bump .6s ease-out; }
  @keyframes bump { 0% { transform: scale(1.5); color: #fff; } 100% { transform: scale(1); } }

  .rrsign { position: absolute; left: 0; top: 0; width: 70px; height: 30px; transform-origin: 0 0; text-align: center;
    background: linear-gradient(#141015, #0a080b); box-shadow: 0 0 0 1px #c9ced6, 0 0 0 2px #2a2d33; }
  .rrsign .t1 { font: 400 15px/16px var(--bebas); letter-spacing: 1.5px; color: #fff1c9; text-shadow: 0 0 5px rgba(255,220,140,.8); }
  .rrsign .t2 { font: 500 10px/11px var(--cond); letter-spacing: 1px; color: #6dff9c; text-shadow: 0 0 5px #2bff79; }
  .rrsign.busy .t2 { color: #ff7565; text-shadow: 0 0 5px #ff3020; }

  .clerk { position: absolute; left: 0; top: 0; }
  .clerk .cap { position: absolute; width: 22px; height: 10px; left: -11px; border-radius: 3px 3px 1px 1px;
    background: linear-gradient(#8a3ad0, #4a1478); box-shadow: inset 0 -2px 0 #3ae8ff; }

  /* ---------- labels (above the light layers so they stay readable) ---------- */
  .lab { position: absolute; left: 0; top: 0; will-change: transform; }
  .lab .tag { position: absolute; left: 0; top: 6px; transform: translateX(-50%); white-space: nowrap; font: 500 15px/1 var(--cond); letter-spacing: .2px;
    text-shadow: 0 1px 0 #000, 0 -1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 0 5px #000; }
  .lab .tag i { font-style: normal; color: var(--gold); margin-right: 3px; font-size: 11px; }
  .lab .bub { position: absolute; left: 0; bottom: 100px; width: max-content; max-width: 300px; padding: 5px 11px 6px;
    background: linear-gradient(180deg, rgba(24,20,26,.94), rgba(10,9,12,.94)); border-radius: 9px;
    box-shadow: 0 0 0 1px rgba(205,210,218,.55), 0 4px 10px rgba(0,0,0,.55);
    color: #fbf3e2; font: 400 17px/1.28 var(--cond); text-align: center; overflow-wrap: anywhere; }
  .lab .bub::after { content: ''; position: absolute; left: var(--tail, 50%); bottom: -6px; width: 10px; height: 10px; margin-left: -5px; transform: rotate(45deg);
    background: #0b0a0d; box-shadow: 1px 1px 0 rgba(205,210,218,.55); }
  .lab .bub.below { bottom: auto; top: 26px; }
  .lab .bub.below::after { bottom: auto; top: -6px; box-shadow: -1px -1px 0 rgba(205,210,218,.55); }
  .lab .bub .sb-emote { margin: 0 2px; }
  .ftext { position: absolute; left: 0; bottom: 80px; white-space: nowrap; font: 400 15px var(--deco); color: #ffe066; pointer-events: none;
    text-shadow: 0 0 6px rgba(255,120,200,.9), 0 1px 0 #000, 0 0 3px #000; animation: ftext 1.9s ease-out forwards; }
  .ftext.cool { color: #bff6ff; text-shadow: 0 0 6px rgba(80,220,255,.8), 0 1px 0 #000, 0 0 3px #000; }
  @keyframes ftext { 0% { opacity: 0; transform: translate(-50%, 8px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -40px); } }
  .tkt { position: absolute; left: 0; top: 0; width: 20px; height: 12px; margin: -6px 0 0 -10px; pointer-events: none; }

  /* ---------- title (night sky, top centre) ---------- */
  #title { position: absolute; left: 700px; top: 22px; width: 820px; text-align: center; pointer-events: none; }
  #title .kick { font: 400 22px/1 var(--bebas); letter-spacing: 7px; color: #8ef0ff; text-shadow: 0 2px 6px #000; }
  #title .neon { margin-top: 0; font: 400 104px/1.02 var(--script); color: #ffe6f4; white-space: nowrap; letter-spacing: 1px;
    text-shadow: 0 0 2px #fff, 0 0 8px #ff4fb4, 0 0 20px #ff2aa0, 0 0 42px #ff2aa0, 0 0 70px rgba(150,60,255,.7); }
  #title .sub { margin-top: 2px; font: 600 22px/1.2 var(--cond); letter-spacing: 5px; text-transform: uppercase; color: #bff8ff; text-shadow: 0 2px 6px #000, 0 0 12px rgba(0,0,0,.8); }
  #title .info { margin-top: 12px; display: inline-flex; align-items: center; gap: 16px; padding: 5px 18px 4px; border-radius: 20px;
    background: linear-gradient(180deg, rgba(28,18,48,.9), rgba(8,8,16,.9)); box-shadow: 0 0 0 2px #9aa1ab, 0 0 0 3px #2a2d33, 0 0 16px rgba(170,80,255,.35), 0 6px 16px rgba(0,0,0,.6);
    font: 400 24px/1.1 var(--bebas); letter-spacing: 2px; color: #f3e6c8; white-space: nowrap; }
  #title .info .clk { color: var(--cyan); text-shadow: 0 0 8px rgba(122,244,255,.6); }
  #title .info .dot { width: 6px; height: 6px; border-radius: 50%; background: #ff3db4; box-shadow: 0 0 8px #ff3db4; }

  #combo { position: absolute; left: 1080px; top: 330px; display: flex; align-items: center; gap: 14px; white-space: nowrap; pointer-events: none;
    font: 400 62px var(--script); color: #fff0fb; text-shadow: 0 0 8px #ff4fb4, 0 0 22px #ff2aa0, 0 0 40px rgba(120,60,255,.8), 0 3px 0 #000;
    transform: translate(-50%, -50%) scale(.6); opacity: 0; transition: opacity .3s, transform .3s cubic-bezier(.2,1.6,.4,1); }
  #combo.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* ---------- chat panel: chrome bezel, dark enamel ---------- */
  #chatpanel { position: absolute; left: 1570px; top: 22px; width: 332px; height: 604px; border-radius: 14px; padding: 6px;
    background: var(--chrome); box-shadow: 0 0 0 1px #24272d, 0 14px 34px rgba(0,0,0,.75), 0 0 40px rgba(255,60,110,.08); }
  #chatpanel .enamel { position: absolute; inset: 6px; border-radius: 9px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 0%, rgba(170,80,255,.16), transparent 60%), linear-gradient(180deg, #120f1f, #07070c);
    box-shadow: inset 0 0 0 1px #000, inset 0 2px 14px rgba(0,0,0,.9); }
  #chatpanel .hd { position: absolute; left: 0; right: 0; top: 0; height: 50px; display: flex; align-items: center; justify-content: center; gap: 12px;
    font: 400 30px/1 var(--bebas); letter-spacing: 6px; color: #e8fdff; text-shadow: 0 0 6px #3ae8ff, 0 0 16px #3ae8ff;
    border-bottom: 2px solid #ff3db4; box-shadow: 0 2px 10px rgba(255,61,180,.35); background: linear-gradient(#211836, #0e0c18); }
  #chatpanel .hd i { width: 8px; height: 8px; border-radius: 50%; background: #ff3db4; box-shadow: 0 0 8px #ff3db4; }
  #chatpanel .rv { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #6b717a 70%); }
  #chat { left: 12px; right: 12px; top: 60px; bottom: 10px; }
  #chat .sb-chat-line { font: 400 19px/1.38 var(--cond); }

  /* ?green=off: a changeable-letter marquee board */
  #green.off { background: linear-gradient(180deg, #fbfbf4, #e9ece6); padding: 14px 22px; display: flex; flex-direction: column; gap: 3px; overflow: hidden;
    box-shadow: inset 0 0 0 3px #1a1a22, inset 0 0 40px rgba(120,160,255,.25); }
  #green .ih { font: 400 40px/1 var(--script); color: #e0168a; text-shadow: 0 0 6px rgba(255,60,180,.35); margin-bottom: 2px; }
  #green .ir { display: flex; justify-content: space-between; gap: 14px; padding: 2px 8px; white-space: nowrap;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,.08) 0 2px, transparent 2px 30px);
    font: 400 24px/1.12 var(--bebas); letter-spacing: 2px; color: #101018; }
  #green .ir span:first-child { overflow: hidden; text-overflow: ellipsis; }
  #green .ir .gold { color: #b0106c; }
  #green .ir.dim { color: #4a4f5c; }

  /* 90s bits */
  .ticker { position: absolute; left: 0; top: 0; width: 54px; height: 13px; overflow: hidden; transform-origin: 0 0;
    background: #120406; box-shadow: 0 0 0 1px #3a3d44; }
  .ticker span { position: absolute; left: 0; top: 0; white-space: nowrap; font: 400 12px/13px var(--bebas); letter-spacing: 1px; color: #ff4a2a;
    text-shadow: 0 0 3px #ff2a10; animation: tick 11s linear infinite; }
  .ticker::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(0,0,0,.45) 0 1px, transparent 1px 2px); }
  @keyframes tick { from { transform: translateX(54px); } to { transform: translateX(-100%); } }
  .w .carry.bb { width: 30px; height: 18px; }
  .note { position: absolute; left: 0; bottom: 70px; font: 700 16px/1 var(--cond); color: #ff7ad0; text-shadow: 0 0 5px #ff2aa0, 0 1px 0 #000;
    pointer-events: none; animation: note 1.6s ease-out forwards; }
  .note.c { color: #7af4ff; text-shadow: 0 0 5px #3ae8ff, 0 1px 0 #000; }
  @keyframes note { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx, 14px), -46px) rotate(18deg); } }
  .ring { position: absolute; left: 0; top: 0; font: 400 18px/1 var(--deco); color: #fff36a; white-space: nowrap; pointer-events: none;
    text-shadow: 0 0 6px #ffb400, 0 1px 0 #000, 0 0 3px #000; transform: translate(-50%, -100%); animation: ring .12s ease-in-out infinite alternate; }
  @keyframes ring { from { margin-left: -3px; } to { margin-left: 3px; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" class="layer"></canvas>
  <canvas id="emit"></canvas>
  <div id="crowd" class="layer"></div>
  <canvas id="glow" class="layer" width="480" height="270"></canvas>
  <canvas id="fx" class="layer" width="960" height="540"></canvas>
  <div id="vig" class="layer"></div>
  <div id="labels" class="layer"></div>
  <div id="title">
    <div class="kick">Intermission · Standby</div>
    <div class="neon" id="t-main">The Roxy</div>
    <div class="sub" id="t-sub">the picture resumes shortly</div>
    <div class="info"><span class="clk" id="t-clock">--:--</span><span class="dot"></span><span id="t-next">Next show · TBA</span></div>
  </div>
  <div id="combo"></div>
  <div id="chatpanel">
    <div class="enamel">
      <div class="hd"><i></i>LOBBY CHAT<i></i></div>
      <div id="chat"></div>
    </div>
    <div class="rv" style="left:9px;top:9px"></div><div class="rv" style="right:9px;top:9px"></div>
    <div class="rv" style="left:9px;bottom:9px"></div><div class="rv" style="right:9px;bottom:9px"></div>
  </div>
  <div id="green"></div>
</div>

<script src="shared/core.js"></script>
<script src="shared/cinema.js"></script>
<script src="shared/live.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const h = (tag, cls, ...kids) => { const el = document.createElement(tag); if (cls) el.className = cls; el.append(...kids); return el; };
  const { rand, pick } = SB;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const TAU = Math.PI * 2;
  const now = () => performance.now();
  const wob = (t) => (Math.sin(t) + Math.sin(t * 1.73 + 1.3) * 0.6 + Math.sin(t * 2.91 + 0.7) * 0.3) / 1.9;
  function mulberry(seed) {
    return () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  SB.mountStage($('stage'));
  if (!q.has('f')) SB.cfg.f = '3';
  SB.mountChat($('chat'), { emoteHeight: 24, max: 30 });
  const HAS_CHAT = SB.cfg.chat !== 'off';
  const green = $('green');
  if (!HAS_CHAT) $('chatpanel').remove();
  if (SB.cfg.title) $('t-main').textContent = SB.cfg.title;
  if (SB.cfg.sub) $('t-sub').textContent = SB.cfg.sub;
  {
    const el = $('t-main');
    for (let fs = 84; fs > 30 && el.scrollWidth > 820; fs -= 4) el.style.fontSize = `${fs}px`;
  }

  // ======================================================================
  // Isometric world. u runs down-right along the street, v down-left towards
  // the viewer, z is height in px. The storefront is the line v = 0: v > 0 is
  // the street, v < 0 the lobby.
  // ======================================================================
  const W = 1920;
  const H = 1080;
  const OX = 179;
  const OY = 467;
  const P = (u, v, z = 0) => [OX + (u - v) * 32, OY + (u + v) * 16 - z];
  const FRAME = { x: 14, y: 2, w: 646, h: 408 };     // the board + its frame
  const CURB = 4.6;
  const FAR = 10.6;
  const ROADZ = -5;
  const CAN = { u0: 0, u1: 13, v1: 3.4, z0: 172, z1: 232 };
  const NEON_S = -96;          // "Roxy" script on the marquee's side face
  const NEON_Z = 186;
  const NEON_FONT = '400 40px Yellowtail, "Brush Script MT", cursive';
  const PHONE_P = [20.5, 4.35];
  const NEWSBOX_P = [25.8, 1.0];
  const KIO = { u0: 4.4, u1: 6.2, v0: 1.2, v1: 2.8 };
  const BWV = -6.5;           // lobby back wall
  const ENDU = 14;            // lobby end wall
  const WH = 300;             // lobby wall height
  const ENT = { u0: 16.6, u1: 18.9, out: [17.75, 0.6], in: [17.75, -1.05], ang: 0 };
  const LAMP = [24, 4.85];

  const PUDDLES = [

  // ---------- canvas helpers (every canvas knows its stage offset and pixel scale) ----------
  function mkCtx(el, w, hh, ox = 0, oy = 0) {
    el.style.position = 'absolute';
    el.style.left = `${ox}px`;
    el.style.top = `${oy}px`;
    const c = SB.fitCanvas(el, w, hh);
    c._w = w; c._h = hh; c._ox = ox; c._oy = oy; c._k = el.width / w;
    SB.on('resize', () => { c._k = el.width / w; });
    return c;
  }
  function offCtx(w, hh, k, ox = 0, oy = 0) {
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(w * k));
    cv.height = Math.max(1, Math.round(hh * k));

    return c;

  function ident(c) { const k = c._k; c.setTransform(k, 0, 0, k, -k * c._ox, -k * c._oy); }
  function plane(c, a, b, cc, d, e, f) { const k = c._k; c.setTransform(k * a, k * b, k * cc, k * d, k * (e - c._ox), k * (f - c._oy)); }
  // Floor at height z, coordinates in world units (u, v).
  const floorP = (c, z = 0) => plane(c, 32, 16, -32, 16, OX, OY - z);
  // Wall along u at v0, coordinates (s = 32u, -z). mir: mirrored in the wet ground.
  const wallU = (c, v0, mir = false) => plane(c, 1, 0.5, 0, mir ? -1 : 1, OX - 32 * v0, OY + 16 * v0);
  // Wall along v at u0 (faces +u), coordinates (s = -32v, -z).
  const wallV = (c, u0, mir = false) => plane(c, 1, -0.5, 0, mir ? -1 : 1, OX + 32 * u0, OY + 16 * u0);
  function poly(c, pts, fill, stroke, lw = 1) {
    c.beginPath();
    pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
    c.closePath();
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); }
  }
  function lg(c, x0, y0, x1, y1, stops) {
    const g = c.createLinearGradient(x0, y0, x1, y1);
    stops.forEach(([o, col]) => g.addColorStop(o, col));
    return g;
  }
  function rg(c, x, y, r0, r1, stops) {
    const g = c.createRadialGradient(x, y, r0, x, y, r1);
    stops.forEach(([o, col]) => g.addColorStop(o, col));
    return g;
  }
  const CHROME = [[0, '#f2f4f7'], [0.35, '#9aa1ab'], [0.5, '#4f5560'], [0.68, '#c9ced6'], [1, '#737a84']];

  // ---------- procedural textures, made once ----------
  function valueNoise(size, seed, octaves, base) {
    const rnd = mulberry(seed);
    const acc = new Float32Array(size * size);
    let amp = 1;
    let tot = 0;
    const sm = (t) => t * t * (3 - 2 * t);
    for (let o = 0; o < octaves; o++) {
      const g = base << o;
      const vals = new Float32Array(g * g).map(() => rnd());
      for (let y = 0; y < size; y++) {
        const fy = (y / size) * g;
        const y0 = Math.floor(fy);
        const ty = sm(fy - y0);
        const y1 = (y0 + 1) % g;
        for (let x = 0; x < size; x++) {
          const fx = (x / size) * g;
          const x0 = Math.floor(fx);
          const tx = sm(fx - x0);
          const x1 = (x0 + 1) % g;
          const a = lerp(vals[y0 * g + x0], vals[y0 * g + x1], tx);
          const b = lerp(vals[y1 * g + x0], vals[y1 * g + x1], tx);
          acc[y * size + x] += lerp(a, b, ty) * amp;
        }
      }
      tot += amp;
      amp *= 0.55;
    }
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const c = cv.getContext('2d');
    const img = c.createImageData(size, size);
    for (let i = 0; i < acc.length; i++) {
      const v = clamp((acc[i] / tot - 0.5) * 1.6 + 0.5, 0, 1) * 255;
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
      img.data[i * 4 + 3] = 255;
    }
    c.putImageData(img, 0, 0);
    return cv;
  }
  function grainTex(size, seed) {
    const rnd = mulberry(seed);
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const c = cv.getContext('2d');
    const img = c.createImageData(size, size);
    for (let i = 0; i < size * size; i++) {
      const v = 128 + (rnd() - 0.5) * 200;
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
      img.data[i * 4 + 3] = 255;
    }
    c.putImageData(img, 0, 0);
    return cv;
  }
  const NOISE = valueNoise(256, 11, 6, 4);
  const NOISE2 = valueNoise(256, 37, 5, 8);
  const GRAIN = grainTex(128, 5);
  function texture(c, img, scale, alpha, op, fill) {
    c.save();
    const p = c.createPattern(img, 'repeat');
    p.setTransform(new DOMMatrix().scaleSelf(scale, scale));
    c.globalAlpha = alpha;
    c.globalCompositeOperation = op;
    c.fillStyle = p;
    fill();
    c.restore();
  }

  // Carpet tile: 2 x 2 world units, 128 px per unit. 90s multiplex confetti.
  const CARPET = (() => {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 256;
    const c = cv.getContext('2d');
    c.fillStyle = '#15113a';
    c.fillRect(0, 0, 256, 256);
    const rnd = mulberry(90);
    const cols = ['#19c6c0', '#e8338f', '#f2c935', '#8a4fe0', '#3a7bff'];
    const shapes = [];
    for (let i = 0; i < 44; i++) shapes.push({ x: rnd() * 256, y: rnd() * 256, k: Math.floor(rnd() * 4), col: cols[Math.floor(rnd() * cols.length)], a: rnd() * TAU, s: 7 + rnd() * 9 });
    for (const sh of shapes) {
      for (const ox of [-256, 0, 256]) {
        for (const oy of [-256, 0, 256]) {
          const x = sh.x + ox;
          const y = sh.y + oy;
          if (x < -30 || x > 286 || y < -30 || y > 286) continue;
          c.save();
          c.translate(x, y);
          c.rotate(sh.a);
          c.fillStyle = sh.col;
          c.strokeStyle = sh.col;
          c.lineWidth = 3.2;
          c.lineCap = 'round';
          if (sh.k === 0) { c.beginPath(); c.moveTo(0, -sh.s); c.lineTo(sh.s * 0.9, sh.s * 0.6); c.lineTo(-sh.s * 0.9, sh.s * 0.6); c.closePath(); c.fill(); }
          else if (sh.k === 1) {
            c.beginPath();
            for (let t = 0; t <= 1.001; t += 0.1) { const px = -sh.s * 1.4 + t * sh.s * 2.8; const py = Math.sin(t * TAU * 1.2) * sh.s * 0.45; if (t) c.lineTo(px, py); else c.moveTo(px, py); }
            c.stroke();
          } else if (sh.k === 2) { c.beginPath(); c.arc(0, 0, sh.s * 0.55, 0, TAU); c.lineWidth = 2.6; c.stroke(); }

          c.restore();
        }
      }
    }
    c.globalAlpha = 0.75;
    for (let i = 0; i < 170; i++) { c.fillStyle = cols[i % cols.length]; c.fillRect(rnd() * 256, rnd() * 256, 2.6, 2.6); }
    c.globalAlpha = 1;
    return cv;
  })();

  // Soft round light sprite.
  const sprites = new Map();
  function glowSpr(rgb) {
    if (sprites.has(rgb)) return sprites.get(rgb);

  const WARM = '255,178,92';

  function drawSkyline(c) {
    ident(c);
    const rnd = mulberry(21);
    const layers = [
      { top: [250, 360], col: '#141a34', edge: '#1d2547', win: 0.06, ww: 2, wh: 3, wa: 0.45 },
      { top: [320, 460], col: '#0b0f21', edge: '#151b36', win: 0.09, ww: 3, wh: 4, wa: 0.7 },
    ];
    for (const L of layers) {
      let x = 600 + rnd() * 40;

        const w = 46 + rnd() * 120;
        const top = L.top[0] + rnd() * (L.top[1] - L.top[0]);
        c.fillStyle = lg(c, 0, top, 0, 800, [[0, L.edge], [0.08, L.col], [1, L.col]]);

  // ---------- street: far sidewalk, wet asphalt, curb, sidewalk ----------
  function slabs(c, v0, v1, n, size, rnd, tone) {
    const dv = (v1 - v0) / n;
    for (let u = -24; u < 70; u += size) {
      for (let j = 0; j < n; j++) {
        const v = v0 + j * dv;
        const [x, y] = P(u + size / 2, v + dv / 2);
        if (x < -80 || x > 2000 || y < 280 || y > 1160) continue;
        const l = rnd();
        c.fillStyle = l < 0.5 ? `rgba(255,255,255,${(0.5 - l) * 0.07})` : `rgba(0,0,0,${(l - 0.5) * 0.16})`;
        c.fillRect(u, v, size, dv);
      }
    }
    c.lineWidth = 0.05;
    c.strokeStyle = 'rgba(5,6,9,.65)';
    c.beginPath();
    for (let j = 0; j <= n; j++) { c.moveTo(-24, v0 + j * dv); c.lineTo(70, v0 + j * dv); }
    for (let u = -24; u < 70; u += size) { c.moveTo(u, v0); c.lineTo(u, v1); }

    c.strokeStyle = `rgba(200,210,230,${tone})`;

  // Mirrored light sources for the wet ground (z -> -z), blurred and smeared.
  function drawMirrorSources(r) {
    const M = (u, v, z) => P(u, v, -z);

    wallU(r, 0, true);
    for (let u = ENDU; u < 42; u += 2) {

    }

    { const [x, y] = M(LAMP[0], LAMP[1], 236); blob(r, x, y, 34, AMBER, 1); blob(r, x, y, 12, '255,240,210', 1); }
    // the board's neon frame

  function puddlePath(c, p) {
    c.beginPath();
    for (let i = 0; i <= 28; i++) {
      const a = (i / 28) * TAU;
      const k = puddleR(p, a);
      const u = p.u + Math.cos(a) * p.ru * k;
      const v = p.v + Math.sin(a) * p.rv * k;
      if (i) c.lineTo(u, v); else c.moveTo(u, v);
    }
    c.closePath();
  }

  function drawWet(c) {
    const rk = Math.max(0.5, c._k * 0.5);
    const r = offCtx(W, H, rk);
    drawMirrorSources(r);
    const b = offCtx(W, H, rk);
    b.filter = `blur(${Math.round(4 * rk)}px)`;
    b.drawImage(r.canvas, 0, 0);
    const b2 = offCtx(W, H, rk);
    b2.filter = `blur(${Math.round(1.5 * rk)}px)`;
    b2.drawImage(r.canvas, 0, 0);
    // general wet sheen on all outdoor ground, smeared vertically like real wet asphalt
    c.save();
    ident(c);
    c.beginPath();
    const a0 = P(-30, 0);
    const a1 = P(80, 0);
    c.moveTo(a0[0], a0[1]); c.lineTo(a1[0], a1[1]); c.lineTo(2200, 2200); c.lineTo(-400, 2200); c.closePath();
    c.clip();
    c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 8; i++) {
      c.globalAlpha = 0.2 * (1 - i / 8);
      c.drawImage(b.canvas, 0, i * 6, W, H);
    }
    c.restore();
    // puddles: dark sky mirror + crisp reflections + rim
    for (const p of PUDDLES) {
      c.save();
      floorP(c, p.z);
      puddlePath(c, p);
      c.clip();
      ident(c);
      const [px, py] = P(p.u, p.v, p.z);
      const ry = p.rv * 32 + 6;
      c.fillStyle = lg(c, 0, py - ry, 0, py + ry, [[0, 'rgba(58,60,98,.82)'], [0.55, 'rgba(26,28,52,.8)'], [1, 'rgba(12,13,26,.82)']]);
      c.fillRect(0, 0, W, H);
      c.fillStyle = lg(c, px - 60, py - 20, px + 60, py + 20, [[0, 'rgba(160,170,220,0)'], [0.45, 'rgba(160,170,220,.12)'], [0.55, 'rgba(160,170,220,.12)'], [1, 'rgba(160,170,220,0)']]);
      c.fillRect(0, 0, W, H);
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = 0.95;
      c.drawImage(b2.canvas, 0, 0, W, H);
      c.globalAlpha = 0.5;
      c.drawImage(b.canvas, 0, 3, W, H);
      c.restore();
      floorP(c, p.z);
      puddlePath(c, p);
      c.lineWidth = 0.1;
      c.strokeStyle = 'rgba(0,0,0,.3)';
      c.stroke();
      c.lineWidth = 0.03;
      c.strokeStyle = 'rgba(170,185,225,.18)';
      c.stroke();
    }
  }

  // Baked pools of light on the ground.
  function drawGroundLight(c) {
    c.save();
    c.globalCompositeOperation = 'lighter';
    floorP(c, 0);
    const pool = (u, v, r, rgb, a) => {
      c.fillStyle = rg(c, u, v, 0, r, [[0, `rgba(${rgb},${a})`], [0.5, `rgba(${rgb},${a * 0.4})`], [1, `rgba(${rgb},0)`]]);
      c.fillRect(u - r, v - r, r * 2, r * 2);
    };
    for (let u = 1; u <= 12; u += 1.6) pool(u, 2.0, 3.2, '225,220,255', 0.12);
    pool(10.6, 1.6, 2.6, '190,210,255', 0.12);
    pool(5.3, 2.0, 2.6, AMBER, 0.12);
    pool(10, 3.9, 3.2, PINK, 0.06);
    pool(LAMP[0], LAMP[1], 5.5, AMBER, 0.2);
    pool(LAMP[0], LAMP[1], 2.2, AMBER, 0.12);
    // light from the storefront spilling onto the sidewalk
    for (let u = ENDU; u < 42; u += 2) {
      c.fillStyle = lg(c, 0, 0, 0, 2.6, [[0, 'rgba(255,186,110,.16)'], [1, 'rgba(255,186,110,0)']]);

    }
    floorP(c, ROADZ);
    pool(LAMP[0] + 0.5, LAMP[1] + 1.5, 4.5, AMBER, 0.08);
    c.restore();
    // contact shadow of the kiosk and the lamp

    c.fillStyle = rg(c, 5.3, 2.0, 0, 1.6, [[0, 'rgba(0,0,0,.5)'], [1, 'rgba(0,0,0,0)']]);
    c.fillRect(4, -1, 6, 6);
    c.fillStyle = rg(c, LAMP[0], LAMP[1], 0, 0.6, [[0, 'rgba(0,0,0,.6)'], [1, 'rgba(0,0,0,0)']]);
    c.fillRect(LAMP[0] - 1, LAMP[1] - 1, 2, 2);

  // ---------- the lobby ----------

  // 90s multiplex wall: purple field, Memphis-pattern band, neon stripes, black laminate dado.
  function wallSkin(c, s0, s1, rnd) {
    const w = s1 - s0;
    c.fillStyle = lg(c, 0, -300, 0, -50, [[0, '#120c26'], [0.5, '#251650'], [1, '#2f1c5c']]);
    c.fillRect(s0, -300, w, 250);
    for (let s = Math.floor(s0 / 96) * 96; s < s1; s += 96) {
      c.fillStyle = 'rgba(0,0,0,.28)';
      c.fillRect(s, -262, 2, 212);
      c.fillStyle = 'rgba(255,255,255,.04)';
      c.fillRect(s + 2, -262, 1, 212);
    }
    c.fillStyle = '#0d0a1c';
    c.fillRect(s0, -264, w, 32);
    const r2 = mulberry(Math.round(s0) + 3);
    const cols = ['#19c6c0', '#e8338f', '#f2c935', '#8a4fe0'];
    for (let s = s0 + 6; s < s1; s += 13 + r2() * 10) {
      const col = cols[Math.floor(r2() * 4)];
      const z = -248 + (r2() - 0.5) * 14;
      c.fillStyle = col;
      c.strokeStyle = col;
      c.lineWidth = 2;
      const k = Math.floor(r2() * 3);
      if (k === 0) { c.beginPath(); c.moveTo(s, z - 6); c.lineTo(s + 6, z + 5); c.lineTo(s - 6, z + 5); c.closePath(); c.fill(); }
      else if (k === 1) { c.beginPath(); c.moveTo(s - 7, z); c.quadraticCurveTo(s - 3, z - 7, s, z); c.quadraticCurveTo(s + 3, z + 7, s + 7, z); c.stroke(); }
      else { c.beginPath(); c.arc(s, z, 3.4, 0, TAU); c.fill(); }
    }
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = lg(c, 0, -284, 0, -252, [[0, 'rgba(60,220,255,0)'], [0.5, 'rgba(60,220,255,.32)'], [1, 'rgba(60,220,255,0)']]);
    c.fillRect(s0, -284, w, 32);
    c.fillStyle = lg(c, 0, -72, 0, -34, [[0, 'rgba(255,60,180,0)'], [0.5, 'rgba(255,60,180,.3)'], [1, 'rgba(255,60,180,0)']]);
    c.fillRect(s0, -72, w, 38);
    c.restore();
    c.fillStyle = '#b8fbff';
    c.fillRect(s0, -268, w, 2);
    c.fillStyle = '#ffb0e0';
    c.fillRect(s0, -53, w, 2);
    c.fillStyle = lg(c, 0, -48, 0, 0, [[0, '#1d1d26'], [1, '#0b0b10']]);
    c.fillRect(s0, -48, w, 48);
    c.fillStyle = lg(c, 0, -50, 0, -47, CHROME);
    c.fillRect(s0, -50, w, 3);
    c.fillStyle = 'rgba(255,255,255,.05)';
    for (let s = Math.floor(s0 / 48) * 48; s < s1; s += 48) c.fillRect(s, -44, 1, 40);
    c.fillStyle = '#050508';
    c.fillRect(s0, -5, w, 5);
    c.fillStyle = '#08070e';
    c.fillRect(s0, -300, w, 28);
    c.fillStyle = lg(c, 0, -274, 0, -271, CHROME);
    c.fillRect(s0, -274, w, 3);
    texture(c, NOISE, 1.2, 0.35, 'soft-light', () => c.fillRect(s0, -300, w, 300));
    c.fillStyle = lg(c, 0, -26, 0, 0, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,.55)']]);
    c.fillRect(s0, -26, w, 26);
    void rnd;
  }

  // Wall spot: a black can throwing a cone of light down the wall.
  function sconce(c, s, z) {
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = rg(c, s, -z + 10, 0, 95, [[0, 'rgba(215,205,255,.4)'], [0.4, 'rgba(180,150,255,.15)'], [1, 'rgba(180,150,255,0)']]);
    c.beginPath(); c.moveTo(s - 5, -z); c.lineTo(s - 46, -z + 112); c.lineTo(s + 46, -z + 112); c.lineTo(s + 5, -z); c.closePath(); c.fill();
    c.restore();
    c.fillStyle = '#0b0b10';
    c.fillRect(s - 2, -z - 14, 4, 8);
    c.fillStyle = lg(c, s - 8, 0, s + 8, 0, [[0, '#0b0b10'], [0.4, '#4a4f5a'], [1, '#0b0b10']]);
    c.beginPath(); c.moveTo(s - 6, -z - 8); c.lineTo(s + 6, -z - 8); c.lineTo(s + 8, -z); c.lineTo(s - 8, -z); c.closePath(); c.fill();
    c.fillStyle = '#fff6e6';
    c.fillRect(s - 6, -z - 1, 12, 2);
  }

  function drawBackWall(c) {
    const rnd = mulberry(9);
    const s0 = ENDU * 32;
    const s1 = 56 * 32;
    wallU(c, BWV);
    wallSkin(c, s0, s1, rnd);
    // corner occlusion
    c.fillStyle = lg(c, s0, 0, s0 + 40, 0, [[0, 'rgba(0,0,0,.6)'], [1, 'rgba(0,0,0,0)']]);
    c.fillRect(s0, -300, 40, 300);
    // auditorium doors
    for (const c0 of ROOM_C) {
      const a = (c0 - 2.15) * 32;
      const b = (c0 - 0.15) * 32;
      c.fillStyle = 'rgba(0,0,0,.45)';
      c.fillRect(a - 9, -136, b - a + 18, 136);
      c.fillStyle = lg(c, a - 7, 0, b + 7, 0, [[0, '#3d424c'], [0.2, '#c9ced6'], [0.5, '#5d636b'], [0.8, '#b9bec6'], [1, '#2a2d33']]);
      c.fillRect(a - 7, -133, b - a + 14, 133);
      c.fillStyle = lg(c, 0, -125, 0, 0, [[0, '#04050a'], [0.65, '#090c18'], [1, '#151d36']]);
      c.fillRect(a, -125, b - a, 125);
      c.fillStyle = rg(c, (a + b) / 2, -10, 0, 40, [[0, 'rgba(110,140,230,.35)'], [1, 'rgba(110,140,230,0)']]);
      c.fillRect(a, -60, b - a, 60);
      c.fillStyle = '#05060b';
      for (let i = 0; i < 5; i++) { c.beginPath(); c.arc(a + 7 + i * 12.5, -16, 5, Math.PI, TAU); c.fill(); }
      // poster lightbox glow on the wall

      c.save();
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = rg(c, p0 + 35, -70, 10, 85, [[0, 'rgba(200,225,255,.24)'], [1, 'rgba(200,225,255,0)']]);

      c.restore();
    }
    // restroom door opening (tiled, lit)
    {
      const a = RR.u0 * 32;
      const b = RR.u1 * 32;

      c.fillRect(a - 5, -120, b - a + 10, 120);
      c.fillStyle = lg(c, 0, -115, 0, 0, [[0, '#7d9592'], [1, '#c3d2cc']]);
      c.fillRect(a, -115, b - a, 115);
      c.strokeStyle = 'rgba(40,60,60,.35)';
      c.lineWidth = 1;
      for (let z = 8; z < 115; z += 9) { c.beginPath(); c.moveTo(a, -z); c.lineTo(b, -z); c.stroke(); }
      for (let s = a + 9; s < b; s += 9) { c.beginPath(); c.moveTo(s, 0); c.lineTo(s, -115); c.stroke(); }
    }
    for (const s of SCONCES) sconce(c, s * 32, 168);
    sconce(c, 14.9 * 32, 168);
    // the wall is cut away: its top shows as a dark section
    floorP(c, WH);
    c.fillStyle = '#0a0812';
    c.fillRect(ENDU - 0.35, BWV - 0.38, 50, 0.38);
    c.fillStyle = 'rgba(122,244,255,.4)';
    c.fillRect(ENDU, BWV - 0.02, 50, 0.03);
    // thresholds
    floorP(c, 0);
    for (const c0 of ROOM_C) {
      c.fillStyle = lg(c, 0, BWV, 0, BWV + 0.25, [[0, '#c9ced6'], [1, '#3d424c']]);
      c.fillRect(c0 - 2.15, BWV, 2.0, 0.22);
    }
  }

  function drawCounter(c) {
    const u0 = ENDU;
    const u1 = 15.2;
    const v0 = -5.3;
    const v1 = -1.8;
    const zc = 42;

    const sa = -v1 * 32;

    c.fillRect(sa + 6, -36, sb - sa - 12, 24);

    for (let s = sa + 9; s < sb - 12; s += 9) {
      for (const z of [-33, -22]) {

    c.fillStyle = lg(c, 0, -40, 0, -36, CHROME);
    c.fillRect(sa, -40, sb - sa, 4);
    c.fillStyle = lg(c, 0, -10, 0, -6, CHROME);
    c.fillRect(sa, -10, sb - sa, 4);
    c.fillStyle = '#0a0506';
    c.fillRect(sa, -5, sb - sa, 5);
    c.fillStyle = '#ff6fc8';
    c.fillRect(sa, -8, sb - sa, 1.5);
    c.fillStyle = '#6ff3ff';
    c.fillRect(sa, -42.5, sb - sa, 1.5);
    // side (+v) face
    wallU(c, v1);

  // ---------- the marquee ----------
  function marqueeRows() {
    const t = rooms.map((r, i) => `${i + 1} ${(r.title || '').toUpperCase()}`);
    return [`${t[0]}   ${t[1]}`, `${t[2]}   ${t[3]}`, `${t[4]}`];
  }
  function drawCanopy(c) {
    const { u0, u1, v1, z0, z1 } = CAN;
    floorP(c, z1);
    c.fillStyle = '#17191e';
    c.fillRect(u0, 0, u1 - u0, v1);

    c.fillStyle = lg(c, 0, v1 - 0.12, 0, v1, CHROME);
    c.fillRect(u0, v1 - 0.12, u1 - u0, 0.12);
    c.fillStyle = lg(c, u1 - 0.12, 0, u1, 0, CHROME);
    c.fillRect(u1 - 0.12, 0, 0.12, v1);
    const fascia = (s0, s1) => {
      const w = s1 - s0;
      c.fillStyle = '#0d0b16';
      c.fillRect(s0, -z1, w, z1 - z0);
      c.fillStyle = lg(c, 0, -z1, 0, -(z1 - 3), CHROME);
      c.fillRect(s0, -z1, w, 3);
      c.fillStyle = lg(c, 0, -(z0 + 3), 0, -z0, CHROME);
      c.fillRect(s0, -(z0 + 3), w, 3);
      c.fillStyle = lg(c, 0, -(z1 - 8), 0, -(z0 + 8), [[0, '#3c1a6e'], [1, '#170932']]);
      c.fillRect(s0, -(z1 - 8), w, z1 - z0 - 16);
    };
    wallU(c, v1);
    fascia(u0 * 32, u1 * 32);
    // backlit changeable-letter board with this week's films
    const b0 = 8.1 * 32;
    const b1 = 12.85 * 32;
    const bz0 = z0 + 10;
    const bz1 = z1 - 10;
    c.fillStyle = lg(c, 0, -bz1, 0, -bz0, [[0, '#ffffff'], [1, '#dde6f4']]);

    marqueeRows().forEach((txt, i) => {
      const top = bz1 - rowH * i;

      const w = c.measureText(txt).width;
      const avail = b1 - b0 - 8;
      c.save();
      c.translate(b0 + 4, -(top - rowH + 2.6));
      if (w > avail) c.scale(avail / w, 1);
      c.fillStyle = '#101018';
      c.fillText(txt, 0, 0);
      c.restore();
    });
    c.strokeStyle = '#0b0b12';
    c.lineWidth = 2;
    c.strokeRect(b0, -bz1, b1 - b0, bz1 - bz0);
    // side face: "Roxy" neon script (lit tubes live on the emit layer)
    wallV(c, u1);

  const BOARD_BULBS = [];

  {
    const inFrame = (x, y) => x > FRAME.x - 4 && x < FRAME.x + FRAME.w + 4 && y > FRAME.y - 4 && y < FRAME.y + FRAME.h + 6;

  function roundRectPath(c, x, y, w, hh, r) {
    c.beginPath();

    c.arcTo(x + w, y + hh, x, y + hh, r);
    c.arcTo(x, y + hh, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();

  function drawFacade(c) {
    c.clearRect(0, 0, c.canvas.width, c.canvas.height);

    const s0 = ENDU * 32;
    const s1 = 42 * 32;
    const e0 = ENT.u0 * 32;
    const e1 = ENT.u1 * 32;
    const rnd = mulberry(31);
    // kick plate
    c.fillStyle = lg(c, 0, -18, 0, 0, [[0, '#1f232b'], [0.4, '#0b0c10'], [1, '#14161b']]);
    c.fillRect(s0, -18, s1 - s0, 18);
    c.fillStyle = 'rgba(255,255,255,.08)';
    c.fillRect(s0, -16, s1 - s0, 1);
    c.fillStyle = lg(c, 0, -21, 0, -18, CHROME);
    c.fillRect(s0, -21, s1 - s0, 3);
    // glass panes
    for (let s = s0; s < s1; s += 64) {
      const a = s + 2;
      const b = s + 62;
      if (b > e0 && a < e1) continue;
      c.fillStyle = lg(c, 0, -106, 0, -21, [[0, 'rgba(150,175,215,.2)'], [0.5, 'rgba(140,165,205,.1)'], [1, 'rgba(160,180,215,.16)']]);
      c.fillRect(a, -106, b - a, 85);
      c.save();
      c.beginPath(); c.rect(a, -106, b - a, 85); c.clip();
      c.fillStyle = 'rgba(255,255,255,.07)';
      const k = rnd() * 30;
      poly(c, [[a + k, -21], [a + k + 14, -21], [a + k + 44, -106], [a + k + 30, -106]], 'rgba(255,255,255,.06)');
      poly(c, [[a + k + 18, -21], [a + k + 22, -21], [a + k + 52, -106], [a + k + 48, -106]], 'rgba(255,255,255,.05)');
      c.fillStyle = lg(c, 0, -40, 0, -21, [[0, 'rgba(190,200,220,0)'], [1, 'rgba(190,200,220,.1)']]);
      c.fillRect(a, -40, b - a, 19);
      for (let i = 0; i < 26; i++) { // raindrops on the glass

    c.fillRect(s0, -124, s1 - s0, 18);
    c.fillStyle = lg(c, 0, -108, 0, -104, CHROME);
    c.fillRect(s0, -108, s1 - s0, 4);
    c.fillStyle = lg(c, 0, -126, 0, -122, CHROME);
    c.fillRect(s0, -126, s1 - s0, 4);

    for (let s = s0 + 40; s < s1; s += 64) {

    c.shadowColor = '#ffb040';

    c.fillText('ENTRANCE', (e0 + e1) / 2, -109);

    // transom and the cut top of the wall
    floorP(c, 126);

    c.fillStyle = lg(c, sc - 6, 0, sc + 6, 0, [[0, '#e8c87a'], [1, '#6e5226']]);

    c.fillStyle = lg(c, 0, -48, 0, -42, CHROME);
    c.fillRect(sc - 16, -48, 32, 6);
    // corner posts
    ident(c);
    for (const [u, v] of [[u0, v1], [u1, v1], [u1, v0]]) {

    const zs0 = zg + 8;

      c.fillStyle = lg(c, 0, -zs1, 0, -zs0, [[0, '#ffffff'], [1, '#d9e4f4']]);
      c.fillRect(s, -zs1, w, zs1 - zs0);

      c.lineWidth = 2;

      c.fillStyle = '#c0127a';
      c.fillText(text, s + w / 2, -zs0 - 7.5);

    sbox(() => wallV(c, u1), -v1 * 32, (v1 - v0) * 32, '');

      c.fillRect(5.3 - a, 2.0 - b, a * 2, b * 2);

    fin(0.5, 0.45, zs1, zs1 + 6, '#7c838d');
    ident(c);

    c.fillStyle = rg(c, bx - 2, by - 2, 0, 7, [[0, '#ffffff'], [0.5, '#b9bec6'], [1, '#4f5560']]);

  // ---------- emissive layer: chase bulbs + neon, pre-rendered in a few states ----------
  let emitStates = null;
  function bulb(c, x, y, r = 2.4) {
    c.drawImage(glowSpr(AMBER), x - r * 3.4, y - r * 3.4, r * 6.8, r * 6.8);
    c.fillStyle = rg(c, x - 0.5, y - 0.5, 0, r, [[0, '#ffffff'], [0.5, '#fff0c0'], [1, 'rgba(255,190,90,.9)']]);
    c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  }
  function tube(c, path, col, core, w = 3) {
    c.save();
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.shadowColor = col;
    c.shadowBlur = 14 * c._k;
    c.strokeStyle = col;
    c.lineWidth = w;
    path();
    c.stroke();
    c.shadowBlur = 4 * c._k;
    c.strokeStyle = core;
    c.lineWidth = w * 0.45;
    path();
    c.stroke();
    c.restore();
  }
  function neonWord(c, skipX) {
    ident(c);
    const { x, y, w, h: hh } = FRAME;
    tube(c, () => roundRectPath(c, x + 8, y + 8, w - 16, hh - 16, 10), '#ff3db4', '#ffe0f4', 3.4);
    tube(c, () => innerTubePath(c), '#3ae8ff', '#e6fdff', 2.6);
    wallU(c, CAN.v1);
    tube(c, () => { c.beginPath(); c.moveTo(8.0 * 32, -(CAN.z1 - 5)); c.lineTo(CAN.u1 * 32 - 2, -(CAN.z1 - 5)); }, '#3ae8ff', '#e6fdff', 2.6);
    wallV(c, CAN.u1);
    tube(c, () => { c.beginPath(); c.moveTo(-CAN.v1 * 32 + 2, -(CAN.z1 - 5)); c.lineTo(-2, -(CAN.z1 - 5)); }, '#3ae8ff', '#e6fdff', 2.6);
    tube(c, () => { c.beginPath(); c.moveTo(NEON_S - 2, -(NEON_Z - 7)); c.lineTo(-10, -(NEON_Z - 7)); }, '#a04bff', '#f0e0ff', 2.4);
    c.font = NEON_FONT;
    let s = NEON_S;
    for (const ch of ['R', 'o', 'x', 'y']) {
      const cw = c.measureText(ch).width;
      if (!(skipX && ch === 'x')) {
        c.save();
        c.shadowColor = '#ff2aa0';
        c.shadowBlur = 16 * c._k;
        c.lineWidth = 2.6;
        c.strokeStyle = '#ff4fb4';
        c.strokeText(ch, s, -NEON_Z);
        c.shadowBlur = 6 * c._k;
        c.fillStyle = '#ffe6f6';
        c.fillText(ch, s, -NEON_Z);
        c.restore();
      }
      s += cw;
    }

  function buildEmit() {
    const k = emc._k;
    const all = [...BOARD_BULBS, ...CAN_BULBS];
    const phases = [0, 1, 2].map(() => offCtx(EMIT_W, EMIT_H, k));
    all.forEach((b, j) => { const c = phases[j % 3]; ident(c); bulb(c, b.x, b.y); });
    const neonOn = offCtx(EMIT_W, EMIT_H, k);
    neonWord(neonOn, false);
    const neonNoX = offCtx(EMIT_W, EMIT_H, k);
    neonWord(neonNoX, true);
    emitStates = { phases, neonOn, neonNoX };
  }

  function drawEmit(t) {
    if (!emitStates) return;
    const step = Math.floor(t / 150);
    let xOn = true;
    if (t > NEON.nextFlicker) {
      if (!NEON.until) NEON.until = t + rand(700, 1600);
      xOn = Math.sin(t * 0.09) + Math.sin(t * 0.031) > 0.35;
      if (t > NEON.until) { NEON.until = 0; NEON.nextFlicker = t + rand(8000, 20000); xOn = true; }
    }
    const key = step * 2 + (xOn ? 1 : 0);
    NEON.on = xOn;
    if (key === lastEmit) return;
    lastEmit = key;
    chaseStep = step;
    const c = emc;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, c.canvas.width, c.canvas.height);
    c.drawImage(xOn ? emitStates.neonOn.canvas : emitStates.neonNoX.canvas, 0, 0);
    for (let i = 0; i < 3; i++) if (i !== step % 3) c.drawImage(emitStates.phases[i].canvas, 0, 0);
  }

  const PHONE = { next: now() + rand(20000, 40000), until: 0, el: null, label: null };
  const SKATE = { active: false, next: now() + rand(12000, 26000), u: -6, v: 12.15, el: null, bod: null, ph: 0 };
  function startSkater() {
    const name = Cinema.defaultEmote(`skater${Math.random()}`);
    if (!name) return;
    const el = h('div', 'w');
    const bod = h('div', 'bod');

  const PAPER = { active: false, next: now() + rand(25000, 45000), u: -3, v: 7, z: 0, rot: 0, vu: 0 };
  const LIGHTNING = { next: now() + rand(40000, 80000), t0: 0, f: 0 };
  function stepAmbient(t, dt) {
    // car
    if (!CAR.active && t > CAR.next) {
      CAR.active = true;
      CAR.u = -6;
      CAR.spd = 7;
      CAR.wait = 0;
      CAR.variant = Math.random() < 0.28 ? 3 : pick([0, 1, 2, 4, 5]);
      drawCar(CAR.c, CAR_COLORS[CAR.variant]);
      CAR.el.style.display = '';
    }
    if (CAR.active) {
      const front = CAR.u + 2.25;
      const onZebra = [...active].some((g) => g.v > CURB && g.v < FAR && g.u > ZEBRA.u0 - 0.6 && g.u < ZEBRA.u1 + 0.6);
      const target = onZebra && front > 6.5 && front < ZEBRA.u0 - 0.4 ? 0 : 7.5;
      CAR.spd += clamp(target - CAR.spd, -14 * dt, 5 * dt);
      if (onZebra && front > ZEBRA.u0 - 0.6 && front < ZEBRA.u0) CAR.spd = Math.min(CAR.spd, 0.3);
      CAR.u += CAR.spd * dt;
      CAR.wait = CAR.spd < 0.5 ? (CAR.wait || 0) + dt : 0;
      const [x, y] = P(CAR.u, CAR.v, ROADZ);
      CAR.el.style.left = `${(x - 115).toFixed(1)}px`;
      CAR.el.style.top = `${(y - 112).toFixed(1)}px`;
      CAR.el.style.zIndex = String(BAND_STREET + Math.round(P(CAR.u, CAR.v + 0.6)[1]));
      if (CAR.u > 44) { CAR.active = false; CAR.el.style.display = 'none'; CAR.next = t + rand(26000, 60000); }
    }
    // payphone rings now and then
    if (t > PHONE.next) {
      PHONE.next = t + rand(45000, 95000);
      PHONE.until = t + 3600;
      const [x, y] = PHONE_XY;
      PHONE.label = h('div', 'ring', 'RING! RING!');
      PHONE.label.style.left = `${x}px`;
      PHONE.label.style.top = `${y - 142}px`;
      labels.append(PHONE.label);
    }
    if (PHONE.until && t < PHONE.until) phonec.canvas.style.transform = `translateX(${(Math.sin(t * 0.09) * 1.4).toFixed(2)}px)`;

      SKATE.el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
      SKATE.bod.style.transform = `translateY(${(-ollie * 22).toFixed(1)}px) rotate(${(ollie * -8).toFixed(1)}deg) scale(${flipOK ? 1 : 1}, 1)`;
      const z = BAND_STREET + Math.round(y);

  // ======================================================================

  const EH = 56;

  const SPAWNS = [

  function makeWalker(w) {
    const sp = SPAWNS[Math.random() < 0.3 ? 2 : pick([0, 1, 3])];

  const later = (g, ms, fn) => { g.tAt = now() + ms; g.tFn = fn; };
  function walk(g, pts, then) { g.path = pts.slice(); g.then = then || null; g.tFn = null; }

  // ---------- street ----------
  function carNearZebra() {
    if (!CAR.active || (CAR.spd < 0.5 && CAR.wait < 2.5)) return false;
    const front = CAR.u + 2.25;
    return front > ZEBRA.u0 - 7 && CAR.u - 2.4 < ZEBRA.u1 + 0.5;
  }
  function crossRoad(g) {
    g.state = 'crossing';
    if (carNearZebra() && !g.hurry) { later(g, 350, () => crossRoad(g)); return; }
    walk(g, [[ZEBRA.near[0] + rand(-0.5, 0.5), ZEBRA.near[1] + rand(-0.1, 0.2)]], () => arriveSidewalk(g));
  }
  function arriveSidewalk(g) {
    if (g.hurry || g.ticket || queue.length >= SKIP_AT) {
      if (!g.ticket) { g.ticket = true; carry(g, 'tk'); floatText(g, queue.length >= SKIP_AT ? 'bought online' : 'has a ticket', 'cool'); }
      toEntrance(g);
    } else joinQueue(g);
  }
  function slotPos(k) { return k === 0 ? [5.3, 3.42] : [6.75 + 1.55 * (k - 1), 3.98]; }
  function joinQueue(g) { g.state = 'queue'; g.qIdx = -1; queue.push(g); retargetQueue(); }
  function retargetQueue() {
    queue.forEach((g, k) => {
      if (g.qIdx === k) return;
      g.qIdx = k;
      g.atSlot = false;
      const [u, v] = slotPos(k);
      const pts = [];
      if (k === 0 && g.u > 6.0) pts.push([6.4, 3.6]);
      pts.push([u + (k ? rand(-0.1, 0.1) : 0), v + (k ? rand(-0.06, 0.06) : 0)]);
      walk(g, pts, () => { g.atSlot = true; g.facing = -1; });
    });
  }
  let serving = null;
  function stepQueue(t) {
    const g = queue[0];
    if (!g) { serving = null; return; }
    if (!g.atSlot) return;
    if (!serving || serving.g !== g) {
      const dur = clamp(2300 - queue.length * 230, 650, 2300);
      serving = { g, at: t + dur, handed: false };
      return;
    }
    if (!serving.handed && t >= serving.at) {
      serving.handed = true;
      CLERK.hop = 1;
      handTicket(g);
      later(g, 450, () => { queue.shift(); retargetQueue(); serving = null; toEntrance(g); });
      g.state = 'served';
    }
  }
  function handTicket(g) {
    const tk = h('div', 'tkt');
    tk.style.backgroundImage = TKT_URL;
    tk.style.backgroundSize = '100% 100%';
    labels.append(tk);
    const from = [CLERK.x, CLERK.y - 20];
    const to = [g.x + 10, g.y - 30];
    tk.animate([
      { transform: `translate(${from[0]}px, ${from[1]}px) rotate(-20deg)` },
      { transform: `translate(${(from[0] + to[0]) / 2}px, ${Math.min(from[1], to[1]) - 24}px) rotate(160deg)`, offset: 0.5 },
      { transform: `translate(${to[0]}px, ${to[1]}px) rotate(360deg)` },
    ], { duration: 420, easing: 'ease-in-out' }).onfinish = () => tk.remove();
    setTimeout(() => {
      if (!active.has(g)) return;
      g.ticket = true;
      carry(g, 'tk');
      g.idle = 0.001;
      floatText(g, pick(['Admit one', 'Enjoy the show', 'Stadium seating!', 'Matinee price', 'Late show, baby']), '');
    }, 400);
  }
  function toEntrance(g) {
    g.state = 'toEntrance';
    const pts = [];
    if (g.u < 7.4 && g.v > 2.3) pts.push([6.9, 3.3], [8.0, 1.6]);
    else if (g.u < 16) pts.push([clamp(g.u + 1.2, 11, 15.5), rand(1.2, 1.8)]);
    else pts.push([Math.min(g.u, 20), rand(1.0, 1.6)]);
    pts.push([16.6 + rand(0, 0.4), rand(0.9, 1.2)], [ENT.out[0] + rand(-0.25, 0.25), ENT.out[1]], [ENT.in[0] + rand(-0.3, 0.3), ENT.in[1]]);
    walk(g, pts, () => inLobby(g));

  // ---------- lobby ----------
  function inLobby(g) {
    if (g.detour === 'popcorn' && !g.hurry) toPopcorn(g);
    else if (g.detour === 'bathroom' && !g.hurry) toRestroom(g);
    else toRoom(g);
  }
  function toRoom(g) {
    g.state = 'toRoom';
    const r = rooms[g.room] || rooms[0];
    const mid = [lerp(g.u, r.approach[0], 0.5) + rand(-0.8, 0.8), clamp(lerp(g.v, r.approach[1], 0.5) + rand(-0.6, 0.6), -4.6, -1.2)];
    walk(g, [mid, [r.approach[0] + rand(-0.25, 0.25), r.approach[1] + rand(-0.15, 0.1)]], () => atDoor(g, r));
  }
  function atDoor(g, r) {
    g.state = 'atDoor';
    g.door = r;
    if (r.ang < 0.9 && !g.hurry) { later(g, 120, () => atDoor(g, r)); return; }
    g.state = 'entering';
    if (walkers.get(g.key) === g) walkers.delete(g.key);
    dropBubble(g);
    walk(g, [r.inside], () => {
      entries.set(r.title, (entries.get(r.title) || 0) + 1);
      updateCounts();
      r.pulse = 1;
      r.plaque.classList.remove('bump');
      void r.plaque.offsetWidth;
      r.plaque.classList.add('bump');
      removeWalker(g);
    });
  }
  function toPopcorn(g) {
    g.state = 'toPopcorn';
    walk(g, [[POP_SPOT[0] + rand(-0.1, 0.25), POP_SPOT[1] + rand(-0.45, 0.45)]], () => {
      g.state = 'buying';
      g.facing = -1;
      POP.pulse = 1;
      later(g, rand(1500, 2300), () => {
        g.popcorn = true;
        carry(g, 'pc');
        floatText(g, pick(['Large combo #2', 'Extra butter', 'Nachos get', 'Free refill!']), '');
        toRoom(g);
      });
    });
  }
  function toRestroom(g) {
    g.state = 'toRestroom';
    g.waitStart = 0;
    walk(g, [[RR.wait[0] + rand(-0.2, 0.2), RR.wait[1] + rand(-0.2, 0.2)]], () => tryRestroom(g));
  }
  function tryRestroom(g) {
    if (g.hurry) { toRoom(g); return; }
    if (!RR.occ) {
      setRR(g);
      walk(g, [RR.front], () => {
        g.state = 'rrDoor';
        const go = () => {
          if (RR.ang < 0.9) { later(g, 120, go); return; }
          walk(g, [RR.inside], () => {
            g.state = 'restroom';
            later(g, rand(3000, 5200), () => {
              walk(g, [RR.front], () => {
                setRR(null);
                floatText(g, pick(['Much better', 'Washed hands', 'Back for the film']), 'cool');
                toRoom(g);
              });
            });
          });
        };
        go();
      });
      return;
    }
    g.waitStart ||= now();
    g.state = 'rrWait';
    if (now() - g.waitStart > 8000) { floatText(g, 'Can wait till later', 'cool'); toRoom(g); return; }
    later(g, 400, () => tryRestroom(g));
  }

  function hurry(g) {
    if (g.hurry) return;
    g.hurry = true;
    g.spd *= 2.1;
    const qi = queue.indexOf(g);
    if (qi >= 0) {
      queue.splice(qi, 1);
      retargetQueue();
      if (serving && serving.g === g) serving = null;
      if (!g.ticket) { g.ticket = true; carry(g, 'tk'); }
      toEntrance(g);
    } else if (['buying', 'toPopcorn', 'rrWait', 'toRestroom'].includes(g.state)) {
      toRoom(g);
    } else if (g.state === 'restroom') {
      walk(g, [RR.front], () => { setRR(null); toRoom(g); });
    }
  }
  function enforceCap() {
    const list = [...active].filter((g) => g.state !== 'entering').sort((a, b) => a.seq - b.seq);
    for (let i = 0; i < list.length - MAX_WALKERS; i++) hurry(list[i]);
    for (let i = 0; i < list.length - HARD_CAP; i++) removeWalker(list[i]);
  }

  // ---------- bubbles and float texts ----------
  function dropBubble(g) {
    if (!g.bub) return;
    g.bub.remove();
    g.bub = null;
    const i = bubbles.indexOf(g);
    if (i >= 0) bubbles.splice(i, 1);
  }
  function bubble(g, tokens) {
    dropBubble(g);
    while (bubbles.length >= 4) dropBubble(bubbles[0]);
    const el = h('div', 'bub');
    SB.renderTokens(el, tokens, 24, 60);
    g.lab.append(el);
    g.bub = el;
    g.bubW = el.offsetWidth;
    g.bubH = el.offsetHeight;
    g.bubShift = null;
    g.bubBelow = null;
    g.bubUntil = now() + 5200;
    bubbles.push(g);
    placeBub(g);
  }
  function placeBub(g) {
    if (!g.bub) return;
    const half = g.bubW / 2;
    let shift = Math.round(Math.max(0, 10 - (g.x - half)) + Math.min(0, 1910 - (g.x + half)));
    const above = { x: g.x - half + shift, y: g.y - 100 - g.bubH, w: g.bubW, h: g.bubH };
    let below = FORBID.some((r) => hit(above, r));
    if (below) {
      // try sliding sideways first
      for (const r of FORBID) {
        if (!hit(above, r)) continue;
        const right = r.x + r.w + 8 - above.x;
        if (right < 220 && g.x + half + right < 1910) { shift += right; above.x += right; }
      }
      below = FORBID.some((r) => hit(above, r));
    }
    if (shift !== g.bubShift) {
      g.bubShift = shift;
      g.bub.style.transform = `translateX(${Math.round(-half + shift)}px)`;
      g.bub.style.setProperty('--tail', `${clamp(half - shift, 12, g.bubW - 12)}px`);
    }
    if (below !== g.bubBelow) { g.bubBelow = below; g.bub.classList.toggle('below', below); }
  }
  function floatText(g, text, kind) {
    const el = h('div', `ftext ${kind}`, text);
    el.addEventListener('animationend', () => el.remove());
    g.lab.append(el);
  }

  // ---------- chat hooks ----------
  Cinema.onWalkIn((w) => {
    let g = walkers.get(w.nick.toLowerCase());
    if (g && g.state !== 'entering') {
      setEmote(g, w.emote);
      if (g.room !== w.roomIndex) {
        g.room = w.roomIndex;
        if (g.state === 'toRoom' || g.state === 'atDoor') toRoom(g);
      }
    } else g = makeWalker(w);
    bubble(g, w.tokens);
    enforceCap();
  });
  Cinema.onPurge((nick) => {
    const key = String(nick).toLowerCase();
    for (const g of [...active]) if (g.key === key) removeWalker(g);
  });
  let comboTimer = 0;
  Cinema.onCombo(({ emote, count }) => {
    const t = now();
    if (combo.emote !== emote || t > combo.until) combo.start = t;
    combo.emote = emote;
    combo.until = t + 2600;
    if (count < 3) return;
    $('combo').replaceChildren(SB.emoteEl(emote, 60), h('span', '', `${count}× combo`));
    $('combo').classList.add('show');
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => $('combo').classList.remove('show'), 2000);
  });
  SB.on('emotes', () => { flipOK = SB.emotes.css; setClerk(); });

  // ---------- light on the walkers ----------
  function lightAt(u, v) {
    let b;
    let w;
    if (v < 0) {
      b = 0.84;
      w = 0.16;
      for (const s of SCONCES) { const d = Math.hypot(u - s, v - BWV); if (d < 3.2) b += 0.16 * (1 - d / 3.2); }
      const dp = Math.hypot(u - 15.2, v + 3.6);
      if (dp < 3) { b += 0.18 * (1 - dp / 3); w += 0.15; }
      if (v > -1.2) b -= 0.05;
    } else {
      b = 0.56;
      w = 0;
      if (u > -1 && u < CAN.u1 + 0.6 && v < CAN.v1 + 0.6) { b += 0.34; w += 0.24; }
      const dl = Math.hypot(u - LAMP[0], v - LAMP[1]);
      if (dl < 5.5) { b += 0.42 * (1 - dl / 5.5); w += 0.12 * (1 - dl / 5.5); }
      if (u > ENDU && u < 42 && v < 2.6) { b += 0.14 * (1 - v / 2.6); w += 0.08; }
      if (CAR.active) {
        const du = u - (CAR.u + 2.2);
        if (du > 0 && du < 11 && Math.abs(v - CAR.v) < 1 + du * 0.35) b += 0.55 * (1 - du / 11);
      }
    }
    b += LIGHTNING.f * 0.7;
    return [b, w];
  }

  const easeOutBack = (x) => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2;

  function stepWalker(g, t, dt) {
    let moving = false;
    if (g.alpha < 1) g.alpha = Math.min(1, g.alpha + dt / 0.35);
    if (g.tFn) {
      if (t >= g.tAt) { const fn = g.tFn; g.tFn = null; fn(); }
    } else if (g.path.length) {
      const [tu, tv] = g.path[0];
      const du = tu - g.u;
      const dv = tv - g.v;
      const d = Math.hypot(du, dv);
      const step = g.spd * dt * (g.state === 'entering' ? 0.6 : 1);
      if (d <= step) {
        g.u = tu;
        g.v = tv;
        g.path.shift();
        if (!g.path.length) { const cb = g.then; g.then = null; if (cb) cb(); }
      } else {
        g.u += (du / d) * step;
        g.v += (dv / d) * step;
        const sx = du - dv;
        if (Math.abs(sx) > 0.05) g.facing = sx > 0 ? 1 : -1;
      }
      moving = true;
    }
    if (!active.has(g)) return;
    const [x, y] = P(g.u, g.v, g.v > CURB && g.v < FAR ? ROADZ : 0);
    g.x = x;
    g.y = y;

    // hop: walking, idle bounce, combo jumps
    let s;
    let lift = 0;
    let bouncing = false;
    let tilt = 0;
    if (t < combo.until && g.emote === combo.emote && g.state !== 'entering') {
      s = Math.abs(Math.sin(((t - combo.start) / 1000) * 10));
      lift = s * 30;
      bouncing = true;
    } else if (moving) {
      // one lazy hop every ~0.8 s (0.55 s hurrying), waddling along the floor in between
      g.phase += dt * (g.hurry ? 5.7 : 3.9);
      const c = (g.phase / Math.PI) % 1;
      s = c < 0.5 ? Math.sin((c / 0.5) * Math.PI) : 0;
      lift = s * 13;
      bouncing = c < 0.5;
      tilt = c < 0.5 ? 0 : Math.sin((c - 0.5) * 4 * Math.PI) * 3.5;
      const n = Math.floor(g.phase / Math.PI);
      if (n !== g.hopN) {
        g.hopN = n;
        if (g.v > 0) { const p = inPuddle(g.u, g.v); if (p) splash(x, y, true); }
      }
    } else {
      if (!g.idle && Math.random() < dt * 0.12) g.idle = 0.001;
      if (g.idle) { g.idle += dt * 6; if (g.idle >= Math.PI) g.idle = 0; }
      s = Math.abs(Math.sin(g.idle));
      lift = s * 14;
      bouncing = g.idle > 0;
    }
    const sq = bouncing && s < 0.22 ? 0.88 : 1;
    const f = flipOK ? g.facing : 1;
    // fade through doorways (anything beyond the back wall line) and on spawn
    const vis = g.alpha * (g.v < -6.1 ? clamp((g.v + 7.0) / 0.9, 0, 1) : 1);
    const sc = g.v < -6.1 ? 1 - (1 - vis) * 0.25 : (g.alpha < 1 ? easeOutBack(g.alpha) : 1);
    if (vis !== g.vis) { g.vis = vis; g.el.style.opacity = vis.toFixed(3); g.lab.style.opacity = vis.toFixed(3); }
    g.el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)${sc !== 1 ? ` scale(${sc.toFixed(3)})` : ''}`;
    g.bod.style.transform = `translateY(${(-lift).toFixed(1)}px)${tilt ? ` rotate(${tilt.toFixed(1)}deg)` : ''} scale(${(f * (2 - sq)).toFixed(3)}, ${sq})`;
    g.lab.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
    const out = g.v >= 0;
    if (out !== g.out) { g.out = out; g.el.classList.toggle('out', out); }
    if (out) g.rf.style.transform = `translateY(${lift.toFixed(1)}px) scale(${f}, -1)`;
    const wantUmb = g.umb && out && !(g.u > -1 && g.u < CAN.u1 + 0.3 && g.v < CAN.v1 + 0.2);
    if (wantUmb !== g.umbOn) { g.umbOn = wantUmb; g.umbEl.classList.toggle('on', wantUmb); }
    // depth: lobby | storefront | street
    const z = (out ? BAND_STREET : BAND_LOBBY) + Math.round(y);
    if (z !== g.z) { g.z = z; g.el.style.zIndex = String(z); g.lab.style.zIndex = String(Math.round(y)); }
    // light
    const [lb, lw] = lightAt(g.u, g.v);
    const filt = `brightness(${(Math.round(lb * 20) / 20).toFixed(2)}) sepia(${(Math.round(lw * 20) / 20).toFixed(2)})${out ? ' saturate(.85)' : ''}`;
    if (filt !== g.filt) { g.filt = filt; g.bod.style.filter = filt; g.rf.style.filter = filt; }
    if (g.bub && t > g.bubUntil) dropBubble(g);
    placeBub(g);
    if (g.boom && t > g.noteAt && g.v > -6) {
      g.noteAt = t + rand(380, 620);
      const n = h('div', Math.random() < 0.5 ? 'note' : 'note c', pick(['♪', '♫', '♬']));
      n.style.left = `${-g.halfW - 14}px`;
      n.style.setProperty('--dx', `${rand(-20, 10).toFixed(0)}px`);
      n.addEventListener('animationend', () => n.remove());
      g.lab.append(n);
    }
  }

  // ---------- door animation ----------
  function stepDoors(dt) {
    for (const r of rooms) {
      let want = false;
      for (const g of active) {
        if (g.room === r.i && (g.state === 'atDoor' || g.state === 'entering')) { want = true; break; }
        if (g.room === r.i && g.state === 'toRoom' && Math.hypot(g.u - r.approach[0], g.v - r.approach[1]) < 1.6) { want = true; break; }
      }
      const target = want ? 1.3 : 0;
      r.ang += clamp(target - r.ang, -dt * 3, dt * 4);
      if (Math.abs(r.ang - r.drawnAng) > 0.004) { r.drawnAng = r.ang; setLeaves(r); }
      if (r.pulse > 0) r.pulse = Math.max(0, r.pulse - dt * 1.2);
    }
    let rrWant = false;
    for (const g of active) {
      if (RR.occ === g && (g.state === 'rrDoor' || (g.v < -5.6 && g.state !== 'restroom') || (g.state === 'restroom' && g.tFn && g.tAt - now() < 500))) rrWant = true;
      if (RR.occ === g && g.state === 'restroom' && !g.tFn && g.path.length) rrWant = true;
    }
    const rt = rrWant ? 1.25 : 0;
    const old = RR.ang;
    RR.ang += clamp(rt - RR.ang, -dt * 3, dt * 4);
    if (Math.abs(RR.ang - old) > 0.003) setRRLeaf();
    let entWant = false;
    for (const g of active) if (Math.hypot(g.u - (ENT.u0 + ENT.u1) / 2, g.v) < 1.25) { entWant = true; break; }
    const eo = ENT.ang;
    ENT.ang += clamp((entWant ? 1.2 : 0) - ENT.ang, -dt * 2.5, dt * 4);
    if (Math.abs(ENT.ang - eo) > 0.003) setEntrance();
    if (POP.pulse > 0) POP.pulse = Math.max(0, POP.pulse - dt * 0.6);
    if (CLERK.hop > 0) CLERK.hop = Math.max(0, CLERK.hop - dt * 2.2);
    if (CLERK.inner) {
      const busy = serving ? 1 : 0;
      const lift = Math.abs(Math.sin(CLERK.hop * Math.PI * 2)) * 10 + Math.abs(Math.sin(now() / 380)) * 2 * busy;
      CLERK.inner.style.transform = `translateY(${-lift.toFixed(1)}px)`;
    }
  }

  // ======================================================================
  // Per-frame light (low-res, screen-blended) and effects (rain, splashes, steam)
  // ======================================================================
  const gctx = $('glow').getContext('2d');
  const GS = 0.25;
  function gl(x, y, r, rgb, a, sy = 1) {
    if (a <= 0.003) return;
    gctx.globalAlpha = Math.min(1, a);
    gctx.drawImage(glowSpr(rgb), (x - r) * GS, (y - r * sy) * GS, 2 * r * GS, 2 * r * sy * GS);
  }
  const TVFX = { next: 0, col: BLUE, a: 0.4 };
  const ARC_COLS = [BLUE, PINK, '120,255,140', '255,220,90'];
  function drawGlow(t) {
    const c = gctx;
    c.globalCompositeOperation = 'source-over';
    c.globalAlpha = 1;
    c.clearRect(0, 0, 480, 270);
    c.globalCompositeOperation = 'lighter';
    const ts = t / 1000;
    // marquee: letter board, tubes, side script
    for (let u = 8.6; u <= 12.6; u += 1.3) gl(...P(u, CAN.v1, 202), 60, '225,230,255', 0.16);
    for (const [x, y] of [[120, 10], [330, 10], [540, 10], [22, 200], [652, 200], [120, 402], [540, 402]]) gl(x, y, 70, PINK, 0.09);
    const neonK = NEON.on ? 1 : 0.6;
    for (const v of [0.6, 1.7, 2.8]) gl(...P(CAN.u1, v, 198), 70, PINK, 0.3 * neonK);
    gl(...P(CAN.u1, 1.7, -60), 60, PINK, 0.08 * neonK, 2);
    gl(...P(10.6, 0, 40), 75, '200,215,255', 0.3);
    gl(...P(9.4, 0, 50), 40, RED, 0.35);
    // kiosk
    gl(...P(5.3, KIO.v1, 75), 80, AMBER, 0.2);
    gl(...P(5.3, KIO.v1, 126), 45, '235,240,255', 0.32);
    gl(...P(KIO.u1, 2.0, 128), 26, RED, 0.3);
    // CRT trailers and the arcade attract mode
    if (t > TVFX.next) { TVFX.next = t + rand(180, 650); TVFX.col = pick([BLUE, WHITE, '255,150,70', '120,255,190', PINK, '255,230,140']); TVFX.a = rand(0.35, 0.6); }
    gl(...P((TV.u0 + TV.u1) / 2, TV.v1, 186), 55, TVFX.col, TVFX.a);
    gl(...P(14.85, -1.22, 72), 60, ARC_COLS[Math.floor(t / 900) % ARC_COLS.length], 0.6);
    if (PHONE.until > t && Math.floor(t / 160) % 2) gl(...P(PHONE_P[0], PHONE_P[1], 120), 46, '255,240,120', 0.55);
    // street lamp (it buzzes now and then)
    const buzz = Math.sin(ts * 0.37) > 0.985 ? 0.5 + 0.5 * Math.sin(ts * 60) : 1;
    gl(...P(LAMP[0], LAMP[1], 238), 120, AMBER, 0.5 * buzz);
    gl(...P(LAMP[0], LAMP[1], 238), 30, '255,240,210', 0.6 * buzz);
    gl(...P(LAMP[0], LAMP[1], -150), 40, AMBER, 0.14 * buzz, 3);
    // lobby
    for (const s of SCONCES) gl(...P(s, BWV, 160), 55, '205,190,255', 0.2 + 0.02 * wob(ts * 2 + s));
    gl(...P(14.9, BWV, 160), 55, '205,190,255', 0.2);
    gl(...P(14.7, -3.6, 90), 90, AMBER, 0.22 + 0.28 * POP.pulse + 0.03 * wob(ts * 5));
    gl(...P(16.5, BWV, 146), 45, RR.occ ? RED : GREENL, 0.32);
    for (const r of rooms) {
      if (r.ang > 0.05) gl(...P(r.mid, BWV, 50), 85, BLUE, 0.45 * (r.ang / 1.3) * (0.8 + 0.2 * wob(ts * 9 + r.i)));
      if (r.pulse > 0) gl(...P(r.c, BWV, 185), 90, PINK, 0.35 * r.pulse);
    }
    // headlights
    if (CAR.active) {
      const fu = CAR.u + 2.25;
      for (const dv of [-0.62, 0.62]) gl(...P(fu, CAR.v + dv, 24 + ROADZ), 26, '255,250,225', 0.9);
      c.globalAlpha = 1;
      const [ax, ay] = P(fu, CAR.v, ROADZ);
      const [bx, by] = P(fu + 11, CAR.v, ROADZ);
      const grad = c.createLinearGradient(ax * GS, ay * GS, bx * GS, by * GS);
      grad.addColorStop(0, 'rgba(255,245,215,.42)');
      grad.addColorStop(1, 'rgba(255,245,215,0)');
      c.fillStyle = grad;
      const pts = [P(fu, CAR.v - 0.8, ROADZ), P(fu + 11, CAR.v - 4.2, ROADZ), P(fu + 11, CAR.v + 3.6, ROADZ), P(fu, CAR.v + 0.8, ROADZ)];
      c.beginPath();
      pts.forEach(([x, y], i) => (i ? c.lineTo(x * GS, y * GS) : c.moveTo(x * GS, y * GS)));
      c.closePath();
      c.fill();
      for (const dv of [-0.62, 0.62]) gl(...P(fu, CAR.v + dv, -(24 + ROADZ) * 2), 16, '255,240,210', 0.35, 3.5);
    }
    // lightning
    if (LIGHTNING.f > 0) {
      c.globalAlpha = 1;
      c.fillStyle = `rgba(170,190,255,${0.32 * LIGHTNING.f})`;
      c.fillRect(0, 0, 480, 270);
      c.fillStyle = `rgba(200,215,255,${0.5 * LIGHTNING.f})`;
      c.fillRect(0, 0, 480, 110);
    }
    c.globalAlpha = 1;
  }

  // Rain mask: no rain inside the lobby (above the storefront glass) or under the marquee.
  const fctx = $('fx').getContext('2d');
  const FS = 0.5;
  const rainMask = document.createElement('canvas');
  rainMask.width = 960;
  rainMask.height = 540;
  {
    const c = rainMask.getContext('2d');
    c.fillStyle = '#fff';
    c.fillRect(0, 0, 960, 540);
    c.globalCompositeOperation = 'destination-out';
    const cut = (pts) => {
      c.beginPath();
      pts.forEach(([x, y], i) => (i ? c.lineTo(x * FS, y * FS) : c.moveTo(x * FS, y * FS)));
      c.closePath();
      c.fill();
    };
    cut([P(ENDU, 0, 126), P(ENDU, 0, 330), P(ENDU, BWV, 330), P(80, BWV, 330), P(80, 0, 126)]);
    cut([P(CAN.u0, CAN.v1, 0), P(CAN.u1, CAN.v1, 0), P(CAN.u1, 0, 0), P(CAN.u1, 0, CAN.z0), P(CAN.u0, 0, CAN.z0), P(CAN.u0, CAN.v1, CAN.z0)]);
    c.fillRect(FRAME.x * FS, FRAME.y * FS, FRAME.w * FS, FRAME.h * FS);
    if (HAS_CHAT) c.fillRect(1566 * FS, 18 * FS, 340 * FS, 612 * FS);
  }
  const drops = Array.from({ length: 460 }, () => ({ x: rand(-100, 1980), y: rand(-100, 1080), sp: rand(1100, 1600), len: rand(14, 28), a: rand(0.08, 0.26) }));
  const rings = [];
  const parts = [];
  const steam = [];
  const drips = [];
  const isStreet = (x, y) => y > (OY + (x - OX) / 2) + 4;
  function splash(x, y, big) {
    rings.push({ x, y, r: big ? 4 : 1.5, max: big ? 26 : 9, life: big ? 0.6 : 0.35, t: 0, a: big ? 0.55 : 0.35 });
    if (big) for (let i = 0; i < 7; i++) parts.push({ x, y: y - 2, vx: rand(-60, 60), vy: rand(-120, -50), life: rand(0.25, 0.45), t: 0 });
  }
  const STEAM_SPR = (() => {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 64;
    const c = cv.getContext('2d');
    c.fillStyle = rg(c, 32, 32, 0, 32, [[0, 'rgba(210,215,230,.55)'], [0.5, 'rgba(200,205,225,.2)'], [1, 'rgba(200,205,225,0)']]);
    c.fillRect(0, 0, 64, 64);
    return cv;
  })();
  function drawFx(t, dt) {
    const c = fctx;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalCompositeOperation = 'source-over';
    c.globalAlpha = 1;
    c.clearRect(0, 0, 960, 540);
    // rain
    const wind = 0.16;
    const buckets = [[], [], []];
    for (const d of drops) {
      d.y += d.sp * dt;
      d.x += d.sp * dt * wind;
      if (d.y > 1090) {
        if (Math.random() < 0.5 && isStreet(d.x, 1040)) { /* lands off screen */ }
        d.y = rand(-120, -10);
        d.x = rand(-200, 1920);
      }
      buckets[d.a < 0.14 ? 0 : d.a < 0.2 ? 1 : 2].push(d);
    }
    [0.1, 0.17, 0.26].forEach((a, bi) => {
      c.strokeStyle = `rgba(185,205,240,${a})`;
      c.lineWidth = bi === 2 ? 1.1 : 0.8;
      c.beginPath();
      for (const d of buckets[bi]) {
        c.moveTo(d.x * FS, d.y * FS);
        c.lineTo((d.x - d.len * wind) * FS, (d.y - d.len) * FS);
      }
      c.stroke();
    });
    // splashes on the street (random) and rings in puddles
    for (let i = 0; i < dt * 40; i++) {
      const u = rand(-4, 40);
      const v = rand(0.3, 13);
      const [x, y] = P(u, v, v > CURB && v < FAR ? ROADZ : 0);
      if (x < 0 || x > 1560 || y > 1080) continue;
      if (u > CAN.u0 && u < CAN.u1 && v < CAN.v1) continue;
      rings.push({ x, y, r: 0.5, max: 3, life: 0.18, t: 0, a: 0.35 });
    }
    if (Math.random() < dt * 9) {
      const p = pick(PUDDLES);
      const a = rand(0, TAU);
      const [x, y] = P(p.u + Math.cos(a) * p.ru * 0.5, p.v + Math.sin(a) * p.rv * 0.5, p.z);
      rings.push({ x, y, r: 1, max: rand(8, 14), life: 0.7, t: 0, a: 0.4 });
    }
    c.lineWidth = 0.7;
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.t += dt;
      if (r.t >= r.life) { rings.splice(i, 1); continue; }
      const k = r.t / r.life;
      const rad = lerp(r.r, r.max, Math.sqrt(k));
      c.strokeStyle = `rgba(200,215,245,${r.a * (1 - k)})`;
      c.beginPath();
      c.ellipse(r.x * FS, r.y * FS, rad * FS, rad * 0.5 * FS, 0, 0, TAU);
      c.stroke();
    }
    c.globalCompositeOperation = 'destination-in';
    c.drawImage(rainMask, 0, 0);
    c.globalCompositeOperation = 'source-over';
    // drips off the marquee edge
    if (Math.random() < dt * 5) {
      const u = rand(4.5, CAN.u1 - 0.2);
      drips.push({ u, z: CAN.z0 - 2, vz: 0 });
    }
    c.strokeStyle = 'rgba(210,225,255,.55)';
    c.lineWidth = 0.9;
    c.beginPath();
    for (let i = drips.length - 1; i >= 0; i--) {
      const d = drips[i];
      d.vz += 900 * dt;
      d.z -= d.vz * dt;
      const [x, y] = P(d.u, CAN.v1 + 0.08, Math.max(0, d.z));
      if (d.z <= 0) { drips.splice(i, 1); splash(x, y, false); continue; }
      c.moveTo(x * FS, y * FS);
      c.lineTo(x * FS, (y - 6) * FS);
    }
    c.stroke();
    // splash droplets
    c.fillStyle = 'rgba(210,225,255,.7)';
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.t += dt;
      if (p.t >= p.life) { parts.splice(i, 1); continue; }
      p.vy += 500 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      c.fillRect(p.x * FS, p.y * FS, 1.2, 1.2);
    }
    // steam from the manhole
    if (steam.length < 26 && Math.random() < dt * 7) steam.push({ u: MANHOLE[0] + rand(-0.3, 0.3), v: MANHOLE[1] + rand(-0.2, 0.2), z: 0, t: 0, life: rand(3, 5), s: rand(14, 22), dr: rand(0.1, 0.4) });
    for (let i = steam.length - 1; i >= 0; i--) {
      const s = steam[i];
      s.t += dt;
      if (s.t >= s.life) { steam.splice(i, 1); continue; }
      s.z += dt * 26;
      s.u += dt * s.dr;
      const k = s.t / s.life;
      const [x, y] = P(s.u, s.v, ROADZ + s.z);
      const r = s.s * (1 + k * 2.2);
      c.globalAlpha = Math.sin(k * Math.PI) * 0.22 * (1 + LIGHTNING.f);
      c.drawImage(STEAM_SPR, (x - r) * FS, (y - r) * FS, 2 * r * FS, 2 * r * FS);
    }
    c.globalAlpha = 1;
    // popcorn popping inside the machine glass
    if (Math.random() < dt * (4 + POP.pulse * 20)) POP.pops.push({ du: rand(-0.3, 0.3), dv: rand(-0.4, 0.4), z: 64, vz: rand(60, 120), t: 0 });
    c.fillStyle = '#fff6dc';
    for (let i = POP.pops.length - 1; i >= 0; i--) {
      const p = POP.pops[i];
      p.t += dt;
      p.vz -= 300 * dt;
      p.z += p.vz * dt;
      if (p.z < 64 || p.t > 1.2) { POP.pops.splice(i, 1); continue; }
      const [x, y] = P(14.7 + p.du, -3.6 + p.dv, Math.min(110, p.z));
      c.fillRect(x * FS - 1, y * FS - 1, 2, 2);
    }
    // newspaper tumbling down the street
    if (PAPER.active) {
      const [x, y] = P(PAPER.u, PAPER.v, ROADZ + PAPER.z);
      const [sx, sy] = P(PAPER.u, PAPER.v, ROADZ);
      c.globalAlpha = 0.35;
      c.fillStyle = '#000';
      c.beginPath(); c.ellipse(sx * FS, sy * FS, 7, 3, 0, 0, TAU); c.fill();
      c.globalAlpha = 1;
      c.save();
      c.translate(x * FS, y * FS);
      c.rotate(PAPER.rot);
      c.scale(1, 0.55 + 0.45 * Math.sin(PAPER.rot * 1.3));
      c.fillStyle = '#c9c4b4';
      c.fillRect(-9, -6, 18, 12);
      c.fillStyle = 'rgba(40,40,40,.6)';
      c.fillRect(-7, -4, 14, 2);
      for (let i = 0; i < 3; i++) c.fillRect(-7, -1 + i * 2, 6, 1);
      for (let i = 0; i < 3; i++) c.fillRect(1, -1 + i * 2, 6, 1);
      c.restore();
    }
  }

  // ======================================================================
  // Main loop
  // ======================================================================
  let last = now();

  function frame(t) {

    const dt = Math.min(0.05, Math.max(0, (t - last) / 1000));
    last = t;
    stepAmbient(t, dt);
    stepQueue(t);
    for (const g of active) stepWalker(g, t, dt);
    stepDoors(dt);
    drawEmit(t);
    drawGlow(t);
    drawFx(t, dt);
    if (Math.floor(t / 66) !== CAT.drawn) { CAT.drawn = Math.floor(t / 66); drawCat(t); }
    requestAnimationFrame(frame);
  }

  buildStatic();
  staticReady = true;
  SB.on('resize', () => { buildStatic(); CAT.drawn = -1; if (CAR.active) drawCar(CAR.c, CAR_COLORS[CAR.variant]); });
  if (document.fonts && document.fonts.load) {
    Promise.all(['40px Yellowtail', '16px "Archivo Black"', '16px "Bebas Neue"', '16px Oswald'].map((f) => document.fonts.load(f).catch(() => null)))
      .then(() => document.fonts.ready).then(() => buildStatic()).catch(() => {});
  }
  requestAnimationFrame(frame);
  SB.start();
})();
</script>
</body>
