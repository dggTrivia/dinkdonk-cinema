<!doctype html>
<!-- DinkDonk Cinema, hosted edition: invite links. Needs the server's ADMIN_TOKEN (kept in this tab's sessionStorage only). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DinkDonk Cinema admin</title>
<style>
  :root { color-scheme: dark; --bg: #121318; --panel: #1b1d24; --line: #2c2f39; --text: #e9ebf0; --dim: #8b90a0; --acc: #59aeea; --warn: #ff6d6d; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, 'Segoe UI', sans-serif; }
  main { max-width: 900px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input { background: #10121a; color: var(--text); border: 1px solid #3a3f4d; border-radius: 7px; padding: 7px 10px; font: inherit; flex: 1 1 220px; min-width: 0; }
  button { background: #262a35; color: var(--text); border: 1px solid #3a3f4d; border-radius: 7px; padding: 7px 13px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--acc); }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { color: var(--dim); font-weight: 600; }
  .link { font: 12px ui-monospace, Consolas, monospace; word-break: break-all; color: var(--dim); }
  .revoked { opacity: .45; }
  #msg { color: var(--warn); margin-top: 8px; }
  .wrap { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <h1 style="margin:0 0 14px;font-size:22px">DinkDonk Cinema · invites</h1>
  <div class="card">
    <div class="row"><input id="token" type="password" placeholder="Admin token" autocomplete="off"><button id="load">Open</button></div>
    <div id="msg"></div>
  </div>
  <div class="card" id="panel" hidden>
    <div class="row" style="margin-bottom:12px"><input id="name" placeholder="Streamer name (e.g. their DGG nick)" maxlength="40"><button id="add">Create invite link</button></div>
    <div class="wrap"><table><thead><tr><th>Name</th><th>Invite link (send only to them)</th><th>Live</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</main>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  try { $('token').value = sessionStorage.getItem('dd-admin') || ''; } catch { /* private mode */ }
  const api = async (path, body) => {
    const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'X-Admin-Token': $('token').value, ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    return j;
  };
  async function load() {
    $('msg').textContent = '';
    try {
      const { rooms } = await api('/api/admin/rooms');
      try { sessionStorage.setItem('dd-admin', $('token').value); } catch { /* private mode */ }
      $('panel').hidden = false;
      $('rows').innerHTML = '';
      for (const r of rooms.sort((a, b) => (b.created || '').localeCompare(a.created || ''))) {
        const tr = document.createElement('tr');
        if (r.revoked) tr.className = 'revoked';
        const link = `${location.origin}/setup.html?k=${r.key}`;
        tr.innerHTML = '<td></td><td class="link"></td><td></td><td></td>';
        tr.children[0].textContent = r.name;
        tr.children[1].textContent = r.revoked ? `revoked ${r.revoked.slice(0, 10)}` : link;
        tr.children[2].textContent = r.revoked ? '' : `${r.screens} screen${r.screens === 1 ? '' : 's'}`;
        if (!r.revoked) {
          const copy = document.createElement('button');
          copy.textContent = 'Copy';
          copy.onclick = () => { navigator.clipboard.writeText(link); copy.textContent = 'Copied'; };
          const rev = document.createElement('button');
          rev.textContent = 'Revoke';
          rev.onclick = async () => { if (rev.dataset.sure) { await api('/api/admin/revoke', { key: r.key }); load(); } else { rev.dataset.sure = 1; rev.textContent = 'Sure?'; } };
          tr.children[3].append(copy, ' ', rev);
        }
        $('rows').append(tr);
      }
    } catch (e) { $('msg').textContent = e.message; $('panel').hidden = true; }
  }
  $('load').onclick = load;
  $('token').onkeydown = (e) => { if (e.key === 'Enter') load(); };
  $('add').onclick = async () => {
    const name = $('name').value.trim();
    if (!name) return;
    try { await api('/api/admin/rooms', { name }); $('name').value = ''; load(); } catch (e) { $('msg').textContent = e.message; }
  };
  if ($('token').value) load();
})();
</script>
</body>
</html>
