<!doctype html>
<!--
  Hall 3 · "The Desert Rose Cinema" — a sandstone cinema arcade in a Lut Gholein-style courtyard at dusk
  (isometric 2:1, Diablo 2 Act II flavoured, painterly canvas art, no pixel art).
  GREEN SCREEN (chroma key) on the 1920x1080 stage: x 1184, y 32, w 704, h 396 (16:9, integer px).
  It is the top-most layer (z-index 9999), pure Cinema.green, no filter/blend/opacity on it or its ancestors;
  the carved sandstone + turquoise frame is drawn around it on the sky canvas, nothing overlaps it.
  ?green=off shows showtimes and the five films there instead.
  Options: ?demo=1  ?green=ff00ff  ?green=off  ?chat=off  ?f=3  ?title=...  ?sub=...
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Desert Rose Cinema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
  :root { --sand: #d9b27c; --sand-d: #8a6038; --turq: #2a9c94; --turq-d: #155a5c; --brass: #d8b061; --brass-d: #7a5626; --ink: #f4e6c8; --deep: #1a0f1c; }
  #stage { background: #120a18; color: var(--ink); font-family: 'Marcellus', Georgia, 'Times New Roman', serif; }
  .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
  #sky { z-index: 1; }
  #palms { z-index: 2; }
  #bg { z-index: 3; }
  #wallart { z-index: 4; }
  #world { z-index: 5; }
  #over { z-index: 6; }
  #fx { z-index: 7; }
  #shade { z-index: 8; }
  #glow { z-index: 9; opacity: .55; }
  #labels { z-index: 10; }
  #title, #chatpanel, #combo { z-index: 20; }
  #green { position: absolute; left: 1184px; top: 32px; width: 704px; height: 396px; z-index: 9999; background: #00ff00; }

  /* palms sway gently behind the walls */
  .palm { position: absolute; transform-origin: 50% 100%; animation: sway 7s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-1.1deg); } to { transform: rotate(1.3deg); } }

  /* wall art: sheared onto the wall planes with matrix() */
  .wa { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .poster { width: 78px; height: 108px; padding: 3px; background: linear-gradient(160deg, #f3d48a, #a77a32 45%, #6a4618); box-shadow: 0 0 0 1.5px #2c180c; }
  .poster img { display: block; width: 72px; height: 102px; object-fit: cover; }
  .poster .ps { position: absolute; inset: 3px; background: linear-gradient(rgba(255,190,110,.18), rgba(0,0,0,0) 40%, rgba(20,8,10,.35)); }
  .curt .leak { position: absolute; left: 6%; right: 6%; bottom: -4px; height: 16px; border-radius: 50%;
    background: radial-gradient(closest-side, var(--lc), transparent); animation: leak 2.4s linear infinite; }
  @keyframes leak { 0% { opacity: .5; } 9% { opacity: .95; } 17% { opacity: .55; } 33% { opacity: .8; } 41% { opacity: .4; }
    58% { opacity: 1; } 66% { opacity: .6; } 80% { opacity: .85; } 100% { opacity: .5; } }

  /* walkers */
  .w { position: absolute; left: 0; top: 0; will-change: transform; }
  .w .sh { position: absolute; left: -25px; top: -7px; width: 50px; height: 14px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(28,10,4,.62), rgba(28,10,4,0)); }
  .w .bod { position: absolute; left: 0; bottom: 0; transform-origin: 50% 100%; will-change: transform; }
  .w .bod .sb-emote { position: absolute; bottom: 0; }
  .w .carry { position: absolute; bottom: 4px; width: 22px; height: 28px; background-size: 100% 100%; }
  .w, .lab { transition: opacity .35s; }
  .hid { opacity: 0 !important; }
  .lab { position: absolute; left: 0; top: 0; will-change: transform; }
  .lab .tag { position: absolute; left: 0; top: 7px; transform: translateX(-50%); white-space: nowrap; font: 15px/1 'Marcellus', Georgia, serif; letter-spacing: .3px;
    text-shadow: 0 0 3px #000, 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
  .lab .tag i { font-style: normal; color: #6fe0cf; margin-right: 3px; }
  .bub { position: absolute; left: 0; bottom: 84px; width: max-content; max-width: 300px; padding: 6px 12px 7px;
    background: linear-gradient(#2a1a22f0, #170d14f0); border: 1.5px solid #b98f4a; border-radius: 12px; color: #fbeed4;
    font: 18px/1.3 'Marcellus', Georgia, serif; text-align: center; overflow-wrap: anywhere; box-shadow: 0 4px 10px rgba(0,0,0,.55); }
  .bub::after { content: ''; position: absolute; left: calc(50% - 7px + var(--tail, 0px)); bottom: -8px; border: 7px solid transparent; border-bottom: 0; border-top-color: #b98f4a; }
  .bub .sb-emote { margin: 0 2px; }
  .ftext { position: absolute; left: 0; bottom: 74px; white-space: nowrap; font: 700 17px 'Cinzel', Georgia, serif; color: #ffd98a;
    text-shadow: 0 0 4px #000, 1px 1px 0 #000, -1px -1px 0 #000; animation: ftext 2s ease-out forwards; }
  .ftext.t { color: #7fe8d8; }
  @keyframes ftext { 0% { opacity: 0; transform: translate(-50%, 8px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -40px); } }
  .ticket { position: absolute; left: 0; top: 0; width: 26px; height: 15px; margin: -7px 0 0 -13px; border-radius: 2px;
    background: linear-gradient(#fff3cf, #e7c27a); box-shadow: 0 0 6px rgba(255,210,120,.9), 0 1px 2px rgba(0,0,0,.6);
    -webkit-mask: radial-gradient(circle at 0 50%, transparent 3px, #000 3.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 3px, #000 3.5px) right / 51% 100% no-repeat; }

  /* brass plaques over the five archways */
  .plq { position: absolute; left: 0; top: 0; width: 152px; transform: translate(-50%, -100%); padding: 5px 7px 6px; text-align: center;
    background: linear-gradient(#f0cf86, #c99a4c 40%, #9b6c2c 100%); border-radius: 4px; color: #2b1606;
    box-shadow: inset 0 0 0 1.5px #fbe7b0, inset 0 0 0 3px #7a5420, 0 4px 10px rgba(0,0,0,.6); }
  .plq::before { content: ''; position: absolute; left: 50%; top: -9px; width: 54px; height: 9px; transform: translateX(-50%);
    border-left: 2px solid #4a3418; border-right: 2px solid #4a3418; }
  .plq .no { position: absolute; left: 50%; top: -12px; transform: translateX(-50%); width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center; font: 700 12px 'Cinzel', serif; color: #eafff9; background: radial-gradient(circle at 35% 30%, #5fd0c2, #1a6e6c 70%);
    box-shadow: 0 0 0 2px #c99a4c, 0 0 0 3px #4a3418; }
  .plq .pt { margin-top: 9px; font: 700 15px/1.12 'Cinzel', Georgia, serif; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
    text-shadow: 0 1px 0 rgba(255,240,200,.5); }
  .plq .pm { margin-top: 2px; font: 14px/1.2 'Marcellus', Georgia, serif; white-space: nowrap; }
  .plq .pm b { color: #7a1c10; font-weight: 400; }
  .plq .pc { margin-top: 1px; font: 13px/1.2 'Marcellus', Georgia, serif; color: #0f4f4c; white-space: nowrap; }
  .plq .pc b { font: 700 13px 'Segoe UI', Roboto, Arial, sans-serif; }
  .plq.bump { animation: bump .5s ease-out; }
  @keyframes bump { 30% { transform: translate(-50%, -100%) scale(1.08); filter: brightness(1.25); } }
  .sign { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); padding: 2px 8px 3px; border-radius: 3px; white-space: nowrap;
    font: 700 12px 'Cinzel', Georgia, serif; letter-spacing: 1px; background: linear-gradient(#6a4526, #3e2614); border: 1.5px solid #c99a4c; color: #7fe8d8;
    box-shadow: 0 3px 6px rgba(0,0,0,.6); }
  .sign.busy { color: #ff9a7a; }
  .sign.pop { color: #ffe3a0; }

  /* title cartouche */
  #title { position: absolute; left: 22px; top: 18px; padding: 14px 26px 13px; min-width: 460px;
    background: linear-gradient(#e7c590, #cfa266 55%, #b4844c); border-radius: 6px; color: #3a1d0b;
    box-shadow: inset 0 0 0 2px #f6e2b6, inset 0 0 0 7px #b07a42, inset 0 0 0 9px #1d6a68, inset 0 0 0 12px #2fa597, inset 0 0 0 14px #6a4320, 0 8px 22px rgba(0,0,0,.6); }
  #title::before, #title::after { content: ''; position: absolute; top: 50%; width: 14px; height: 14px; margin-top: -7px; transform: rotate(45deg);
    background: radial-gradient(circle at 35% 35%, #fff0b8, #b8862e 70%); box-shadow: 0 0 0 2px #4a3418; }
  #title::before { left: -7px; }
  #title::after { right: -7px; }
  #title .t { font: 900 31px/1.05 'Cinzel', Georgia, serif; letter-spacing: 1.5px; text-shadow: 0 1px 0 rgba(255,240,205,.7), 0 -1px 0 rgba(80,40,10,.35); }
  #title .s { margin-top: 5px; font: 18px 'Marcellus', Georgia, serif; color: #5a2d12; }
  #title .r { margin-top: 7px; display: flex; gap: 12px; align-items: center; font: 17px 'Marcellus', Georgia, serif; color: #1b4f4c; }
  #title .r .clk { font: 700 19px 'Cinzel', Georgia, serif; color: #3a1d0b; }
  #title .r .dot { width: 7px; height: 7px; transform: rotate(45deg); background: #b8862e; }

  /* chat panel: carved sandstone with turquoise tile trim */
  #chatpanel { position: absolute; left: 1584px; top: 478px; width: 320px; height: 584px; border-radius: 6px;
    background: linear-gradient(#d9b37c, #a8783f); box-shadow: inset 0 0 0 2px #f2dcae, 0 10px 26px rgba(0,0,0,.65); }
  #chatpanel .tile { position: absolute; inset: 8px; border-radius: 3px;
    background: repeating-linear-gradient(45deg, #1f7c78 0 6px, #36b2a3 6px 8px, #1f7c78 8px 14px, #e9dcbc 14px 15px); box-shadow: inset 0 0 0 1.5px #0d3c3c; }
  #chatpanel .inner { position: absolute; left: 14px; right: 14px; top: 48px; bottom: 14px; border-radius: 2px;
    background: linear-gradient(#1d1220f2, #120a14f5); box-shadow: inset 0 0 0 2px #8a6232, inset 0 0 18px rgba(0,0,0,.8); }
  #chatpanel .hd { position: absolute; left: 14px; right: 14px; top: 13px; height: 32px; display: flex; align-items: center; justify-content: center; gap: 12px;
    font: 700 19px 'Cinzel', Georgia, serif; letter-spacing: 4px; color: #3a1d0b; border-radius: 3px 3px 0 0;
    background: linear-gradient(#f3d48c, #c4954a 60%, #94682a); box-shadow: inset 0 0 0 1.5px #fbe8b8, inset 0 -2px 0 #6a4518; }
  #chatpanel .hd::before, #chatpanel .hd::after { content: ''; width: 8px; height: 8px; transform: rotate(45deg); background: #1d7470; box-shadow: 0 0 0 1.5px #f6e2b0; }
  #chat { left: 20px; right: 20px; top: 52px; bottom: 18px; }
  #chat .sb-chat-line { font-size: 19px; }

  #combo { position: absolute; left: 820px; top: 520px; display: flex; align-items: center; gap: 14px; white-space: nowrap; pointer-events: none;
    padding: 8px 26px; border-radius: 8px; font: 900 40px 'Cinzel', Georgia, serif; color: #3a1d0b;
    background: linear-gradient(#f3d48c, #c4954a 60%, #94682a); box-shadow: inset 0 0 0 2px #fbe8b8, inset 0 0 0 5px #1d7470, 0 8px 22px rgba(0,0,0,.6);
    transform: translate(-50%, -50%) scale(.6); opacity: 0; transition: opacity .3s, transform .35s cubic-bezier(.2,1.6,.4,1); }
  #combo.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* ?green=off: showtimes and the five films inside the screen frame */
  #green.off { background: linear-gradient(#22142a, #140b18); padding: 22px 34px; display: flex; flex-direction: column; gap: 6px; box-shadow: inset 0 0 0 2px #8a6232; }
  #green .ih { font: 900 28px 'Cinzel', Georgia, serif; color: var(--brass); letter-spacing: 2px; }
  #green .ih2 { margin-top: 10px; font: 700 17px 'Cinzel', Georgia, serif; color: #6fd6c6; letter-spacing: 2px; text-transform: uppercase; }
  #green .ir { display: flex; justify-content: space-between; gap: 18px; font: 22px/1.25 'Marcellus', Georgia, serif; color: var(--ink); white-space: nowrap; }
  #green .ir span:first-child { overflow: hidden; text-overflow: ellipsis; }
  #green .ir.dim { color: #b9a68a; font-size: 19px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="sky" class="layer"></canvas>
  <div id="palms" class="layer"></div>
  <canvas id="bg" class="layer"></canvas>
  <div id="wallart" class="layer"></div>
  <div id="world" class="layer"></div>
  <canvas id="over" class="layer"></canvas>
  <canvas id="fx" class="layer"></canvas>
  <canvas id="shade" class="layer" width="480" height="270"></canvas>
  <canvas id="glow" class="layer" width="480" height="270"></canvas>
  <div id="labels" class="layer"></div>
  <div id="title"><div class="t">The Desert Rose Cinema</div><div class="s"></div>
    <div class="r"><span class="clk" id="clock"></span><span class="dot"></span><span id="next"></span></div></div>
  <div id="combo"></div>
  <div id="chatpanel"><div class="tile"></div><div class="inner"></div><div class="hd">CHAT</div><div id="chat"></div></div>
  <div id="green"></div>
</div>

<script src="shared/core.js"></script>
<script src="shared/cinema.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const h = (tag, cls, ...kids) => { const el = document.createElement(tag); if (cls) el.className = cls; el.append(...kids); return el; };
  const { rand, pick } = SB;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const TAU = Math.PI * 2;
  const now = () => performance.now();
  const wob = (t) => (Math.sin(t) + Math.sin(t * 1.73 + 1.3) * 0.6 + Math.sin(t * 2.91 + 0.7) * 0.3) / 1.9;
  function mulberry(seed) {
    return () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rgbOf(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  // f < 1 darkens towards black, f > 1 lightens towards white.
  function tone(hex, f, a = 1) {
    const m = (v) => Math.round(clamp(f >= 1 ? v + (255 - v) * (f - 1) : v * f, 0, 255));
    const [r, g, b] = rgbOf(hex);
    return `rgba(${m(r)},${m(g)},${m(b)},${a})`;
  }

  SB.mountStage($('stage'));
  if (!q.has('f')) SB.cfg.f = '3';
  SB.mountChat($('chat'), { emoteHeight: 22, max: 30 });
  if (SB.cfg.chat === 'off') $('chatpanel').remove();
  $('title').querySelector('.t').textContent = SB.cfg.title || 'The Desert Rose Cinema';
  $('title').querySelector('.s').textContent = SB.cfg.sub || 'Standby · the feature resumes shortly';

  // ---------- isometric geometry (2:1). World x runs down-right along the colonnade, y down-left. ----------
  const OX = 560;
  const OY = 420;
  const WH = 220;                       // wall height
  const iso = (x, y, z = 0) => [OX + x - y, OY + (x + y) / 2 - z];
  const M = {
    floor: (z = 0) => [1, 0.5, -1, 0.5, OX, OY - z],      // local (x, y) on the floor at height z
    py: (y0) => [1, 0.5, 0, 1, OX - y0, OY + y0 / 2],     // wall plane y = y0, local (x, -z)
    px: (x0) => [-1, 0.5, 0, 1, OX + x0, OY + x0 / 2],    // wall plane x = x0, local (y, -z)
  };
  const inM = (c, m, fn) => { c.save(); c.transform(...m); fn(); c.restore(); };
  const cssM = (m, s0, t0) => `matrix(${m[0]},${m[1]},${m[2]},${m[3]},${(m[4] + m[0] * s0 + m[2] * t0).toFixed(2)},${(m[5] + m[1] * s0 + m[3] * t0).toFixed(2)})`;
  const GREEN = { x: 1184, y: 32, w: 704, h: 396 };

  // Pointed (two-centred) arch, drawn in a wall's local frame: base at t = 0, springing at t = -spring.
  function archPath(c, cx, hw, spring, k = 1.4) {
    const R = k * hw;
    const d = R - hw;
    const phi = Math.acos(d / R);
    c.moveTo(cx - hw, 0);
    c.lineTo(cx - hw, -spring);
    c.arc(cx + d, -spring, R, Math.PI, Math.PI + phi);
    c.arc(cx - d, -spring, R, TAU - phi, TAU);
    c.lineTo(cx + hw, 0);
    c.closePath();
  }
  const archRise = (hw, k = 1.4) => Math.sqrt((k * hw) ** 2 - ((k - 1) * hw) ** 2);

  const A_HW = 36;
  const A_SP = 104;
  const APEX = A_SP + archRise(A_HW);    // ~152
  const CURT_D = 18;                     // depth of the archway recess
  const ROOM_COL = ['#7c1e2a', '#203f72', '#17605a', '#5c2a70', '#8a4a16'];
  const ROOM_LEAK = ['rgba(255,190,120,.95)', 'rgba(150,200,255,.95)', 'rgba(140,255,220,.9)', 'rgba(230,170,255,.95)', 'rgba(255,214,130,.95)'];
  const ROMAN = ['I', 'II', 'III', 'IV', 'V'];
  // Archway centres along the colonnade; each poster hangs on the pier to the right of its archway.
  const rooms = [140, 326, 512, 698, 884].map((s, i) => ({ i, s, sp: s + 93, title: '', count: 0, sway: 0, flick: 1 }));

  const SPAWN = [0, 495];
  const EXIT = [72, 492];
  const QSLOT = (i) => [174 + i * 52, 257];
  const QMAX = 6;
  // Restroom: a small wooden door in the colonnade wall, by the corner.
  const RESTROOM = { s: 44, door: [44, 6], front: [50, 46], waits: [[104, 74], [132, 62]], lamp: 80 };
  const FOUNT = [650, 385];
  const POP = [380, 565];
  const POP_SPOTS = [[452, 505], [440, 470], [462, 535]];
  const BASKET = [215, 470];
  const CLERK = [84, 256];

  // ---------- procedural textures (made once) ----------
  function noiseCanvas(size, seed, base, oct, contrast) {
    const rnd = mulberry(seed);
    const layers = [];
    for (let o = 0; o < oct; o++) {
      const g = base << o;
      const arr = new Float32Array(g * g);
      for (let i = 0; i < g * g; i++) arr[i] = rnd();
      layers.push([g, arr]);
    }
    let norm = 0;
    for (let o = 0, a = 1; o < oct; o++, a *= 0.5) norm += a;
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const c = cv.getContext('2d');
    const img = c.createImageData(size, size);
    const d = img.data;
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        let v = 0;
        let amp = 1;
        for (const [g, arr] of layers) {
          const fx = (x / size) * g;
          const fy = (y / size) * g;
          const ix = Math.floor(fx);
          const iy = Math.floor(fy);
          let tx = fx - ix;
          let ty = fy - iy;
          tx = tx * tx * (3 - 2 * tx);
          ty = ty * ty * (3 - 2 * ty);
          const x0 = ix % g;
          const x1 = (ix + 1) % g;
          const y0 = iy % g;
          const y1 = (iy + 1) % g;
          v += amp * ((arr[y0 * g + x0] * (1 - tx) + arr[y0 * g + x1] * tx) * (1 - ty) + (arr[y1 * g + x0] * (1 - tx) + arr[y1 * g + x1] * tx) * ty);
          amp *= 0.5;
        }
        const b = clamp((v / norm - 0.5) * contrast * 255 + 128, 0, 255);
        const i = (y * size + x) * 4;
        d[i] = d[i + 1] = d[i + 2] = b;
        d[i + 3] = 255;
      }
    }
    c.putImageData(img, 0, 0);
    return cv;
  }
  const NZ = noiseCanvas(256, 11, 4, 6, 1.9);
  const NF = noiseCanvas(128, 5, 32, 2, 2.6);
  // Fills the current path with a noise texture.
  function texture(c, cv, alpha, mode = 'soft-light') {
    c.save();
    c.globalCompositeOperation = mode;
    c.globalAlpha = alpha;
    c.fillStyle = c.createPattern(cv, 'repeat');
    c.fill();
    c.restore();
  }
  function star8Path(c, x, y, r, rot = 0, inner = 0.42) {
    for (let i = 0; i < 16; i++) {
      const a = rot + (i / 16) * TAU;
      const rr = i % 2 ? r * inner : r;
      if (i) c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      else c.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    c.closePath();
  }
  // Pierced-brass lantern light: a warm glow scattered with little stars (projected on floors and walls).
  const STARLIGHT = (() => {
    const S = 512;
    const cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const c = cv.getContext('2d');
    const m = S / 2;
    const g = c.createRadialGradient(m, m, 0, m, m, m);
    g.addColorStop(0, 'rgba(255,190,110,.62)');
    g.addColorStop(0.3, 'rgba(255,160,80,.28)');
    g.addColorStop(0.7, 'rgba(255,130,60,.08)');
    g.addColorStop(1, 'rgba(255,120,50,0)');
    c.fillStyle = g;
    c.fillRect(0, 0, S, S);
    c.shadowColor = 'rgba(255,200,120,1)';
    c.shadowBlur = 10;
    const rings = [[0, 1, 26], [56, 8, 15], [100, 12, 13], [146, 16, 12], [192, 20, 10], [234, 24, 8]];
    rings.forEach(([r, n, size], k) => {
      const a = Math.max(0, 1 - r / 255);
      for (let i = 0; i < n; i++) {
        const ang = (i / n) * TAU + k * 0.2;
        const x = m + Math.cos(ang) * r;

      c.lineWidth = 3;
      c.beginPath();
      c.moveTo(cx, cy);
      c.quadraticCurveTo(mx, my, ex, ey);

    const hw = A_HW;
    const ax0 = s - 51;
    const top = APEX + 19;
    inM(c, M.py(0), () => {
      // alfiz panel
      let g = c.createLinearGradient(0, -top, 0, 0);
      g.addColorStop(0, '#f1cf98');
      g.addColorStop(1, '#a0704a');
      c.fillStyle = g;
      c.beginPath();
      c.rect(ax0, -top, 102, top);
      c.fill();
      texture(c, NZ, 0.4);
      // turquoise spandrels
      c.save();
      c.beginPath();
      c.rect(ax0 + 4, -top + 4, 94, top - 4 - A_SP + 10);
      archPath(c, s, hw + 11, A_SP);
      c.clip('evenodd');
      c.fillStyle = '#185e62';
      c.fillRect(ax0, -top, 102, top);
      for (let yy = -top + 6; yy < -A_SP; yy += 9) {
        for (let xx = ax0 + 6 + ((yy / 9) % 2 ? 4.5 : 0); xx < ax0 + 100; xx += 9) {
          c.fillStyle = '#3fb2a4';
          c.beginPath();
          star8Path(c, xx, yy, 3.6, 0, 0.5);
          c.fill();
          c.fillStyle = '#efe2c2';
          c.fillRect(xx + 3.6, yy + 3.6, 1.4, 1.4);
        }
      }
      c.restore();
      c.strokeStyle = 'rgba(255,240,210,.8)';
      c.lineWidth = 1.2;
      c.strokeRect(ax0 + 2, -top + 2, 98, top - 2);
      c.strokeStyle = 'rgba(60,30,12,.6)';
      c.strokeRect(ax0 + 0.5, -top + 0.5, 101, top - 0.5);
      // striped voussoirs (cream and red, like Cordoba)
      c.save();
      c.beginPath();
      archPath(c, s, hw + 10, A_SP);
      archPath(c, s, hw, A_SP);
      c.clip('evenodd');
      c.fillStyle = '#eed7a8';
      c.fillRect(s - 60, -top, 120, top);
      const cy = -A_SP + 14;
      for (let k = 0; k < 15; k++) {
        if (k % 2) continue;
        const a0 = Math.PI + (k / 15) * Math.PI;
        const a1 = Math.PI + ((k + 1) / 15) * Math.PI;
        c.fillStyle = '#a3402c';
        c.beginPath();
        c.moveTo(s, cy);
        c.lineTo(s + Math.cos(a0) * 200, cy + Math.sin(a0) * 200);
        c.lineTo(s + Math.cos(a1) * 200, cy + Math.sin(a1) * 200);
        c.fill();
      }
      c.restore();
      // slim columns at the jambs
      for (const cx of [s - hw - 9, s + hw + 2]) {
        g = c.createLinearGradient(cx, 0, cx + 7, 0);
        g.addColorStop(0, '#fff0d0');
        g.addColorStop(1, '#a88458');
        c.fillStyle = g;
        c.fillRect(cx, -A_SP, 7, A_SP);
        c.fillStyle = '#c99a4c';
        c.fillRect(cx - 1.5, -A_SP - 4, 10, 5);
        c.fillRect(cx - 1.5, -6, 10, 6);
      }
      // the opening: reveal, recess floor (the curtain canvas covers the rest)
      c.save();
      c.beginPath();
      archPath(c, s, hw, A_SP);
      c.clip();
      g = c.createLinearGradient(0, -APEX, 0, 0);
      g.addColorStop(0, '#2a160e');
      g.addColorStop(1, '#5a3824');
      c.fillStyle = g;
      c.fillRect(s - hw, -APEX, hw * 2, APEX);
      c.fillStyle = '#8a6440';
      c.beginPath();
      c.moveTo(s - hw, 0);
      c.lineTo(s + hw, 0);
      c.lineTo(s + hw + CURT_D, -CURT_D);
      c.lineTo(s - hw + CURT_D, -CURT_D);
      c.fill();
      c.restore();
      // pier panel behind the poster
      const p = r.sp;
      c.fillStyle = 'rgba(40,20,10,.45)';
      c.fillRect(p - 42, -150, 84, 120);
      c.strokeStyle = 'rgba(255,236,200,.4)';
      c.strokeRect(p - 41.5, -149.5, 83, 119);
      c.fillStyle = '#c99a62';
      c.fillRect(p - 44, -32, 88, 5);
    });
    // stone sill in front of the archway
    inM(c, M.floor(5), () => {
      c.fillStyle = '#c69a68';
      c.fillRect(s - hw - 8, 0, hw * 2 + 16, 10);
      c.strokeStyle = 'rgba(255,236,200,.4)';
      c.strokeRect(s - hw - 8, 0, hw * 2 + 16, 10);
    });
    inM(c, M.py(10), () => {
      c.fillStyle = '#7a5434';
      c.fillRect(s - hw - 8, -5, hw * 2 + 16, 5);
    });
  }

  function drawPierLantern(c, r) {
    const p = r.sp;
    const [bx, by] = iso(p, 0, 202);
    const [lx, ly] = iso(p, 16, 202);
    c.strokeStyle = '#2a1a0e';
    c.lineWidth = 2.2;
    c.beginPath();
    c.moveTo(bx, by);
    c.lineTo(lx, ly);
    c.moveTo(bx, by + 10);
    c.quadraticCurveTo(lx - 4, ly + 6, lx, ly);
    c.stroke();
    lanternAt(c, lx, ly + 32);
  }

  function drawWalls(c) {
    // left wall (in shade, facing south-east): restroom, booth, gate
    inM(c, M.px(0), () => {
      stoneFace(c, 0, 720, WH, [[0, '#b5825a'], [0.35, '#8e6246'], [1, '#4c3029']], 31);
      wallBands(c, 0, 720);
    });
    // right wall: the colonnade, catching the last of the sun up top
    inM(c, M.py(0), () => {
      stoneFace(c, 0, 1440, WH, [[0, '#f0b678'], [0.25, '#cc8d58'], [0.6, '#9a6844'], [1, '#64422f']], 17);
      wallBands(c, 0, 1440);
    });
    // wall tops (thickness) and merlons
    inM(c, M.floor(WH), () => {
      c.fillStyle = '#e8bd86';
      c.beginPath();
      c.rect(0, -22, 1440, 22);
      c.rect(-22, -22, 22, 742);
      c.fill();
      texture(c, NZ, 0.4);
    });
    merlons(c, M.px(0), M.px(-22), 0, 720, '#a77656', '#6a4636');
    merlons(c, M.py(0), M.py(-22), 0, 1440, '#e2a874', '#9c6a46');
    // corner pilaster hides the seam
    const [cx, cy] = iso(0, 0, 0);
    const g = c.createLinearGradient(cx - 6, 0, cx + 6, 0);
    g.addColorStop(0, '#9a6a4a');
    g.addColorStop(1, '#d8a26c');
    c.fillStyle = g;
    c.fillRect(cx - 4, cy - WH - 30, 8, WH + 30);
    for (const r of rooms) drawArch(c, r);
    for (const r of rooms) drawPierLantern(c, r);
    drawLeftWallDetails(c);
  }

  function hangingCarpet(c, s0, s1, ztop, zbot, base, seed) {
    // a rug hanging flat on the left wall
    const rnd = mulberry(seed);
    inM(c, M.px(0.5), () => {
      const w = s1 - s0;
      const hh = ztop - zbot;
      c.save();
      c.shadowColor = 'rgba(0,0,0,.45)';
      c.shadowBlur = 6;
      c.shadowOffsetY = 3;
      c.fillStyle = base;
      c.fillRect(s0, -ztop, w, hh);
      c.restore();
      c.strokeStyle = '#d9b46a';
      c.lineWidth = 2;
      c.strokeRect(s0 + 4, -ztop + 4, w - 8, hh - 8);
      c.fillStyle = '#1d2d56';
      c.fillRect(s0 + 7, -ztop + 7, w - 14, 6);
      c.fillRect(s0 + 7, -zbot - 13, w - 14, 6);
      const mx = s0 + w / 2;
      const my = -(ztop + zbot) / 2;
      c.fillStyle = '#d9b46a';
      c.beginPath();
      c.moveTo(mx, my - hh * 0.3); c.lineTo(mx + w * 0.3, my); c.lineTo(mx, my + hh * 0.3); c.lineTo(mx - w * 0.3, my);
      c.fill();
      c.fillStyle = '#1d2d56';
      c.beginPath();
      c.moveTo(mx, my - hh * 0.2); c.lineTo(mx + w * 0.2, my); c.lineTo(mx, my + hh * 0.2); c.lineTo(mx - w * 0.2, my);
      c.fill();
      c.fillStyle = '#e8d9b4';
      c.beginPath();
      star8Path(c, mx, my, w * 0.09, 0, 0.5);
      c.fill();
      for (let i = 0; i < 26; i++) {
        c.fillStyle = rnd() < 0.5 ? 'rgba(255,220,170,.25)' : 'rgba(0,0,0,.2)';
        c.fillRect(s0 + 9 + rnd() * (w - 18), -ztop + 16 + rnd() * (hh - 32), 2, 2);
      }
      c.strokeStyle = '#e8d9b4';
      c.lineWidth = 1;
      for (let x = s0 + 2; x < s1; x += 3) { c.beginPath(); c.moveTo(x, -zbot); c.lineTo(x, -zbot + 6); c.stroke(); }
      c.beginPath();
      c.rect(s0, -ztop, w, hh);
      texture(c, NF, 0.25, 'overlay');
    });
  }

  function drawLeftWallDetails(c) {
    // restroom (colonnade wall, by the corner): carved stone surround and dark doorway (the door leaf is its own canvas)
    inM(c, M.py(0), () => {
      const s = RESTROOM.s;
      c.fillStyle = '#c69a68';
      c.beginPath();
      c.moveTo(s - 26, 0); c.lineTo(s - 26, -78); c.arc(s, -78, 26, Math.PI, TAU); c.lineTo(s + 26, 0); c.closePath();
      c.fill();
      texture(c, NZ, 0.4);
      c.fillStyle = '#140a08';
      c.beginPath();
      c.moveTo(s - 21, 0); c.lineTo(s - 21, -78); c.arc(s, -78, 21, Math.PI, TAU); c.lineTo(s + 21, 0); c.closePath();
      c.fill();
    });
    {
      const [bx, by] = iso(RESTROOM.lamp, 0, 128);
      const [lx, ly] = iso(RESTROOM.lamp, 12, 128);
      c.strokeStyle = '#2a1a0e';
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(bx, by);
      c.lineTo(lx, ly);
      c.stroke();
      lanternAt(c, lx, ly + 26, 0.7);
    }
    // booth: hanging carpets and shelves on the wall behind the clerk
    hangingCarpet(c, 176, 246, 205, 92, '#8a1f24', 3);
    hangingCarpet(c, 268, 334, 200, 104, '#23466e', 9);
    inM(c, M.px(0.5), () => {
      for (const z of [74, 118]) {
        c.fillStyle = '#5a3a20';
        c.fillRect(196, -z, 120, 5);
        c.fillStyle = 'rgba(0,0,0,.35)';
        c.fillRect(196, -z + 5, 120, 4);
      }
      const rnd = mulberry(4);
      for (const z of [74, 118]) {
        for (let s = 202; s < 312; s += 14 + rnd() * 6) {
          const hh = 12 + rnd() * 10;
          const col = pick(['#2a8c86', '#b8642c', '#d8c08a', '#7a2a5a', '#3a5a9a']);
          const g = c.createLinearGradient(s - 5, 0, s + 5, 0);
          g.addColorStop(0, tone(col, 1.35));
          g.addColorStop(1, tone(col, 0.6));
          c.fillStyle = g;
          c.beginPath();
          c.ellipse(s, -z - hh * 0.45, 5, hh * 0.45, 0, 0, TAU);
          c.fill();
          c.fillRect(s - 2, -z - hh - 3, 4, 4);
        }
      }
    });
  }

  // ---------- floor ----------
  function drawFloor(c) {
    inM(c, M.floor(0), () => {
      c.save();
      c.beginPath();
      c.rect(0, 0, 1440, 1000);
      c.clip();
      c.fillStyle = '#4a3122';
      c.fillRect(0, 0, 1440, 1000);
      const rnd = mulberry(21);
      const T = 40;
      for (let x = 0; x < 1440; x += T) {
        for (let y = 0; y < 1000; y += T) {
          const l = 39 + rnd() * 11;
          c.fillStyle = `hsl(${26 + rnd() * 9} ${28 + rnd() * 14}% ${l}%)`;
          c.fillRect(x + 1.6, y + 1.6, T - 3.2, T - 3.2);
          c.fillStyle = 'rgba(255,236,200,.18)';
          c.fillRect(x + 1.6, y + 1.6, T - 3.2, 1.6);
          c.fillRect(x + 1.6, y + 1.6, 1.6, T - 3.2);
          c.fillStyle = 'rgba(40,20,8,.25)';
          c.fillRect(x + 1.6, y + T - 3.2, T - 3.2, 1.6);
          c.fillRect(x + T - 3.2, y + 1.6, 1.6, T - 3.2);
          if (rnd() < 0.13) {
            c.strokeStyle = 'rgba(40,20,10,.45)';
            c.lineWidth = 0.9;
            c.beginPath();
            let px = x + rnd() * T;
            let py = y + 2;
            c.moveTo(px, py);
            for (let k = 0; k < 4; k++) { px += (rnd() - 0.5) * 14; py += T / 4; c.lineTo(clamp(px, x + 2, x + T - 2), Math.min(py, y + T - 2)); }
            c.stroke();
          }
          if (rnd() < 0.08) {
            c.fillStyle = 'rgba(50,26,12,.4)';
            c.beginPath();
            c.moveTo(x + 2, y + 2); c.lineTo(x + 6 + rnd() * 8, y + 2); c.lineTo(x + 2, y + 6 + rnd() * 8);
            c.fill();
          }
        }
      }
      c.beginPath();
      c.rect(0, 0, 1440, 1000);
      texture(c, NZ, 0.42);
      texture(c, NF, 0.2, 'overlay');
      // large weathered patches: the same noise, stretched
      c.save();
      c.scale(3.2, 3.2);
      c.beginPath();
      c.rect(0, 0, 1440 / 3.2, 1000 / 3.2);
      texture(c, NZ, 0.3, 'multiply');
      c.restore();
      // worn, slightly polished walking lanes
      for (const [x, y, r] of [[300, 330, 260], [560, 160, 300], [200, 260, 160]]) {
        const g = c.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(255,230,190,.09)');
        g.addColorStop(1, 'rgba(255,230,190,0)');
        c.fillStyle = g;
        c.fillRect(x - r, y - r, r * 2, r * 2);
      }
      mosaicStar(c);
      mosaicBorder(c, rnd);
      drawRugs(c);
      drawSand(c);
      // ambient occlusion along the walls
      let g = c.createLinearGradient(0, 0, 0, 46);
      g.addColorStop(0, 'rgba(28,12,6,.55)');
      g.addColorStop(1, 'rgba(28,12,6,0)');
      c.fillStyle = g;
      c.fillRect(0, 0, 1440, 46);
      g = c.createLinearGradient(0, 0, 46, 0);
      g.addColorStop(0, 'rgba(28,12,6,.6)');
      g.addColorStop(1, 'rgba(28,12,6,0)');
      c.fillStyle = g;
      c.fillRect(0, 0, 46, 1000);
      c.restore();
    });
  }

  function mosaicStar(c) {
    const [fx, fy] = FOUNT;
    const R = 132;
    const starPath = (r) => {
      c.beginPath();
      c.rect(fx - r * 0.71, fy - r * 0.71, r * 1.42, r * 1.42);
      c.save();
      c.translate(fx, fy);
      c.rotate(Math.PI / 4);
      c.rect(-r * 0.71, -r * 0.71, r * 1.42, r * 1.42);
      c.restore();
    };
    c.save();
    starPath(R);
    c.clip('nonzero');
    const rnd = mulberry(55);
    const S = 6;
    for (let x = fx - R; x < fx + R; x += S) {
      for (let y = fy - R; y < fy + R; y += S) {
        if (rnd() < 0.07) continue; // missing tesserae
        const d = Math.hypot(x - fx, y - fy);
        let col;
        if (d < 92) col = rnd() < 0.5 ? '#a8482e' : '#b85a36';
        else if (d < 100) col = '#efe0bc';
        else col = rnd() < 0.5 ? '#2a8e88' : '#1f6c70';
        c.fillStyle = col;
        c.fillRect(x + 0.6, y + 0.6, S - 1.2, S - 1.2);
      }
    }
    c.restore();
    c.lineWidth = 3;
    c.strokeStyle = '#efe0bc';
    starPath(R);
    c.save();
    c.globalAlpha = 0.85;
    c.stroke();
    c.restore();
    c.save();
    starPath(R);
    c.clip();
    c.beginPath();
    c.rect(fx - R, fy - R, R * 2, R * 2);
    texture(c, NZ, 0.5);
    c.restore();
  }

  function mosaicBorder(c, rnd) {
    // a worn tile runner along the colonnade
    const y0 = 118;
    const w = 22;
    c.fillStyle = '#e4d1a8';
    c.fillRect(0, y0, 1440, w);
    for (let x = 0; x < 1440; x += w) {
      if (rnd() < 0.08) continue;
      c.fillStyle = '#237c7a';
      c.beginPath();
      c.moveTo(x + w / 2, y0 + 3); c.lineTo(x + w - 3, y0 + w / 2); c.lineTo(x + w / 2, y0 + w - 3); c.lineTo(x + 3, y0 + w / 2);
      c.fill();
      c.fillStyle = '#a8482e';
      c.fillRect(x + w / 2 - 2, y0 + w / 2 - 2, 4, 4);
    }
    c.fillStyle = '#7a3a24';
    c.fillRect(0, y0 - 2, 1440, 2);
    c.fillRect(0, y0 + w, 1440, 2);
    for (let i = 0; i < 40; i++) {
      c.fillStyle = 'rgba(200,160,110,.6)';
      c.fillRect(rnd() * 1300, y0 + rnd() * w, 3 + rnd() * 8, 2 + rnd() * 4);
    }
  }

  function rug(c, x0, y0, x1, y1, field, border, seed, fringeEnd = true) {
    const rnd = mulberry(seed);
    c.save();
    c.shadowColor = 'rgba(0,0,0,.4)';
    c.shadowBlur = 4;
    c.fillStyle = border;
    c.fillRect(x0, y0, x1 - x0, y1 - y0);
    c.restore();
    c.fillStyle = '#d6b066';
    c.fillRect(x0 + 3, y0 + 3, x1 - x0 - 6, y1 - y0 - 6);
    c.fillStyle = field;
    c.fillRect(x0 + 6, y0 + 6, x1 - x0 - 12, y1 - y0 - 12);
    const cy = (y0 + y1) / 2;
    const hh = (y1 - y0) / 2 - 10;
    for (let x = x0 + 22; x < x1 - 14; x += 34) {
      c.fillStyle = '#d6b066';
      c.beginPath();
      c.moveTo(x, cy - hh); c.lineTo(x + hh, cy); c.lineTo(x, cy + hh); c.lineTo(x - hh, cy);
      c.fill();
      c.fillStyle = border;
      c.beginPath();
      c.moveTo(x, cy - hh * 0.55); c.lineTo(x + hh * 0.55, cy); c.lineTo(x, cy + hh * 0.55); c.lineTo(x - hh * 0.55, cy);
      c.fill();
      c.fillStyle = '#e8dcc0';
      c.fillRect(x - 1.5, cy - 1.5, 3, 3);
    }
    for (let i = 0; i < 60; i++) {
      c.fillStyle = rnd() < 0.5 ? 'rgba(255,220,170,.16)' : 'rgba(0,0,0,.16)';
      c.fillRect(x0 + rnd() * (x1 - x0), y0 + rnd() * (y1 - y0), 1.5 + rnd() * 3, 1.5);
    }
    if (fringeEnd) {
      c.strokeStyle = '#efe2c4';
      c.lineWidth = 0.9;
      for (let y = y0 + 1; y < y1; y += 2.5) { c.beginPath(); c.moveTo(x1, y); c.lineTo(x1 + 6 + rnd() * 2, y + 1); c.stroke(); }
    }
    c.beginPath();
    c.rect(x0, y0, x1 - x0, y1 - y0);
    texture(c, NZ, 0.35);
  }

  function drawRugs(c) {
    rug(c, 146, 236, 478, 279, '#7c1d22', '#1d2a50', 7);         // the queue runner
    rug(c, 4, 176, 128, 336, '#23365e', '#7c1d22', 12, false);    // under the booth
    rug(c, 318, 520, 446, 600, '#5a2a14', '#1d5a5a', 14);         // at the popcorn pot
  }

  function drawSand(c) {
    const rnd = mulberry(61);
    const blob = (x, y, r, a) => {
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(226,184,124,${a})`);
      g.addColorStop(0.7, `rgba(226,184,124,${a * 0.5})`);
      g.addColorStop(1, 'rgba(226,184,124,0)');
      c.fillStyle = g;
      c.fillRect(x - r, y - r, r * 2, r * 2);
    };
    for (let s = 0; s < 1440; s += 9) blob(s, rnd() * 10, 14 + rnd() * 26 * (0.5 + 0.5 * Math.sin(s * 0.013)), 0.32);
    for (let s = 0; s < 1000; s += 9) blob(rnd() * 10, s, 14 + rnd() * 26 * (0.5 + 0.5 * Math.sin(s * 0.017 + 2)), 0.32);
    for (let i = 0; i < 26; i++) blob(rnd() * 40, rnd() * 40, 30 + rnd() * 40, 0.3); // the corner pile
    // drifts that blew in through the gate and pile at the open front
    for (let i = 0; i < 70; i++) blob(20 + rnd() * 160, 470 + rnd() * 420, 18 + rnd() * 40, 0.22);
    for (let i = 0; i < 40; i++) blob(600 + rnd() * 700, 640 + rnd() * 340, 20 + rnd() * 50, 0.18);
    // wind ripples
    c.strokeStyle = 'rgba(255,236,196,.22)';
    c.lineWidth = 1;
    for (let i = 0; i < 60; i++) {
      const x = rnd() < 0.5 ? 10 + rnd() * 120 : 600 + rnd() * 600;
      const y = x < 200 ? 500 + rnd() * 380 : 680 + rnd() * 300;
      c.beginPath();
      c.moveTo(x, y);
      c.quadraticCurveTo(x + 10, y - 6, x + 22 + rnd() * 10, y + 2);
      c.stroke();
    }
  }

  // Baked lantern light: star-pierced pools on the floor and the walls.
  function drawLightPools(c) {
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (const r of rooms) {
      inM(c, M.floor(0), () => { c.globalAlpha = 0.42; c.drawImage(STARLIGHT, r.sp - 105, 52 - 105, 210, 210); });
      inM(c, M.py(0), () => {
        c.save();
        c.beginPath();
        c.rect(-10, -WH, 1130, WH);
        c.clip();
        c.globalAlpha = 0.34;
        c.drawImage(STARLIGHT, r.sp - 110, -176 - 110, 220, 220);
        c.restore();
      });
    }
    inM(c, M.floor(0), () => {
      c.globalAlpha = 0.55;
      c.drawImage(STARLIGHT, 150 - 110, 205 - 110, 220, 220);
      c.drawImage(STARLIGHT, 150 - 110, 305 - 110, 220, 220);
      c.globalAlpha = 0.32;

  function drawCurtain(r, t = 0) {
    const c = r.cctx;
    const W = CW;
    const H = CHt;
    c.clearRect(0, 0, W, H);
    c.save();
    c.beginPath();
    c.save(); c.translate(0, H); archPath(c, A_HW, A_HW, A_SP); c.restore();
    c.clip();
    c.beginPath();
    c.save(); c.translate(0, H + CURT_D); archPath(c, A_HW - CURT_D, A_HW, A_SP); c.restore();
    c.clip();
    // projector light behind the curtain
    let g = c.createLinearGradient(0, H, 0, 0);
    g.addColorStop(0, ROOM_LEAK[r.i]);
    g.addColorStop(0.45, 'rgba(70,40,30,1)');
    g.addColorStop(1, 'rgba(20,10,8,1)');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
    const base = ROOM_COL[r.i];
    const open = r.sway;
    const top = 18;
    const fold = (x0, x1, v, hh, ph) => {
      if (x1 - x0 < 1) return;
      const gg = c.createLinearGradient(x0, 0, x1, 0);
      const n = 7;
      for (let k = 0; k <= n; k++) {
        const f = 0.55 + 0.45 * Math.cos((k / n) * Math.PI * 6 + ph);
        gg.addColorStop(k / n, tone(base, 0.55 + f * 0.75));
      }
      c.fillStyle = gg;
      c.fillRect(x0, v, x1 - x0, hh);
    };
    for (let v = top; v < H - 3; v += 4) {
      const f = (v - top) / (H - top);
      const gap = open * 30 * f ** 1.2;
      const sw = Math.sin(t * 6 + v * 0.06) * open * 5 * f;
      const L = W / 2 - gap / 2 + sw;
      fold(0, L, v, 4.6, sw * 0.3);
      fold(W / 2 + gap / 2 + sw, W, v, 4.6, sw * 0.3 + 1);
      // gold borders along the inner edges
      c.fillStyle = 'rgba(232,192,104,.85)';
      c.fillRect(L - 3, v, 1.6, 4.6);
      c.fillRect(W / 2 + gap / 2 + sw + 1.4, v, 1.6, 4.6);
    }
    // hem and fringe
    c.fillStyle = '#e8c068';
    c.fillRect(0, H - 13, W, 3);
    c.strokeStyle = 'rgba(240,200,110,.9)';
    c.lineWidth = 0.8;
    for (let x = 1; x < W; x += 2.2) {
      if (Math.abs(x - W / 2) < open * 15) continue;
      c.beginPath(); c.moveTo(x, H - 10); c.lineTo(x, H - 4); c.stroke();
    }
    // valance
    g = c.createLinearGradient(0, 0, 0, top + 6);
    g.addColorStop(0, tone(base, 0.4));
    g.addColorStop(1, tone(base, 0.9));
    c.fillStyle = g;
    c.fillRect(0, 0, W, top);
    c.fillStyle = '#e8c068';
    for (let x = 4; x < W; x += 10) {
      c.beginPath();
      c.moveTo(x, top - 2); c.lineTo(x + 5, top + 5); c.lineTo(x + 10, top - 2);
      c.fill();
    }
    // shadow at the top of the recess
    g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(10,4,2,.65)');
    g.addColorStop(0.5, 'rgba(10,4,2,.1)');
    g.addColorStop(1, 'rgba(10,4,2,0)');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
    c.restore();
  }

  function drawBunting() {
    const c = overCtx;
    c.clearRect(0, 0, 1920, 1080);
    const rnd = mulberry(29);
    const COLS = ['#c8322e', '#e9b23a', '#2a9a8e', '#f1e4c8', '#7a3b8c', '#2c58a0'];
    const string = (a, b, sag) => {
      const [x0, y0] = a;
      const [x1, y1] = b;
      const mx = (x0 + x1) / 2;
      const my = (y0 + y1) / 2 + sag;
      c.strokeStyle = 'rgba(40,24,14,.9)';
      c.lineWidth = 1.2;
      c.beginPath();
      c.moveTo(x0, y0);
      c.quadraticCurveTo(mx, my, x1, y1);
      c.stroke();
      const n = Math.floor(Math.hypot(x1 - x0, y1 - y0) / 26);
      for (let i = 1; i < n; i++) {
        const t = i / n;
        const px = (1 - t) ** 2 * x0 + 2 * (1 - t) * t * mx + t * t * x1;
        const py = (1 - t) ** 2 * y0 + 2 * (1 - t) * t * my + t * t * y1;
        const tx = 2 * (1 - t) * (mx - x0) + 2 * t * (x1 - mx);
        const ty = 2 * (1 - t) * (my - y0) + 2 * t * (y1 - my);
        const ang = Math.atan2(ty, tx) + (rnd() - 0.5) * 0.2;
        c.save();
        c.translate(px, py);
        c.rotate(ang);
        const col = COLS[i % COLS.length];
        const g = c.createLinearGradient(0, 0, 0, 22);
        g.addColorStop(0, tone(col, 1.08));
        g.addColorStop(1, tone(col, 0.6));
        c.fillStyle = g;

        c.moveTo(-8, 0);
        c.lineTo(8, 0);
        c.lineTo(0, 20);
        c.closePath();
        c.fill();
        c.restore();
      }
    };

  }

    for (const [i, [x, y]] of TORCHES.entries()) {
      flame(x, y, 1.1, t, i * 2.1);
      if (Math.random() < dt * 3) emit({ x: x + rand(-3, 3), y: y - 14, vx: rand(-6, 6), vy: rand(-40, -22), life: rand(0.8, 1.5), max: 1.5, c: '255,170,70', r: 1.4 });
    }
    flame(POP_SCR[0] - 12, POP_SCR[1] - 33, 0.7, t, 3);
    flame(POP_SCR[0] + 10, POP_SCR[1] - 33, 0.65, t, 5);
    if (Math.random() < dt * 4) emit({ x: POP_SCR[0] + rand(-24, 24), y: POP_SCR[1] - 40, vx: rand(-8, 8), vy: rand(-34, -20), life: rand(0.6, 1.2), max: 1.2, c: '255,150,60', r: 1.3 });
    // popping kernels jump out of the pot now and then
    if (Math.random() < dt * 2.2) emit({ x: POP_SCR[0] + rand(-26, 26), y: POP_SCR[1] - 96, vx: rand(-30, 30), vy: rand(-90, -50), life: 0.9, max: 0.9, c: '255,248,225', r: 2.2, g: 220 });
    // fountain: water spilling from the bowl into the basin
    const [fx0, fy0] = FOUNT_TOP;
    fx.strokeStyle = 'rgba(190,230,255,.38)';
    fx.lineWidth = 2.2;
    for (let k = 0; k < 10; k++) {
      const a = (k / 10) * TAU;
      const sx = fx0 + Math.cos(a) * 38;
      const sy = fy0 + Math.sin(a) * 12;
      const ex = fx0 + Math.cos(a) * 54;
      const ey = FOUNT_SCR[1] - 18 + Math.sin(a) * 22;
      fx.beginPath();
      fx.moveTo(sx, sy);
      fx.quadraticCurveTo(lerp(sx, ex, 0.7), sy - 2, ex, ey);
      fx.stroke();
    }
    fx.strokeStyle = 'rgba(200,236,255,.55)';
    fx.lineWidth = 1.6;
    fx.beginPath();
    for (let i = 0; i < 3; i++) {
      const f = ((t * 0.5 + i / 3) % 1);
      fx.ellipse(FOUNT_SCR[0], FOUNT_SCR[1] - 19, 40 + f * 50, (40 + f * 50) * 0.5, 0, 0, TAU);
    }
    fx.globalAlpha = 0.5;
    fx.stroke();
    fx.globalAlpha = 1;
    // a small jet from the finial
    if (Math.random() < dt * 30) emit({ x: fx0 + rand(-2, 2), y: fy0 - 24, vx: rand(-26, 26), vy: rand(-60, -40), life: 0.7, max: 0.7, c: '210,240,255', r: 1.5, g: 160 });
    if (Math.random() < dt * 5) {
      const a = rand(0, TAU);
      emit({ x: FOUNT_SCR[0] + Math.cos(a) * rand(10, 80), y: FOUNT_SCR[1] - 19 + Math.sin(a) * rand(5, 40), vx: 0, vy: 0, life: 0.35, max: 0.35, c: '255,255,255', r: 1.2, spark: true });
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vy += (p.g || 0) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const a = Math.min(1, (p.life / p.max) * 1.6);
      fx.fillStyle = `rgba(${p.c},${a})`;
      if (p.spark) {
        const s = 4 * Math.sin((p.life / p.max) * Math.PI);
        fx.fillRect(p.x - s, p.y - 0.6, s * 2, 1.2);
        fx.fillRect(p.x - 0.6, p.y - s, 1.2, s * 2);
      } else {
        fx.beginPath();
        fx.arc(p.x, p.y, p.r, 0, TAU);
        fx.fill();
      }
    }
  }

  // ---------- title clock, next showtime, green screen info ----------
  function nextShowText() {
    const s = Cinema.showtimes()[0];
    if (!s) return 'Next show not announced yet';
    return s.live ? 'Movie night · showing now' : `Next show · ${Cinema.dayShort(s.start)}, ${Cinema.timeLocal(s.start)}`;
  }
  function updateTitle() {
    $('clock').textContent = SB.clockText();
    $('next').textContent = nextShowText();
  }
  setInterval(updateTitle, 1000);
  updateTitle();
  function renderInfo() {
    const green = $('green');
    if (Cinema.green !== 'off') return;
    const rows = [h('div', 'ih', 'Showtimes')];
    const shows = Cinema.showtimes().slice(0, 3);
    for (const s of shows) {
      rows.push(h('div', 'ir', h('span', '', s.live ? 'Movie night · now' : `Movie night · ${Cinema.dayShort(s.start)}`),
        h('span', '', s.live ? `until ${Cinema.timeLocal(s.end)}` : Cinema.timeLocal(s.start))));
    }
    if (!shows.length) rows.push(h('div', 'ir dim', 'Next movie night not announced yet'));
    rows.push(h('div', 'ih2', 'In the arcade tonight'));
    Cinema.rooms.forEach((f, i) => {
      rows.push(h('div', 'ir dim', h('span', '', `${ROMAN[i]}  ${f.title}${f.year ? ` (${f.year})` : ''}`),
        h('span', '', f.rating != null ? `★ ${Number(f.rating).toFixed(1)}/5` : '')));
    });
    green.replaceChildren(...rows);
  }
  if (Cinema.green === 'off') {
    $('green').classList.add('off');
    renderInfo();
    setInterval(renderInfo, 15_000);
  } else {
    $('green').style.background = Cinema.green;
  }

  // ---------- walkers (positions in world units, drawn at iso(x, y)) ----------
  const EH = 54;
  const MAX_WALKERS = 45;
  const HARD_CAP = 70;
  const MAX_BUBBLES = 4;
  const walkers = new Map();
  const active = new Set();
  const queue = [];
  const bubbles = [];
  let serving = null;
  let seq = 0;
  let flipOK = false;
  SB.on('emotes', () => { flipOK = SB.emotes.css; });
  const combo = { emote: null, start: 0, until: 0 };
  const POP_URL = (() => {
    const cv = document.createElement('canvas');
    cv.width = 44;
    cv.height = 56;
    const c = cv.getContext('2d');
    for (let k = 0; k < 5; k++) {
      c.fillStyle = k % 2 ? '#f4ecdc' : '#c8283a';
      c.beginPath();
      c.moveTo(6 + k * 6.4, 20); c.lineTo(6 + (k + 1) * 6.4, 20); c.lineTo(10 + (k + 1) * 4.8, 56); c.lineTo(10 + k * 4.8, 56);
      c.fill();
    }
    const rnd = mulberry(9);
    for (let i = 0; i < 26; i++) {
      const x = 8 + rnd() * 28;
      const y = 6 + rnd() * 16;
      const g = c.createRadialGradient(x - 1, y - 1, 0.5, x, y, 5);
      g.addColorStop(0, '#fffdf2');
      g.addColorStop(1, rnd() < 0.3 ? '#e8b850' : '#e6d6b0');
      c.fillStyle = g;
      c.beginPath();
      c.arc(x, y, 4.4, 0, TAU);
      c.fill();
    }
    return `url(${cv.toDataURL()})`;
  })();

  function setEmote(g, name, poof = true) {
    if (g.emote === name) return;
    g.emote = name;
    const e = SB.emoteEl(name, EH);
    const w = Number(e.dataset.w) || EH;
    e.style.left = `${-w / 2}px`;
    g.halfW = w / 2;
    g.bod.replaceChildren(e);
    if (g.carryEl) { g.carryEl.style.left = `${g.halfW - 6}px`; g.bod.append(g.carryEl); }
    if (poof) e.animate([{ filter: 'brightness(2)', transform: 'scale(1.3)' }, { filter: 'none', transform: 'none' }], { duration: 350, easing: 'ease-out' });
  }

  function makeWalker(w) {
    const g = {
      nick: w.nick, key: w.nick.toLowerCase(), emote: null, room: w.roomIndex, detour: w.detour,
      x: SPAWN[0] + rand(-6, 2), y: SPAWN[1] + rand(-28, 28), path: [], then: null, speed: rand(80, 98),
      phase: rand(0, 6), facing: 1, state: 'spawn', seq: seq++, spawnT: 0, tAt: 0, tFn: null, hurry: false,
      fadeT: 0, idle: 0, z: -1, bub: null, bubUntil: 0, bubW: 0, bubShift: null, halfW: EH / 2, qj: rand(-5, 5),
    };
    g.el = h('div', 'w');
    g.bod = h('div', 'bod');
    g.el.append(h('div', 'sh'), g.bod);
    g.el.style.opacity = '0';
    g.lab = h('div', 'lab');
    const tag = h('div', 'tag');
    if (w.sub) tag.append(h('i', '', '◆'));
    tag.append(w.nick);
    tag.style.color = w.color;
    g.lab.append(tag);
    g.lab.style.opacity = '0';
    world.append(g.el);
    labels.append(g.lab);
    setEmote(g, w.emote, false);
    walkers.set(g.key, g);
    active.add(g);
    gateLight.pulse = 1;
    const [sx, sy] = iso(g.x, g.y);
    for (let i = 0; i < 10; i++) emit({ x: sx + rand(-20, 20), y: sy - rand(0, 8), vx: rand(-20, 20), vy: rand(-14, -4), life: rand(0.5, 1), max: 1, c: '226,190,140', r: 2.2 });
    return g;
  }

  function removeWalker(g) {
    g.el.remove();
    g.lab.remove();
    dropBubble(g);
    active.delete(g);
    if (walkers.get(g.key) === g) walkers.delete(g.key);
    const qi = queue.indexOf(g);
    if (qi >= 0) queue.splice(qi, 1);
    if (serving && serving.g === g) serving = null;
    if (rest.occupant === g) freeRestroom();
  }

  const later = (g, ms, fn) => { g.tAt = now() + ms; g.tFn = fn; };
  const go = (g, pts, then) => { g.path = pts.map((p) => [p[0], p[1]]); g.then = then || null; };

  function begin(g) {
    g.el.style.opacity = '';
    g.lab.style.opacity = '';
    if (g.hurry || queue.length >= QMAX) {
      go(g, [[EXIT[0] + rand(-10, 30), EXIT[1] + rand(-26, 26)]], () => { if (Math.random() < 0.2) floatText(g, 'has a ticket', 't'); afterTicket(g); });
    } else {
      go(g, [[EXIT[0] + rand(-10, 20), EXIT[1] + rand(-26, 26)]], () => { g.state = 'queue'; queue.push(g); });
    }
    if (queue.length === 0 && Math.random() < 0.25) setTimeout(() => clerkSay('Greetings, stranger!'), 900);
  }

  function afterTicket(g) {
    g.state = 'go';
    if (g.detour === 'popcorn' && !g.hurry) {
      const spot = pick(POP_SPOTS);
      go(g, [[spot[0] + rand(-6, 6), spot[1] + rand(-6, 6)]], () => {
        g.state = 'popcorn';
        g.facing = -1;
        if (Math.random() < 0.4) vendorSay(pick(['Hot popcorn!', 'Fresh from the pot!', 'Extra butter, friend?']));
        later(g, rand(1500, 2400), () => {
          g.popcorn = true;
          g.carryEl = h('div', 'carry');
          g.carryEl.style.backgroundImage = POP_URL;
          g.carryEl.style.left = `${g.halfW - 6}px`;
          g.bod.append(g.carryEl);
          floatText(g, '+1 popcorn');
          toRoom(g);
        });
      });
    } else if (g.detour === 'bathroom' && !g.hurry) {
      g.state = 'toRest';
      go(g, [[170, 150], RESTROOM.front], () => tryRestroom(g));
    } else {
      toRoom(g);
    }
  }

  function toRoom(g) {
    g.state = 'toRoom';
    const r = rooms[g.room] || rooms[0];
    const pts = [];
    if (g.y > 330) pts.push([clamp(g.x + 60, 300, 470), 300]);
    pts.push([r.s + rand(-12, 12), rand(68, 100)], [r.s + rand(-4, 4), 22]);
    go(g, pts, () => enterRoom(g, r));
  }

  function enterRoom(g, r) {
    g.state = 'entering';
    g.fadeT = 0;
    g.ix = g.x;
    g.iy = g.y;
    dropBubble(g);
    r.sway = 1;
    r.swayStart = now();
    r.light.pulse = 1;
    noteEntry(r);
    if (walkers.get(g.key) === g) walkers.delete(g.key);
  }

  // restroom
  const rest = { occupant: null };
  function freeRestroom() {
    rest.occupant = null;
    setRestSign(false);
    doorOpen = false;
    drawDoor();
  }
  function tryRestroom(g, waited = 0) {
    if (g.hurry) { toRoom(g); return; }
    if (!rest.occupant) {
      rest.occupant = g;
      setRestSign(true);
      doorOpen = true;
      drawDoor();
      go(g, [RESTROOM.door], () => {
        g.state = 'rest';
        g.el.classList.add('hid');
        g.lab.classList.add('hid');
        dropBubble(g);
        setTimeout(() => { if (rest.occupant === g) { doorOpen = false; drawDoor(); } }, 450);
        later(g, rand(3200, 5600), () => leaveRestroom(g));
      });
      return;
    }
    if (waited > 8000) { floatText(g, "can't wait!", 't'); toRoom(g); return; }
    g.state = 'waitRest';
    const [wx, wy] = RESTROOM.waits[g.seq % 2];
    go(g, [[wx + rand(-4, 4), wy + rand(-4, 4)]], () => later(g, 450, () => tryRestroom(g, waited + 450)));
  }
  function leaveRestroom(g) {
    doorOpen = true;
    drawDoor();
    g.el.classList.remove('hid');
    g.lab.classList.remove('hid');
    floatText(g, pick(['ahh, refreshed', 'much better', '+10 relief']), 't');
    go(g, [RESTROOM.front], () => {
      if (rest.occupant === g) freeRestroom();
      toRoom(g);
    });
  }

  function hurry(g) {
    if (g.hurry) return;
    g.hurry = true;
    g.speed *= 2.2;
    const qi = queue.indexOf(g);
    if (qi >= 0 && !(serving && serving.g === g)) { queue.splice(qi, 1); afterTicket(g); return; }
    if (g.state === 'rest') { g.tFn = null; leaveRestroom(g); } else if (['popcorn', 'waitRest', 'toRest'].includes(g.state)) { g.tFn = null; toRoom(g); }
  }
  function enforceCap() {
    const list = [...active].filter((g) => g.state !== 'entering').sort((a, b) => a.seq - b.seq);
    for (let i = 0; i < list.length - MAX_WALKERS; i++) hurry(list[i]);
    for (let i = 0; i < list.length - HARD_CAP; i++) removeWalker(list[i]);
  }

  // ---------- bubbles and floating text (labels layer) ----------
  const TEXT_RIGHT = $('chatpanel') ? 1570 : 1905;
  const edgeShift = (x, w) => Math.round(Math.min(0, TEXT_RIGHT - (x + w / 2)) + Math.max(0, 10 - (x - w / 2)));
  function placeBub(o, x) {
    if (!o.bub) return;
    const s = edgeShift(x, o.bubW);
    if (s !== o.bubShift) {
      o.bubShift = s;
      o.bub.style.transform = `translateX(${Math.round(-o.bubW / 2) + s}px)`;
      o.bub.style.setProperty('--tail', `${clamp(-s, -o.bubW / 2 + 14, o.bubW / 2 - 14)}px`);
    }
  }
  function dropBubble(o) {
    if (o.bub) { o.bub.remove(); o.bub = null; }
    const i = bubbles.indexOf(o);
    if (i >= 0) bubbles.splice(i, 1);
  }
  let bubZ = 1;
  function attachBubble(o, el, x, ms) {
    dropBubble(o);
    while (bubbles.length >= MAX_BUBBLES) dropBubble(bubbles[0]);
    el.style.zIndex = String(bubZ++);
    o.lab.append(el);
    o.bub = el;
    o.bubW = el.offsetWidth;
    o.bubShift = null;
    o.bubUntil = now() + ms;
    bubbles.push(o);
    placeBub(o, x);
  }
  function bubble(g, tokens) {
    if (g.state === 'rest' || g.state === 'entering') return;
    const el = h('div', 'bub');
    SB.renderTokens(el, tokens, 24, 60);
    attachBubble(g, el, iso(g.x, g.y)[0], 5000);
  }
  function floatText(g, text, kind = '') {
    const el = h('div', `ftext ${kind}`, text);
    el.addEventListener('animationend', () => el.remove());
    g.lab.append(el);
    el.style.left = `${edgeShift(iso(g.x, g.y)[0], el.offsetWidth)}px`;
  }
  // NPC speakers: the clerk and the popcorn vendor
  function npc(x, y, bottom) {
    const lab = h('div', 'lab');
    lab.style.transform = `translate(${x}px, ${y}px)`;
    labels.append(lab);
    return { lab, x, bottom, bub: null, bubUntil: 0, bubW: 0, bubShift: null };
  }
  const CLERK_SCR = iso(...CLERK);
  const clerkNpc = npc(CLERK_SCR[0], CLERK_SCR[1], 150);
  const vendorNpc = npc(POP_SCR[0] - 66, POP_SCR[1], 130);
  function npcSay(n, text) {
    const el = h('div', 'bub', text);
    el.style.bottom = `${n.bottom}px`;
    el.style.borderColor = '#2fb3a2';
    attachBubble(n, el, n.x, 3800);
  }
  const clerkSay = (t) => npcSay(clerkNpc, t);
  const vendorSay = (t) => npcSay(vendorNpc, t);

  // ---------- the ticket hand-over ----------
  function serveMs() { return queue.length > 5 ? 450 : queue.length > 3 ? 800 : 1500; }
  function handTicket(g) {
    const [x0, y0] = iso(118, 262, 66);
    const [x1, y1] = iso(g.x, g.y, EH + 6);
    const tk = h('div', 'ticket');
    labels.append(tk);
    tk.animate([
      { transform: `translate(${x0}px, ${y0}px) rotate(-20deg) scale(.6)`, opacity: 0 },
      { transform: `translate(${(x0 + x1) / 2}px, ${Math.min(y0, y1) - 30}px) rotate(10deg) scale(1.1)`, opacity: 1, offset: 0.5 },
      { transform: `translate(${x1}px, ${y1}px) rotate(0deg) scale(1)`, opacity: 1, offset: 0.85 },
      { transform: `translate(${x1}px, ${y1 - 14}px) scale(.8)`, opacity: 0 },
    ], { duration: 650, easing: 'ease-out' }).onfinish = () => tk.remove();
    clerkP.cv.animate([{ transform: 'none' }, { transform: 'translate(3px, 3px) rotate(1.5deg)' }, { transform: 'none' }], { duration: 420 });
  }

  Cinema.onWalkIn((w) => {
    let g = walkers.get(w.nick.toLowerCase());
    if (g && g.state !== 'entering') setEmote(g, w.emote);
    else g = makeWalker(w);
    bubble(g, w.tokens);
    enforceCap();
  });
  Cinema.onPurge((nick) => {
    const key = String(nick).toLowerCase();
    for (const g of [...active]) if (g.key === key) removeWalker(g);
  });
  let comboTimer = 0;
  Cinema.onCombo(({ emote, count }) => {
    const t = now();
    if (combo.emote !== emote || t > combo.until) combo.start = t;
    combo.emote = emote;
    combo.until = t + 2600;
    if (count < 3) return;
    $('combo').replaceChildren(SB.emoteEl(emote, 56), h('span', '', `${count}× COMBO`));
    $('combo').classList.add('show');
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => $('combo').classList.remove('show'), 2200);
  });

  // ---------- per frame ----------
  const easeOutBack = (x) => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2;
  function moveToward(g, tx, ty, dt) {
    const dx = tx - g.x;
    const dy = ty - g.y;
    const d = Math.hypot(dx, dy);
    const step = g.speed * dt;
    if (d <= step) { g.x = tx; g.y = ty; return true; }
    g.x += (dx / d) * step;
    g.y += (dy / d) * step;
    const sdx = dx - dy; // screen x direction
    if (Math.abs(sdx) > 2) g.facing = sdx > 0 ? 1 : -1;
    return false;
  }

  function stepQueue(t) {
    if (serving && t >= serving.until) {
      const g = serving.g;
      serving = null;
      const qi = queue.indexOf(g);
      if (qi >= 0) queue.splice(qi, 1);
      handTicket(g);
      later(g, 380, () => afterTicket(g));
      g.state = 'gotTicket';
    }
  }

  function stepWalker(g, t, dt) {
    let moving = false;
    if (g.state === 'spawn') {
      g.spawnT += dt;
      const a = Math.min(1, g.spawnT / 0.5);
      g.el.style.opacity = String(a);
      g.lab.style.opacity = String(a);
      if (g.spawnT >= 0.5) { g.state = 'out'; begin(g); }
    } else if (g.state === 'entering') {
      g.fadeT = Math.min(1, g.fadeT + dt / 0.9);
      const r = rooms[g.room] || rooms[0];
      g.x = lerp(g.ix, r.s, g.fadeT);
      g.y = lerp(g.iy, -16, g.fadeT);
      g.el.style.opacity = String(1 - g.fadeT);
      g.lab.style.opacity = String(1 - g.fadeT);
      moving = true;
      if (g.fadeT >= 1) { removeWalker(g); return; }
    } else if (g.tFn) {
      if (t >= g.tAt) { const fn = g.tFn; g.tFn = null; fn(); }
    } else if (g.path.length) {
      if (moveToward(g, g.path[0][0], g.path[0][1], dt)) {
        g.path.shift();
        if (!g.path.length && g.then) { const cb = g.then; g.then = null; cb(); }
      }
      moving = true;
    } else if (g.state === 'queue') {
      const qi = queue.indexOf(g);
      const [qx, qy] = QSLOT(Math.max(0, qi));
      const tx = qx;
      const ty = qy + g.qj;
      if (Math.hypot(tx - g.x, ty - g.y) > 1.5) {
        moveToward(g, tx, ty, dt);
        moving = true;
      } else {
        g.facing = -1;
        if (qi === 0 && !serving) serving = { g, until: t + serveMs() };
      }
    }

    let s;
    let lift = 0;
    let bouncing = false;
    if (t < combo.until && g.emote === combo.emote && g.state !== 'entering') {
      s = Math.abs(Math.sin(((t - combo.start) / 1000) * 11));
      lift = s * 30;
      bouncing = true;
    } else if (moving) {
      g.phase += dt * (g.hurry ? 17 : 10.5);
      s = Math.abs(Math.sin(g.phase));
      lift = s * 16;
      bouncing = true;
    } else {
      if (!g.idle && Math.random() < dt * 0.35) g.idle = 0.001;
      if (g.idle) { g.idle += dt * 9; if (g.idle >= Math.PI) g.idle = 0; }
      s = Math.abs(Math.sin(g.idle));
      lift = s * 18;
      bouncing = g.idle > 0;
    }
    const sq = bouncing && s < 0.2 ? 0.86 : bouncing && s > 0.85 ? 1.05 : 1;
    const f = flipOK ? g.facing : 1;
    const sc = g.state === 'spawn' ? 0.6 + 0.4 * easeOutBack(Math.min(1, g.spawnT / 0.5)) : g.state === 'entering' ? 1 - g.fadeT * 0.25 : 1;
    const [sx, sy] = iso(g.x, g.y);
    g.el.style.transform = `translate3d(${sx.toFixed(1)}px, ${sy.toFixed(1)}px, 0)${sc !== 1 ? ` scale(${sc.toFixed(3)})` : ''}`;
    g.bod.style.transform = `translateY(${(-lift).toFixed(1)}px) scale(${(f * (2 - sq)).toFixed(3)}, ${sq})`;
    g.lab.style.transform = `translate3d(${sx.toFixed(1)}px, ${sy.toFixed(1)}px, 0)`;
    const z = Math.round(sy);
    if (z !== g.z) { g.z = z; g.el.style.zIndex = String(z); }
    if (g.bub && t > g.bubUntil) dropBubble(g);
    placeBub(g, sx);
    // the snake rises when someone walks past its basket
    if (snake.state === 'idle' && t > snake.cool && Math.hypot(g.x - BASKET[0], g.y - BASKET[1]) < 100) {
      snake.state = 'rise';
      snake.t = 0;
    }
  }

  function stepSnake(dt) {
    if (snake.state === 'idle') return;
    snake.t += dt;
    if (snake.state === 'rise' && snake.t > 1.1) { snake.state = 'sway'; snake.t = 0; }
    else if (snake.state === 'sway' && snake.t > 3) { snake.state = 'sink'; snake.t = 0; }
    else if (snake.state === 'sink' && snake.t > 0.9) { snake.state = 'idle'; snake.cool = now() + rand(20_000, 40_000); }
    basketP.draw();
  }

  // camel: peeks in from the left edge every minute or two
  const camel = { off: -330, target: -330, shown: -330 };
  function stepCamel(dt) {
    camel.off += (camel.target - camel.off) * Math.min(1, dt * 1.8);
    const o = Math.round(camel.off);
    if (o !== camel.shown) { camel.shown = o; camelWrap.style.transform = `translateX(${o}px)`; }
    camelLight.a = 0.7 * (1 - Math.min(1, -camel.off / 330));
  }
  function camelVisit() {
    camel.target = 0;
    const blink = () => { camelBlink = true; drawCamel(); setTimeout(() => { camelBlink = false; drawCamel(); }, 160); };
    setTimeout(blink, 2600);
    setTimeout(blink, 5200);
    setTimeout(() => { camel.target = -330; }, 8000);
    setTimeout(camelVisit, rand(55_000, 110_000));
  }
  setTimeout(camelVisit, q.has('demo') ? 9000 : rand(30_000, 60_000));
  // the clerk greets the arcade now and then
  (function clerkTimer() {
    setTimeout(() => { clerkSay(pick(['Greetings, stranger!', 'Greetings, stranger!', 'Tickets! Fresh tickets!', 'Five halls, one price!'])); clerkTimer(); }, rand(35_000, 80_000));
  })();
  setTimeout(() => clerkSay('Greetings, stranger!'), 2500);

  let last = now();
  function frame() {
    const t = now(); // one clock for everything (rAF timestamps can lag performance.now in throttled/virtual time)
    const dt = Math.min(0.05, Math.max(0, (t - last) / 1000));
    last = t;
    const ts = t / 1000;
    stepQueue(t);
    for (const g of active) stepWalker(g, t, dt);
    for (const n of [clerkNpc, vendorNpc]) if (n.bub && t > n.bubUntil) dropBubble(n);
    stepSnake(dt);
    stepCamel(dt);
    for (const r of rooms) {
      if (r.sway > 0) {
        r.sway = Math.max(0, 1 - (t - r.swayStart) / 1600);
        drawCurtain(r, ts);
      }
    }
    for (const L of lights) if (L.pulse > 0) L.pulse = Math.max(0, L.pulse - dt * 1.2);
    drawLights(ts);
    drawFx(ts, dt);
  }
  const loop = () => { frame(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  // Fallback tick when rAF stalls (headless capture, some throttled sources); a no-op while rAF runs.
  setInterval(() => { if (now() - last > 250) frame(); }, 100);
  setInterval(() => { SB.topEmotes(1); SB.topWords(1); }, 30_000);

  SB.start();
})();
</script>
