<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DinkDonk Intermission</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
  :root {
    --red: #ed3237; --red-dim: rgba(237, 50, 55, .18); --ink: #f4f1ea; --dim: #9b968c; --line: rgba(244, 241, 234, .12);
    --good: #43d17a; --mid: #f2c14e; --bad: #ff5a5f; --bg: #0b0a0c; --panel: rgba(16, 14, 18, .78);
  }
  #stage { background: var(--bg); color: var(--ink); font-family: 'Inter Tight', sans-serif; }
  .anton { font-family: 'Anton', sans-serif; font-weight: 400; letter-spacing: .5px; }
  .mono { font-family: 'DM Mono', monospace; }
  .label { font: 500 17px 'DM Mono', monospace; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); }

  /* ---- backdrop ---- */
  .backdrop { position: absolute; inset: -80px; background-size: cover; background-position: center; filter: blur(70px) saturate(1.3);
    opacity: 0; transition: opacity 1.6s ease; transform: scale(1.1); }
  .backdrop.on { opacity: .38; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 40% 45%, transparent 30%, rgba(0,0,0,.75) 100%), linear-gradient(transparent 70%, rgba(0,0,0,.6)); }
  #grain { position: absolute; inset: 0; opacity: .08; pointer-events: none; mix-blend-mode: overlay; animation: grain 1s steps(4) infinite;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }
  @keyframes grain { 25% { transform: translate(-6px, 4px); } 50% { transform: translate(5px, -3px); } 75% { transform: translate(-3px, -5px); } }

  /* ---- header ---- */
  #head { position: absolute; left: 56px; top: 34px; width: 1360px; height: 74px; display: flex; align-items: center; gap: 22px; }
  #logo { height: 58px; }
  #wordmark { font: 400 44px 'Anton'; color: var(--red); display: none; }
  #pill { padding: 6px 14px 5px; border-radius: 6px; background: var(--red); color: #fff; font: 500 16px 'DM Mono'; letter-spacing: 3px; }
  #headline { font: 400 44px/1 'Anton'; letter-spacing: 1px; }
  #head .grow { flex: 1; }
  #timerbox { text-align: right; }
  #timer { font: 400 54px/1 'Anton'; font-variant-numeric: tabular-nums; }

  /* ---- segment area ---- */
  #segs { position: absolute; left: 56px; top: 132px; width: 1360px; height: 790px; }
  .seg { position: absolute; inset: 0; opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1); }
  .seg.in { opacity: 1; transform: none; }
  .seg.out { opacity: 0; transform: translateY(-18px); }
  .kicker { display: flex; align-items: center; gap: 14px; }
  .kicker .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); box-shadow: 0 0 14px var(--red); }
  .h1 { font: 400 96px/0.95 'Anton'; letter-spacing: .5px; margin: 14px 0 0; text-transform: uppercase; }
  .h2 { font: 400 54px/1 'Anton'; text-transform: uppercase; }

  .poster { position: relative; flex: none; border-radius: 10px; overflow: hidden; background: linear-gradient(135deg, #2a2230, #15121a);
    box-shadow: 0 18px 50px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08); }
  .poster img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 10px; text-align: center; font: 400 22px/1.05 'Anton'; color: var(--dim); text-transform: uppercase; }
  .score { display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; font: 500 22px 'DM Mono'; padding: 3px 10px; color: #000; }
  .s-good { background: var(--good); } .s-mid { background: var(--mid); } .s-bad { background: var(--bad); } .s-none { background: #444; color: #ddd; }
  .badge { display: inline-block; padding: 5px 12px 4px; border-radius: 6px; border: 1px solid var(--line); font: 500 17px 'DM Mono'; letter-spacing: 2px; text-transform: uppercase; }
  .badge.red { background: var(--red); border-color: var(--red); color: #fff; }

  /* last watched */
  .last { display: flex; gap: 56px; align-items: flex-start; padding-top: 10px; }
  .last .poster { width: 400px; height: 600px; }
  .last .meta { flex: 1; min-width: 0; }
  .last .facts { margin-top: 18px; font-size: 26px; color: var(--dim); }
  .last .picked { margin-top: 26px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 24px; }
  .last .note { font-style: italic; color: var(--ink); opacity: .85; }
  .bigscore { display: flex; align-items: flex-end; gap: 22px; margin-top: 34px; }
  .bigscore .n { font: 400 140px/0.85 'Anton'; }
  .bigscore .of { font: 400 44px/1 'Anton'; color: var(--dim); margin-bottom: 8px; }
  .bigscore .votes { margin-bottom: 12px; }
  .stars { position: relative; display: inline-block; font-size: 38px; letter-spacing: 4px; color: rgba(255,255,255,.15); line-height: 1; }
  .stars i { position: absolute; left: 0; top: 0; overflow: hidden; white-space: nowrap; color: var(--mid); font-style: normal; }
  .hist { display: flex; align-items: flex-end; gap: 10px; height: 150px; margin-top: 30px; }
  .hist .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .hist .bar { width: 100%; border-radius: 6px 6px 2px 2px; background: linear-gradient(var(--red), #8f1a1e); height: 0; transition: height 1.2s cubic-bezier(.2,.8,.2,1); }
  .hist .col span { font: 400 15px 'DM Mono'; color: var(--dim); }
  .hist .col b { font: 500 16px 'DM Mono'; }
  .versus { margin-top: 24px; font-size: 24px; }
  .versus b { color: var(--mid); }

  /* reel */
  .reel { display: flex; gap: 24px; margin-top: 34px; }
  .reel .card { width: 152px; opacity: 0; transform: translateY(30px); transition: all .6s cubic-bezier(.2,.8,.2,1); }
  .reel .card.show { opacity: 1; transform: none; }
  .reel .poster { width: 152px; height: 228px; }
  .reel .t { margin-top: 12px; font: 700 19px/1.15 'Inter Tight'; height: 44px; overflow: hidden; }
  .reel .row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .reel .when { font: 400 15px 'DM Mono'; color: var(--dim); margin-top: 6px; }
  .reel .how { font: 500 14px 'DM Mono'; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
  .strip { position: absolute; left: 0; right: 0; height: 22px; background: repeating-linear-gradient(90deg, transparent 0 14px, rgba(255,255,255,.08) 14px 30px); }

  /* poll replay */
  .pollhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; }
  .pollhead .h2 { max-width: 980px; }
  .round { font: 400 64px/1 'Anton'; text-align: right; white-space: nowrap; }
  .round small { display: block; font: 500 16px 'DM Mono'; letter-spacing: 3px; color: var(--dim); }
  .rows { position: relative; margin-top: 30px; height: 600px; }
  .prow { position: absolute; left: 0; right: 0; height: 66px; display: flex; align-items: center; gap: 18px; transition: top .9s cubic-bezier(.2,.8,.2,1), opacity .6s, filter .6s; }
  .prow .poster { width: 44px; height: 66px; border-radius: 6px; box-shadow: none; }
  .prow .name { width: 380px; font: 700 23px/1.1 'Inter Tight'; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .name small { font: 400 17px 'DM Mono'; color: var(--dim); margin-left: 8px; }
  .prow .track { flex: 1; height: 34px; border-radius: 6px; background: rgba(255,255,255,.06); overflow: hidden; }
  .prow .fill { height: 100%; width: 0; background: linear-gradient(90deg, #8f1a1e, var(--red)); transition: width .9s cubic-bezier(.2,.8,.2,1); border-radius: 6px; }
  .prow .v { width: 120px; text-align: right; font: 500 24px 'DM Mono'; font-variant-numeric: tabular-nums; }
  .prow.out { opacity: .32; filter: grayscale(1); }
  .prow.out .name::after { content: attr(data-out); margin-left: 10px; font: 500 14px 'DM Mono'; color: var(--bad); letter-spacing: 2px; }
  .prow.win .fill { background: linear-gradient(90deg, #b8860b, var(--mid)); box-shadow: 0 0 24px rgba(242,193,78,.5); }
  .prow.win .name { color: var(--mid); }
  .stamp { position: absolute; right: 150px; top: 50%; transform: translateY(-50%) rotate(-8deg) scale(2.4); opacity: 0; padding: 4px 16px; border: 4px solid var(--mid);
    color: var(--mid); font: 400 34px 'Anton'; letter-spacing: 3px; transition: all .45s cubic-bezier(.2,1.6,.4,1); }
  .prow.win .stamp { opacity: 1; transform: translateY(-50%) rotate(-8deg) scale(1); }
  .pollfoot { position: absolute; left: 0; right: 0; bottom: 0; font-size: 24px; color: var(--dim); }
  .pollfoot b { color: var(--ink); }

  /* hall */
  .hall { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; margin-top: 26px; }
  .hall h3 { margin: 0 0 18px; font: 400 44px/1 'Anton'; text-transform: uppercase; }
  .hall .fame h3 { color: var(--mid); }
  .hall .shame h3 { color: var(--bad); }
  .hrow { display: flex; align-items: center; gap: 18px; height: 112px; border-top: 1px solid var(--line); opacity: 0; transform: translateX(-20px); transition: all .6s cubic-bezier(.2,.8,.2,1); }
  .hrow.show { opacity: 1; transform: none; }
  .hrow .rank { width: 46px; font: 400 44px 'Anton'; color: var(--dim); }
  .hrow .poster { width: 64px; height: 96px; border-radius: 6px; }
  .hrow .t { flex: 1; font: 700 24px/1.15 'Inter Tight'; }
  .hrow .t small { display: block; margin-top: 4px; font: 400 16px 'DM Mono'; color: var(--dim); }

  /* numbers */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 30px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 26px; min-height: 250px;
    opacity: 0; transform: scale(.96); transition: all .6s cubic-bezier(.2,.8,.2,1); }
  .tile.show { opacity: 1; transform: none; }
  .tile .big { font: 400 92px/1 'Anton'; margin-top: 12px; }
  .tile .sub { margin-top: 8px; font-size: 20px; color: var(--dim); }
  .bars { margin-top: 14px; display: grid; gap: 9px; }
  .bars div { display: grid; grid-template-columns: 150px 1fr 48px; align-items: center; gap: 12px; font-size: 19px; }
  .bars span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bars i { display: block; height: 14px; border-radius: 4px; background: var(--red); }
  .bars em { font: 500 17px 'DM Mono'; font-style: normal; color: var(--dim); text-align: right; }

  /* schedule */
  .next { margin-top: 30px; display: flex; align-items: flex-end; gap: 30px; }
  .count { font: 400 190px/0.85 'Anton'; font-variant-numeric: tabular-nums; }
  .sessions { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; margin-top: 56px; }
  .sess { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .sess.now { border-color: var(--red); box-shadow: 0 0 30px var(--red-dim); }
  .sess .d { font: 400 38px/1 'Anton'; text-transform: uppercase; }
  .sess .tm { margin-top: 10px; font: 500 20px 'DM Mono'; }
  .sess .et { margin-top: 4px; font: 400 16px 'DM Mono'; color: var(--dim); }
  .sess .ev { margin-top: 10px; font-size: 17px; color: var(--mid); }

  /* straw poll */
  .straw { display: flex; gap: 40px; margin-top: 40px; }
  .cand { flex: 1; text-align: center; }
  .cand .poster { width: 280px; height: 420px; margin: 0 auto; }
  .cand .num { font: 400 64px/1 'Anton'; color: var(--red); margin-top: -40px; position: relative; text-shadow: 0 4px 20px #000; }
  .cand .t { font: 700 26px/1.15 'Inter Tight'; margin-top: 10px; }
  .cand .v { font: 500 22px 'DM Mono'; color: var(--dim); margin-top: 8px; }
  .cand.lead .poster { box-shadow: 0 0 0 4px var(--mid), 0 18px 60px rgba(242,193,78,.35); }

  /* ---- footer ---- */
  #foot { position: absolute; left: 56px; top: 950px; width: 1360px; height: 96px; }
  #pills { display: flex; gap: 10px; }
  #pills div { flex: 1; }
  #pills b { display: block; height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
  #pills b i { display: block; height: 100%; width: 0; background: var(--red); }
  #pills span { display: block; margin-top: 10px; font: 500 14px 'DM Mono'; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  #pills .on span { color: var(--ink); }
  #hint { margin-top: 18px; display: flex; justify-content: space-between; font: 500 19px 'DM Mono'; color: var(--dim); }
  #hint b { color: var(--ink); font-weight: 500; }
  #hint .r { color: var(--red); }

  /* ---- right column ---- */
  #corner { position: absolute; left: 1448px; top: 34px; width: 442px; padding: 18px 20px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
  #corner .label { font-size: 14px; }
  #corner .rate { margin-top: 10px; display: flex; align-items: center; gap: 12px; }
  #corner .rate .stars { font-size: 26px; letter-spacing: 2px; }
  #corner .rate .n { font: 400 40px/1 'Anton'; }
  #corner .rate .who { font-size: 16px; color: var(--dim); line-height: 1.3; }
  #corner .t { font: 700 19px/1.2 'Inter Tight'; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #corner hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .mini { display: grid; grid-template-columns: 24px 1fr 34px; gap: 10px; align-items: center; margin-top: 8px; font-size: 17px; }
  .mini b { font: 400 22px 'Anton'; color: var(--red); }
  .mini .tr { position: relative; height: 26px; border-radius: 5px; background: rgba(255,255,255,.06); overflow: hidden; }
  .mini .tr i { position: absolute; inset: 0 auto 0 0; background: var(--red-dim); border-right: 3px solid var(--red); transition: width .6s; }
  .mini .tr span { position: absolute; left: 10px; top: 2px; right: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini em { font: 500 17px 'DM Mono'; font-style: normal; text-align: right; }
  #chatwrap { position: absolute; left: 1448px; width: 442px; bottom: 34px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
  #chathead { height: 50px; line-height: 50px; padding: 0 20px; border-bottom: 1px solid var(--line); }
  #chathead span { float: right; color: var(--ink); }
  #chat { left: 0; right: 0; top: 52px; bottom: 0; }

  /* ---- !watched card ---- */
  #ask { position: absolute; left: 50%; top: 520px; width: 900px; margin-left: -450px; transform: translateY(40px); opacity: 0; z-index: 10;
    background: #121014; border: 1px solid var(--line); border-left: 6px solid var(--red); border-radius: 14px; padding: 24px 30px;
    box-shadow: 0 30px 80px rgba(0,0,0,.7); transition: all .45s cubic-bezier(.2,1.4,.4,1); }
  #ask.show { opacity: 1; transform: none; }
  #ask .q { font: 500 18px 'DM Mono'; color: var(--dim); letter-spacing: 1px; }
  #ask .a { font: 400 52px/1.05 'Anton'; margin-top: 8px; text-transform: uppercase; }
  #ask .a.yes { color: var(--good); } #ask .a.no { color: var(--mid); }
  #ask ul { margin: 14px 0 0; padding: 0; list-style: none; font-size: 21px; }
  #ask li { padding: 6px 0; border-top: 1px solid var(--line); display: flex; gap: 14px; align-items: center; }
  #ask li .mono { color: var(--dim); font-size: 17px; width: 140px; }
  #ask li .tt { flex: 1; }
  #stalebadge { position: absolute; left: 56px; top: 108px; font: 500 14px 'DM Mono'; color: var(--mid); letter-spacing: 1px; }
</style>
</head>
<body>
<div id="stage">
  <div class="backdrop" id="bd0"></div>
  <div class="backdrop" id="bd1"></div>
  <div id="vignette"></div>
  <div id="grain"></div>

  <div id="head">
    <img id="logo" src="https://cdn.dinkdonk.mov/images/DinkDonk.png" alt="">
    <div id="wordmark">DinkDonk</div>
    <div id="pill">INTERMISSION</div>
    <div id="headline"></div>
    <div class="grow"></div>
    <div id="timerbox"><div class="label" id="timer-label">away for</div><div id="timer">0:00</div></div>
  </div>
  <div id="stalebadge"></div>

  <div id="segs"></div>
  <div id="ask"></div>

  <div id="foot">
    <div id="pills"></div>
    <div id="hint"><span id="hint-l"></span><span class="r">dinkdonk.mov</span></div>
  </div>

  <div id="corner">
    <div class="label">Chat rates · <b style="color:var(--ink)">!rate 0-5</b></div>
    <div class="t" id="rate-title">—</div>
    <div class="rate">
      <div class="n" id="rate-n">–</div>
      <div><span class="stars" id="rate-stars">★★★★★<i style="width:0">★★★★★</i></span><div class="who" id="rate-who">no votes yet</div></div>
    </div>
    <hr>
    <div class="label">Chat's straw poll · <b style="color:var(--ink)">!pick 1-3</b></div>
    <div id="mini"></div>
  </div>
  <div id="chatwrap">
    <div id="chathead" class="label">Destiny.gg chat <span id="viewers"></span></div>
    <div id="chat"></div>
  </div>
</div>

<script src="shared/core.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  SB.mountStage($('stage'));
  $('headline').textContent = (SB.cfg.title || 'Back after this').toUpperCase();
  $('logo').onerror = () => { $('logo').remove(); $('wordmark').style.display = 'block'; };

  // ---------- helpers ----------
  function h(tag, attrs = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else el.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
    return el;
  }
  function poster(url, title, w, hgt) {
    const el = h('div', { class: 'poster', style: `width:${w}px;height:${hgt}px` }, h('div', { class: 'ph' }, title || ''));
    if (url) {
      const img = h('img', { src: url, alt: '' });
      img.onerror = () => img.remove();
      el.append(img);
    }
    return el;
  }
  const fmt2 = (n) => (n == null ? '–' : (Math.round(n * 100) / 100).toFixed(2));
  const scoreClass = (n) => (n == null ? 's-none' : n >= 3.75 ? 's-good' : n >= 2.75 ? 's-mid' : 's-bad');
  const scoreBadge = (n) => h('span', { class: `score ${scoreClass(n)}` }, n == null ? 'n/a' : fmt2(n));
  function stars(n, size) {
    const w = n == null ? 0 : Math.max(0, Math.min(1, n / 5)) * 100;
    return h('span', { class: 'stars', style: size ? `font-size:${size}px` : null }, '★★★★★', h('i', { style: `width:${w}%` }, '★★★★★'));
  }
  const METHOD = { poll: 'Poll', dictator: 'Dictator pick', marbles: 'Marbles', raffle: 'Raffle', other: 'Other' };
  const method = (m) => METHOD[m] || 'Conductor call';
  function ago(ts) {
    const s = (Date.now() - ts) / 1000;
    if (s < 3600) return `${Math.max(1, Math.round(s / 60))} min ago`;
    if (s < 86400) return `${Math.round(s / 3600)} h ago`;
    const d = Math.round(s / 86400);
    return d === 1 ? 'yesterday' : `${d} days ago`;
  }
  const dateLong = (ts) => new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const dayTime = (ts) => new Date(ts).toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
  const timeLocal = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const timeET = (ts) => new Date(ts).toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' });
  const kicker = (txt) => h('div', { class: 'kicker' }, h('span', { class: 'dot' }), h('span', { class: 'label', style: 'color:var(--ink)' }, txt));
  const clean = (t) => (t || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

  // ---------- data ----------
  let D = null;
  const ratingCards = () => [...(D?.ratings || []), ...(D?.best || []), ...(D?.worst || [])];
  function posterFor(entry) {
    if (!entry) return null;
    const det = entry.ratingId && D.details.ratings[entry.ratingId];
    if (det?.poster) return det.poster;
    const card = ratingCards().find((r) => r.id === entry.ratingId || clean(r.title) === clean(entry.title));
    return card?.poster || null;
  }

  async function load() {
    try {
      const res = await fetch('/dd/data.json', { cache: 'no-store' });
      if (!res.ok) throw new Error(await res.text());
      D = await res.json();
      $('stalebadge').textContent = D.stale ? `dinkdonk.mov unreachable · showing data from ${dayTime(D.fetchedAt)}` : '';
      buildCandidates();
      renderCorner();
      if (!started) { started = true; next(); }
    } catch (error) {
      console.error('dinkdonk data', error);
      if (!D) $('stalebadge').textContent = 'waiting for dinkdonk.mov data… (is start-standby.bat running?)';
    }
  }

  // ---------- segments ----------
  const SEGMENTS = [
    { key: 'last', name: 'Just watched', dur: 22, render: segLast },
    { key: 'reel', name: 'Recent', dur: 18, render: segReel },
    { key: 'poll', name: 'Poll replay', dur: 20, render: segPoll },

  // 3. Poll replay (instant runoff gets the round-by-round treatment)

  // 6. Chat straw poll
  let candidates = [];
  const pickVotes = new Map();
  function buildCandidates() {
    const seen = new Set(D.history.slice(0, 120).map((e) => clean(e.title)));
    const pool = [];
    for (const p of D.polls) {
      const det = D.details.polls[p.id];
      if (!det) continue;
      const score = (o) => (det.rounds ? o.tmdb ?? 0 : o.votes ?? 0);
      for (const o of det.options.slice().sort((a, b) => score(b) - score(a))) {
        if (!o.poster || !o.year || seen.has(clean(o.title)) || pool.some((c) => clean(c.title) === clean(o.title))) continue;
        pool.push({ title: o.title, year: o.year, poster: o.poster, from: det.title });
      }
    }
    const nextSet = pool.slice(0, 3);
    if (nextSet.map((c) => c.title).join('|') !== candidates.map((c) => c.title).join('|')) { candidates = nextSet; pickVotes.clear(); }
  }
  function tally() { const t = [0, 0, 0]; for (const v of pickVotes.values()) t[v] += 1; return t; }

  }

  // ---------- chat corner: !rate and !pick ----------

  // !watched TITLE — searches the DinkDonk watch log.

      box.replaceChildren(h('div', { class: 'q' }, `${nick} asks: have we watched “${query}”?`), answer,
        list.length ? h('ul', {}, list.slice(0, 4).map((e) => h('li', {}, h('span', { class: 'mono' }, e.watchedTs ? dateLong(e.watchedTs) : ''),
          h('span', { class: 'tt' }, `${e.title}${e.year ? ` (${e.year})` : ''}`), h('span', { class: 'mono', style: 'width:auto' }, method(e.method)), scoreBadge(e.rating)))) : null);
      box.classList.add('show');
      clearTimeout(askTimer);
      askTimer = setTimeout(() => box.classList.remove('show'), 10_000);
    } catch (error) { console.error('watched', error); }
  });

  SB.on('purge', (nick) => {
    const rated = rateVotes.delete(nick);
    const picked = pickVotes.delete(nick);
    if (rated) saveRates();
    if ((rated || picked) && D) renderCorner();
  });

  // ---------- chrome ----------
  SB.mountChat($('chat'), { emoteHeight: 28 });
  const fitChat = () => { $('chatwrap').style.top = `${34 + $('corner').offsetHeight + 16}px`; };
  new ResizeObserver(fitChat).observe($('corner'));
  SB.on('names', ({ connections }) => { $('viewers').textContent = connections ? `${connections.toLocaleString('en-US')} here` : ''; });

  const HINTS = ['type <b>!rate 4.5</b> to rate the last movie', 'type <b>!pick 1</b>, <b>2</b> or <b>3</b> for what should be next',
    'type <b>!watched alien</b> to search the DinkDonk watch log', 'type <b>!skip</b> to jump to the next segment'];
  let hintI = 0;
  const showHint = () => { $('hint-l').innerHTML = HINTS[hintI++ % HINTS.length]; };
  showHint();
  setInterval(showHint, 7000);

  function frame() {
    const p = Math.min(1, (performance.now() - segStart) / segDur);
    const on = $('pills').querySelector('.on i');
    for (const i of $('pills').querySelectorAll('i')) i.style.width = '0';
    if (on) on.style.width = `${p * 100}%`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  setInterval(() => {
    const t = SB.timerText();
    $('timer').textContent = t.value;
    $('timer-label').textContent = t.label;
  }, 500);

  // Demo: also exercise this page's commands.
  if (SB.cfg.demo) {
    const NICKS = ['Mooby', 'cocoFan', 'popcorn_andy', 'Bingus', 'MovieBuff', 'smolbean', 'directorscut', 'okayeg', 'Tuesday'];
    const ASKS = ['alien', 'the thing', 'shrek', 'dark knight', 'paddington', 'zzzz never'];
    setInterval(() => {
      const r = Math.random();
      const n = SB.pick(NICKS) + Math.floor(Math.random() * 9);
      if (r < 0.5) SB.say(n, `!rate ${SB.pick([2.5, 3, 3.5, 4, 4.5, 5, 1.5])}`);
      else if (r < 0.92) SB.say(n, `!pick ${1 + Math.floor(Math.random() * 3)}`);
      else SB.say(n, `!watched ${SB.pick(ASKS)}`);
    }, 1400);
  }

  load();
  setInterval(load, 120_000);
  SB.start();
})();
</script>
</body>
</html>
