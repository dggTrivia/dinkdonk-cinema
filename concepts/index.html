<!doctype html>
<!--
  Static concept drafts: 5 lobby scenes + 5 cinema scenes, 1920x1080 each, no functionality.
  Each theme comes as a pair (lobby -> DinkDonk -> cinema). Grey "MOVIE / STREAM" boxes mark where
  the video would go. ?s=L1 .. ?s=C5 shows one scene alone at 1920x1080.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lobby & Cinema Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=JetBrains+Mono:wght@400;700&family=Limelight&family=Monoton&family=Pacifico&family=Press+Start+2P&family=Rye&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 28px; background: #111114; color: #eee; font: 15px/1.5 'Space Grotesk', system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  h2 { margin: 34px 0 12px; font-size: 20px; color: #cfcfd8; }
  p.lead { margin: 0; color: #9a9aa2; max-width: 900px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(540px, 1fr)); gap: 22px; }
  .card { background: #1a1a1f; border: 1px solid #2b2b33; border-radius: 12px; overflow: hidden; }
  .card svg { display: block; width: 100%; height: auto; cursor: zoom-in; }
  .meta { padding: 12px 16px 14px; }
  .meta b { font-size: 17px; }
  .meta div { color: #9a9aa2; margin-top: 3px; }
  .meta a { color: #8fd3ff; font-size: 13px; }
  #full { position: fixed; inset: 0; background: #000e; display: none; align-items: center; justify-content: center; cursor: zoom-out; z-index: 10; }
  #full.on { display: flex; }
  #full svg { width: min(100vw, 177.78vh); height: auto; }
  body.solo { padding: 0; background: #000; overflow: hidden; }
  body.solo svg { display: block; width: 1920px; height: 1080px; }
  @media (max-width: 600px) { body { padding: 16px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="full"></div>
<script>
const COLORS = ['#ffb84d','#7ad1ff','#ff7aa8','#9bf07a','#c59bff','#ffe066','#ff8a5c','#5ce1c4','#a0a6ff','#f7a1ff','#b8f28c','#8ce0ff'];
const NAMES = ['Pog','Juno','gnomey','Tako','Nugget','Lumi','Rico','Moth','Vex','Kappa','Dank','Wyvern','Zoomer','Booba','Mona','sk8r','Bean','Lucky'];
const FACES = ['happy','joy','wow','meh','sleepy','smug','cool'];

function rng(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647) / 2147483647; }
const pick = (r, a) => a[Math.floor(r() * a.length)];
function shade(hex, a) {
  const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, Math.round(a < 0 ? v * (1 + a) : v + (255 - v) * a)));
  return '#' + [n >> 16, n >> 8 & 255, n & 255].map(v => f(v).toString(16).padStart(2, '0')).join('');
}

// ---------- shared pieces ----------
const GLOBAL_DEFS = `<defs><linearGradient id="mv-sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>`;

function movieSlot(x, y, w, h, o = {}) {
  const cx = x + w / 2, cy = y + h / 2 - h * .04, k = h * .09;
  return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.bg || '#0c0f1a'}"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#mv-sheen)"/>
  <circle cx="${cx}" cy="${cy}" r="${k}" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="${Math.max(2, h * .008)}"/>
  <path d="M${cx - k * .33} ${cy - k * .5} L${cx + k * .6} ${cy} L${cx - k * .33} ${cy + k * .5}Z" fill="#fff" fill-opacity=".5"/>
  <text x="${cx}" y="${cy + k + h * .09}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="${Math.max(12, h * .042)}" fill="#fff" fill-opacity=".5" letter-spacing="3">${o.label || 'MOVIE / STREAM · 16:9'}</text></g>`;
}

function face(t, ink = '#231a2b') {
  const dots = `<circle cx="-9" cy="-3" r="3.8" fill="${ink}"/><circle cx="9" cy="-3" r="3.8" fill="${ink}"/>`;
  const st = `stroke="${ink}" stroke-width="3.4" fill="none" stroke-linecap="round"`;
  const blush = `<ellipse cx="-17" cy="7" rx="5" ry="3" fill="#ff6b8a" opacity=".45"/><ellipse cx="17" cy="7" rx="5" ry="3" fill="#ff6b8a" opacity=".45"/>`;
  switch (t) {
    case 'joy': return `<path d="M-14 -1 Q-9 -9 -4 -1 M4 -1 Q9 -9 14 -1" ${st}/><path d="M-8 6 Q0 18 8 6 Z" fill="${ink}"/>` + blush;
    case 'wow': return dots + `<ellipse cy="10" rx="4.5" ry="5.5" fill="${ink}"/>`;
    case 'meh': return dots + `<path d="M-7 10 H7" ${st}/>`;
    case 'sleepy': return `<path d="M-14 -2 H-4 M4 -2 H14" ${st}/><circle cy="10" r="3" fill="${ink}"/>`;
    case 'smug': return `<path d="M-14 -4 Q-9 -1 -4 -4 M4 -4 Q9 -1 14 -4" ${st}/><path d="M-6 9 Q3 13 10 5" ${st}/>`;
    case 'cool': return `<path d="M-19 -8 H19 V-2 Q19 5 11 5 Q5 5 3 -2 H-3 Q-5 5 -11 5 Q-19 5 -19 -2 Z" fill="#111"/><path d="M-6 11 Q0 15 6 11" ${st}/>`;
    default: return dots + `<path d="M-8 7 Q0 15 8 7" ${st}/>` + blush;
  }
}

function item(k) {
  if (k === 'popcorn') return `<g transform="translate(27 -50)"><circle cx="-6" cy="-1" r="6" fill="#ffe7a0"/><circle cx="2" cy="-5" r="7" fill="#fff4cc"/><circle cx="8" cy="0" r="6" fill="#ffe7a0"/><path d="M-11 0 H13 L10 28 H-8Z" fill="#fff"/><path d="M-5 0 L-3 28 M1 0 V28 M7 0 L5 28" stroke="#e8343f" stroke-width="3.5"/></g>`;
  if (k === 'drink') return `<g transform="translate(27 -48)"><path d="M3 -2 L8 -16" stroke="#fff" stroke-width="3"/><path d="M-8 0 H10 L7 26 H-5Z" fill="#3fa9f5"/><rect x="-9" y="-3" width="20" height="5" rx="2" fill="#e8f4ff"/></g>`;
  if (k === 'ticket') return `<g transform="translate(29 -46) rotate(-15)"><rect x="-13" y="-8" width="27" height="16" rx="2" fill="#ffd34d"/><path d="M-4 -8 V8" stroke="#a87a10" stroke-width="2" stroke-dasharray="3 2"/></g>`;
  if (k === 'flashlight') return `<g transform="translate(26 -42)"><rect x="-4" y="-6" width="22" height="11" rx="3" fill="#333"/><rect x="16" y="-8" width="6" height="15" rx="2" fill="#fff3b0"/></g>`;
  return '';
}

function tag(x, y, t, st = {}) {
  const fs = st.fs || 20, w = t.length * fs * (st.cw || .6) + 16;
  return `<g transform="translate(${x} ${y})"><rect x="${-w / 2}" y="${-fs - 3}" width="${w}" height="${fs + 11}" rx="${st.r ?? 8}" fill="${st.bg || '#000000b0'}" ${st.stroke ? `stroke="${st.stroke}" stroke-width="2"` : ''}/><text y="1" text-anchor="middle" font-size="${fs}" font-family="${st.font || 'Space Grotesk, sans-serif'}" font-weight="700" fill="${st.fg || '#fff'}">${t}</text></g>`;
}

function bubble(x, y, t, st = {}) {
  const fs = st.fs || 22, w = t.length * fs * (st.cw || .55) + 30, h = fs + 22;
  const sk = st.stroke ? `stroke="${st.stroke}" stroke-width="3"` : '';
  return `<g transform="translate(${x} ${y})"><path d="M${-w / 2 + 14} ${-h} H${w / 2 - 14} Q${w / 2} ${-h} ${w / 2} ${-h + 14} V-14 Q${w / 2} 0 ${w / 2 - 14} 0 H10 L0 13 L-10 0 H${-w / 2 + 14} Q${-w / 2} 0 ${-w / 2} -14 V${-h + 14} Q${-w / 2} ${-h} ${-w / 2 + 14} ${-h}Z" fill="${st.bg || '#fff'}" ${sk}/><text y="${-h / 2 + fs * .36}" text-anchor="middle" font-size="${fs}" font-family="${st.font || 'Space Grotesk, sans-serif'}" font-weight="600" fill="${st.fg || '#1b1420'}">${t}</text></g>`;
}

// A standing (or sitting) emote; x,y = feet.
function emote(x, y, s, c, o = {}) {
  const d = shade(c, -.35), sw = o.stroke ? `stroke="${o.stroke}" stroke-width="3"` : '';
  let g = `<g transform="translate(${x} ${y}) scale(${s})">`;
  if (!o.noShadow) g += `<ellipse cy="2" rx="26" ry="6" fill="#000" opacity=".3"/>`;
  if (o.sit) g += `<rect x="-18" y="-24" width="40" height="13" rx="6" fill="${d}" ${sw}/><rect x="-21" y="-62" width="42" height="44" rx="17" fill="${c}" ${sw}/>`;
  else g += `<rect x="-15" y="-20" width="11" height="20" rx="5" fill="${d}" ${sw}/><rect x="4" y="-20" width="11" height="20" rx="5" fill="${d}" ${sw}/><rect x="-21" y="-58" width="42" height="44" rx="17" fill="${c}" ${sw}/>`;
  if (o.wave) g += `<rect x="14" y="-80" width="11" height="32" rx="5.5" fill="${c}" ${sw} transform="rotate(30 19 -50)"/>`;
  const hy = o.sit ? -88 : -84;
  g += `<circle cy="${hy}" r="29" fill="${c}" ${sw}/>`;
  if (!o.stroke) g += `<ellipse cx="-10" cy="${hy - 12}" rx="8" ry="5" fill="#fff" opacity=".28"/>`;
  g += `<g transform="translate(0 ${hy + 2})">${face(o.face, o.ink)}</g>`;
  if (o.hold) g += item(o.hold);
  g += '</g>';
  if (o.name) g += tag(x, y - 126 * s, o.name, o.tagStyle);
  if (o.say) g += bubble(x + (o.sayDx || 0), y - (o.name ? 160 : 128) * s, o.say, o.bubbleStyle);
  return g;
}

// A head seen from behind (seated audience); turned heads show their face.
function seatHead(x, cy, hr, c, o = {}) {
  const k = hr / 29;
  let g = `<g transform="translate(${x} ${cy}) scale(${k})"><circle r="29" fill="${o.fill || c}" ${o.stroke ? `stroke="${o.stroke}" stroke-width="4"` : ''}/>`;
  g += o.turned ? face(o.face, o.ink) : `<ellipse cx="-9" cy="-13" rx="9" ry="6" fill="#fff" opacity="${o.stroke ? .06 : .2}"/>`;
  g += '</g>';
  if (o.popcorn) g += `<g transform="translate(${x + hr * 1.05} ${cy + hr * .15}) scale(${k * .9})"><circle cx="-6" cy="-1" r="6" fill="#ffe7a0"/><circle cx="3" cy="-4" r="7" fill="#fff4cc"/><path d="M-11 0 H13 L10 22 H-8Z" fill="#fff"/><path d="M-4 0 L-3 22 M2 0 V22 M8 0 L6 22" stroke="#e8343f" stroke-width="3.5"/></g>`;
  if (o.name) g += tag(x, cy - hr - 12, o.name, o.tagStyle);
  return g;
}

function hint(x, y, txt, st = {}) {
  const fs = st.fs || 22, w = txt.length * fs * (st.cw || .58) + 40;
  return `<g transform="translate(${x} ${y})"><rect x="${-w / 2}" y="${-fs - 8}" width="${w}" height="${fs + 20}" rx="${(fs + 20) / 2}" fill="${st.bg || '#000000a0'}" ${st.stroke ? `stroke="${st.stroke}" stroke-width="2"` : ''}/><text y="2" text-anchor="middle" font-size="${fs}" font-family="${st.font || 'Space Grotesk, sans-serif'}" fill="${st.fg || '#fff'}">${txt}</text></g>`;
}

// =====================================================================
// 1 · VELVET PALACE
// =====================================================================
function lobbyVelvet() {
  let s = `<defs>
  <linearGradient id="vl-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e050c"/><stop offset="1" stop-color="#6e1222"/></linearGradient>
  <linearGradient id="vl-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dc8e"/><stop offset=".5" stop-color="#c79a3e"/><stop offset="1" stop-color="#8a6420"/></linearGradient>
  <pattern id="vl-damask" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M60 20 Q76 44 60 62 Q44 44 60 20Z M60 62 Q84 74 102 62 M60 62 Q36 74 18 62 M0 0 Q14 22 0 40 M120 0 Q106 22 120 40" stroke="#e7c27a" fill="none" stroke-width="2"/></pattern>
  <pattern id="vl-carpet" width="80" height="40" patternUnits="userSpaceOnUse"><rect width="80" height="40" fill="#5c0d1b"/><path d="M40 4 L56 20 L40 36 L24 20Z" fill="none" stroke="#c9a14a" stroke-width="2" opacity=".55"/><circle cx="0" cy="20" r="3" fill="#c9a14a" opacity=".5"/><circle cx="80" cy="20" r="3" fill="#c9a14a" opacity=".5"/></pattern>
  <pattern id="vl-tuft" width="42" height="42" patternUnits="userSpaceOnUse"><rect width="42" height="42" fill="#8a1426"/><path d="M0 21 L21 0 L42 21 L21 42Z" fill="none" stroke="#5a0b18" stroke-width="2"/><circle cx="21" cy="0" r="3" fill="#e7c27a"/><circle cx="0" cy="21" r="3" fill="#e7c27a"/><circle cx="42" cy="21" r="3" fill="#e7c27a"/><circle cx="21" cy="42" r="3" fill="#e7c27a"/></pattern>
  <linearGradient id="vl-floorshade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  <radialGradient id="vl-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd98a" stop-opacity=".4"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
  <linearGradient id="vl-poster" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2a6b"/><stop offset="1" stop-color="#6b2a8a"/></linearGradient>
  </defs>`;
  s += `<rect width="1920" height="1080" fill="url(#vl-wall)"/><rect width="1920" height="820" fill="url(#vl-damask)" opacity=".14"/>`;
  s += `<rect width="1920" height="28" fill="url(#vl-gold)"/><rect y="28" width="1920" height="10" fill="#22040a"/>`;
  [30, 515, 1330, 1874].forEach(x => s += `<rect x="${x}" y="38" width="16" height="620" fill="url(#vl-gold)" opacity=".75"/>`);
  s += `<rect y="660" width="1920" height="160" fill="#2b050c"/><rect y="654" width="1920" height="7" fill="url(#vl-gold)"/>`;
  for (let x = 20; x < 1920; x += 160) s += `<rect x="${x + 10}" y="680" width="140" height="118" fill="none" stroke="#c9a14a" stroke-opacity=".35" stroke-width="2"/>`;
  s += `<rect y="820" width="1920" height="260" fill="url(#vl-carpet)"/><rect y="820" width="1920" height="260" fill="url(#vl-floorshade)"/><rect y="815" width="1920" height="8" fill="url(#vl-gold)"/>`;
  // chandeliers
  [440, 1480].forEach(cx => {
    s += `<ellipse cx="${cx}" cy="150" rx="220" ry="160" fill="url(#vl-glow)"/><line x1="${cx}" y1="38" x2="${cx}" y2="110" stroke="#c9a14a" stroke-width="3"/>`;
    s += `<path d="M${cx - 70} 130 Q${cx} 175 ${cx + 70} 130" stroke="#c9a14a" stroke-width="5" fill="none"/><ellipse cx="${cx}" cy="125" rx="26" ry="16" fill="url(#vl-gold)"/>`;
    for (let i = -3; i <= 3; i++) s += `<line x1="${cx + i * 22}" y1="${145 - Math.abs(i) * 3}" x2="${cx + i * 22}" y2="${175 - Math.abs(i) * 5}" stroke="#fff3d0" stroke-width="2" opacity=".8"/><circle cx="${cx + i * 22}" cy="${178 - Math.abs(i) * 5}" r="5" fill="#fff6dc"/>`;
  });
  // marquee
  s += `<rect x="600" y="46" width="720" height="150" rx="14" fill="url(#vl-gold)"/><rect x="616" y="62" width="688" height="118" rx="8" fill="#1c0307"/>`;
  const bulb = (x, y) => `<circle cx="${x}" cy="${y}" r="11" fill="#ffd36b" opacity=".25"/><circle cx="${x}" cy="${y}" r="5" fill="#fff1c2"/>`;
  for (let x = 622; x <= 1300; x += 26) s += bulb(x, 54) + bulb(x, 188);
  for (let y = 80; y <= 166; y += 26) s += bulb(607, y) + bulb(1313, y);
  s += `<text x="960" y="134" text-anchor="middle" font-family="Limelight, serif" font-size="66" fill="#f6d98a">THE VELVET</text><text x="960" y="168" text-anchor="middle" font-family="Limelight, serif" font-size="24" letter-spacing="6" fill="#e9b9a0">MOVIE NIGHT · TONIGHT</text>`;
  // trailer screen
  s += `<rect x="688" y="208" width="544" height="316" rx="6" fill="url(#vl-gold)"/>` + movieSlot(700, 220, 520, 292, { label: 'TRAILERS / STREAM' });
  // ticket booth with host as cashier
  s += `<rect x="724" y="530" width="472" height="16" fill="url(#vl-gold)"/><rect x="740" y="546" width="440" height="284" fill="#3a0812"/>`;
  s += `<path d="M790 750 V650 Q790 592 850 592 H1070 Q1130 592 1130 650 V750Z" fill="#f3d39a" opacity=".2"/>`;
  s += emote(960, 770, 1.15, '#7ad1ff', { face: 'happy', noShadow: true });
  s += `<path d="M790 750 V650 Q790 592 850 592 H1070 Q1130 592 1130 650 V750" fill="#fff" fill-opacity=".05" stroke="url(#vl-gold)" stroke-width="6"/>`;
  s += `<rect x="740" y="732" width="440" height="98" fill="#4a0a17"/><rect x="734" y="724" width="452" height="12" fill="url(#vl-gold)"/><rect x="740" y="736" width="8" height="94" fill="url(#vl-gold)"/><rect x="1172" y="736" width="8" height="94" fill="url(#vl-gold)"/>`;
  s += `<rect x="870" y="548" width="180" height="36" rx="4" fill="#1c0307" stroke="#c9a14a" stroke-width="2"/><text x="960" y="576" text-anchor="middle" font-family="Limelight, serif" font-size="26" fill="#f6d98a" letter-spacing="4">TICKETS</text>`;
  s += tag(960, 622, 'arealhumanbean', { bg: '#1c0307d0', stroke: '#c9a14a', fg: '#f6d98a', fs: 18 });
  // doors to hall
  s += `<rect x="90" y="300" width="380" height="520" fill="url(#vl-gold)"/><rect x="104" y="314" width="352" height="506" fill="#2a040a"/>`;
  s += `<rect x="112" y="322" width="164" height="498" fill="url(#vl-tuft)"/><rect x="284" y="322" width="164" height="498" fill="url(#vl-tuft)"/>`;
  [194, 366].forEach(cx => s += `<circle cx="${cx}" cy="420" r="36" fill="#f6d39a" fill-opacity=".25" stroke="url(#vl-gold)" stroke-width="6"/><rect x="${cx - 50}" y="580" width="100" height="10" rx="5" fill="url(#vl-gold)"/>`);
  s += `<rect x="140" y="246" width="280" height="44" rx="6" fill="#1c0307" stroke="#c9a14a" stroke-width="3"/><text x="280" y="278" text-anchor="middle" font-family="Limelight, serif" font-size="28" fill="#f6d98a">HALL 1  →</text>`;
  // poster
  s += `<rect x="548" y="290" width="170" height="250" fill="url(#vl-gold)"/><rect x="558" y="300" width="150" height="230" fill="url(#vl-poster)"/><circle cx="660" cy="350" r="22" fill="#fff3c4"/><path d="M558 470 L600 420 L630 450 L670 400 L708 460 V530 H558Z" fill="#120a2e"/><text x="633" y="512" text-anchor="middle" font-family="Limelight, serif" font-size="20" fill="#f6d98a">COMING SOON</text>`;
  // concessions
  s += `<rect x="1380" y="236" width="480" height="206" rx="6" fill="url(#vl-gold)"/><rect x="1392" y="248" width="456" height="182" fill="#160306"/>`;
  s += `<text x="1620" y="296" text-anchor="middle" font-family="Limelight, serif" font-size="36" fill="#f6d98a">CONCESSIONS</text>`;
  ['POPCORN ........ 5', 'NACHOS ......... 6', 'SODA ........... 3'].forEach((t, i) => s += `<text x="1620" y="${340 + i * 32}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="22" fill="#f1d9a8">${t}</text>`);
  s += `<rect x="1400" y="466" width="140" height="32" rx="8" fill="#d0202f"/><text x="1470" y="489" text-anchor="middle" font-size="18" font-weight="700" fill="#fff" font-family="Space Grotesk">POPCORN</text><rect x="1408" y="498" width="124" height="134" fill="#fff6d0" fill-opacity=".18" stroke="#c9a14a" stroke-width="3"/>`;
  const pr = rng(7);
  for (let i = 0; i < 70; i++) s += `<circle cx="${1416 + pr() * 108}" cy="${570 + pr() * 58}" r="${5 + pr() * 4}" fill="${pr() < .5 ? '#ffe9a0' : '#fff6d6'}"/>`;
  s += `<rect x="1580" y="512" width="130" height="130" rx="8" fill="#b9bcc6"/><rect x="1592" y="524" width="106" height="40" rx="4" fill="#2c2f3a"/>`;
  ['#e8343f', '#3fa9f5', '#ffb84d'].forEach((c, i) => s += `<rect x="${1598 + i * 34}" y="530" width="26" height="28" rx="3" fill="${c}"/><rect x="${1607 + i * 34}" y="566" width="8" height="18" fill="#555"/>`);
  s += emote(1795, 700, 1.1, '#ff8a5c', { face: 'joy', noShadow: true });
  s += `<rect x="1360" y="650" width="520" height="170" fill="#6e0f1f"/><rect x="1350" y="640" width="540" height="16" fill="#e8d2a2"/>`;
  for (let x = 1380; x < 1860; x += 120) s += `<rect x="${x}" y="676" width="100" height="120" fill="none" stroke="#c9a14a" stroke-opacity=".5" stroke-width="2"/>`;
  // crowd
  const crowd = [
    [960, 872, 1.05, '#c59bff', { face: 'joy', name: 'Pog', hold: 'ticket' }],
    [880, 912, 1.08, '#9bf07a', { face: 'happy', name: 'Juno' }],
    [800, 952, 1.12, '#ffe066', { face: 'meh', name: 'gnomey', say: 'how long is this line', sayDx: -40 }],
    [715, 995, 1.16, '#7ad1ff', { face: 'sleepy', name: 'Tako' }],
    [625, 878, 1.0, '#a0a6ff', { face: 'wow', name: 'Moth', say: 'ooh new poster', sayDx: -30 }],

function token(x, y, c, f, name, o = {}) {
  let g = '';
  if (o.ring) g += `<circle cx="${x}" cy="${y}" r="40" fill="none" stroke="#ffe066" stroke-width="3" stroke-dasharray="6 6"/>`;
  g += `<circle cx="${x}" cy="${y}" r="28" fill="${c}" stroke="#e8f4ff" stroke-width="3"/><g transform="translate(${x} ${y + 2}) scale(.82)">${face(f)}</g>`;
  if (name) { const w = name.length * 11 + 16; g += `<rect x="${x + 34}" y="${y - 14}" width="${w}" height="28" rx="4" fill="#0b2747" stroke="${c}" stroke-width="2"/><text x="${x + 42}" y="${y + 6}" font-family="JetBrains Mono" font-size="18" fill="#e8f4ff">${name}</text>`; }
  if (o.badge) g += `<rect x="${x - 26}" y="${y - 54}" width="52" height="20" rx="4" fill="#ffe066"/><text x="${x}" y="${y - 39}" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="14" fill="#0b2747">${o.badge}</text>`;
  return g;
}

function cinemaBlueprint() {
  const r = rng(62);
  let s = `<defs><pattern id="bc-g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  <filter id="bc-glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  s += `<rect width="1920" height="1080" fill="#0a1424"/><rect width="1920" height="1080" fill="url(#bc-g)"/>`;
  s += `<text x="40" y="44" font-family="JetBrains Mono" font-size="18" letter-spacing="3" fill="#7fb8ff">NOW SHOWING · HALL 1</text><rect x="38" y="58" width="1204" height="679" fill="none" stroke="#23395c" stroke-width="2"/>` + movieSlot(40, 60, 1200, 675, { bg: '#0d1626' });
  s += `<rect x="40" y="770" width="1200" height="270" rx="16" fill="#0f1b30" stroke="#23395c" stroke-width="2"/>`;
  s += `<text x="70" y="860" font-family="Space Grotesk" font-weight="700" font-size="68" fill="#fff">31<tspan fill="#5d7aa6" font-size="40"> / 60</tspan></text><text x="70" y="890" font-family="JetBrains Mono" font-size="16" letter-spacing="3" fill="#7fb8ff">SEATED</text>`;
  s += `<rect x="70" y="910" width="400" height="10" rx="5" fill="#1d2d4a"/><rect x="70" y="910" width="207" height="10" rx="5" fill="#7fb8ff"/>`;
  s += `<text x="70" y="966" font-family="JetBrains Mono" font-size="20" fill="#ffe066">LIGHTS DOWN IN 00:45</text><text x="70" y="1012" font-family="JetBrains Mono" font-size="17" fill="#9fb3d4">tag @arealhumanbean to grab a seat</text>`;
  s += `<line x1="510" y1="796" x2="510" y2="1014" stroke="#23395c" stroke-width="2"/>`;
  [['20:31:04', '#b8f28c', 'Wyvern', 'walking to G7'], ['20:30:58', '#c59bff', 'Pog', 'took seat D7'], ['20:30:51', '#ff7aa8', 'Nugget', 'took seat D8'], ['20:30:40', '#5ce1c4', 'Lumi', 'took seat F2'], ['20:30:22', '#8ce0ff', 'Kappa', 'took seat A1 (front row??)'], ['20:30:10', '#ffb84d', 'Rico', 'took seat H5']].forEach(([tm, c, n, a], i) => {
    const y = 818 + i * 38;
    s += `<text x="540" y="${y}" font-family="JetBrains Mono" font-size="19" fill="#5d7aa6">${tm}</text><circle cx="660" cy="${y - 6}" r="7" fill="${c}"/><text x="676" y="${y}" font-family="JetBrains Mono" font-size="19" font-weight="700" fill="#fff">${n}</text><text x="790" y="${y}" font-family="JetBrains Mono" font-size="19" fill="#9fb3d4">${a}</text>`;
  });
  // seat map
  s += `<rect x="1280" y="60" width="600" height="980" rx="16" fill="#0f1b30" stroke="#23395c" stroke-width="2"/>`;
  s += `<path d="M1340 132 Q1580 92 1820 132" stroke="#7fb8ff" stroke-width="6" fill="none" filter="url(#bc-glow)"/><text x="1580" y="160" text-anchor="middle" font-family="JetBrains Mono" font-size="16" letter-spacing="8" fill="#7fb8ff">SCREEN</text>`;
  const seatX = k => 1316 + k * 50 + (k >= 5 ? 28 : 0), seatY = j => 200 + j * 70;
  const fixed = { '3,7': ['#c59bff', 'joy', 'just'], '3,8': ['#ff7aa8', 'wow', 'just'], '5,2': ['#5ce1c4', 'joy'], '0,0': ['#8ce0ff', 'smug'], '7,5': ['#ffb84d', 'smug'] };
  for (let j = 0; j < 10; j++) {
    s += `<text x="1300" y="${seatY(j) + 27}" text-anchor="middle" font-family="JetBrains Mono" font-size="16" fill="#5d7aa6">${'ABCDEFGHIJ'[j]}</text>`;
    for (let k = 0; k < 10; k++) {
      const x = seatX(k), y = seatY(j), f = fixed[j + ',' + k];
      const taken = f || (r() < .45 && !(j === 6 && k === 7));
      if (j === 6 && k === 7) { s += `<rect x="${x}" y="${y}" width="42" height="42" rx="10" fill="none" stroke="#b8f28c" stroke-width="3" stroke-dasharray="5 4"/>`; continue; }
      if (taken) {
        const c = f ? f[0] : pick(r, COLORS), fc = f ? f[1] : pick(r, FACES);
        if (f && f[2]) s += `<rect x="${x - 5}" y="${y - 5}" width="52" height="52" rx="14" fill="none" stroke="#ffe066" stroke-width="3"/>`;
        s += `<rect x="${x}" y="${y}" width="42" height="42" rx="10" fill="${c}"/><g transform="translate(${x + 21} ${y + 22}) scale(.6)">${face(fc)}</g>`;
      } else s += `<rect x="${x}" y="${y}" width="42" height="42" rx="10" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>`;
    }
  }
  s += `<path d="M1860 1000 H1572 V641 H1690" fill="none" stroke="#b8f28c" stroke-width="3" stroke-dasharray="8 8"/>`;
  s += `<circle cx="1572" cy="820" r="20" fill="#b8f28c" stroke="#fff" stroke-width="3"/><g transform="translate(1572 822) scale(.62)">${face('happy')}</g><rect x="1600" y="806" width="96" height="28" rx="4" fill="#0a1424" stroke="#b8f28c" stroke-width="2"/><text x="1648" y="826" text-anchor="middle" font-family="JetBrains Mono" font-size="17" fill="#fff">Wyvern</text>`;
  s += `<g transform="translate(1680 382)"><rect x="-70" y="-38" width="140" height="32" rx="6" fill="#fff"/><path d="M-8 -6 L0 4 L8 -6Z" fill="#fff"/><text y="-16" text-anchor="middle" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#0a1424">Pog · D7</text></g>`;
  s += `<text x="1860" y="1028" text-anchor="end" font-family="JetBrains Mono" font-size="14" letter-spacing="3" fill="#5d7aa6">ENTRANCE</text>`;
  [['FREE', 'none', '#ffffff40'], ['TAKEN', '#7fb8ff', 'none'], ['JUST SAT', 'none', '#ffe066']].forEach(([lb, fl, st], i) => {
    const x = 1320 + i * 150;
    s += `<rect x="${x}" y="924" width="24" height="24" rx="6" fill="${fl}" stroke="${st}" stroke-width="2"/><text x="${x + 34}" y="942" font-family="JetBrains Mono" font-size="15" fill="#9fb3d4">${lb}</text>`;
  });
  return s;
}

// =====================================================================
const THEMES = [
  ['Velvet Palace', 'Classic red-velvet picture palace: gold marquee, host behind the ticket window, rope line to Hall 1, concessions. The cinema is seen from the back rows with the curtains open.', lobbyVelvet, cinemaVelvet],
  ['Neon Picture House', 'Synthwave night club meets cinema: glowing grid floor, arcade cabinets, slushie bar, big countdown. Cinema has neon-outlined seats and laser walls.', lobbyNeon, cinemaNeon],
  ['16-bit Pixel', 'SNES-style RPG room: checker carpet, sprites queueing, a dialog box for host messages. Cinema shows sprites filling pixel seat rows.', lobbyPixel, cinemaPixel],
  ['Starlight Drive-In', 'Outdoor drive-in at dusk: roadside sign, cars queueing at the booth with emotes inside, snack shack. Cinema: rows of cars seen from behind, usernames on the plates.', lobbyDrive, cinemaDrive],
  ['Blueprint / Seat Map', 'Clean architectural floor plan with emote tokens, walking routes and an activity log. Cinema is a booking-style seat map next to the movie.', lobbyBlueprint, cinemaBlueprint],
];
const SCENES = [];
THEMES.forEach(([n, d, l, c], i) => { SCENES.push({ id: 'L' + (i + 1), kind: 'Lobby', title: n, desc: d, draw: l }); });
THEMES.forEach(([n, d, l, c], i) => { SCENES.push({ id: 'C' + (i + 1), kind: 'Cinema', title: n, desc: d, draw: c }); });

const svgOf = sc => `<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="Space Grotesk, sans-serif">${GLOBAL_DEFS}${sc.draw()}</svg>`;
const solo = new URLSearchParams(location.search).get('s');
const app = document.getElementById('app'), full = document.getElementById('full');
if (solo) {
  document.body.classList.add('solo');
  const sc = SCENES.find(x => x.id === solo.toUpperCase());
  app.innerHTML = sc ? svgOf(sc) : '';
} else {
  let h = `<h1>Lobby &amp; cinema concepts</h1><p class="lead">Static drafts, no functionality. Five themes, each with a lobby and a matching cinema scene (lobby → DinkDonk → cinema). Grey boxes show where the movie/stream would go. Click a picture to enlarge it.</p>`;
  ['Lobby', 'Cinema'].forEach(kind => {
    h += `<h2>${kind} scenes</h2><div class="grid">`;
    SCENES.filter(x => x.kind === kind).forEach(sc => h += `<div class="card" data-id="${sc.id}">${svgOf(sc)}<div class="meta"><b>${sc.id} · ${sc.title}</b><div>${sc.desc}</div><a href="?s=${sc.id}" target="_blank">open 1920×1080</a></div></div>`);
    h += `</div>`;
  });
  app.innerHTML = h;
  app.addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (!card || e.target.closest('a')) return;
    full.innerHTML = svgOf(SCENES.find(x => x.id === card.dataset.id));
    full.classList.add('on');
  });
  full.addEventListener('click', () => full.classList.remove('on'));
}
</script>
